# Arabic names for every named place the map draws (audits/map_names_ar.md): the source of truth for each name's sources,
# review flag and note. No loader reads this file, so it is outside the content hash and no save or golden depends on it.
#
# Since F5 step 6 each name is also inline, as `name_ar:` on its own row (and `today_name_ar:` on a locality row), where
# the loaders read it: settlements_1948.yaml (SettlementPlacer), locations_1948.yaml, localities_1948.yaml (Localities.cs,
# and its runtime TSV through tools/localities_bake.py).
# An empty name has no inline key. tools/tests/test_names_ar.py keeps the inline names equal to the rows here; change a
# name here and in its file together. The loaders also accept name_ar_sources, name_ar_review and name_ar_note inline.
#
# One list per content file (path under content/), one row per id there, in that file's order:
#   name                the row's English name, copied for review (the file's own row is the truth).
#   name_ar             the Arabic name the Arabic UI shows; '' where no source was found (never guessed).
#   name_ar_review      agent-checked: an AI agent checked the name against its sources and no person has read it yet
#                       (CONTENT_POLICY section 2, rule 6); a native speaker reviews it and removes the flag.
#   name_ar_sources     {url, checked}: pages read on that day (Arabic Wikipedia read through its API, Wikidata items
#                       through wbgetentities). A name's source does not check the row's facts.
#   name_ar_note        why the name is what it is: an Arab place name used for a colony, the Arab place a colony was
#                       built on or beside, or why the name is empty.
#   name_sources        {url, checked}: the Palestinian source of a renamed English name, or tip_sources the source of a
#                       row's tooltip (tip, tip_ar) where the name stays (2026-10-20, audits/place_names_palestinian.md).
#   today_name_ar(_sources)  localities only: the Arabic form of today.name (the label's tooltip).
# Rules (the brief, 2026-10-19): Palestinian Arab places keep their historical Arabic name; a Jewish colony takes the
# Arab place name where it was founded on that place and the place was no longer a separate locality in May 1948 (ملبس,
# عيون قارة, زمارين), else the Arabic transliteration, with the Arab place noted; kibbutzim read «كيبوتس ...», moshavim
# «موشاف ...». No diacritics, no direction marks, no Hebrew.
status: draft
