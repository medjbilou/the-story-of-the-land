# Key places that existed in May 1948 (M2 map seed). Coordinates: Wikipedia API prop=coordinates;
# founding years: the cited article's text. founded: null + pre_modern: true = pre-19th-century city.
# Naming (owner, 2026-10-20; audits/place_names_palestinian.md): a Palestinian Arab town carries its Palestinian Arabic
# name in the Khalidi / Palestine Remembered transliteration (Yafa, 'Akka, al-Lydd), its English exonym in `tip`
# ("Also: Jaffa"); a pre-1948 colony that Palestinian sources name by the Arab place it took (Mulabbis, 'Uyun Qara,
# Zammarin, al-Khudayra) carries that name and the colony in `tip`; a place with no Palestinian name keeps its own,
# never an invented Arabic one, and `tip` names the depopulated village it was built on or beside where a source says so.
# tip / tip_ar: the pill's tooltip line in each UI language (optional); their sources are in names_ar.yaml (tip_sources).
# name_ar: the Arabic name the Arabic UI's map label shows (audits/map_names_ar.md). Its sources, review flag and note are
# in names_ar.yaml (one row per id here); tools/tests/test_names_ar.py keeps the two equal.
