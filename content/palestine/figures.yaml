figures:
  - {"id": "fig_musa_kazim_husseini", "name_ar": "موسى كاظم الحسيني", "name": "Musa Kazim al-Husseini", "born": "1853", "died": "1934-03", "chapters": ["1880_1946"], "role_ar": "رئيس اللجنة التنفيذية العربية ورئيس بلدية القدس", "role": "Head of the Arab Executive and mayor of al-Quds (Jerusalem)", "bio_ar": "وُلد موسى كاظم الحسيني في القدس عام 1853، وتولّى منصب المتصرّف في الدولة العثمانية، ثم صار رئيسًا لبلدية القدس بعد الاحتلال البريطاني عام 1918، فعزلته سلطات الاحتلال البريطاني عام 1920 متّهمةً إياه بالتحريض على صدامات نيسان من ذلك العام. وفي كانون الأول 1920 اختاره المؤتمر العربي الفلسطيني الثالث في حيفا رئيسًا للجنة التنفيذية العربية، فبقي على رأسها حتى وفاته، وترأّس وفودًا إلى لندن عام 1921 وفي آذار 1930، وأشرف في أيلول 1932 على صندوق قومي لوقف تسرّب الأراضي العربية. وفي 27 تشرين الأول 1933 قاد مظاهرة يافا وهو في الثمانين، فضربه شرطي بريطاني خيّال بهراوة على جبهته ونُقل إلى المستشفى. ولم يتعافَ من تلك الضربة تمامًا، وتوفي في آذار 1934.", "bio": "Musa Kazim al-Husseini, born in al-Quds (Jerusalem) in 1853, served the Ottoman state as a district governor (mutasarrif) and became mayor of al-Quds after the British occupation of 1918; the British occupation authorities dismissed him in 1920, accusing him of inciting the clashes of April that year. In December 1920 the Third Palestine Arab Congress in Hayfa (Haifa) chose him to head the Arab Executive, which he led until his death; he headed delegations to London in 1921 and in March 1930, and in September 1932 oversaw the Piaster Project, a national fund to stop Arab land passing out of Arab hands. On 27 October 1933, aged 80, he led the Yafa (Jaffa) demonstration, where a mounted British policeman struck him on the forehead with a club and he was taken to hospital. He never fully recovered from the blow and died in March 1934.", "related_events": ["e1920_04_nabi_musa", "e1933_10_jaffa"], "sources": ["https://palquest.org/en/node/9749", "https://en.wikipedia.org/wiki/Musa_Kazim_al-Husayni", "https://www.jerusalemstory.com/en/lexicon/arab-executive-committee"], "sensitive": false}
  - {"id": "fig_qassam", "name_ar": "عز الدين القسام", "name": "Izz ad-Din al-Qassam", "born": "1882", "died": "1935-11", "chapters": ["1880_1946"], "role_ar": "خطيب في حيفا وقائد خلايا مقاومة مسلحة سرية", "role": "Hayfa (Haifa) preacher and leader of secret armed resistance cells", "bio_ar": "وُلد عز الدين القسام في جبلة قرب اللاذقية عام 1882 ودرس في الأزهر، وقاتل الاحتلال الفرنسي في الساحل السوري عامَي 1919 و1920 فحكم عليه الفرنسيون بالإعدام، فلجأ إلى حيفا أواخر 1920 وصار خطيبًا في جامع الاستقلال ومأذونًا لدى المحكمة الشرعية. والتفّ حوله فلاحون وعمّال فقراء سكنوا أحياء حيفا الشرقية بعد أن خسر كثير منهم أرضه حين انتقلت إلى أيدي اليهود، ومنذ نحو 1930 نظّم خلايا سرّية عُرفت باسم «الكف الأسود»، بلغ عدد أعضائها بحلول 1935 ما بين 200 و800 رجل. ونُسبت إلى أعضائها هجمات قتلت ثلاثة من أعضاء كيبوتس ياجور في 11 نيسان 1931، وأبًا وابنه في مستعمرة نهلال في 22 كانون الأول 1932، وقُتل في هجماتها 8 يهود على الأقل حتى 1935، وإن نسب المؤرخ صبحي ياسين هجمات الشمال إلى جناح منشقّ خالف القسام. وفي 20 تشرين الثاني 1935 استُشهد القسام في أحراج يعبد قرب جنين بعد قتال دام نحو ست ساعات مع قوة بريطانية تفوق رجاله عددًا بكثير، ومعه ثلاثة من رجاله بحسب بعض الروايات، أو أربعة بحسب مؤسسة الدراسات الفلسطينية، ودُفن في مقبرة بلد الشيخ قرب حيفا.", "bio": "Izz ad-Din al-Qassam, born in Jableh near Latakia in 1882 and educated at al-Azhar, fought the French occupation on the Syrian coast in 1919–20 and was sentenced to death by the French; he took refuge in Hayfa (Haifa) in late 1920 and became preacher at the Istiqlal mosque and a marriage registrar of the sharia court. Poor peasants and workers living in Hayfa's eastern districts gathered around him, many of them pushed off their land when it passed into Jewish hands, and from about 1930 he organised secret cells known as the Black Hand, which by 1935 numbered between 200 and 800 men. Attacks attributed to its members killed three members of kibbutz Yagur on 11 April 1931 and a father and son at Nahalal on 22 December 1932, and its attacks killed at least 8 Jews by 1935, although the historian Subhi Yasin attributed the northern attacks to a dissident faction acting against al-Qassam's wishes. On 20 November 1935, in the woods of Ya'bad near Jenin, he was killed after some six hours of fighting against a far larger British force, with three of his men by some accounts, or four by the Institute for Palestine Studies', and he was buried in the cemetery of Balad al-Shaykh near Hayfa.", "related_events": ["e1935_11_qassam", "e1936_04_revolt"], "sources": ["https://www.palquest.org/en/node/9837", "https://en.wikipedia.org/wiki/Izz_ad-Din_al-Qassam", "https://en.wikipedia.org/wiki/Black_Hand_(Mandatory_Palestine)", "https://www.noonpost.com/content/45458"], "sensitive": true}
  - {"id": "fig_abd_al_rahim_hajj_muhammad", "name_ar": "عبد الرحيم الحاج محمد", "name": "Abd al-Rahim al-Hajj Muhammad", "born": "1892", "died": "1939-03", "chapters": ["1880_1946"], "role_ar": "القائد العام لثورة 1936–1939", "role": "General commander of the 1936–39 revolt", "bio_ar": "وُلد عبد الرحيم الحاج محمد (أبو كمال) في ذنابة قرب طولكرم عام 1892، وخدم في الجيش العثماني في الحرب العالمية الأولى، وقاد منذ 1936 فصائل الثوار في مناطق طولكرم ونابلس وجنين، ومن ذلك كمين نصبه في حزيران 1936 قرب عنبتا لقوة بريطانية تحرس قافلة يهودية، ثم رصدت سلطات الانتداب البريطاني 500 جنيه مكافأةً لمن يقبض عليه، فلجأ إلى دمشق. وفي أيلول 1938 جعله قادة الثورة قائدًا عامًّا بالتناوب مع عارف عبد الرازق، ثم قائدًا عامًّا وحده في شباط 1939، ويصفه المؤرخ تيد سويدنبرغ بأنه كان معارضًا للاغتيالات السياسية. وفي فجر 27 آذار 1939 استُشهد في اشتباك مع الجيش البريطاني في صانور بين جنين ونابلس، بعد أن تعقّبته إحدى «فصائل السلام» بقيادة فريد إرشيد، الذي يُنسب مقتل إخوته عام 1938 عمومًا إلى عبد الرحيم، ونقلت أخباره إلى الاستخبارات البريطانية. ودفنه البريطانيون سرًّا في صانور، فاستعاد الثوار جثمانه وأعادوا دفنه في ذنابة، وعمّ فلسطين إضراب عام استمرّ عدة أيام.", "bio": "Abd al-Rahim al-Hajj Muhammad (Abu Kamal), born in Dhinnaba near Tulkarm in 1892, served in the Ottoman army in the First World War and from 1936 led rebel bands around Tulkarm, Nablus and Jenin, among them an ambush near Anabta in June 1936 on a British force guarding a Jewish convoy; the British Mandate authorities later put a bounty of 500 pounds on him, and he withdrew to Damascus. In September 1938 the revolt's leaders made him general commander in rotation with Aref Abd al-Raziq, and in February 1939 sole general commander; the historian Ted Swedenburg describes him as opposed to political assassination. At dawn on 27 March 1939 the British army killed him in a clash at Sanur between Jenin and Nablus, after a \"peace band\" led by Farid Irsheid, whose brothers' killing in 1938 is generally attributed to Abd al-Rahim, had tracked his movements and passed them to British intelligence. The British buried him secretly at Sanur; the rebels recovered his body and reburied him in Dhinnaba, and a general strike was held across Palestine for several days.", "related_events": ["e1936_04_revolt", "e1939_03_abd_rahim"], "sources": ["https://en.wikipedia.org/wiki/Abd_al-Rahim_al-Hajj_Muhammad", "https://www.palquest.org/ar/media/9532/%D8%B9%D8%A8%D8%AF-%D8%A7%D9%84%D8%B1%D8%AD%D9%8A%D9%85-%D8%A7%D9%84%D8%AD%D8%A7%D8%AC-%D9%85%D8%AD%D9%85%D8%AF", "https://www.noonpost.com/23336/amp/"], "sensitive": true}
  - {"id": "fig_haj_amin_husseini", "name_ar": "الحاج أمين الحسيني", "name": "Haj Amin al-Husseini", "born": "1895", "died": "1974-07", "chapters": ["1880_1946", "1947_1949", "1967_1987"], "role_ar": "مفتي القدس ورئيس اللجنة العربية العليا", "role": "Mufti of al-Quds (Jerusalem) and head of the Arab Higher Committee", "bio_ar": "وُلد محمد أمين الحسيني في القدس عام 1895، ولجأ إلى سوريا بعد مظاهرات القدس عام 1920، فأدانته محكمة بريطانية غيابيًّا في نيسان من ذلك العام بتهمة التحريض على الثورة، ثم عفا عنه المندوب السامي هربرت صموئيل وعيّنه مفتيًا للقدس في أيار 1921، وصار رئيسًا للمجلس الإسلامي الأعلى في كانون الثاني 1922، وترأّس اللجنة العربية العليا منذ 1936. وبعد مقتل لويس أندروز في أيلول 1937 جرّدته سلطات الانتداب من مناصبه، وحظرت اللجنة العليا ونفت خمسة من قادتها إلى جزر سيشل دون دليل على تورّطهم، فتدلّى بحبل من سور الحرم الشريف وفرّ إلى لبنان، ثم شارك في الانقلاب الموالي لدول المحور في العراق في نيسان 1941. وتعاون مع ألمانيا النازية وإيطاليا الفاشية من أواخر 1941 حتى 1945، فاستقبله هتلر في برلين في 28 تشرين الثاني 1941، وأذاع دعاية معادية لبريطانيا ولليهود، وساعد عام 1943 في تجنيد مسلمين بوسنيين في فرقة «هندشار» التابعة لقوات «فافن إس إس»، وكتب في أيار وحزيران 1943 إلى خمس حكومات يحثّها على ألّا تساعد في نقل أطفال يهود إلى فلسطين، مقترحًا إرسالهم إلى بولندا، بحسب متحف ذكرى الهولوكوست الأمريكي. وفرّ من فرنسا إلى القاهرة عام 1946، وترأّس عام 1948 في غزة المجلس الوطني الفلسطيني الذي أقرّ شرعية حكومة عموم فلسطين، وتوفي في بيروت في 4 تموز 1974.", "bio": "Muhammad Amin al-Husseini, born in al-Quds (Jerusalem) in 1895, fled to Syria after the 1920 demonstrations and was convicted in absentia by a British tribunal that April of incitement to revolt; the High Commissioner Herbert Samuel later pardoned him and appointed him Mufti of al-Quds in May 1921, he became president of the Supreme Muslim Council in January 1922, and from 1936 he chaired the Arab Higher Committee. After the killing of Lewis Andrews in September 1937 the Mandate authorities stripped him of his posts, outlawed the Committee and exiled five of its leaders to the Seychelles without proof of their involvement; he slid down a rope from the Haram's wall and fled to Lebanon, and in April 1941 he took part in the pro-Axis coup in Iraq. He collaborated with Nazi Germany and Fascist Italy from late 1941 to 1945: Hitler received him in Berlin on 28 November 1941, he broadcast anti-British and anti-Jewish propaganda, in 1943 he helped recruit Bosnian Muslims for the Waffen-SS \"Handschar\" division, and in May–June 1943 he wrote to five governments urging them not to help move Jewish children to Palestine and suggesting they be sent to Poland, according to the US Holocaust Memorial Museum. He escaped from France to Cairo in 1946, in 1948 presided over the Palestine National Council in Ghazza (Gaza) that confirmed the All-Palestine Government, and died in Beirut on 4 July 1974.", "related_events": ["e1936_04_revolt", "e1937_10_seychelles"], "sources": ["https://encyclopedia.ushmm.org/content/en/article/hajj-amin-al-husayni-the-mufti-of-jerusalem", "https://encyclopedia.ushmm.org/content/en/article/hajj-amin-al-husayni-key-dates", "https://www.palquest.org/en/node/6563", "https://en.wikipedia.org/wiki/Amin_al-Husseini"], "sensitive": true}
  - {"id": "fig_matiel_mogannam", "name_ar": "ماتيل مغنّم", "name": "Matiel Mogannam", "born": "1899-02", "died": "1992-08", "chapters": ["1880_1946", "1967_1987", "1987_2000"], "role_ar": "ناشطة في الحركة النسائية الوطنية الفلسطينية", "role": "Activist in the Palestinian women's national movement", "bio_ar": "وُلدت ماتيل مغنّم في لبنان في 15 شباط 1899 لعائلة فلسطينية مسيحية هاجرت إلى نيويورك، وانتقلت إلى فلسطين في منتصف العشرينيات مع زوجها مغنّم مغنّم، ابن رام الله ودارس القانون. وعُقدت في بيتها وفي بيت طرب عبد الهادي الاجتماعاتُ التحضيرية للمؤتمر النسائي العربي الفلسطيني الأول، الذي انعقد في 26 تشرين الأول 1929، وتحدّثت بالإنجليزية باسم الوفد الذي قابل المندوب السامي جون تشانسلور واحتجّ على إساءة الشرطة إلى المعتقلين وطلاب المدرسة الصلاحية في نابلس، وعلى منحة قدرها 10,000 جنيه قدّمتها حكومة الانتداب للمستوطنين اليهود، وانتُخبت أمينة سرّ للمراسلات الإنجليزية في اللجنة التنفيذية النسائية العربية المؤلفة من 14 عضوًا. وفي 15 نيسان 1933، خلال مسيرة نسائية في القدس احتجاجًا على سياسة الانتداب في الهجرة اليهودية، خطبت في مسجد عمر، ونشرت عام 1937 في لندن كتابها «المرأة العربية وقضية فلسطين» بالإنجليزية. وعادت إلى الولايات المتحدة عام 1980، وتوفيت في أرلينغتون بولاية فرجينيا في 11 آب 1992.", "bio": "Matiel Mogannam was born in Lebanon on 15 February 1899 to a Palestinian Christian family that emigrated to New York, and moved to Palestine in the mid-1920s with her husband Mughannam Mughannam, a Ramallah-born law graduate. Preparatory meetings for the first Palestine Arab Women's Congress of 26 October 1929 were held at her house and at Tarab Abd al-Hadi's; she spoke in English for the delegation that met the High Commissioner John Chancellor and protested police mistreatment of detainees and of students at the Salahiyya School in Nablus and a Mandate grant of 10,000 pounds to Jewish settlers, and she was elected English-language secretary of the 14-member Arab Women's Executive. On 15 April 1933, during a women's march in al-Quds (Jerusalem) against Mandate policy on Jewish immigration, she spoke at the Mosque of Omar, and in 1937 she published \"The Arab Woman and the Palestine Problem\" in London. She returned to the United States in 1980 and died in Arlington, Virginia, on 11 August 1992.", "related_events": ["e1929_10_women"], "sources": ["https://www.palquest.org/en/biography/30018/matiel-mogannam", "https://en.wikipedia.org/wiki/Tarab_Abdul_Hadi"], "sensitive": false}
  - {"id": "fig_ibrahim_tuqan", "name_ar": "إبراهيم طوقان", "name": "Ibrahim Tuqan", "born": "1905", "died": "1941-05", "chapters": ["1880_1946"], "role_ar": "شاعر فلسطيني من نابلس", "role": "Palestinian poet from Nablus", "bio_ar": "وُلد إبراهيم طوقان في نابلس عام 1905، وتخرّج في الجامعة الأمريكية في بيروت عام 1929، ودرّس الأدب العربي في نابلس وبيروت والقدس. وبعد أن أعدمت سلطات الانتداب البريطاني شنقًا فؤاد حجازي ومحمد جمجوم وعطا الزير في سجن عكا في 17 حزيران 1930، ألقى بعد نحو عشرة أيام قصيدته «الثلاثاء الحمراء» في حفل تخرّج مدرسة النجاح، وكتب عام 1934 قصيدة «موطني» التي صارت نشيدًا وطنيًّا فلسطينيًّا غير رسمي، ثم نشيدًا وطنيًّا للعراق بعد 2003. وأشرف على القسم العربي في إذاعة القدس منذ تأسيسه عام 1936، وقاوم مساعي فرض العامية على أحاديث الإذاعة ومقابلاتها، وكان ذلك من أسباب إقالة سلطات الانتداب له في تشرين الأول 1940. وتوفي في القدس في 2 أيار 1941 ودُفن في نابلس، وهو شقيق الشاعرة فدوى طوقان.", "bio": "Ibrahim Tuqan, born in Nablus in 1905, graduated from the American University of Beirut in 1929 and taught Arabic literature in Nablus, Beirut and al-Quds (Jerusalem). After the British Mandate authorities hanged Fuad Hijazi, Muhammad Jamjoum and Ata al-Zeer in 'Akka (Acre) prison on 17 June 1930, he recited his poem \"Red Tuesday\" at the Najah School commencement about ten days later, and in 1934 he wrote \"Mawtini\" (\"My Homeland\"), which became an unofficial Palestinian anthem and, after 2003, Iraq's national anthem. He supervised the Arabic section of the al-Quds radio from its founding in 1936 and resisted moves to make colloquial Arabic dominate its talks and interviews, one of the reasons the Mandate authorities dismissed him in October 1940. He died in al-Quds on 2 May 1941 and was buried in Nablus; the poet Fadwa Tuqan was his sister.", "related_events": ["e1930_06_red_tuesday"], "sources": ["https://www.palquest.org/en/biography/9721/ibrahim-tuqan", "https://en.wikipedia.org/wiki/Ibrahim_Tuqan", "https://ar.wikipedia.org/wiki/%D8%A5%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B7%D9%88%D9%82%D8%A7%D9%86", "https://ar.wikipedia.org/wiki/%D9%81%D8%A4%D8%A7%D8%AF_%D8%AD%D8%B3%D9%86_%D8%AD%D8%AC%D8%A7%D8%B2%D9%8A"], "sensitive": true}
  - {"id": "fig_abd_al_qadir_husseini", "name_ar": "عبد القادر الحسيني", "name": "Abd al-Qadir al-Husseini", "born": "1908", "died": "1948-04", "chapters": ["1880_1946", "1947_1949"], "role_ar": "قائد جيش الجهاد المقدس", "role": "Commander of the Army of the Holy War", "bio_ar": "وُلد عبد القادر الحسيني، ابن موسى كاظم الحسيني، عام 1908، وطُرد من مصر عام 1932 بعد أن اتّهم الجامعة الأمريكية في القاهرة، في حفل تخرّجه فيها، بخدمة الاستعمار، ثم شارك عام 1936 في تأسيس تنظيم الجهاد المقدس في منطقة القدس. وجُرح في معركة الخضر في تشرين الأول 1936 فاعتقله البريطانيون، ففرّ إلى دمشق، ثم جُرح في بني نعيم في تشرين الأول 1938. وشارك في ثورة رشيد عالي الكيلاني على البريطانيين في العراق عام 1941، واعتُقل حتى أواخر 1943. وعاد إلى فلسطين في كانون الأول 1947 ليقود جيش الجهاد المقدس، الذي فجّرت وحدة المتفجرات فيه مبنى الوكالة اليهودية في القدس في 11 آذار 1948، وأحصى تقرير بريطاني أولي إلى الأمم المتحدة 8 قتلى وما بين 30 و40 جريحًا، وتذكر روايات لاحقة 12 قتيلًا. وفي 6 نيسان 1948 حمّل الجامعة العربية في رسالة مسؤولية ترك جنوده بلا سلاح، واستُشهد فجر 8 نيسان برصاص عصابة الهاغاناه الصهيونية وهو يقود هجومًا لاستعادة القسطل، ودُفن إلى جانب أبيه قرب المسجد الأقصى في 9 نيسان، يوم ارتكبت العصابتان الصهيونيتان الإرغون وليحي مجزرة دير ياسين.", "bio": "Abd al-Qadir al-Husseini, son of Musa Kazim al-Husseini, was born in 1908; he was expelled from Egypt in 1932 after accusing the American University in Cairo of serving imperialism at his graduation, and co-founded the Holy War organisation in the al-Quds (Jerusalem) district in 1936. Wounded at the battle of al-Khadr in October 1936, he was arrested by the British and escaped to Damascus, and he was wounded again at Bani Na'im in October 1938. He fought in Rashid Ali al-Kaylani's revolt against the British in Iraq in 1941 and was detained until late 1943. He returned to Palestine in December 1947 to command the Army of the Holy War, whose explosives unit blew up the Jewish Agency building in al-Quds on 11 March 1948; a first British report to the UN gave 8 dead and 30 to 40 injured, and later accounts give 12 dead. On 6 April 1948 he wrote to the Arab League holding it responsible for leaving his men without arms; before dawn on 8 April fighters of the Haganah, a Zionist militia, shot him dead as he led an attack to retake al-Qastal, and he was buried beside his father at al-Aqsa on 9 April, the day the Zionist militias Irgun and Lehi massacred the people of Deir Yassin.", "related_events": ["e1936_04_revolt", "e1948_01_ala", "e1948_04_qastal"], "sources": ["https://palquest.org/en/node/9831", "https://www.jerusalemstory.com/en/bio/abd-al-qader-al-husseini", "https://en.wikipedia.org/wiki/Abd_al-Qadir_al-Husayni", "https://www.un.org/unispal/wp-json/wp/v2/document/211077", "https://en.wikipedia.org/wiki/1948_in_Mandatory_Palestine", "https://en.wikipedia.org/wiki/Al-Qastal,_Jerusalem", "https://en.wikipedia.org/wiki/Operation_Nachshon", "https://en.wikipedia.org/wiki/Deir_Yassin_massacre", "https://en.wikipedia.org/wiki/Lehi_(militant_group)"], "sensitive": true}
  - {"id": "fig_shuqairi", "name_ar": "أحمد الشقيري", "name": "Ahmad al-Shuqairi", "born": "1908", "died": "1980-02", "chapters": ["1880_1946", "1947_1949", "1950_1966", "1967_1987"], "role_ar": "أول رئيس لمنظمة التحرير الفلسطينية", "role": "First chairman of the Palestine Liberation Organization", "bio_ar": "وُلد أحمد الشقيري عام 1908 في تبنين جنوب لبنان، حيث كان والده الشيخ أسعد الشقيري منفيًّا، ونشأ بين طولكرم وعكا، مدينة عائلته، وأسهم عام 1930 في إعداد الدفاع عن فؤاد حجازي وعطا الزير ومحمد جمجوم، ومارس المحاماة في عكا منذ 1933، واعتقلته سلطات الانتداب البريطاني عام 1936 ثم عام 1937. وترأّس المكتب العربي في القدس حتى نهاية 1947، ولجأ إلى لبنان بعد أن احتلّ الجيش الصهيوني عكا عام 1948، ثم عمل في وفد سوريا لدى الأمم المتحدة، وأمينًا عامًّا مساعدًا لجامعة الدول العربية منذ 1951، ومندوبًا دائمًا للسعودية لدى الأمم المتحدة من 1957 إلى 1962. وانتخبه المؤتمر الوطني الفلسطيني الأول، المنعقد في القدس من 28 أيار إلى 2 حزيران 1964، رئيسًا لمنظمة التحرير الفلسطينية الوليدة. واستقال في كانون الأول 1967، بعد النكسة وخلافات حادة داخل اللجنة التنفيذية، وتوفي في عمّان في شباط 1980، ودُفن بوصية منه في مقبرة أبي عبيدة في غور الأردن.", "bio": "Ahmad al-Shuqairi was born in 1908 in Tibnin, in south Lebanon, where his father, Shaykh As'ad al-Shuqairi, was living in exile; he grew up between Tulkarm and 'Akka (Acre), his family's home town, helped prepare the defence of Fuad Hijazi, Ata al-Zeer and Muhammad Jamjoum in 1930, practised law in 'Akka from 1933, and was detained by the British Mandate authorities in 1936 and again in 1937. He headed the Arab Office in al-Quds (Jerusalem) until the end of 1947 and became a refugee in Lebanon after the Zionist army took 'Akka in 1948; he then served on Syria's UN delegation, as assistant secretary-general of the Arab League from 1951, and as Saudi Arabia's permanent envoy to the UN from 1957 to 1962. The first Palestinian National Congress, held in al-Quds from 28 May to 2 June 1964, elected him chairman of the new Palestine Liberation Organization. He resigned in December 1967, after the Naksa and sharp differences within the Executive Committee, died in Amman in February 1980, and was buried, as he had asked, in the Abu Ubayda cemetery in the Jordan Valley.", "related_events": ["e1964_05_plo"], "sources": ["https://palquest.org/en/node/9753", "https://en.wikipedia.org/wiki/Ahmad_Shukeiri"], "sensitive": false}
  - {"id": "fig_hasan_salama", "name_ar": "حسن سلامة", "name": "Hasan Salama", "born": "1913", "died": "1948-06", "chapters": ["1880_1946", "1947_1949"], "role_ar": "قائد في ثورة 1936 وجيش الجهاد المقدس", "role": "Commander in the 1936 revolt and the Army of the Holy War", "bio_ar": "وُلد حسن سلامة في قولة قرب اللد عام 1913، وتولّى منذ أيار 1936 قيادة الثوار في منطقة اللد والرملة، وجُرح عام 1938 حين نسف قطارًا على خط اللد–حيفا ولاحقته القوات البريطانية. وفي 1941 قاد 165 مقاتلًا فلسطينيًّا في ثورة رشيد عالي الكيلاني في العراق، ثم انتقل إلى ألمانيا، وفي ليلة 6 تشرين الأول 1944 هبط بالمظلّة قرب أريحا مع ثلاثة ألمان من جماعة الهيكليين وفلسطيني آخر في عملية ألمانية سُمّيت «أطلس»، ونجا من الاعتقال. وفي 1947–1948 قاد قوات جيش الجهاد المقدس في قطاع اللد والرملة، فصُدّ هجومها على حيّ هتكفا في تل أبيب في 8 كانون الأول 1947 وقُتل من رجاله نحو 100 بحسب المؤرخ ديفيد طال، وفي 5 نيسان 1948 دمّرت سرية من لواء «جفعاتي» التابع لعصابة الهاغاناه الصهيونية مقرّه قرب الرملة وقتلت 25 عربيًّا. وأُصيب في رئته وهو يقود هجومًا مضادًّا على مواقع العصابات الصهيونية في رأس العين في 31 أيار 1948، واستُشهد متأثرًا بجراحه في 2 حزيران 1948، وبعد خمسة أسابيع، في 10 تموز، هجّرت قوات الاحتلال أهل قريته قولة.", "bio": "Hasan Salama, born in Qula near al-Lydd (Lydda) in 1913, commanded the rebels of the al-Lydd–al-Ramla (Ramla) area from May 1936 and was wounded in 1938 when he blew up a train on the al-Lydd–Hayfa (Haifa) line and British forces pursued him. In 1941 he led 165 Palestinian fighters in Rashid Ali al-Kaylani's revolt in Iraq, then went to Germany, and on the night of 6 October 1944 he parachuted near Ariha (Jericho) with three German Templers and another Palestinian in a German operation named \"Atlas\", and escaped capture. In 1947–48 he led Army of the Holy War forces in the al-Lydd–al-Ramla sector: their attack on the Hatikva quarter of Tel Aviv on 8 December 1947 was repulsed with about 100 of his men killed, according to the historian David Tal, and on 5 April 1948 a company of the Haganah's Givati Brigade, a Zionist militia, destroyed his headquarters near al-Ramla, killing 25 Arabs. He was shot in the lung while leading a counter-attack on Zionist militia positions at Ras al-Ein on 31 May 1948 and died of his wounds on 2 June 1948; five weeks later, on 10 July, Israeli occupation forces drove the people of his village, Qula, from their homes.", "related_events": ["e1936_04_revolt", "e1948_01_ala"], "sources": ["https://en.wikipedia.org/wiki/Hasan_Salama", "https://en.wikipedia.org/wiki/Operation_Atlas", "https://www.marefa.org/%D8%AD%D8%B3%D9%86_%D8%B3%D9%84%D8%A7%D9%85%D8%A9", "https://www.aljazeera.net/encyclopedia/2024/2/9/%d8%b9%d9%84%d9%8a-%d8%ad%d8%b3%d9%86-%d8%b3%d9%84%d8%a7%d9%85%d8%a9-%d8%a7%d9%84%d8%a3%d9%85%d9%8a%d8%b1-%d8%a7%d9%84%d8%a3%d8%ad%d9%85%d8%b1-%d8%a7%d9%84%d8%b4%d8%a8%d8%ad", "https://en.wikipedia.org/wiki/Qula"], "sensitive": true}
  - {"id": "fig_haidar_abdel_shafi", "name_ar": "حيدر عبد الشافي", "name": "Haidar Abdel-Shafi", "born": "1919-06", "died": "2007-09", "chapters": ["1947_1949", "1950_1966", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "طبيب من غزة ورئيس الوفد الفلسطيني في مؤتمر مدريد", "role": "Physician from Ghazza (Gaza), head of the Palestinian delegation at Madrid", "bio_ar": "وُلد حيدر عبد الشافي في غزة في 10 حزيران 1919، وتخرّج طبيبًا في الجامعة الأمريكية في بيروت عام 1943، وعالج عام 1948 الجرحى في المواجهات مع القوات الصهيونية واللاجئين الذين وصلوا إلى غزة، وعارض عام 1955 مشروع توطين اللاجئين في سيناء. وبصفته رئيسًا للمجلس التشريعي لقطاع غزة في عهد الإدارة المصرية حضر المؤتمر الوطني الفلسطيني الأول في القدس عام 1964 وعُيّن لعام واحد في أول لجنة تنفيذية لمنظمة التحرير. وبعد احتلال القطاع عام 1967 نفته سلطات الاحتلال صيف 1969 ثلاثة أشهر إلى نخل في سيناء المحتلة بسبب نشاطه الوطني، ثم أبعدته إلى لبنان في 12 أيلول 1970، وترأّس من 1972 حتى 2005 جمعية الهلال الأحمر في غزة التي شارك في تأسيسها. وترأّس الوفد الفلسطيني في مؤتمر مدريد في تشرين الأول 1991 ثم في مفاوضات واشنطن، واستقال من الوفد مؤقتًا في نيسان 1993 احتجاجًا على استمرار الاستيطان، وغاب عن توقيع اتفاق أوسلو في أيلول 1993. وحصل على أعلى الأصوات في انتخابات المجلس التشريعي عام 1996، ثم استقال منه عام 1998 احتجاجًا على الفساد في السلطة الفلسطينية وغياب الفصل بين السلطات، وشارك عام 2002 في تأسيس المبادرة الوطنية الفلسطينية، وتوفي في غزة في 25 أيلول 2007.", "bio": "Haidar Abdel-Shafi was born in Ghazza (Gaza) on 10 June 1919 and qualified as a doctor at the American University of Beirut in 1943; in 1948 he treated people wounded in clashes with Zionist forces and the refugees who reached Ghazza, and in 1955 he opposed the plan to resettle the refugees in Sinai. As speaker of the Gaza Strip Legislative Council under Egyptian administration he attended the first Palestinian National Congress in al-Quds (Jerusalem) in 1964 and was appointed for a year to the first PLO Executive Committee. After the Strip was occupied in 1967, the Israeli occupation authorities exiled him for three months in the summer of 1969 to Nakhl in occupied Sinai over his nationalist activity and deported him to Lebanon on 12 September 1970; from 1972 to 2005 he headed the Red Crescent Society in Gaza, which he had co-founded. He led the Palestinian delegation at the Madrid conference in October 1991 and then in the Washington talks, briefly resigned from the delegation in April 1993 in protest at continued settlement building, and stayed away from the Oslo signing in September 1993. He won more votes than any other candidate in the 1996 Legislative Council election, resigned from the Council in 1998 in protest at corruption in the Palestinian Authority and the lack of a separation of powers, co-founded the Palestinian National Initiative in 2002, and died in Ghazza on 25 September 2007.", "related_events": ["e1964_05_plo", "e1991_10_madrid", "e1993_09_oslo", "e1996_01_elections"], "sources": ["https://palquest.org/en/node/14593", "https://en.wikipedia.org/wiki/Haidar_Abdel-Shafi", "https://qantara.de/en/article/obituary-haidar-abdel-shafi-grand-old-man-gaza"], "sensitive": false}
  - {"id": "fig_habash", "name_ar": "جورج حبش", "name": "George Habash", "born": "1925-08", "died": "2008-01", "chapters": ["1947_1949", "1950_1966", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "مؤسس الجبهة الشعبية لتحرير فلسطين وأمينها العام الأول", "role": "Founder and first secretary-general of the PFLP", "bio_ar": "وُلد جورج حبش في اللد عام 1925 لعائلة مسيحية أرثوذكسية، وكان مع أسرته بين من طردهم الجيش الصهيوني من اللد سيرًا تحت النار في تموز 1948، وتخرّج طبيبًا في الجامعة الأمريكية في بيروت عام 1951. وشارك في تأسيس حركة القوميين العرب في مطلع الخمسينيات، ثم أسّس في كانون الأول 1967 الجبهة الشعبية لتحرير فلسطين، وتولّى أمانتها العامة حتى عام 2000. وفي عهده تبنّت الجبهة، التي أدار وديع حداد عملياتها الخارجية، خطف الطائرات، فخطفت في أيلول 1970 طائرات ركاب غربية وفجّرت ثلاثًا منها في مدرج صحراوي بالأردن. وفي 10 آب 1973 أرغمت مقاتلتان لجيش الاحتلال طائرة ركاب لشركة طيران الشرق الأوسط على الهبوط في حيفا لاختطافه، لكنه عدل عن ركوبها في اللحظة الأخيرة. وأقام في عمّان منذ 1992، وتوفي فيها بنوبة قلبية في 26 كانون الثاني 2008.", "bio": "George Habash, born in al-Lydd (Lydda) in 1925 into an Orthodox Christian family, was with his family among those the Zionist army drove out of al-Lydd on foot under gunfire in July 1948, and graduated as a physician from the American University of Beirut in 1951. He co-founded the Arab Nationalist Movement in the early 1950s and in December 1967 founded the Popular Front for the Liberation of Palestine (PFLP), which he led as secretary-general until 2000. Under his leadership the PFLP, whose external operations were run by Wadie Haddad, took up the hijacking of airliners: in September 1970 it hijacked Western passenger planes and blew up three of them on a desert airstrip in Jordan. On 10 August 1973 two occupation army fighter jets forced a Middle East Airlines passenger plane to land at Hayfa (Haifa) to seize him, but he had decided at the last minute not to board. He lived in Amman from 1992 and died there of a heart attack on 26 January 2008.", "related_events": ["e1948_07_lydda_ramle", "e1948_07_lydda_march", "e1970_09_black_september"], "sources": ["https://www.palquest.org/en/node/6564", "https://www.aljazeera.com/news/2008/1/28/pflp-founder-george-habash-dies", "https://www.aljazeera.com/news/2009/7/13/habash-the-bearer-of-the-dream", "https://www.rte.ie/news/2008/0126/98759-habashg/", "https://en.wikipedia.org/wiki/George_Habash", "https://www.larousse.fr/archives/journaux_annee/1974/182/asie"], "sensitive": false}
  - {"id": "fig_wadie_haddad", "name_ar": "وديع حداد", "name": "Wadie Haddad", "born": "1927", "died": "1978-03", "chapters": ["1947_1949", "1967_1987"], "role_ar": "مسؤول العمليات الخارجية في الجبهة الشعبية", "role": "Head of the PFLP's external operations", "bio_ar": "وُلد وديع حداد في صفد عام 1927 لعائلة مسيحية أرثوذكسية، ولجأ إلى لبنان في نكبة 1948، ودرس الطب في الجامعة الأمريكية في بيروت حيث أسّس مع جورج حبش حركة القوميين العرب، وأدار الاثنان عام 1952 عيادة مجانية للاجئين والفقراء في عمّان. وكان من مؤسسي الجبهة الشعبية لتحرير فلسطين وتولّى عملياتها الخارجية، التي خطفت في تموز 1968 طائرة لشركة «العال» الإسرائيلية إلى الجزائر، وفي أيلول 1970 طائرات ركاب إلى مدرج صحراوي في الأردن. وفي 30 أيار 1972 هاجم مطارَ اللد ثلاثةٌ من أعضاء «الجيش الأحمر الياباني» درّبتهم الجبهة وخطّطت للهجوم، فقُتل 26 شخصًا، منهم 17 حاجًّا مسيحيًّا من بورتوريكو و8 إسرائيليين، بحسب موقع «المونيتور». وبعد أن خطف رجاله في حزيران 1976 طائرة لشركة «إير فرانس» إلى عنتيبي في أوغندا فصلته الجبهة، وتوفي في برلين الشرقية في 28 آذار 1978، وتقول مؤسسة الدراسات الفلسطينية إن الموساد سمّمه.", "bio": "Wadie Haddad, born in Safad in 1927 into an Orthodox Christian family, fled to Lebanon as a refugee in the Nakba of 1948 and studied medicine at the American University of Beirut, where he and George Habash founded the Arab Nationalist Movement; in 1952 the two ran a free clinic for refugees and the poor in Amman. A founder of the PFLP, he ran its external operations, which hijacked an El Al plane to Algiers in July 1968 and passenger planes to a desert airstrip in Jordan in September 1970. On 30 May 1972 three members of the Japanese Red Army, trained by the PFLP, which planned the attack, opened fire at al-Lydd (Lydda) airport, and 26 people were killed, 17 of them Christian pilgrims from Puerto Rico and 8 Israelis, according to Al-Monitor. After his men hijacked an Air France plane to Entebbe in Uganda in June 1976 the PFLP expelled him; he died in East Berlin on 28 March 1978, and the Institute for Palestine Studies says the Mossad poisoned him.", "related_events": ["e1948_05_safad", "e1970_09_black_september"], "sources": ["https://en.wikipedia.org/wiki/Wadie_Haddad", "https://www.palquest.org/en/highlight/23332/popular-front-liberation-palestine-%E2%80%93-pflp", "https://www.palquest.org/en/node/6564", "https://carnegieendowment.org/ar/middle-east/diwan/2025/08/a-just-cause-ruined", "https://www.al-monitor.com/originals/2022/05/kozo-okamotos-long-life-after-israel-suicide-mission"], "sensitive": true}
  - {"id": "fig_abu_iyad", "name_ar": "صلاح خلف (أبو إياد)", "name": "Salah Khalaf (Abu Iyad)", "born": "1933-08", "died": "1991-01", "chapters": ["1947_1949", "1950_1966", "1967_1987", "1987_2000"], "role_ar": "أحد مؤسسي فتح ومسؤول أمن منظمة التحرير", "role": "Fatah co-founder and PLO security chief", "bio_ar": "وُلد صلاح خلف (أبو إياد) في يافا في 31 آب 1933، وفي 13 أيار 1948 غادرت عائلته المدينة بحرًا إلى غزة؛ وبعد دراسته في القاهرة درّس اللغة العربية في غزة، ثم شارك ياسر عرفات وخليل الوزير في بناء حركة فتح في الكويت، وصار الرجل الثاني فيها، وكان من أوائل من طرحوا فكرة الدولة الفلسطينية الديمقراطية العلمانية. وفي عام 1969 أسّس أول جهاز أمني لمنظمة التحرير، «جهاز الرصد الثوري»، واعتقلته السلطات الأردنية إثر مواجهات أيلول 1970 ثم أبعدته إلى لبنان. واتهمته حكومة الاحتلال والولايات المتحدة بتأسيس منظمة «أيلول الأسود» التي احتجزت في 5 أيلول 1972 أعضاء الفريق الأولمبي الإسرائيلي في ميونخ، فقُتل 11 من أعضاء الفريق وشرطي من ألمانيا الغربية؛ ونسبت إليه الصحافة التخطيط للهجوم، فيما نفى في مذكراته أي صلة له بأيلول الأسود أو بهجوم ميونخ. ونجا منذ عام 1970 من محاولات اغتيال كثيرة نُسب بعضها إلى الموساد، وفي 14 كانون الثاني 1991 قتله في تونس حمزة أبو زيد، وهو حارس مرتبط بجماعة أبي نضال، وقُتل معه هايل عبد الحميد (أبو الهول) وفخري العمري، وحمّلت مصادر فلسطينية جماعة أبي نضال المسؤولية، فيما اتهم مراقب منظمة التحرير لدى الأمم المتحدة عملاء للاحتلال، ونفت سلطات الاحتلال علمها بالأمر.", "bio": "Salah Khalaf (Abu Iyad) was born in Yafa (Jaffa) on 31 August 1933, and on 13 May 1948 his family left the city by sea for Ghazza (Gaza); after studying in Cairo he taught Arabic in Ghazza, then joined Yasser Arafat and Khalil al-Wazir in building Fatah in Kuwait, became its second most senior leader, and was among the first to put forward the idea of a democratic, secular Palestinian state. In 1969 he founded the PLO's first security body, the Revolutionary Observation Apparatus, and after the fighting of September 1970 the Jordanian authorities arrested him and then expelled him to Lebanon. The Zionist government and the United States accused him of founding the Black September Organization, which on 5 September 1972 seized the Israeli Olympic team in Munich: 11 Israeli team members and a West German police officer were killed; the press named him as the attack's planner, while in his memoirs he denied any link to Black September or the Munich attack. He survived many assassination attempts from 1970 on, some of them attributed to the Mossad, and on 14 January 1991 he was shot dead in Tunis, together with Hayel Abdel Hamid (Abu al-Hol) and Fakhri al-Omari, by Hamza Abu Zeid, a guard linked to Abu Nidal's group; Palestinian sources blamed the Abu Nidal Organization, while the PLO's UN observer blamed agents of the occupation, and the Israeli authorities denied any knowledge.", "related_events": ["e1948_05_jaffa_surrender", "e1959_10_fatah", "e1970_09_black_september"], "sources": ["https://en.wikipedia.org/wiki/Salah_Khalaf", "https://www.aljazeera.net/encyclopedia/2025/7/3/%d8%a3%d8%a8%d9%88-%d8%a5%d9%8a%d8%a7%d8%af-%d9%85%d9%86%d8%b8%d8%b1-%d8%a7%d9%84%d8%ab%d9%88%d8%b1%d8%a9-%d8%a7%d9%84%d9%81%d9%84%d8%b3%d8%b7%d9%8a%d9%86%d9%8a%d8%a9", "https://csmonitor.com/1991/0116/ofill16.html", "https://en.majalla.com/node/322105"], "sensitive": true}
  - {"id": "fig_abu_jihad", "name_ar": "خليل الوزير (أبو جهاد)", "name": "Khalil al-Wazir (Abu Jihad)", "born": "1935-10", "died": "1988-04", "chapters": ["1947_1949", "1950_1966", "1967_1987", "1987_2000"], "role_ar": "أحد مؤسسي فتح وقائد جناحها العسكري", "role": "Fatah co-founder and commander of its armed wing", "bio_ar": "وُلد خليل الوزير (أبو جهاد) في الرملة في 10 تشرين الأول 1935، وطردت قوات الاحتلال عائلته منها في تموز 1948، فاستقرّت في مخيم البريج في قطاع غزة، حيث نظّم وهو طالب في المرحلة الثانوية مجموعة فدائية صغيرة تُغير على مواقع لجيش الاحتلال. وشارك مع ياسر عرفات في تأسيس حركة فتح في الكويت، وتولّى قيادة «العاصفة»، جناحها العسكري، والإشراف على عملياتها المسلحة في الأراضي المحتلة عامَي 1948 و1967. ونُسبت إليه هجمات قُتل فيها إسرائيليون، منها هجوم 11 آذار 1978 على الطريق الساحلي الذي قُتل فيه 38 إسرائيليًّا بحسب الجزيرة، وتقول الجزيرة نت إنه هو من خطّط له؛ ومنذ 1982 رعى لجانًا شبابية في الأراضي المحتلة صارت ركيزة للانتفاضة الأولى، التي تقول الجزيرة إنه كان في طليعة موجّهيها. وبُعيد منتصف ليل 16 نيسان 1988 استُشهد في بيته في تونس، أمام زوجته، حين اغتالته وحدة كوماندوز من جيش الاحتلال نزلت بقوارب مطاطية بتخطيط من الموساد، وقتلت معه حارسَيه وبستاني البيت، ولم يُقرّ الاحتلال بالاغتيال إلا عام 2012 في تقرير أجازت رقابته العسكرية نشره، ودُفن في مخيم اليرموك في دمشق.", "bio": "Khalil al-Wazir (Abu Jihad) was born in al-Ramla (Ramla) on 10 October 1935; in July 1948 Israeli occupation forces drove his family out and they settled in al-Bureij camp in the Gaza Strip, where as a secondary-school student he organised a small fedayeen group that raided posts of the Israeli occupation army. He co-founded Fatah with Yasser Arafat in Kuwait and took command of al-Asifa, its armed wing, in charge of its guerrilla operations in the lands occupied in 1948 and 1967. He was blamed for attacks that killed Israelis, among them the attack on the coastal road on 11 March 1978, in which 38 Israelis were killed by Al Jazeera's count and which Al Jazeera's Arabic site says he planned; from 1982 he sponsored youth committees in the occupied territories that became a backbone of the first intifada, which Al Jazeera says he played a leading role in directing. Just after midnight on 16 April 1988 an Israeli occupation army commando team, landed by rubber boats in an operation planned by the Mossad, assassinated him at his home in Tunis in front of his wife, killing his two bodyguards and the gardener too; the occupation did not admit the killing until 2012, in a report its military censor cleared, and he was buried in Yarmouk camp in Damascus.", "related_events": ["e1948_07_lydda_ramle", "e1959_10_fatah", "e1965_01_fatah_first_op", "e1988_04_abu_jihad"], "sources": ["https://en.wikipedia.org/wiki/Khalil_al-Wazir", "https://www.aljazeera.com/news/middleeast/2012/11/2012111191447383639.html", "https://www.aljazeera.net/icons/strugglers/2017/6/1/دلال-المغربي-فدائية-أقامت-الجمهورية-الفلسطينية"], "sensitive": true}
  - {"id": "fig_abbas", "name_ar": "محمود عباس (أبو مازن)", "name": "Mahmoud Abbas (Abu Mazen)", "born": "1935-11", "chapters": ["1947_1949", "1950_1966", "1987_2000", "2000_2023", "2023_2026"], "role_ar": "رئيس السلطة الفلسطينية منذ 2005", "role": "President of the Palestinian Authority since 2005", "bio_ar": "وُلد محمود عباس (أبو مازن) في صفد في 15 تشرين الثاني 1935، ولجأت عائلته إلى سوريا في نكبة 1948، فدرس الحقوق في دمشق ثم نال درجة عليا في موسكو، وانضمّ إلى حركة فتح عام 1961. وفي 13 أيلول 1993 وقّع في واشنطن إعلان المبادئ (اتفاق أوسلو الأول) باسم منظمة التحرير، وتولّى رئاسة وزراء السلطة الفلسطينية من 19 آذار 2003 حتى استقالته في 6 أيلول من العام نفسه. وبعد وفاة ياسر عرفات انتُخب رئيسًا للسلطة في 9 كانون الثاني 2005 بنحو 63% من الأصوات، وكان يُفترض أن تنتهي ولايته عام 2009، لكن لم تُجرَ انتخابات رئاسية منذ ذلك الحين، وهو يحكم بالمراسيم. وفي نيسان 2025 عيّن حسين الشيخ نائبًا للرئيس، ثم جعله بمرسوم في تشرين الأول 2025 خلفًا مؤقتًا له إن شغر المنصب. ورفضت الولايات المتحدة منحه تأشيرة لحضور الجمعية العامة للأمم المتحدة في أيلول 2025 ثم في أيلول 2026، فخاطبها بكلمة مسجّلة. وفي 10 تشرين الأول 2026، وهو في التسعين، أرجأ الانتخابات التشريعية المقرّرة في 28 تشرين الثاني 2026 إلى 11 أيلول 2027 لتُجرى مع الرئاسية، في ظل اقتحامات جيش الاحتلال وتوسّع الاستيطان واحتجاز سلطات الاحتلال أموال الضرائب الفلسطينية، بحسب الجزيرة (حتى تشرين الأول 2026).", "bio": "Mahmoud Abbas (Abu Mazen) was born in Safad on 15 November 1935, and his family fled to Syria in the Nakba of 1948; he studied law in Damascus, later earned a postgraduate degree in Moscow, and joined Fatah in 1961. On 13 September 1993 he signed the Declaration of Principles (Oslo I) in Washington for the PLO, and he was the Palestinian Authority's prime minister from 19 March 2003 until he resigned on 6 September that year. After Yasser Arafat's death he was elected president on 9 January 2005 with about 63% of the vote; his term should have ended in 2009, no presidential election has been held since, and he rules by decree. In April 2025 he appointed Hussein al-Sheikh vice-president and in October 2025 decreed that al-Sheikh would succeed him temporarily if the presidency fell vacant. The United States refused him a visa to attend the UN General Assembly in September 2025 and again in September 2026, so he addressed it by video. On 10 October 2026, aged 90, he postponed the legislative elections set for 28 November 2026 to 11 September 2027, to be held with the presidential vote, amid occupation army raids, settlement expansion and the occupation authorities' withholding of Palestinian tax revenues, as Al Jazeera reported (as of October 2026).", "related_events": ["e1993_09_oslo", "e2004_11_arafat"], "sources": ["https://en.wikipedia.org/wiki/Mahmoud_Abbas", "https://www.aljazeera.com/news/2026/10/10/abbas-postpones-palestinian-legislative-elections-to-september-2027", "https://www.thenationalnews.com/news/mena/2026/05/18/imprisoned-palestinian-leader-marwan-barghouti-gains-most-votes-in-fatah-elections/", "https://www.aljazeera.com/news/2025/9/19/un-approves-video-address-by-palestines-abbas-after-us-visa-refusal", "https://www.aljazeera.com/news/2026/9/17/us-extends-visa-ban-on-palestinian-officials-before-un-general-assembly"], "sensitive": false}
  - {"id": "fig_edward_said", "name_ar": "إدوارد سعيد", "name": "Edward Said", "born": "1935-11", "died": "2003-09", "chapters": ["1947_1949", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "مفكر وناقد أدبي فلسطيني أمريكي", "role": "Palestinian-American scholar and literary critic", "bio_ar": "وُلد إدوارد سعيد في القدس في 1 تشرين الثاني 1935، وغادرت عائلته المدينة مع بداية حرب 1947–1949 إلى مصر، ثم انتقل إلى الولايات المتحدة. ودرّس الأدب الإنجليزي والأدب المقارن في جامعة كولومبيا منذ عام 1963، وأصدر كتاب «الاستشراق» عام 1978، ثم «مسألة فلسطين» عام 1979 الذي عرض للقارئ الغربي تاريخ الفلسطينيين ومشروعية تطلعاتهم الوطنية. وكان عضوًا مستقلًا في المجلس الوطني الفلسطيني من 1977 إلى 1991، واستقال منه عام 1991 لخلافه مع القيادة، ثم صار بعد عام 1993 من أبرز منتقدي اتفاق أوسلو، الذي رأى أنه لا يغيّر من الاحتلال إلا شكله، فحظرت السلطة الفلسطينية كتبه، وشارك عام 2002 في تأسيس المبادرة الوطنية الفلسطينية. ووصفته «رابطة الدفاع اليهودية» بالنازي، وأضرم متطرفون النار في مكتبه في جامعة كولومبيا. وتوفي بسرطان الدم في نيويورك في أيلول 2003، ودُفن في برمّانا في لبنان.", "bio": "Edward Said was born in al-Quds (Jerusalem) on 1 November 1935, and his family left the city for Egypt at the start of the 1947–1949 war; he later moved to the United States. He taught English and comparative literature at Columbia University from 1963, and published Orientalism in 1978 and then The Question of Palestine in 1979, which set out Palestinian history and the legitimacy of Palestinian national aspirations for Western readers. He was an independent member of the Palestine National Council from 1977 to 1991, resigned in 1991 in dispute with the leadership, and after 1993 became one of the leading critics of the Oslo accords, which he saw as changing only the form of the occupation, so that the Palestinian Authority banned his books; in 2002 he co-founded the Palestinian National Initiative. In the United States the Jewish Defense League called him a Nazi, and militants set fire to his office at Columbia. He died of leukaemia in New York in September 2003 and was buried in Broummana, Lebanon.", "related_events": ["e1993_09_oslo"], "sources": ["https://en.wikipedia.org/wiki/Edward_Said", "https://www.jadaliyya.com/Details/45326", "https://www.aljazeera.com/news/2003/10/5/wests-greatest-palestinian-advocate", "https://palquest.org/en/node/14593", "https://www.upi.com/Top_News/2003/09/25/Palestinian-scholar-dies/33451064514780/", "https://countercurrents.org/fisk-270903.htm"], "sensitive": false}
  - {"id": "fig_kanafani", "name_ar": "غسان كنفاني", "name": "Ghassan Kanafani", "born": "1936-04", "died": "1972-07", "chapters": ["1947_1949", "1950_1966", "1967_1987"], "role_ar": "روائي وناطق باسم الجبهة الشعبية", "role": "Novelist and PFLP spokesman", "bio_ar": "وُلد غسان كنفاني في عكا عام 1936، وهُجّر مع عائلته عام 1948 إلى لبنان ثم دمشق، وعمل مدرّسًا في الكويت منذ عام 1956، ثم انتقل إلى بيروت عام 1960 وانضمّ إلى هيئة تحرير مجلة «الحرية» التي أصدرتها حركة القوميين العرب. ونشر روايته «رجال في الشمس» عام 1963، وحوّلها المخرج توفيق صالح إلى فيلم «المخدوعون» الذي نال الجائزة الذهبية في مهرجان قرطاج، وكان أول من أطلق مفهوم «أدب المقاومة» على الكتابة الفلسطينية، وأول من نشر رسوم ناجي العلي. وشارك في تأسيس الجبهة الشعبية لتحرير فلسطين عام 1967 وصار ناطقًا باسمها، وترأّس منذ عام 1969 تحرير مجلتها «الهدف». وفي 8 تموز 1972 استُشهد في بيروت مع ابنة أخته لميس نجم ذات السبعة عشر عامًا، حين اغتاله جهاز الموساد بعبوة ناسفة زرعها في سيارته، بحسب مؤسسة الدراسات الفلسطينية.", "bio": "Ghassan Kanafani, born in 'Akka (Acre) in 1936, was driven out with his family in 1948 to Lebanon and then Damascus, taught in Kuwait from 1956, and in 1960 moved to Beirut and joined the editorial board of al-Hurriya, the Arab Nationalist Movement's magazine. He published his novel Men in the Sun in 1963, which the director Tawfiq Salih made into the film al-Makhdu'un (The Dupes), winner of the Golden Prize at the Carthage festival; he was the first to call Palestinian writing \"resistance literature\", and the first to publish Naji al-Ali's drawings. He took part in founding the PFLP in 1967, became its spokesman, and from 1969 edited its magazine al-Hadaf. On 8 July 1972 the Mossad assassinated him in Beirut with a bomb planted in his car, which also killed his 17-year-old niece, Lamees Najim, according to the Institute for Palestine Studies.", "related_events": ["e1963_06_men_in_the_sun", "e1966_06_resistance_literature", "e1969_10_handala", "e1972_07_kanafani"], "sources": ["https://www.palquest.org/en/biography/6566/ghassan-kanafani", "https://www.palquest.org/en/biography/14303/naji-al-ali", "https://en.wikipedia.org/wiki/Ghassan_Kanafani", "https://en.wikipedia.org/wiki/Naji_al-Ali"], "sensitive": true}
  - {"id": "fig_ahmed_yassin", "name_ar": "أحمد ياسين", "name": "Ahmed Yassin", "born": "1936-06", "died": "2004-03", "chapters": ["1947_1949", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "مؤسس حركة حماس وزعيمها الروحي", "role": "Founder and spiritual leader of Hamas", "bio_ar": "وُلد أحمد ياسين في قرية الجورة قرب المجدل عام 1936، ولجأ مع عائلته إلى غزة في نكبة 1948، وأُصيب في صباه إصابة رياضية خلّفت له شللًا رباعيًّا لازمه طوال حياته. وعمل مدرّسًا وترأّس جماعة الإخوان المسلمين في غزة، وأسّس المجمّع الإسلامي عام 1973، ثم أسّس مع ناشطين إسلاميين آخرين حركة حماس في كانون الأول 1987. واعتقلته سلطات الاحتلال في نيسان 1984 وحكمت عليه بالسجن 13 عامًا بتهمة تشكيل تنظيم مسلح، ثم أُطلق سراحه في أيار 1985 في صفقة تبادل، واعتقلته مجددًا في 19 أيار 1989 وحكمت عليه محكمة عسكرية تابعة للاحتلال بالسجن المؤبد، وأُفرج عنه في تشرين الأول 1997 في صفقة مع الأردن الذي أطلق عميلَين للموساد اعتُقلا بعد محاولة اغتيال خالد مشعل في عمّان. ونفّذت حماس أول تفجير انتحاري ضد مدنيين إسرائيليين في العفولة في 6 نيسان 1994، في ختام الحداد على 29 فلسطينيًّا قتلهم المستوطن باروخ غولدشتاين وهم يصلّون في الحرم الإبراهيمي، وقالت هيومن رايتس ووتش عام 2002 إن تفجيرات الحركة قتلت 168 شخصًا على الأقل، بينهم 153 مدنيًّا، وإن قادتها، ومنهم ياسين، يجب أن يخضعوا لتحقيق جنائي. وفجر 22 آذار 2004 اغتاله جيش الاحتلال بصواريخ أطلقتها مروحياته عليه وهو يغادر مسجدًا في حي الصبرة بمدينة غزة، فاستُشهد ومعه سبعة آخرون بينهم ثلاثة من حراسه، وجُرح 17 شخصًا بينهم اثنان من أبنائه، بحسب المركز الفلسطيني لحقوق الإنسان، فيما ذكرت الجزيرة أن تسعة آخرين استُشهدوا معه.", "bio": "Ahmed Yassin was born in al-Jura near al-Majdal in 1936 and fled with his family to Ghazza (Gaza) in the Nakba of 1948; a sports injury in his youth left him paralysed in all four limbs for life. A teacher and head of the Muslim Brotherhood in Gaza, he founded al-Mujamma al-Islami in 1973 and, with other Islamist activists, founded Hamas in December 1987. The occupation authorities arrested him in April 1984 and sentenced him to 13 years on a charge of forming an armed group; freed in a prisoner exchange in May 1985, he was arrested again on 19 May 1989 and sentenced to life by an Israeli military court, and freed in October 1997 in a deal with Jordan, which released two Mossad agents arrested after the attempt to kill Khaled Mashal in Amman. Hamas carried out its first suicide bombing against Israeli civilians at Afula on 6 April 1994, at the end of the mourning for 29 Palestinians killed at prayer in the Ibrahimi mosque by the settler Baruch Goldstein, and in 2002 Human Rights Watch said Hamas bombings had killed at least 168 people, 153 of them civilians, and that its leaders, Yassin among them, should face criminal investigation. At dawn on 22 March 2004 the Israeli occupation army assassinated him with missiles fired from helicopters as he left a mosque in the Sabra quarter of Ghazza, killing seven others, three of them his bodyguards, and wounding 17 people, two of his sons among them, according to PCHR; Al Jazeera reported nine others killed.", "related_events": ["e1987_12_jabalia", "e1994_04_afula"], "sources": ["https://www.palquest.org/en/biography/9845/ahmad-ismail-yasin", "https://www.aljazeera.com/news/2004/3/24/the-life-and-death-of-shaikh-yasin", "https://csmonitor.com/1997/1003/100397.intl.intl.4.html", "https://www.hrw.org/reports/2002/isrl-pa/ISRAELPA1002-05.htm", "https://www.hrw.org/news/2002/11/02/israel/pa-suicide-bombers-commit-crimes-against-humanity", "https://pchrgaza.org/?p=3250"], "sensitive": true}
  - {"id": "fig_darwish", "name_ar": "محمود درويش", "name": "Mahmoud Darwish", "born": "1941-03", "died": "2008-08", "chapters": ["1947_1949", "1950_1966", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "شاعر فلسطيني وعضو اللجنة التنفيذية لمنظمة التحرير", "role": "Palestinian poet and PLO Executive Committee member", "bio_ar": "وُلد محمود درويش في البروة في الجليل في 13 آذار 1941، ولجأت عائلته إلى لبنان خلال القتال، واحتلّ الجيش الصهيوني القرية ودمّرها عام 1948، ولمّا عاد إليها خفيةً مع جدّه عام 1949 وجدها مسوّاةً بالأرض وقد أُقيمت على أرضها مستوطنة وكيبوتس، فعاشت العائلة في دير الأسد بصفة «حاضرين غائبين»، أي لاجئين في وطنهم بلا أوراق رسمية. واعتقلته سلطات الاحتلال مرات عدة منذ عام 1961 بسبب أقواله وكتاباته ونشاطه السياسي، كان آخرها عام 1969، وفرضت عليه الإقامة الجبرية أكثر من مرة، وصارت قصيدته «بطاقة هوية» من أشهر قصائد الأرض المحتلة. وغادر عام 1970 للدراسة في موسكو، وانتقل إلى القاهرة في شباط 1971 وقرّر ألّا يعود، وانضمّ إلى منظمة التحرير في بيروت عام 1973، وكتب إعلان الاستقلال الذي أقرّه المجلس الوطني في الجزائر في تشرين الثاني 1988، ثم استقال من اللجنة التنفيذية للمنظمة عام 1993 احتجاجًا على اتفاق أوسلو. وتوفي في هيوستن في 9 آب 2008 بعد جراحة في القلب، ودُفن في رام الله في 13 آب.", "bio": "Mahmoud Darwish was born in al-Birwa in the Galilee on 13 March 1941; his family fled to Lebanon during the fighting, and the Zionist army captured and razed the village in 1948. When he crossed back secretly with his grandfather in 1949 they found it levelled, with a settlement and a kibbutz built on its land, and the family lived in Deir al-Asad as \"present-absentees\", refugees in their own country without official papers. The occupation authorities arrested him several times from 1961 over his words, writings and political activity, the last time in 1969, and placed him under house arrest more than once, and his poem \"Identity Card\" became one of the best-known poems of the occupied land. He left in 1970 to study in Moscow, moved to Cairo in February 1971, deciding not to return, and joined the PLO in Beirut in 1973; he wrote the Declaration of Independence that the National Council adopted in Algiers in November 1988, and in 1993 he resigned from the PLO Executive Committee in protest at the Oslo accords. He died in Houston on 9 August 2008 after heart surgery and was buried in Ramallah on 13 August.", "related_events": ["e1952_04_citizenship_law", "e1965_05_identity_card", "e1966_06_resistance_literature", "e1971_02_darwish", "e1982_06_lebanon", "e1988_11_declaration", "e1993_09_oslo"], "sources": ["https://en.wikipedia.org/wiki/Mahmoud_Darwish", "https://www.palquest.org/en/node/6550"], "sensitive": false}
  - {"id": "fig_leila_khaled", "name_ar": "ليلى خالد", "name": "Leila Khaled", "born": "1944-04", "chapters": ["1947_1949", "1967_1987", "2000_2023"], "role_ar": "عضو في الجبهة الشعبية والمجلس الوطني الفلسطيني", "role": "PFLP member and Palestine National Council member", "bio_ar": "وُلدت ليلى خالد في حيفا في 9 نيسان 1944، وكانت في الرابعة حين أُجبرت عائلتها على اللجوء إلى صور في لبنان بعد أن سقطت المدينة بيد العصابات الصهيونية في نيسان 1948، وانضمت إلى حركة القوميين العرب عام 1959 ثم إلى الجبهة الشعبية فور تأسيسها في كانون الأول 1967. وفي 29 آب 1969 خطفت مع سليم العيساوي طائرة ركاب لشركة «تي دبليو إيه» الأمريكية متجهة من روما إلى تل أبيب وحوّلتها إلى دمشق، حيث فجّر الخاطفان مقدّمتها بعد نزول الركاب، ولم يُصب أحد. وفي 6 أيلول 1970، ضمن موجة الخطف التي نفّذتها الجبهة، حاولت مع النيكاراغوي الأمريكي باتريك أرغويو خطف طائرة لشركة «العال» أقلعت من أمستردام، فأطلق أرغويو النار على أحد أفراد الطاقم فجرحه، وأطلق عليه حرّاس أمن إسرائيليون على متن الطائرة النار فمات متأثرًا بجراحه، وهبطت الطائرة في لندن حيث احتُجزت ليلى خالد نحو شهر قبل أن تُفرج عنها بريطانيا مقابل رهائن. وفي عام 1978 شاركت في تأسيس «بيت أطفال الصمود» لرعاية أطفال من قُتل آباؤهم في مخيم تل الزعتر، وانتُخبت عضوًا في المجلس الوطني الفلسطيني عام 1979 وفي المكتب السياسي للجبهة الشعبية عام 2005، وتقيم في عمّان.", "bio": "Leila Khaled, born in Hayfa (Haifa) on 9 April 1944, was four when her family was forced out to Tyre in Lebanon after Zionist militias took the city in April 1948; she joined the Arab Nationalist Movement in 1959 and the PFLP as soon as it was founded in December 1967. On 29 August 1969 she and Salim Issawi hijacked a TWA airliner flying from Rome to Tel Aviv and diverted it to Damascus, where the hijackers blew up its nose after the passengers had left; no one was hurt. On 6 September 1970, in the PFLP's wave of hijackings, she and the Nicaraguan-American Patrick Argüello tried to seize an El Al plane out of Amsterdam: Argüello shot and wounded a crew member, Israeli security guards on board shot Argüello, who died of his wounds, and the plane landed in London, where Khaled was held for about a month before Britain freed her in exchange for hostages. In 1978 she helped found the House of the Children of Resilience for children whose parents were killed at Tal al-Za'atar camp; she was elected to the Palestine National Council in 1979 and to the PFLP's political bureau in 2005, and lives in Amman.", "related_events": ["e1948_04_haifa", "e1970_09_black_september"], "sources": ["https://www.palquest.org/en/node/9857", "https://www.arabnews.com/node/225084", "https://www.open.ac.uk/library/digital-archive/video:LSGB862S", "https://en.wikipedia.org/wiki/Leila_Khaled"], "sensitive": true}
  - {"id": "fig_rantisi", "name_ar": "عبد العزيز الرنتيسي", "name": "Abdel Aziz al-Rantisi", "born": "1947-10", "died": "2004-04", "chapters": ["1947_1949", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "أحد مؤسسي حركة حماس وقائدها في غزة", "role": "Hamas co-founder and its leader in Gaza", "bio_ar": "وُلد عبد العزيز الرنتيسي في يبنا عام 1947، وكان في نحو شهره السادس حين سقطت القرية بيد قوات الاحتلال عام 1948 فلجأت عائلته إلى مخيم خان يونس، ودرس الطب في الإسكندرية وتخصّص في طب الأطفال، وكان أحد سبعة من قادة الإخوان المسلمين اجتمعوا في بيت أحمد ياسين في 9 كانون الأول 1987 وقرّروا تأسيس حركة حماس. واعتقلته سلطات الاحتلال أول مرة عام 1983 بعد أن نظّم حملة للامتناع عن دفع الضرائب لها، ثم مرارًا بعد ذلك، واحتجزته إداريًّا عامًا كاملًا منذ كانون الأول 1990، وفي كانون الأول 1992 أبعدته مع 415 فلسطينيًّا إلى مرج الزهور في جنوب لبنان، فاختاره المبعَدون ناطقًا باسمهم؛ وأدرجته هيومن رايتس ووتش عام 2002 بين قادة حماس الذين قالت إنهم قد يتحمّلون مسؤولية جنائية عن تفجيرات الحركة الانتحارية ضد المدنيين. وفي 10 حزيران 2003 حاول جيش الاحتلال اغتياله بصواريخ أطلقتها مروحية على سيارته فجُرح، وقالت قناة الجزيرة إن امرأة وابنتها ذات الخمس سنوات قُتلتا وهما تمرّان في المكان. وتولّى قيادة حماس في غزة بعد اغتيال ياسين، وفي 17 نيسان 2004 اغتاله جيش الاحتلال بصاروخ أطلقته مروحية على سيارته في مدينة غزة، فاستُشهد مع حارسَيه وجُرح أربعة من المارّة بينهم طفل في الرابعة عشرة، بحسب المركز الفلسطيني لحقوق الإنسان.", "bio": "Abdel Aziz al-Rantisi was born in Yibna in 1947 and was about six months old when Israeli occupation forces took the village in 1948 and his family fled to Khan Yunis camp; he trained in medicine in Alexandria, specialising in paediatrics, and was one of seven Muslim Brotherhood leaders who met at Ahmed Yassin's house on 9 December 1987 and decided to found Hamas. The occupation authorities first arrested him in 1983, after he organised a campaign to withhold taxes from them, and many times after; they held him in administrative detention for a year from December 1990, and in December 1992 deported him with 415 Palestinians to Marj al-Zuhur in South Lebanon, where the deportees chose him as their spokesman; in 2002 Human Rights Watch listed him among the Hamas leaders who, it said, could be held criminally responsible for the movement's suicide bombings against civilians. On 10 June 2003 the occupation army tried to kill him with missiles fired from a helicopter at his car, and he was wounded; Al Jazeera reported that a woman and her five-year-old daughter passing by were killed. He led Hamas in Gaza after Yassin's assassination, and on 17 April 2004 the occupation army assassinated him with a missile fired from a helicopter at his car in Ghazza (Gaza City), killing him and his two bodyguards and wounding four bystanders, one a child of 14, according to PCHR.", "related_events": ["e1987_12_jabalia", "e1992_12_marj_al_zuhur"], "sources": ["https://en.wikipedia.org/wiki/Abdel_Aziz_al-Rantisi", "https://palquest.org/en/node/14583", "https://www.aljazeera.com/news/2004/4/17/profile-dr-abd-al-aziz-al-rantisi", "https://www.hrw.org/reports/2002/isrl-pa/ISRAELPA1002-05.htm", "https://pchrgaza.org/?p=3242"], "sensitive": true}
  - {"id": "fig_naji_al_ali", "name_ar": "ناجي العلي", "name": "Naji al-Ali", "died": "1987-08", "chapters": ["1947_1949", "1950_1966", "1967_1987"], "role_ar": "رسام كاريكاتير ومبتكر شخصية حنظلة", "role": "Cartoonist, creator of Handala", "bio_ar": "وُلد ناجي العلي في قرية الشجرة في قضاء طبرية في أواخر الثلاثينيات، بين 1936 و1938 بحسب اختلاف المصادر، ولمّا احتلّت العصابات الصهيونية قريته عام 1948 لجأت عائلته إلى جنوب لبنان فنشأ في مخيم عين الحلوة قرب صيدا. ونشر غسان كنفاني أولى رسومه في مجلة «الحرية»، ثم رسم لصحف منها «الطليعة» و«السياسة» و«القبس» في الكويت، وابتكر شخصية حنظلة عام 1969. واحتجزه جيش الاحتلال مدة قصيرة خلال اجتياح لبنان عام 1982، ثم قرّرت الحكومة الكويتية إبعاده فانتقل إلى لندن في تشرين الأول 1985. وفي 22 تموز 1987 أطلق مسلح مجهول النار عليه قرب مكتب صحيفة «القبس» الدولية في لندن، فدخل في غيبوبة وتوفي في 29 آب 1987، ودُفن في مقبرة بروكوود الإسلامية خارج لندن. ولم تُعرف حتى اليوم الجهة التي تقف وراء اغتياله.", "bio": "Naji al-Ali was born in the village of al-Shajara, in the Tabariyya (Tiberias) district, in the late 1930s (sources give 1936 to 1938); when Zionist militias took the village in 1948 his family fled to south Lebanon, and he grew up in Ain al-Hilweh camp near Sidon. Ghassan Kanafani published his first drawings in al-Hurriya; he went on to draw for papers including al-Tali'a, al-Siyasa and al-Qabas in Kuwait, and created Handala in 1969. The occupation army briefly detained him during its 1982 invasion of Lebanon, and after Kuwait decided to expel him he moved to London in October 1985. On 22 July 1987 an unidentified gunman shot him near the London office of the international edition of al-Qabas; he fell into a coma, died on 29 August 1987 and was buried in Brookwood Islamic Cemetery outside London. Who was behind his killing has never been established.", "related_events": ["e1969_10_handala", "e1987_07_naji_al_ali", "e1987_08_naji_dies"], "sources": ["https://www.palquest.org/en/biography/14303/naji-al-ali", "https://www.thehullstory.com/allarticles/naji-al-ali-column-angus", "https://en.wikipedia.org/wiki/Naji_al-Ali"], "sensitive": true}
  - {"id": "fig_arafat", "name_ar": "ياسر عرفات (أبو عمار)", "name": "Yasser Arafat (Abu Ammar)", "born": "1929-08", "died": "2004-11", "chapters": ["1950_1966", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "رئيس منظمة التحرير الفلسطينية والسلطة الفلسطينية", "role": "Chairman of the PLO and president of the Palestinian Authority", "bio_ar": "وُلد ياسر عرفات (أبو عمار) في آب 1929، في القاهرة بحسب أغلب المصادر (وتقول نبذة الجزيرة إنه وُلد في غزة)، وشارك في تأسيس حركة فتح في الكويت أواخر الخمسينيات، ثم انتُخب رئيسًا لمنظمة التحرير الفلسطينية في 4 شباط 1969. وقاد مقاتلي فتح في معركة الكرامة عام 1968 حين هاجم جيش الاحتلال البلدة الأردنية، ثم قاد المنظمة في مواجهات أيلول 1970 مع الجيش الأردني، وفي لبنان حتى خروجها من بيروت إلى تونس عام 1982 بعد أن اجتاح جيش الاحتلال لبنان وحاصر المدينة، وفي 1 تشرين الأول 1985 قصفت طائرات الاحتلال مقرّ المنظمة في حمّام الشط قرب تونس فقتلت ما بين 47 و71 شخصًا بحسب اختلاف التقديرات، ولم يكن عرفات فيه، ودان مجلس الأمن الغارة في القرار 573. وخاطب الجمعية العامة للأمم المتحدة عام 1974، وفي 15 تشرين الثاني 1988 أعلنت المنظمة قيام دولة فلسطين. وبعد اتفاق أوسلو عام 1993 تقاسم جائزة نوبل للسلام لعام 1994 مع إسحاق رابين وشمعون بيريز، وعاد إلى غزة عام 1994 رئيسًا للسلطة الفلسطينية الوليدة، وانتُخب رئيسًا لها عام 1996، ومنذ آذار 2002 حاصره جيش الاحتلال في مقرّ المقاطعة في رام الله. وتوفي في 11 تشرين الثاني 2004 في مستشفى قرب باريس ودُفن في المقاطعة، وفي عام 2013 وجد فريق سويسري في رفاته مستويات من البولونيوم 210 تفوق المعتاد 18 مرة على الأقل، ورأى أنها تدعم فرضية التسميم بدرجة معتدلة، فيما خلص الفريقان الفرنسي والروسي إلى أنه توفي وفاة طبيعية، فبقي سبب وفاته موضع خلاف.", "bio": "Yasser Arafat (Abu Ammar) was born in August 1929, in Cairo according to most accounts (Al Jazeera's profile says Ghazza (Gaza)), co-founded Fatah in Kuwait in the late 1950s, and on 4 February 1969 became chairman of the PLO. He led Fatah's fighters at Karameh in 1968, when the occupation army attacked the Jordanian town, then led the PLO through the fighting with the Jordanian army in September 1970 and through its years in Lebanon until it left Beirut for Tunis in 1982, after the occupation army invaded Lebanon and besieged the city; on 1 October 1985 occupation warplanes bombed the PLO headquarters at Hammam al-Shatt near Tunis, killing between 47 and 71 people by differing estimates while he was away, and the UN Security Council condemned the raid in resolution 573. He addressed the UN General Assembly in 1974, and on 15 November 1988 the PLO proclaimed the State of Palestine. After the Oslo accords of 1993 he shared the 1994 Nobel Peace Prize with Yitzhak Rabin and Shimon Peres, returned to Gaza in 1994 as head of the new Palestinian Authority and was elected its president in 1996; from March 2002 the occupation army besieged him in his Muqata'a headquarters in Ramallah. He died on 11 November 2004 in a hospital near Paris and was buried at the Muqata'a; in 2013 a Swiss team found polonium-210 in his remains at no less than 18 times normal levels and said this moderately supported poisoning, while the French and Russian teams concluded he died of natural causes, so the cause of his death remains disputed.", "related_events": ["e1959_10_fatah", "e1968_03_karameh", "e1970_09_black_september", "e1974_11_arafat_un", "e1982_08_plo_departs", "e1988_11_declaration", "e1993_09_oslo", "e1994_05_cairo", "e1994_07_arafat_gaza", "e1996_01_elections", "e2000_07_camp_david", "e2002_03_defensive_shield", "e2004_11_arafat"], "sources": ["https://en.wikipedia.org/wiki/Yasser_Arafat", "https://www.aljazeera.com/news/2004/11/4/profile-president-yasir-arafat", "https://www.aljazeera.com/news/2004/11/12/arafat-buried-in-ram-allah", "https://www.aljazeera.com/news/2013/12/5/swiss-french-arafat-conclusion-debatable", "https://www.swissinfo.ch/eng/archive-science/russian-researchers-say-arafat-was-not-poisoned/37622490", "https://en.wikipedia.org/wiki/Operation_Wooden_Leg"], "sensitive": true}
  - {"id": "fig_tawfiq_ziad", "name_ar": "توفيق زيّاد", "name": "Tawfiq Ziad", "born": "1929-05", "died": "1994-07", "chapters": ["1950_1966", "1967_1987", "1987_2000"], "role_ar": "شاعر ورئيس بلدية الناصرة ونائب في الكنيست عن راكاح", "role": "Poet, mayor of al-Nasira (Nazareth) and Rakah member of the Knesset", "bio_ar": "وُلد توفيق زيّاد في الناصرة في 7 أيار 1929، واعتقلته شرطة الاحتلال بعد مظاهرة في آذار 1954 ضد ضريبة الرأس المفروضة على العرب غير المجنّدين، فضُرب في سجن طبريا وسُجن أربعين يومًا، ثم سُجن ستة أشهر عام 1958، وشارك عام 1965 في تأسيس القائمة الشيوعية الجديدة (راكاح). ومن دواوينه «أشدّ على أياديكم» (1966)، وانتُخب نائبًا في الكنيست عن راكاح عام 1973، ثم رئيسًا لبلدية الناصرة بعد فوز قائمته في 9 كانون الأول 1975، وبقي في المنصب حتى وفاته. وفي يوم الأرض، آذار 1976، تصدّى لرؤساء مجالس محلية عربية حاولوا تحت ضغط سلطات الاحتلال إلغاء الإضراب العام، فتعرّض للضرب وجرت محاولة لإحراق بيته. وتوفي في 5 تموز 1994 في حادث سير وهو عائد من أريحا، حيث ذهب لاستقبال ياسر عرفات العائد من المنفى.", "bio": "Tawfiq Ziad was born in al-Nasira (Nazareth) on 7 May 1929. The occupation police arrested him after a March 1954 protest against the poll tax on Arabs who were not conscripted; he was beaten in Tiberias prison and jailed for forty days, then for six months in 1958, and in 1965 he helped found the New Communist List, Rakah. His poetry collections include I Shake Your Hands (1966); he was elected to the Knesset for Rakah in 1973, and became mayor of al-Nasira after his list won on 9 December 1975, a post he held until his death. On Land Day, in March 1976, he stood against Arab local council heads who, under pressure from the occupation authorities, tried to call off the general strike, and he was beaten and an attempt was made to burn his house. He died on 5 July 1994 in a car crash on his way back from Ariha (Jericho), where he had gone to welcome Yasser Arafat back from exile.", "related_events": ["e1976_03_land_day", "e1994_07_arafat_gaza"], "sources": ["https://palquest.org/en/node/14601", "https://en.wikipedia.org/wiki/Tawfiq_Ziad"], "sensitive": false}
  - {"id": "fig_hawatmeh", "name_ar": "نايف حواتمة", "name": "Nayef Hawatmeh", "born": "1935-11", "chapters": ["1950_1966", "1967_1987", "1987_2000"], "role_ar": "مؤسس الجبهة الديمقراطية لتحرير فلسطين وأمينها العام", "role": "Founder and secretary-general of the DFLP", "bio_ar": "وُلد نايف حواتمة في السلط بالأردن في تشرين الثاني 1935 بحسب الموسوعة التفاعلية للقضية الفلسطينية (وتذكر مصادر أخرى عام 1938)، وقاد حركة القوميين العرب في الأردن والضفة الغربية، وحُكم عليه بالإعدام في الأردن في شباط 1958، ثم سُجن في بغداد أربعة عشر شهرًا حتى 8 شباط 1963. وفي 22 شباط 1969 قاد انشقاقًا عن الجبهة الشعبية لتحرير فلسطين انبثقت منه «الجبهة الشعبية الديمقراطية»، التي صار اسمها الجبهة الديمقراطية لتحرير فلسطين عام 1975، وهو أمينها العام منذ 1970. وفي 15 أيار 1974 عبر ثلاثة مسلحين من الجبهة من لبنان، فقتلوا زوجين وابنهما ذا الأربع سنوات في شقتهم في معالوت، ثم احتجزوا عشرات التلاميذ من مدرسة ثانوية في صفد داخل مدرسة في البلدة، وطالبوا بالإفراج عن 26 أسيرًا من سجون الاحتلال؛ واقتحمت قوات الاحتلال المبنى قبل انتهاء المهلة فقتل المسلحون رهائن، وبلغ عدد القتلى 26 إسرائيليًّا بحسب إحصاء مجلة «تايم» يومها (وتذكر روايات لاحقة 25 إلى 31 قتيلًا أغلبهم من التلاميذ). وفي اليوم التالي قصفت طائرات الاحتلال مخيمات للاجئين وقواعد للفدائيين في جنوب لبنان، فقتلت 27 شخصًا على الأقل بحسب بي بي سي، و50 بحسب «تايم». وأسهم في صياغة برنامج النقاط العشر الذي أقرّه المجلس الوطني الفلسطيني في حزيران 1974، ورفض اتفاق أوسلو عام 1993، ويقيم في دمشق منذ 1982، وكان مطلع 2024 لا يزال الأمين العام للجبهة بحسب الموسوعة.", "bio": "Nayef Hawatmeh was born in al-Salt, Jordan, in November 1935 according to the Interactive Encyclopedia of the Palestine Question (other sources give 1938); he led the Arab Nationalist Movement in Jordan and the West Bank, was sentenced to death in Jordan in February 1958, and was later jailed in Baghdad for fourteen months until 8 February 1963. On 22 February 1969 he led a split from the Popular Front for the Liberation of Palestine that founded the Popular Democratic Front, renamed the Democratic Front for the Liberation of Palestine in 1975, and he has been its secretary-general since 1970. On 15 May 1974 three of the front's gunmen crossed from Lebanon, killed a couple and their four-year-old son in their flat in Ma'alot, then held dozens of pupils of a Safad secondary school hostage in a school there, demanding the release of 26 prisoners from occupation jails; occupation forces stormed the building before the deadline and the gunmen killed hostages, 26 Israelis dying in all by Time magazine's count at the time (later accounts give 25 to 31 dead, most of them pupils). The next day occupation warplanes struck refugee camps and guerrilla bases in southern Lebanon, killing at least 27 people according to the BBC, and 50 according to Time. He helped draft the Ten Point Programme adopted by the Palestinian National Council in June 1974, rejected the Oslo accords in 1993 and has lived in Damascus since 1982; in early 2024 the encyclopedia still listed him as the front's secretary-general.", "related_events": [], "sources": ["https://www.palquest.org/en/biography/36875/nayef-hawatmeh", "https://en.wikipedia.org/wiki/Nayef_Hawatmeh", "https://en.wikipedia.org/wiki/Democratic_Front_for_the_Liberation_of_Palestine", "https://en.wikipedia.org/wiki/Ma%27alot_massacre", "https://content.time.com/time/subscriber/article/0,33009,911276,00.html"], "sensitive": true}
  - {"id": "fig_abu_ali_mustafa", "name_ar": "أبو علي مصطفى", "name": "Abu Ali Mustafa", "born": "1938-05", "died": "2001-08", "chapters": ["1950_1966", "1967_1987", "1987_2000", "2000_2023"], "role_ar": "الأمين العام للجبهة الشعبية لتحرير فلسطين (2000–2001)", "role": "PFLP secretary-general, 2000–2001", "bio_ar": "وُلد مصطفى الزبري (أبو علي مصطفى) في عرّابة في قضاء جنين في 14 أيار 1938، وانضم إلى حركة القوميين العرب عام 1955، وسُجن في الأردن من 1957 إلى 1961. وشارك في تأسيس الجبهة الشعبية لتحرير فلسطين في كانون الأول 1967 وكان نائبًا لجورج حبش مدة طويلة، وأمضى 32 عامًا في المنفى في الأردن ولبنان وسوريا، ونجا في بيروت من مخطط للاحتلال لاغتياله بسيارة مفخخة. وعاد إلى فلسطين في 30 أيلول 1999، وانتُخب أمينًا عامًا للجبهة في تموز 2000 خلفًا لحبش. وفي 27 آب 2001 اغتاله جيش الاحتلال بصاروخين أطلقتهما مروحيتان على مكتبه في البيرة، فاستُشهد، وجُرح خمسة فلسطينيين آخرين بينهم امرأة من سكان المبنى، بحسب المركز الفلسطيني لحقوق الإنسان.", "bio": "Mustafa al-Zibri (Abu Ali Mustafa) was born in Arraba, in the Jenin district, on 14 May 1938; he joined the Arab Nationalist Movement in 1955 and was imprisoned in Jordan from 1957 to 1961. He took part in founding the PFLP in December 1967, was for many years George Habash's deputy, and spent 32 years in exile in Jordan, Lebanon and Syria, surviving a car-bomb plot by the occupation in Beirut. He returned to Palestine on 30 September 1999 and was elected the PFLP's secretary-general in July 2000, succeeding Habash. On 27 August 2001 the occupation army assassinated him with two missiles fired by helicopters into his office in al-Bireh; the Palestinian Centre for Human Rights recorded five other Palestinians injured, one of them a woman living in the building.", "related_events": [], "sources": ["https://www.palquest.org/en/node/39354", "https://pchrgaza.org/?p=3460", "https://www.arabnews.com/node/214858", "https://www.palquest.org/en/highlight/23332/popular-front-liberation-palestine-%E2%80%93-pflp", "https://en.wikipedia.org/wiki/Abu_Ali_Mustafa"], "sensitive": true}
  - {"id": "fig_samih_al_qasim", "name_ar": "سميح القاسم", "name": "Samih al-Qasim", "born": "1939-05", "died": "2014-08", "chapters": ["1950_1966", "1967_1987", "2000_2023"], "role_ar": "شاعر وصحفي فلسطيني من الرامة", "role": "Palestinian poet and journalist from al-Rameh", "bio_ar": "وُلد سميح القاسم في 11 أيار 1939 في الزرقاء في الأردن لعائلة درزية من الرامة في الجليل الأعلى، ونشأ في القرية بعد عودة العائلة إليها عام 1941. وقاوم التجنيد الذي فرضته سلطات الاحتلال على الدروز، فلما جُنّد قسرًا عام 1960 رفض حمل السلاح وسُجن، ثم أمر وزير المعارف في حكومة الاحتلال بفصله من التدريس بسبب نشاطه الأدبي والسياسي والوطني، فعمل في مصنع ومساعدًا للحّام وعاملًا في محطة وقود. واعتقلته قوات الاحتلال مرات عدة وفرضت عليه الإقامة الجبرية، واعتُقل في 5 حزيران 1967 في مكاتب صحيفة «الاتحاد» الشيوعية واحتُجز في سجن الدامون. وكان من الشعراء الذين جمع غسان كنفاني نصوصهم في دراساته عن «أدب المقاومة»، وتولّى تحرير مجلة «الجديد» عشر سنوات منذ مطلع السبعينيات، وأصدر أكثر من سبعين كتابًا. وتوفي بالسرطان في مستشفى صفد في 19 آب 2014، ودُفن في الرامة.", "bio": "Samih al-Qasim was born on 11 May 1939 in Zarqa, in Jordan, to a Druze family from al-Rameh in the Upper Galilee, and grew up in the village after the family returned in 1941. He resisted the military service the occupation authorities imposed on the Druze: when he was conscripted by force in 1960 he refused to carry arms and was jailed, and the occupation's education minister had him dismissed from teaching over his literary, political and national activity, so he worked in a factory, as a welder's assistant and at a petrol station. Occupation forces arrested him several times and placed him under house arrest, and on 5 June 1967 he was arrested at the offices of the Communist paper al-Ittihad and held in Damun prison. He was among the poets whose work Ghassan Kanafani gathered in his studies of \"resistance literature\", edited the magazine al-Jadid for ten years from the early 1970s and published more than seventy books. He died of cancer in the hospital in Safad on 19 August 2014 and was buried in al-Rameh.", "related_events": ["e1966_06_resistance_literature"], "sources": ["https://en.wikipedia.org/wiki/Samih_al-Qasim", "https://www.palquest.org/en/biography/14239/samih-al-qasim", "https://www.ajnet.me/culture/2014/8/21/%d8%a7%d9%84%d8%b4%d8%a7%d8%b9%d8%b1-%d8%a7%d9%84%d9%81%d9%84%d8%b3%d8%b7%d9%8a%d9%86%d9%8a-%d8%b3%d9%85%d9%8a%d8%ad-%d8%a7%d9%84%d9%82%d8%a7%d8%b3%d9%85-%d9%8a%d9%8f%d9%88%d8%a7%d8%b1%d9%89"], "sensitive": false}
  - {"id": "fig_hanan_ashrawi", "name_ar": "حنان عشراوي", "name": "Hanan Ashrawi", "born": "1946-10", "chapters": ["1967_1987", "1987_2000", "2000_2023"], "role_ar": "أكاديمية ونائبة وعضو سابق في اللجنة التنفيذية لمنظمة التحرير", "role": "Academic, legislator and former PLO Executive Committee member", "bio_ar": "وُلدت حنان عشراوي في نابلس في 8 تشرين الأول 1946، ودرست في الجامعة الأمريكية في بيروت ثم في جامعة فرجينيا، وعادت إلى فلسطين عام 1973 فأسّست قسم اللغة الإنجليزية في جامعة بيرزيت، ثم صارت عميدة كلية الآداب فيها. وبسبب نشاطها الاحتجاجي في الجامعة لاحقتها سلطات الاحتلال بالمضايقات واحتجزتها مرات كثيرة، يومًا واحدًا في كل مرة، غالبًا في ذكرى 5 حزيران و2 تشرين الثاني، بحسب الموسوعة التفاعلية للقضية الفلسطينية. وانضمّت إلى اللجنة السياسية للانتفاضة الأولى، وصارت منذ مؤتمر مدريد عام 1991 الناطقة الرسمية باسم الوفد الفلسطيني الذي ترأّسه حيدر عبد الشافي. وانتُخبت عن القدس في المجلس التشريعي عام 1996 ثم عام 2006، وتولّت وزارة التعليم العالي من 1996 إلى 1998 واستقالت احتجاجًا على عدم تنفيذ السلطة خطط الإصلاح وعلى إدارة المفاوضات، وأسّست مؤسسة «مفتاح» والهيئة المستقلة لحقوق المواطن. وانتُخبت عام 2009 في اللجنة التنفيذية لمنظمة التحرير، وأعلنت استقالتها منها في 9 كانون الأول 2020 داعيةً إلى تجديد النظام السياسي وإنهاء تهميش اللجنة، وعُيّنت في آب 2023 رئيسة لمجلس أمناء جامعة بيرزيت.", "bio": "Hanan Ashrawi was born in Nablus on 8 October 1946, studied at the American University of Beirut and then the University of Virginia, and on returning to Palestine in 1973 founded the English department at Birzeit University, later becoming dean of its Faculty of Arts. For her protest activity at the university the occupation authorities harassed her and detained her many times for a day at a time, often around the anniversaries of 5 June and 2 November, according to the Interactive Encyclopedia of the Palestine Question. She joined the political committee of the first intifada and, from the Madrid conference of 1991, was official spokesperson of the Palestinian delegation headed by Haidar Abdel-Shafi. Elected for al-Quds (Jerusalem) to the Legislative Council in 1996 and again in 2006, she was minister of higher education from 1996 to 1998 and resigned over the Palestinian Authority's failure to carry out reform and over how the negotiations were run, and she founded MIFTAH and the Independent Commission for Citizens' Rights. Elected to the PLO Executive Committee in 2009, she announced her resignation on 9 December 2020, calling for renewal of the political system and an end to the committee's marginalisation, and in August 2023 she was named chair of Birzeit University's Board of Trustees.", "related_events": ["e1974_11_birzeit", "e1991_10_madrid", "e1996_01_elections"], "sources": ["https://www.palquest.org/en/node/14595", "https://en.wikipedia.org/wiki/Hanan_Ashrawi", "https://www.aljazeera.com/amp/news/2020/12/8/senior-plo-member-resigns-reports", "https://baynews9.com/fl/tampa/ap-online/2020/12/09/veteran-palestinian-official-hanan-ashrawi-resigns"], "sensitive": false}
  - {"id": "fig_fathi_shaqaqi", "name_ar": "فتحي الشقاقي", "name": "Fathi Shaqaqi", "born": "1951-01", "died": "1995-10", "chapters": ["1967_1987", "1987_2000"], "role_ar": "مؤسس حركة الجهاد الإسلامي وقائدها", "role": "Founder and leader of Palestinian Islamic Jihad", "bio_ar": "وُلد فتحي الشقاقي في مخيم رفح للاجئين في 4 كانون الثاني 1951 لعائلة هُجّرت من زرنوقة في نكبة 1948، ودرس الرياضيات في بيرزيت ثم الطب في جامعة الزقازيق في مصر، وعمل طبيبًا للأطفال، وكان يحب شعر محمود درويش ويكتب الشعر. وفي مطلع الثمانينيات أسّس مع رفاق من الطلبة الحركة التي صارت حركة الجهاد الإسلامي في فلسطين، واعتقلته قوات الاحتلال مرات عدة بين 1983 و1986، وحكمت عليه محكمة للاحتلال عام 1986 بالسجن أربع سنوات، ثم أبعدته سلطات الاحتلال إلى لبنان في 1 آب 1988 قبل انتهاء محكوميته، متّهمةً إياه بدور رئيسي في تنظيم الانتفاضة، فقاد الحركة من دمشق. وفي 22 كانون الثاني 1995 فجّر مهاجمان من الجهاد الإسلامي نفسيهما عند مفترق بيت ليد قرب نتانيا، فقتلا 20 جنديًّا إسرائيليًّا بحسب هيومن رايتس ووتش، و22 بحسب الجزيرة. وفي 26 تشرين الأول 1995 استُشهد في سليما بمالطا وهو عائد من ليبيا بجواز سفر ليبي، إذ اغتاله عميلان للموساد أطلقا خمس رصاصات على رأسه بحسب الجزيرة، وتصف هيومن رايتس ووتش قتله بأنه اغتيال إسرائيلي، ودُفن في مقبرة الشهداء بمخيم اليرموك في دمشق.", "bio": "Fathi Shaqaqi was born in Rafah refugee camp on 4 January 1951 to a family driven out of Zarnuqa in the Nakba of 1948; he studied mathematics at Birzeit and then medicine at Zagazig University in Egypt, worked as a paediatrician, and loved Darwish's poetry and wrote poems. In the early 1980s he and fellow students founded the movement that became Palestinian Islamic Jihad; occupation forces arrested him several times between 1983 and 1986, an occupation court jailed him for four years in 1986, and on 1 August 1988, before his term ended, the occupation authorities deported him to Lebanon, accusing him of a central role in organising the intifada; he led the movement from Damascus. On 22 January 1995 two Islamic Jihad bombers blew themselves up at the Beit Lid junction near Netanya, killing 20 Israeli soldiers according to Human Rights Watch, or 22 according to Al Jazeera. On 26 October 1995 two Mossad agents assassinated him in Sliema, Malta, as he travelled back from Libya on a Libyan passport, firing five bullets into his head, according to Al Jazeera; Human Rights Watch calls it an Israeli assassination. He was buried in the martyrs' cemetery of Yarmouk camp in Damascus.", "related_events": [], "sources": ["https://www.palquest.org/en/node/14247", "https://www.aljazeera.net/encyclopedia/2014/12/6/%D9%81%D8%AA%D8%AD%D9%8A-%D8%A7%D9%84%D8%B4%D9%82%D8%A7%D9%82%D9%8A", "https://www.aljazeera.net/news/2020/5/11/%D8%A7%D9%82%D8%AA%D9%84%D9%88%D9%87-%D8%AE%D8%A7%D8%B1%D8%AC-%D8%AF%D9%85%D8%B4%D9%82-%D8%AE%D9%85%D8%B3-%D8%B1%D8%B5%D8%A7%D8%B5%D8%A7%D8%AA-%D9%81%D9%8A-%D8%B1%D8%A3%D8%B3-%D9%85%D8%A4%D8%B3", "https://www.hrw.org/reports/2002/isrl-pa/ISRAELPA1002-05.htm", "https://en.wikipedia.org/wiki/Fathi_Shaqaqi", "https://en.wikipedia.org/wiki/Beit_Lid_massacre"], "sensitive": true}
  - {"id": "fig_saadat", "name_ar": "أحمد سعدات", "name": "Ahmad Saadat", "born": "1953", "chapters": ["1967_1987", "1987_2000", "2000_2023", "2023_2026"], "role_ar": "الأمين العام للجبهة الشعبية وأسير في سجون الاحتلال", "role": "PFLP secretary-general, held in Israeli occupation prisons", "bio_ar": "وُلد أحمد سعدات في البيرة عام 1953، واعتقلته قوات الاحتلال ست مرات بين 1976 و1993، وانتخبته اللجنة المركزية للجبهة الشعبية لتحرير فلسطين أمينًا عامًا في 3 تشرين الأول 2001 بعد أن اغتال جيش الاحتلال أبا علي مصطفى. وفي 17 تشرين الأول 2001 قتلت كتائب أبو علي مصطفى، الجناح المسلح للجبهة، وزير السياحة في حكومة الاحتلال رحبعام زئيفي بالرصاص في فندق بالقدس، وقالت الجبهة إنها تثأر لأبي علي مصطفى، ثم اعتقلت السلطة الفلسطينية سعدات في كانون الثاني 2002 واحتجزته في سجن أريحا تحت حراسة أمريكية وبريطانية. وفي 14 آذار 2006، بعد دقائق من انسحاب المراقبين، اقتحمت قوات الاحتلال السجن، وقصفته بقذائف الدبابات وصواريخ المروحيات وهدمت مبانيه بالجرافات، وقتلت في الاقتحام فلسطينيَّين بحسب المركز الفلسطيني لحقوق الإنسان وثلاثة بحسب مركز الميزان، واقتادته وقد صار نائبًا منتخبًا في المجلس التشريعي. وفي 25 كانون الأول 2008 حكمت عليه محكمة عسكرية تابعة للاحتلال بالسجن 30 عامًا بتهم منها الإشراف على العمليات العسكرية للجبهة، بعد أن أسقطت النيابة عنه تهمة التخطيط لقتل زئيفي. وفي العزل الانفرادي كتب «صدى القيد» عن سياسة العزل، وحُرم من الزيارة سنوات، وحتى تشرين الأول 2025 بقي في سجون الاحتلال، وطالبت حماس بالإفراج عنه في مفاوضات وقف إطلاق النار.", "bio": "Ahmad Saadat, born in al-Bireh in 1953 and arrested by occupation forces six times between 1976 and 1993, was elected secretary-general of the PFLP by its central committee on 3 October 2001, after the Israeli occupation army assassinated Abu Ali Mustafa. On 17 October 2001 the Abu Ali Mustafa Brigades, the PFLP's armed wing, shot dead the Israeli tourism minister Rehavam Ze'evi in an al-Quds (Jerusalem) hotel, and the PFLP said it was avenging Abu Ali Mustafa; in January 2002 the Palestinian Authority arrested Saadat and later held him in Ariha (Jericho) prison under US and British guard. On 14 March 2006, minutes after the monitors left, occupation forces stormed the prison, shelling it with tank rounds and helicopter missiles and bulldozing its buildings, and seized him, by then an elected member of the Legislative Council; two Palestinians were killed according to the Palestinian Centre for Human Rights, three according to Al Mezan. On 25 December 2008 an Israeli military court sentenced him to 30 years on charges including overseeing the PFLP's military operations, after prosecutors dropped the charge of planning Ze'evi's killing against him. In solitary confinement he wrote \"Echo of the Shackle\" (Sada al-Qayd) on the policy of isolation, and he was denied visits for years; as of October 2025 he was still held in Israeli occupation prisons and Hamas was demanding his release in the ceasefire talks.", "related_events": ["gz_2025_10_exchange"], "sources": ["https://www.palquest.org/en/highlight/23332/popular-front-liberation-palestine-%E2%80%93-pflp", "https://transcripts.cnn.com/show/lad/date/2001-10-17/segment/09", "https://pchrgaza.org/?p=3011", "https://pchrgaza.org/?p=3009", "https://mezan.org/public/en/post/943", "https://www.arabnews.com/node/319334", "https://www.masrawy.com/news/news_publicaffairs/details/2025/10/8/2868846", "https://en.wikipedia.org/wiki/Ahmad_Sa%27adat"], "sensitive": true}
  - {"id": "fig_salah_shehadeh", "name_ar": "صلاح شحادة", "name": "Salah Shehadeh", "born": "1953-02", "died": "2002-07", "chapters": ["1967_1987", "1987_2000", "2000_2023"], "role_ar": "مؤسس الجناح العسكري لحماس وقائده", "role": "Founder and commander of Hamas's armed wing", "bio_ar": "وُلد صلاح شحادة في 24 شباط 1953 في مخيم الشاطئ للاجئين في غزة لعائلة هُجّرت من يافا عام 1948، ودرس الخدمة الاجتماعية في الإسكندرية، وعمل مفتشًا للشؤون الاجتماعية ثم في الجامعة الإسلامية في غزة. واعتقلته سلطات الاحتلال بين 1984 و1986 بموجب قانون الطوارئ دون أن تثبت عليه تهمة، ثم أسّس أول جهاز عسكري لحماس، «المجاهدون الفلسطينيون»، الذي صار كتائب عز الدين القسام. واعتُقل مجددًا من 1988 حتى 14 أيار 2000، وتعرّض في السجن للضرب المبرح ونتف شعر لحيته والعزل الانفرادي والحرمان من زيارة عائلته، وهدّده ضباط مخابرات الاحتلال قبيل الإفراج عنه بالاغتيال، بحسب الجزيرة. ثم قاد الكتائب في الانتفاضة الثانية، وسجّلت هيومن رايتس ووتش 18 تفجيرًا انتحاريًا ضد مدنيين إسرائيليين تبنّتها كتائب القسام بين كانون الثاني 2001 وتموز 2002. وقبيل منتصف ليل 22 تموز 2002 اغتاله جيش الاحتلال بقنبلة تزن طنًّا ألقتها طائرة إف-16 على بيته في حي الدرج بمدينة غزة، فاستُشهد مع زوجته وابنته، ووثّق مركز الميزان 15 قتيلًا، بينهم ثمانية أطفال، وأكثر من 150 جريحًا.", "bio": "Salah Shehadeh was born on 24 February 1953 in al-Shati camp, Gaza, to a family driven out of Yafa (Jaffa) in 1948; he studied social work in Alexandria and worked as a social affairs inspector and at the Islamic University of Gaza. Held by the occupation from 1984 to 1986 under emergency law with no charge proven, he then founded Hamas's first armed apparatus, \"al-Mujahidun al-Filastiniyun\", which became the Izz ad-Din al-Qassam Brigades. Jailed again from 1988 until 14 May 2000, he was badly beaten, had his beard torn out, was kept in solitary and denied family visits, and was threatened with assassination by occupation intelligence officers before release, according to Al Jazeera. He then commanded the Brigades in the second intifada; Human Rights Watch recorded 18 suicide bombings against Israeli civilians claimed by the Brigades from January 2001 to July 2002. Shortly before midnight on 22 July 2002 the occupation army assassinated him with a one-ton bomb dropped by an F-16 on his home in al-Daraj, Ghazza (Gaza City), killing him, his wife and his daughter; Al Mezan documented 15 dead, eight of them children, and more than 150 wounded.", "related_events": ["e2002_07_shehadeh"], "sources": ["https://www.aljazeera.net/encyclopedia/2010/12/9/%D8%B5%D9%84%D8%A7%D8%AD-%D8%B4%D8%AD%D8%A7%D8%AF%D8%A9", "https://www.hrw.org/reports/2002/isrl-pa/ISRAELPA1002-05.htm", "https://www.mezan.org/en/post/1320", "https://en.wikipedia.org/wiki/Salah_Shehade"], "sensitive": true}
  - {"id": "fig_dalal_mughrabi", "name_ar": "دلال المغربي", "name": "Dalal al-Mughrabi", "born": "1958", "died": "1978-03", "chapters": ["1967_1987", "2000_2023"], "role_ar": "قائدة مجموعة فتح في هجوم الطريق الساحلي عام 1978", "role": "Leader of the Fatah team in the 1978 Coastal Road attack", "bio_ar": "وُلدت دلال المغربي عام 1958 في أحد مخيمات اللاجئين في بيروت، لعائلة من يافا لجأت إلى لبنان في نكبة 1948، ودرست في مدارس وكالة الغوث، وانضمّت إلى حركة فتح وهي طالبة، وتطوّعت ممرّضة في الهلال الأحمر. وفي 11 آذار 1978، وهي في العشرين، قادت مجموعة من فتح نزلت بحرًا من لبنان على الساحل شمال تل أبيب، في هجوم تقول الجزيرة نت إن خليل الوزير (أبو جهاد) خطّط له؛ واستولت المجموعة على سيارات ثم على حافلة ركاب على الطريق الساحلي وعلّقت فيها العلم الفلسطيني، فطاردتها دبابات الاحتلال ومروحياته وقوة خاصة يقودها إيهود باراك حتى أوقفتها قرب هرتسليا، واحترقت الحافلة بركّابها في الاشتباك. وقُتل 38 مدنيًّا إسرائيليًّا، بينهم 13 طفلًا، بحسب «موسوعة التاريخ العسكري»، فيما أعلن رئيس حكومة الاحتلال مناحيم بيغن مقتل 37 وجرح أكثر من 80، وقُتلت هي ومعظم أفراد مجموعتها. واحتجزت سلطات الاحتلال جثمانها ثلاثين عامًا، وأفادت الجزيرة بأن رفاتها كان بين الرفات التي تسلّمها حزب الله في صفقة تبادل الأسرى في 16 تموز 2008.", "bio": "Dalal al-Mughrabi was born in 1958 in a refugee camp in Beirut to a family from Yafa (Jaffa) that had fled to Lebanon in the Nakba of 1948; she went to UNRWA schools, joined Fatah as a student and volunteered as a nurse with the Red Crescent. On 11 March 1978, aged twenty, she led a Fatah team that came by sea from Lebanon and landed on the coast north of Tel Aviv, in an attack that Al Jazeera's Arabic site says Khalil al-Wazir (Abu Jihad) planned; the group seized cars and then a passenger bus on the coastal road and hung the Palestinian flag inside it, and occupation tanks and helicopters and a special unit led by Ehud Barak pursued it until they stopped it near Herzliya, where the bus burned with its passengers inside during the firefight. The attack killed 38 Israeli civilians, 13 of them children, according to the Encyclopedia of Military History, while the Israeli prime minister Menachem Begin announced 37 dead and more than 80 wounded; she and most of her team were killed. The occupation authorities held her body for thirty years, and Al Jazeera reported that her remains were among those Hezbollah received in the prisoner exchange of 16 July 2008.", "related_events": [], "sources": ["https://www.aljazeera.net/icons/strugglers/2017/6/1/دلال-المغربي-فدائية-أقامت-الجمهورية-الفلسطينية", "https://en.wikipedia.org/wiki/Dalal_Mughrabi", "https://en.wikipedia.org/wiki/Coastal_road_massacre", "https://www.aljazeera.com/amp/news/2008/7/16/israel-returns-lebanese-prisoners"], "sensitive": true}
  - {"id": "fig_marwan_barghouti", "name_ar": "مروان البرغوثي", "name": "Marwan Barghouti", "born": "1959-06", "chapters": ["1967_1987", "1987_2000", "2000_2023", "2023_2026"], "role_ar": "قيادي في حركة فتح وأسير في سجون الاحتلال", "role": "Fatah leader held in Israeli occupation prisons", "bio_ar": "وُلد مروان البرغوثي في كوبر قرب رام الله في 6 حزيران 1959، وانضمّ إلى حركة فتح في الخامسة عشرة، واعتقلته قوات الاحتلال أول مرة عام 1978 فأمضى أربع سنوات في سجونها، ثم اعتقلته مرارًا وأبعدته في أيار 1987، وعاد بموجب اتفاقات أوسلو في نيسان 1994، وانتُخب عضوًا في المجلس التشريعي عن رام الله عام 1996. وكان من قادة الانتفاضتين الأولى والثانية، وقاد «التنظيم» التابع لفتح، فدعا إلى مقاومة الاحتلال بالسلاح وعارض الهجمات على المدنيين داخل إسرائيل، واتهمته سلطات الاحتلال بقيادة كتائب شهداء الأقصى، وهو ما نفاه. واعتقلته قوات الاحتلال في 15 نيسان 2002، ووجّهت إليه 26 تهمة، ودانته محكمة تابعة للاحتلال عام 2004 بخمس تهم قتل في هجمات نُسبت إلى الكتائب، وحكمت عليه بالسجن المؤبد خمس مرات وأربعين عامًا، بعد أن امتنع عن الدفاع عن نفسه ورفض الاعتراف بالمحكمة، وكان مراقب للاتحاد البرلماني الدولي قد خلص عام 2003 إلى أنه لا يمكن القول إنه حظي بمحاكمة عادلة. ورفض الاحتلال الإفراج عنه في صفقات التبادل في إطار وقف إطلاق النار الذي بدأ في 10 تشرين الأول 2025، ويحرمه منذ تشرين الأول 2023 من زيارات عائلته والصليب الأحمر. ويقول محاميه وعائلته إن السجّانين ضربوه مرارًا، منها في أيلول 2025 حين كسروا أربعًا من أضلاعه، وفي آذار ونيسان 2026، وفي أيار 2026 نال، وهو في العزل الانفرادي، أعلى الأصوات في انتخابات اللجنة المركزية لحركة فتح، وما زال أسيرًا حتى آخر التقارير في تموز 2026.", "bio": "Marwan Barghouti was born in Kobar, near Ramallah, on 6 June 1959 and joined Fatah at 15; occupation forces first arrested him in 1978 and he spent four years in their prisons, and after repeated arrests they expelled him in May 1987; he returned under the Oslo accords in April 1994 and was elected to the Legislative Council for Ramallah in 1996. A leader of the first and second intifadas, he headed Fatah's Tanzim, calling for armed resistance to the occupation while opposing attacks on civilians inside Israel; the occupation authorities accused him of leading the al-Aqsa Martyrs' Brigades, which he denied. Occupation forces seized him on 15 April 2002 and charged him on 26 counts, and in 2004 an occupation court convicted him on five counts of murder in attacks attributed to the Brigades and sentenced him to five life terms plus 40 years, after he had refused to offer a defence or to recognise the court; an Inter-Parliamentary Union observer had concluded in 2003 that he could not be said to have had a fair trial. The occupation refused to free him in the exchanges under the ceasefire that began on 10 October 2025, and since October 2023 has denied him family and Red Cross visits. His lawyer and family report repeated beatings by guards, including in September 2025, when four of his ribs were broken, and in March and April 2026; in May 2026, held in solitary confinement, he won the most votes in elections to Fatah's Central Committee, and he remained a prisoner in the latest reports, of July 2026.", "related_events": ["e2002_03_defensive_shield", "e2017_04_dignity_strike", "gz_2025_10_exchange"], "sources": ["https://en.wikipedia.org/wiki/Marwan_Barghouti", "https://www.masrawy.com/news/news_publicaffairs/details/2025/10/8/2868846", "https://www.aljazeera.com/news/2024/10/28/marwan-barghouti-brutally-assaulted-in-israeli-prison-rights-groups-say", "https://www.aljazeera.com/news/2025/12/4/global-campaign-launched-to-free-jailed-palestinian-leader-marwan-barghouti", "https://www.aljazeera.com/news/2026/4/15/palestinian-leader-barghouti-endures-violent-assaults-in-israeli-prisons", "https://www.thenationalnews.com/news/mena/2026/05/18/imprisoned-palestinian-leader-marwan-barghouti-gains-most-votes-in-fatah-elections/", "https://www.middleeastmonitor.com/20260702-israel-tightens-solitary-confinement-of-jailed-fatah-leader-marwan-barghouti-his-office-says/", "https://www.newarab.com/news/activists-project-marwan-barghouti-near-eiffel-tower"], "sensitive": true}
  - {"id": "fig_sinwar", "name_ar": "يحيى السنوار", "name": "Yahya Sinwar", "born": "1962-10", "died": "2024-10", "chapters": ["1967_1987", "1987_2000", "2000_2023", "2023_2026"], "role_ar": "قائد حماس في غزة ورئيس مكتبها السياسي", "role": "Hamas leader in Gaza and political bureau head", "bio_ar": "وُلد يحيى السنوار في تشرين الأول 1962 في مخيم خان يونس لعائلة هُجّرت من المجدل (عسقلان) عام 1948. وأسّس عام 1986، بحسب الموسوعة التفاعلية، جهاز «مجد» لتعقّب المتهمين بالتعاون مع الاحتلال ومعاقبتهم، واعتقلته قوات الاحتلال عام 1988 فحكمت عليه محكمة عسكرية تابعة لها بالسجن المؤبد أربع مرات بتهمة المشاركة في أسر جنديين إسرائيليين وقتلهما وقتل أربعة فلسطينيين اشتُبه في تعاونهم مع الاحتلال. وأمضى 23 عامًا متواصلة في سجون الاحتلال، نحو أربع منها في العزل الانفرادي، وكتب فيها رواية «الشوك والقرنفل»، حتى أُفرج عنه في تشرين الأول 2011 في صفقة «وفاء الأحرار» التي حرّرت 1,027 أسيرًا مقابل الجندي جلعاد شاليط. وتولّى قيادة حماس في غزة عام 2017، ويُعدّ مهندس هجوم السابع من تشرين الأول 2023، الذي جاء بعد 16 عامًا من حصار الاحتلال لغزة، وبعد أن قتلت قوات الاحتلال 172 فلسطينيًّا في الضفة الغربية حتى أواخر آب 2023 بحسب «أوتشا»، وقُتل فيه 1,139 شخصًا بينهم 695 مدنيًّا إسرائيليًّا بحسب إحصاء وكالة الصحافة الفرنسية، منهم 14 مدنيًّا على الأقل قتلتهم على الأرجح نيران جيش الاحتلال نفسه بحسب لجنة التحقيق الأممية، وأُسر 251 شخصًا. وخلف إسماعيل هنية في رئاسة المكتب السياسي في 6 آب 2024، وفي 16 تشرين الأول 2024 استُشهد في اشتباك مع قوة لجيش الاحتلال في حي تل السلطان برفح، إذ لجأ جريحًا إلى مبنى قصفته دبابات الاحتلال وصواريخه.", "bio": "Yahya Sinwar was born in October 1962 in the Khan Younis refugee camp to a family expelled from al-Majdal (Asqalan) in 1948. In 1986, according to the Interactive Encyclopedia, he founded al-Majd, a unit that tracked down and punished Palestinians accused of collaborating with the occupation; occupation forces arrested him in 1988 and an Israeli military court sentenced him to four life terms for involvement in the capture and killing of two Israeli soldiers and the killing of four Palestinians suspected of collaborating with the occupation. He spent 23 years in Israeli occupation prisons, about four of them in solitary confinement, and wrote the novel Thorns and Carnations there, until he was freed in October 2011 in the Wafa al-Ahrar exchange, which released 1,027 prisoners for the soldier Gilad Shalit. He became Hamas's leader in Gaza in 2017 and is regarded as the architect of the 7 October 2023 attack, which came after 16 years of the occupation's blockade of Gaza and after occupation forces had killed 172 Palestinians in the West Bank by late August 2023 (OCHA); AFP's tally counts 1,139 killed, 695 of them Israeli civilians, of whom at least 14 were likely killed by the occupation army's own fire according to the UN Commission of Inquiry, and 251 people were taken captive. On 6 August 2024 he succeeded Ismail Haniyeh as head of the political bureau. On 16 October 2024 he was killed in a clash with an Israeli occupation army unit in the Tal al-Sultan neighbourhood of Rafah, after he had taken shelter, wounded, in a building that occupation tanks and missiles then struck.", "related_events": ["e2006_06_power_plant", "gz_2023_10_attack"], "sources": ["https://palquest.org/en/node/41041", "https://www.aljazeera.com/news/2024/8/6/who-is-yahya-sinwar-ismail-haniyehs-successor-as-hamas-chief", "https://www.aljazeera.com/news/2024/10/18/how-was-yahya-sinwar-killed-what-we-know-so-far", "https://www.aljazeera.com/news/2024/10/18/hamas-confirms-leader-yahya-sinwar-killed-in-combat-in-gaza-by-israeli-army", "https://ecfr.eu/special/mapping_palestinian_politics/yahya_sinwar", "https://en.wikipedia.org/wiki/Yahya_Sinwar", "https://www.al-monitor.com/originals/2023/12/israel-social-security-data-reveals-true-picture-oct-7-deaths", "https://www.pbs.org/newshour/world/a-look-at-the-hostages-left-in-gaza-by-the-numbers", "https://maktoobmedia.com/world/un-report-israeli-army-likely-killed-14-own-citizens-on-7-october/", "https://newarab.com/news/gaza-suffers-israels-16-year-blockade-continues-ocha", "https://www.aa.com.tr/en/middle-east/172-palestinians-killed-by-israeli-forces-in-2023-un/2977964"], "sensitive": true}
  - {"id": "fig_arouri", "name_ar": "صالح العاروري", "name": "Saleh al-Arouri", "born": "1966", "died": "2024-01", "chapters": ["1967_1987", "1987_2000", "2000_2023", "2023_2026"], "role_ar": "نائب رئيس المكتب السياسي لحركة حماس", "role": "Deputy head of Hamas's political bureau", "bio_ar": "وُلد صالح العاروري عام 1966 في بلدة عارورة قرب رام الله، ودرس الشريعة في جامعة الخليل، وأسهم في تأسيس كتائب القسام، الجناح العسكري لحماس، في الضفة الغربية. وأمضى في سجون الاحتلال 18 عامًا بحسب الجزيرة نت، بين 1985 و2010، ثم أبعدته سلطات الاحتلال عام 2010 إلى سوريا، فانضم في العام نفسه إلى المكتب السياسي لحماس، وصار نائبًا لرئيسه في تشرين الأول 2017. وفي آب 2014 قال في مؤتمر في تركيا إن كتائب القسام هي التي خطفت الفتيان الإسرائيليين الثلاثة قرب الخليل في حزيران من ذلك العام وقتلتهم، وكانت سلطات الاحتلال قد اتهمت حماس بذلك. وفي تشرين الأول 2023 اعتقلت قوات الاحتلال شقيقه وتسعة من أبناء أخيه، ثم فجّرت منزله في عارورة في 31 من الشهر نفسه. وفي 2 كانون الثاني 2024 اغتاله جيش الاحتلال بطائرة مسيّرة قصفت مكتبًا لحماس في الضاحية الجنوبية لبيروت، فاستُشهد مع ستة من أعضاء الحركة بينهم قائدان في كتائب القسام بحسب حماس، ولم يعترف الاحتلال بمسؤوليته إلا في نهاية 2024 في المراجعة السنوية لجهاز الشاباك.", "bio": "Saleh al-Arouri, born in 1966 in Arura near Ramallah, studied sharia at Hebron University and helped found Hamas's armed wing, the Qassam Brigades, in the West Bank. He spent 18 years in occupation prisons between 1985 and 2010, according to Al Jazeera's Arabic site, and in 2010 was deported to Syria; that year he joined Hamas's political bureau, and in October 2017 he became its deputy head. In August 2014, at a conference in Turkey, he said the Qassam Brigades had abducted and killed the three Israeli teenagers seized near al-Khalil (Hebron) that June, as the occupation authorities had accused Hamas of doing. In October 2023 occupation forces arrested his brother and nine nephews, and on 31 October blew up his house in Arura. On 2 January 2024 the occupation army assassinated him in a drone strike on a Hamas office in Beirut's southern suburbs, with six other Hamas members, two of them Qassam commanders, according to Hamas; it did not admit responsibility until a Shin Bet year-end review at the end of 2024.", "related_events": ["e2014_07_abu_khdeir"], "sources": ["https://www.aljazeera.net/icons/politicians/2017/10/5/العاروري-الأسير-الذي-أصبح-نائبا-لقائد-حماس", "https://ecfr.eu/special/mapping_palestinian_politics/saleh_al_arouri", "https://www.aljazeera.com/news/2024/1/2/top-hamas-official-saleh-al-arouri-killed-in-beirut-suburb", "https://www.newarab.com/news/hamas-top-leader-salah-al-arouri-killed-beirut-blast", "https://www.cbsnews.com/news/hamas-admits-kidnapping-3-israeli-teens-in-west-bank", "https://naharnet.com/stories/en/310111-israel-acknowledges-it-assassinated-arouri-in-dahieh", "https://en.wikipedia.org/wiki/Saleh_al-Arouri"], "sensitive": true}
  - {"id": "fig_shehadeh_shehadeh", "name_ar": "شحادة شحادة", "name": "Shehadeh Shehadeh", "chapters": ["1967_1987", "1987_2000"], "role_ar": "قسّ ترأّس لجنة الدفاع عن الأراضي العربية", "role": "Pastor who chaired the Arab land defence committee", "bio_ar": "كان شحادة شحادة قسًّا بروتستانتيًا في شفاعمرو في السادسة والثلاثين من عمره، غير منتمٍ إلى أي حزب، حين شارك عام 1975 في الاجتماعات الأولى لمواجهة خطط حكومة إسحاق رابين لمصادرة أكثر من 20 ألف دونم من الأراضي العربية، معظمها في الجليل، وترأّس اللجنة القُطرية للدفاع عن الأراضي العربية التي تشكّلت في ذلك العام. ولمّا رُفض منح اللجنة تصريحًا بالتظاهر أمام الكنيست، دعت الناس إلى الإضراب في قراهم بدل تعريضهم للاعتقال الجماعي. وفي آذار 1976، حين صوّت رؤساء مجالس محلية مجتمعون في شفاعمرو ضد الإضراب، غادر الاجتماع احتجاجًا، ومضت اللجنة في الإضراب العام يوم 30 آذار، يوم الأرض. وفي ذلك اليوم اقتحم جيش الاحتلال وشرطته القرى المضربة وأطلقوا الرصاص الحي، فاستُشهد ستة أشخاص: خديجة شواهنة ورجا أبو ريّا وخضر خلايلة من سخنين، وخير ياسين من عرابة، ومحسن طه من كفر كنا، ورأفت الزهيري من مخيم نور شمس الذي استُشهد في الطيبة، واعتُقل نحو 300 بحسب الموسوعة التفاعلية، وآلاف بحسب الجزيرة نت. وبقي شحادة رئيسًا للجنة حتى عام 1990، وكان عام 2005 راعيًا لكنيسة القديس يوحنا الأسقفية في حيفا.", "bio": "Shehadeh Shehadeh was a 36-year-old Protestant pastor in Shefa-Amr, with no party affiliation, when he joined the first meetings in 1975 against Yitzhak Rabin's government's plans to expropriate more than 20,000 dunums of Arab land, most of it in the Galilee, and he chaired the National Committee for the Defence of Arab Lands formed that year. Refused a permit to demonstrate at the Knesset, the committee called people to strike in their villages rather than risk mass arrest. In March 1976, when heads of local councils meeting in Shefa-Amr voted against the strike, he walked out in protest, and the committee went ahead with the general strike of 30 March, Land Day. That day the occupation army and police entered the striking villages and fired live ammunition, and six people were killed: Khadija Shawahna, Raja Abu Rayya and Khader Khalayleh of Sakhnin, Khair Yassin of Arraba, Muhsin Taha of Kafr Kanna, and Rafat al-Zuheiri of Nur Shams camp, who was killed in Taybeh; about 300 were detained per the Interactive Encyclopedia, thousands per Al Jazeera Arabic. Shehadeh chaired the committee until 1990, and in 2005 he was priest of St John's Episcopal Church in Hayfa (Haifa).", "related_events": ["e1976_03_land_day"], "sources": ["https://learnpalestine.qeh.ox.ac.uk/uploads/sources/58964333c81d3.pdf", "https://www.ajnet.me/politics/2022/3/30/%D9%8A%D9%88%D9%85-%D8%A7%D9%84%D8%A3%D8%B1%D8%B6-%D8%A7%D9%84%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A-%D9%85%D8%B9%D8%B1%D9%83%D8%A9-%D8%B5%D9%85%D9%88%D8%AF-%D8%AA%D8%AA%D9%88%D8%A7%D8%B5%D9%84", "https://www.diwanalarab.com/%D9%84%D9%84%D8%A3%D8%B1%D8%B6-%D8%B0%D8%A7%D9%83%D8%B1%D8%A9-%D8%A7%D9%84%D8%A8%D9%82%D8%A7%D8%A1.html", "https://www.palquest.org/en/highlight/14509/land-day-1976"], "sensitive": true}
  - {"id": "fig_haniyeh", "name_ar": "إسماعيل هنية", "name": "Ismail Haniyeh", "born": "1962", "died": "2024-07", "chapters": ["1987_2000", "2000_2023", "2023_2026"], "role_ar": "رئيس وزراء فلسطيني ورئيس المكتب السياسي لحركة حماس", "role": "Palestinian prime minister and head of Hamas's political bureau", "bio_ar": "وُلد إسماعيل هنية عام 1962 في مخيم الشاطئ لعائلة هُجّرت في النكبة من قرية الجورة قرب عسقلان، ودرس الأدب العربي في الجامعة الإسلامية بغزة. واعتقلته قوات الاحتلال في الانتفاضة الأولى ثلاث مرات، آخرها عام 1989 حين سُجن ثلاث سنوات، وفي 17 كانون الأول 1992 كان بين 415 فلسطينيًّا أبعدتهم سلطات الاحتلال إلى مرج الزهور في جنوب لبنان، فعاد بعد عام. وبعد فوز حماس في انتخابات كانون الثاني 2006 تولّى رئاسة الحكومة إلى أن أقالها الرئيس محمود عباس في 14 حزيران 2007، ثم قاد إدارة حماس في غزة، ودمّرت طائرات الاحتلال بيته في مخيم الشاطئ في 28 تموز 2014، وانتُخب في 6 أيار 2017 رئيسًا للمكتب السياسي للحركة. وفي 10 نيسان 2024، أول أيام عيد الفطر، قتل صاروخ أطلقته مسيّرة للاحتلال على سيارة في مخيم الشاطئ ثلاثة من أبنائه، حازمًا وأميرًا ومحمدًا، وبحسب حماس أربعة من أحفاده، وزعم جيش الاحتلال أن الأبناء ضالعون في نشاط مسلح، وفي 25 حزيران 2024 قتلت غارة على بيت العائلة عشرة من أقاربه بينهم أخته زهر بحسب الدفاع المدني في غزة. ثم اغتاله الاحتلال في 31 تموز 2024 في مقر إقامته في طهران، فاستُشهد مع أحد حراسه، ولم يعترف بذلك إلا في كانون الأول 2024 على لسان وزير جيشه يسرائيل كاتس.", "bio": "Ismail Haniyeh was born in 1962 in al-Shati refugee camp to a family driven out in the Nakba from the village of al-Jura near Asqalan, and studied Arabic literature at the Islamic University of Gaza. Occupation forces arrested him three times during the first intifada, the last in 1989, when he was jailed for three years, and on 17 December 1992 he was among the 415 Palestinians the occupation authorities deported to Marj al-Zuhur in southern Lebanon; he returned a year later. After Hamas won the January 2006 elections he became prime minister until President Mahmoud Abbas dismissed his government on 14 June 2007; he then led the Hamas administration in Gaza, Israeli occupation aircraft destroyed his home in al-Shati on 28 July 2014, and on 6 May 2017 he was elected head of the movement's political bureau. On 10 April 2024, the first day of Eid al-Fitr, a missile fired by an occupation drone at a car in al-Shati camp killed three of his sons, Hazem, Amir and Mohammad, and, according to Hamas, four of his grandchildren, and the Israeli army claimed the sons were involved in armed activity; on 25 June 2024 a strike on the family home killed ten of his relatives, among them his sister Zahr, according to Gaza's civil defence. The occupation then assassinated him with one of his bodyguards at his residence in Tehran on 31 July 2024, and acknowledged it only in December 2024, through its defence minister Israel Katz.", "related_events": ["e1992_12_marj_al_zuhur", "e2006_01_elections", "e2007_06_blockade"], "sources": ["https://palquest.org/en/node/37793", "https://ecfr.eu/special/mapping_palestinian_politics/ismail_haniyeh", "https://www.aljazeera.com/news/2024/7/31/life-of-defiance-ismail-haniyeh-hamas-political-boss-killed", "https://www.aljazeera.com/news/2024/7/31/hamass-political-chief-ismail-haniyeh-assassinated-in-iran-state-media", "https://www.newarab.com/news/israel-strike-kills-three-hamas-leader-haniyehs-sons", "https://www.aljazeera.com/program/newsfeed/2024/4/10/israeli-attack-kills-three-sons-of-hamas-political-leader-ismail-haniyeh", "https://www.al-monitor.com/originals/2024/06/gaza-civil-defence-says-israeli-strike-kills-10-relatives-hamas-chief", "https://gulfnews.com/world/mena/israel-acknowledges-it-killed-ex-hamas-leader-haniyeh-in-tehran-1.500006304"], "sensitive": true}
  - {"id": "fig_khalida_jarrar", "name_ar": "خالدة جرار", "name": "Khalida Jarrar", "born": "1963-02", "chapters": ["1987_2000", "2000_2023", "2023_2026"], "role_ar": "نائبة عن الجبهة الشعبية في المجلس التشريعي وأسيرة سابقة في سجون الاحتلال", "role": "PFLP member of the Legislative Council, repeatedly jailed by the occupation", "bio_ar": "وُلدت خالدة جرار في نابلس عام 1963، وأدارت مؤسسة الضمير لرعاية الأسير وحقوق الإنسان بين 1993 و2005، وانتُخبت عضوًا في المجلس التشريعي الفلسطيني عن قائمة الجبهة الشعبية عام 2006، ومنعتها سلطات الاحتلال من السفر منذ عام 1988 إلا في رحلة علاج واحدة إلى عمّان. واعتقلتها قوات الاحتلال في نيسان 2015 وحكمت عليها محكمة عسكرية تابعة للاحتلال بالسجن 15 شهرًا، ثم احتجزتها إداريًّا دون تهمة أو محاكمة من تموز 2017 إلى شباط 2019، واعتقلتها مجددًا في 31 تشرين الأول 2019، وحكمت عليها عام 2021 بالسجن عامين بتهمة «العضوية في تنظيم غير مشروع» استنادًا إلى أدلة سرية لم يُسمح لها ولا لمحاميها بالاطلاع عليها. وفي تموز 2021 توفيت ابنتها سهى، الباحثة في مؤسسة الحق، عن 31 عامًا، فرفضت مصلحة سجون الاحتلال السماح لها بحضور الجنازة، وأُفرج عنها في 26 أيلول 2021. وفي 26 كانون الأول 2023 اعتقلتها قوات الاحتلال مرة أخرى واحتجزتها إداريًّا، وأبقتها منذ آب 2024 في عزل انفرادي في زنزانة مساحتها نحو 2.5 في 1.5 متر في سجن «نيفي ترتسا»، حتى أُفرج عنها في كانون الثاني 2025 ضمن الدفعة الأولى من تبادل الأسرى في اتفاق وقف إطلاق النار في غزة.", "bio": "Khalida Jarrar, born in Nablus in 1963, directed the prisoners' rights group Addameer from 1993 to 2005 and was elected to the Palestinian Legislative Council on the PFLP list in 2006; from 1988 the occupation authorities barred her from travelling, except for one medical trip to Amman. Occupation forces arrested her in April 2015 and an Israeli military court sentenced her to 15 months; she was then held in administrative detention without charge or trial from July 2017 to February 2019, arrested again on 31 October 2019 and sentenced in 2021 to two years for \"membership in an illegal organisation\", on secret evidence that neither she nor her lawyer was allowed to see. In July 2021 her daughter Suha, a researcher at Al-Haq, died at 31, and the occupation's prison service refused to let her attend the funeral; she was freed on 26 September 2021. Occupation forces arrested her again on 26 December 2023 and held her in administrative detention, from August 2024 in solitary confinement in a cell of about 2.5 by 1.5 metres in Neve Tirza prison, until she was released in January 2025 in the first prisoner exchange of the Gaza ceasefire.", "related_events": ["gz_2025_01_truce_return"], "sources": ["https://www.aljazeera.com/news/2021/9/26/palestinian-mp-khalida-jarrar-released-from-israeli-prison", "https://www.middleeasteye.net/news/palestine-khalida-jarrar-released-israel-prison-serving-two-years", "https://www.middleeasteye.net/news/palestinian-mp-khalida-jarrar-freed-after-14-months-israeli-prison", "https://euromedmonitor.org/en/article/6446/West-Bank:-Palestinian-MP-Khalida-Jarrar-faces-slow-death-in-Israeli-solitary-confinement;-effective-and-immediate-action-needed", "https://www.jadaliyya.com/Details/46179/In-Defense-of-Life-and-Breath-Free-Khalida-Jarrar", "https://www.nbcnews.com/news/world/israel-hamas-war-ceasefire-deal-palestinian-prisoners-freed-west-bank-rcna188359", "https://en.wikipedia.org/wiki/Khalida_Jarrar", "https://ar.wikipedia.org/wiki/%D8%AE%D8%A7%D9%84%D8%AF%D8%A9_%D8%AC%D8%B1%D8%A7%D8%B1"], "sensitive": false}
  - {"id": "fig_deif", "name_ar": "محمد الضيف", "name": "Mohammed Deif", "born": "1965", "died": "2024-07", "chapters": ["1987_2000", "2000_2023", "2023_2026"], "role_ar": "قائد كتائب القسام", "role": "Commander of the Qassam Brigades", "bio_ar": "وُلد محمد الضيف، واسمه محمد المصري، في مخيم خان يونس عام 1965، ودرس العلوم في الجامعة الإسلامية بغزة، وكان يمثّل فيها على خشبة المسرح، وانضم إلى حماس عام 1987، واعتقلته قوات الاحتلال عام 1989 فأمضى 16 شهرًا في السجن. وتولّى عام 2002 قيادة كتائب القسام بعد أن اغتال الاحتلال صلاح شحادة، وتفيد التقارير بأنه أسهم في التخطيط لتفجيرات انتحارية قتلت عشرات الإسرائيليين. ونجا من محاولات اغتيال عدة أفقدته إحداها عينه وأصابت ساقه إصابة بالغة بحسب التقارير، وفي آب 2014 قتلت غارة لجيش الاحتلال على بيت في غزة زوجته وابنه البالغ من العمر سبعة أشهر وابنته البالغة من العمر ثلاث سنوات. وعدّه الاحتلال مع يحيى السنوار المخطِّطَين الرئيسيين لهجوم السابع من تشرين الأول 2023، الذي جاء بعد 16 عامًا من حصار الاحتلال لغزة، وقُتل فيه 1,139 شخصًا بحسب إحصاء وكالة الصحافة الفرنسية، منهم 695 مدنيًّا إسرائيليًّا، وأُخذ 251 شخصًا رهائن إلى غزة؛ وقد أعلن هو بدء الهجوم في تسجيل بثّته حماس، قال فيه إن الحركة طالبت الاحتلال مرارًا بالإفراج عن الأسرى ووقف مصادرة الأرض. وفي 13 تموز 2024 قصف جيش الاحتلال منطقة المواصي التي أعلنها الجيش نفسه منطقة إنسانية، زاعمًا أنه يستهدفه، فأحصت وزارة الصحة في غزة 90 قتيلًا على الأقل نصفهم على الأقل من النساء والأطفال، ونحو 300 جريح؛ وزعم جيش الاحتلال في 1 آب 2024 أنه قتله، وأكّدت كتائب القسام استشهاده في 30 كانون الثاني 2025، وألغت المحكمة الجنائية الدولية في شباط 2025 مذكرة التوقيف التي أصدرتها بحقه في 21 تشرين الثاني 2024.", "bio": "Mohammed Deif, born Mohammed al-Masri in the Khan Younis refugee camp in 1965, studied science at the Islamic University of Gaza, where he often performed on stage; he joined Hamas in 1987, and occupation forces arrested him in 1989 and held him for 16 months. In 2002, after the occupation assassinated Salah Shehadeh, he became commander of the Qassam Brigades; he is reported to have helped plan suicide bombings that killed dozens of Israelis. He survived several assassination attempts, one of which reportedly cost him an eye and left him with a serious leg injury, and in August 2014 an Israeli occupation air strike on a house in Gaza killed his wife, their seven-month-old son and their three-year-old daughter. The occupation named him and Yahya Sinwar as the chief planners of the 7 October 2023 attack, which came after 16 years of the occupation's blockade of Gaza and killed 1,139 people by AFP's tally, 695 of them Israeli civilians, while 251 were taken hostage to Gaza; he announced the start of the attack in a recording released by Hamas, saying it had repeatedly demanded that the occupation free prisoners and halt the seizure of land. On 13 July 2024 the occupation army struck al-Mawasi, an area it had itself designated a humanitarian zone, claiming to target him, and the Gaza Ministry of Health counted at least 90 killed, at least half of them women and children, and about 300 wounded; the occupation army claimed on 1 August 2024 that it had killed him, the Qassam Brigades confirmed his death on 30 January 2025, and in February 2025 the International Criminal Court withdrew the arrest warrant it had issued for him on 21 November 2024.", "related_events": ["e2002_07_shehadeh", "e2014_07_gaza_51_days", "gz_2023_10_attack", "gz_2024_11_icc"], "sources": ["https://www.aljazeera.com/news/2024/7/14/who-is-mohammed-deif-the-hamas-military-commander-in-gaza", "https://ecfr.eu/special/mapping_palestinian_politics/mohammed_deif", "https://www.aljazeera.com/news/2024/8/1/israel-says-hamas-military-leader-mohammed-deif-killed-in-july", "https://www.aljazeera.com/news/2025/1/30/hamas-confirms-the-killing-of-military-commander-mohammed-deif", "https://newarab.com/news/who-hamas-chief-mohammed-deif-israel-tried-kill", "https://www.al-monitor.com/originals/2024/07/israel-says-targeted-hamas-military-chief-gaza-ministry-reports-dozens-dead", "https://www.newarab.com/news/icc-nixes-arrest-warrant-slain-hamas-leader-mohammed-deif", "https://www.al-monitor.com/originals/2023/12/israel-social-security-data-reveals-true-picture-oct-7-deaths", "https://www.pbs.org/newshour/world/a-look-at-the-hostages-left-in-gaza-by-the-numbers", "https://www.ochaopt.org/content/locked-humanitarian-impact-two-years-blockade-gaza-strip"], "sensitive": true}
  - {"id": "fig_yahya_ayyash", "name_ar": "يحيى عياش", "name": "Yahya Ayyash", "born": "1966-03", "died": "1996-01", "chapters": ["1987_2000"], "role_ar": "صانع العبوات الناسفة في كتائب القسام، الملقّب بـ«المهندس»", "role": "Bomb maker of the Qassam Brigades, known as \"the Engineer\"", "bio_ar": "وُلد يحيى عياش في رافات غرب سلفيت في 6 آذار 1966، وتخرّج مهندسًا كهربائيًّا في جامعة بيرزيت، وانضمّ إلى كتائب عز الدين القسام فصار صانع عبواتها الناسفة ولُقّب بـ«المهندس». وتُنسب إليه قنابل قتلت مدنيين وجنودًا إسرائيليين، منها تفجير العفولة في 6 نيسان 1994 الذي قتل 8 مدنيين إسرائيليين، وقالت حماس إنه ثأر لمجزرة الحرم الإبراهيمي في 25 شباط، حين قتل المستوطن باروخ غولدشتاين 29 مصلّيًا في صلاة الفجر، وتفجير الحافلة رقم 5 في شارع ديزنغوف في تل أبيب في 19 تشرين الأول 1994 الذي قتل 22 شخصًا، بحسب الجزيرة. وفي 5 كانون الثاني 1996 استُشهد في بيت لاهيا شمال قطاع غزة حين اغتاله جهاز الشاباك التابع للاحتلال بهاتف محمول مفخّخ أوصله إليه عبر عميل، ففجّره وهو يكلّم والده، ولم تسمح رقابة الاحتلال بنشر التفاصيل إلا عام 2019. وبعد اغتياله تبنّت حماس تفجيرين لحافلتين في شارع يافا بالقدس في 25 شباط و3 آذار 1996 قتلا 33 مدنيًّا و12 جنديًّا. وفي 9 كانون الثاني 2026 اعتقلت قوات الاحتلال أرملته هيام من بيتها في نابلس بتهمة «التحريض على الإنترنت».", "bio": "Yahya Ayyash was born in Rafat, west of Salfit, on 6 March 1966 and graduated in electrical engineering from Birzeit University; he joined the Izz ad-Din al-Qassam Brigades and became their bomb maker, known as \"the Engineer\". Bombs attributed to him killed Israeli civilians and soldiers, among them the Afula bombing of 6 April 1994, which killed 8 Israeli civilians and which Hamas called revenge for the Ibrahimi Mosque massacre of 25 February, when the settler Baruch Goldstein killed 29 worshippers at dawn prayer, and the bombing of the No. 5 bus on Dizengoff Street in Tel Aviv on 19 October 1994, which killed 22, according to Al Jazeera. On 5 January 1996 the occupation's Shin Bet assassinated him in Beit Lahia, in the north of the Gaza Strip, with an explosive-packed mobile phone passed to him through a collaborator, detonating it as he spoke to his father; the occupation's censor allowed the details to be published only in 2019. After his killing Hamas claimed two bus bombings on Jaffa Road in al-Quds (Jerusalem) on 25 February and 3 March 1996, which killed 33 civilians and 12 soldiers. On 9 January 2026 occupation forces arrested his widow Hiyam at her home in Nablus, accusing her of \"incitement on the internet\".", "related_events": ["e1994_04_afula", "e1996_03_bombings_closure"], "sources": ["https://en.wikipedia.org/wiki/Yahya_Ayyash", "https://www.aljazeera.net/icons/fighters/2014/9/25/%D9%8A%D8%AD%D9%8A%D9%89-%D8%B9%D9%8A%D8%A7%D8%B4", "https://en.wikipedia.org/wiki/Dizengoff_Street_bus_bombing", "https://en.wikipedia.org/wiki/Afula_bus_suicide_bombing", "https://www.aljazeera.com/gallery/2014/2/24/remembering-the-ibrahimi-mosque-massacre/", "https://en.wikipedia.org/wiki/Jaffa_Road_bus_bombings", "https://www.newarab.com/news/israel-detains-widow-slain-hamas-commander-west-bank", "https://alquds.com/en/posts/224705"], "sensitive": true}
  - {"id": "fig_wael_dahdouh", "name_ar": "وائل الدحدوح", "name": "Wael Dahdouh", "born": "1970-04", "chapters": ["1987_2000", "2000_2023", "2023_2026"], "role_ar": "مدير مكتب قناة الجزيرة في غزة وأسير سابق في سجون الاحتلال", "role": "Al Jazeera's Gaza bureau chief and a former prisoner of the occupation", "bio_ar": "وُلد وائل الدحدوح في حي الزيتون بمدينة غزة عام 1970، ونال عام 1988 منحة لدراسة الطب في العراق، فاعتقله جيش الاحتلال قبل سفره بأيام وهو في السابعة عشرة، في الانتفاضة الأولى، وحُكم عليه بالسجن 15 عامًا بتهمة رشق الحجارة وأنشطة أخرى في الانتفاضة، وهدمت سلطات الاحتلال بيت عائلته، وقضى سبع سنوات في السجن حتى أُفرج عنه عام 1995. وبحلول عام 2004 كان يعمل في قناة الجزيرة، وصار مدير مكتبها في غزة. وفي 25 تشرين الأول 2023 قتلت غارة للاحتلال على مخيم النصيرات، الذي نزحت إليه العائلة بأمر إخلاء من جيش الاحتلال، زوجته آمنة وابنه محمودًا وابنته شام وحفيده آدم، وفي 15 كانون الأول أصابته غارة بطائرة مسيّرة للاحتلال في خان يونس وقتلت مصوّره سامر أبو دقة، الذي لم يتمكن المسعفون من الوصول إليه فيما كانت قوات الاحتلال تطوّق المدرسة التي أُصيبا فيها بحسب الجزيرة، ثم قتل صاروخ للاحتلال ابنه البكر حمزة في سيارته غرب خان يونس في 7 كانون الثاني 2024. وغادر غزة عبر معبر رفح في 16 كانون الثاني 2024 للعلاج في قطر، ويقيم فيها منذ ذلك الحين.", "bio": "Wael Dahdouh was born in the Zeitoun quarter of Ghazza (Gaza City) in 1970; in 1988 he won a scholarship to study medicine in Iraq, but days before he was due to leave, during the first intifada, the occupation army arrested him at 17; he was sentenced to 15 years for stone-throwing and other intifada activities, the occupation authorities demolished his family's home, and he spent seven years in prison until his release in 1995. By 2004 he was working for Al Jazeera, and he became its Gaza bureau chief. On 25 October 2023 an occupation strike on Nuseirat refugee camp, where the family had fled under an occupation army evacuation order, killed his wife Amna, his son Mahmoud, his daughter Sham and his grandson Adam; on 15 December an occupation drone strike in Khan Yunis wounded him and killed his cameraman Samer Abu Daqqa, whom medics could not reach while occupation forces surrounded the school where the two were hit, according to Al Jazeera; and on 7 January 2024 an occupation missile killed his eldest son Hamza in his car west of Khan Yunis. He left Gaza through the Rafah crossing on 16 January 2024 for treatment in Qatar, where he has lived since.", "related_events": ["gz_2023_10_dahdouh", "gz_2024_01_hamza"], "sources": ["https://www.theguardian.com/world/2024/oct/31/wael-al-dahdouh-gaza-palestinian-journalist-tragedy", "https://en.wikipedia.org/wiki/Wael_Dahdouh", "https://airwars.org/?p=103322", "https://cpj.org/2023/12/al-jazeera-cameraperson-samer-abu-daqqa-killed-correspondent-wael-al-dahdouh-injured-in-drone-attack-in-khan-yunis/amp/", "https://www.newarab.com/features/wael-dahdouh-journalism-family-loss-and-gazas-truth", "https://www.al-monitor.com/originals/2024/01/al-jazeera-bureau-chief-leaves-gaza", "https://www.aljazeera.com/news/2024/1/7/hamza-son-of-al-jazeeras-wael-dahdouh-killed-in-israeli-attack-in-gaza"], "sensitive": true}
  - {"id": "fig_shireen_abu_akleh", "name_ar": "شيرين أبو عاقلة", "name": "Shireen Abu Akleh", "born": "1971", "died": "2022-05", "chapters": ["1987_2000", "2000_2023"], "role_ar": "مراسلة قناة الجزيرة في فلسطين", "role": "Al Jazeera correspondent in Palestine", "bio_ar": "وُلدت شيرين أبو عاقلة في القدس عام 1971، ودرست الصحافة في جامعة اليرموك في الأردن، وعملت في إذاعة صوت فلسطين قبل أن تنضم إلى قناة الجزيرة عام 1997، فكانت من أوائل مراسليها الميدانيين، واشتهرت بتغطيتها للانتفاضة الثانية. وفي 11 أيار 2022 استُشهدت برصاصة في الرأس وهي تغطي اقتحام قوات الاحتلال لمخيم جنين، وخلص مكتب الأمم المتحدة لحقوق الإنسان في 24 حزيران إلى أن الرصاص أطلقته قوات الاحتلال، وأنه لم يكن قربها نشاط لمسلحين فلسطينيين، ثم أقرّ جيش الاحتلال في أيلول بـ«احتمال كبير» أن يكون أحد جنوده أصابها، زاعمًا أن ذلك كان «عن غير قصد»، ولم يفتح تحقيقًا جنائيًّا. وفي جنازتها في القدس يوم 13 أيار ضربت شرطة الاحتلال حاملي النعش بالهراوات حتى كاد النعش يسقط. وبُثّ تقريرها الأخير، عن النكبة، يوم 15 أيار بعد استشهادها.", "bio": "Shireen Abu Akleh was born in al-Quds (Jerusalem) in 1971, studied journalism at Yarmouk University in Jordan and worked for Voice of Palestine radio before joining Al Jazeera in 1997 as one of its first field correspondents; she became known for her reporting on the Second Intifada. On 11 May 2022 she was shot in the head while covering an occupation raid on Jenin refugee camp; on 24 June the UN human rights office found that the shots came from occupation forces and that there was no armed Palestinian activity near her, and in September the occupation army conceded a \"high possibility\" that one of its soldiers had hit her, claiming it was \"accidentally\", and opened no criminal investigation. At her funeral in al-Quds on 13 May occupation police beat the pallbearers with batons and the coffin nearly fell. Her last report, on the Nakba, aired on 15 May, after she was killed.", "related_events": ["e2022_05_shireen"], "sources": ["https://www.newarab.com/news/shireen-abu-akleh-did-journalism-heart-without-fear", "https://www.aljazeera.com/features/longform/2023/5/11/shireen-abu-akleh-al-jazeera-reporter-and-daughter-of-palestine", "https://news.un.org/en/story/2022/06/1121252", "https://www.aljazeera.com/news/2022/9/5/israel-probe-shireen-abu-akleh", "https://www.newarab.com/news/shireen-abu-akleh-laid-rest-amid-brutal-israeli-attack", "https://en.wikipedia.org/wiki/Shireen_Abu_Akleh"], "sensitive": true}
  - {"id": "fig_khader_adnan", "name_ar": "خضر عدنان", "name": "Khader Adnan", "born": "1978-03", "died": "2023-05", "chapters": ["2000_2023"], "role_ar": "قيادي في الجهاد الإسلامي استُشهد مضربًا عن الطعام في سجون الاحتلال", "role": "Islamic Jihad leader who died on hunger strike in an occupation prison", "bio_ar": "وُلد خضر عدنان في عرّابة قرب جنين في 24 آذار 1978، وكان خبّازًا وقياديًّا سياسيًّا في حركة الجهاد الإسلامي، واعتقلته قوات الاحتلال 12 مرة على الأقل، فقضى في سجونها نحو ثماني سنوات، معظمها في الاعتقال الإداري بلا تهمة. واعتُقل في 17 كانون الأول 2011، وقال إن الجنود ركلوه وصفعوه وهو مقيّد اليدين خلف ظهره، فأضرب عن الطعام 66 يومًا حتى وافقت سلطات الاحتلال في 21 شباط 2012 على عدم تجديد اعتقاله، وخاض قبل عام 2023 خمسة إضرابات عن الطعام. واعتُقل مجددًا في 5 شباط 2023 ووجّهت إليه سلطات الاحتلال تهمًا، فأضرب عن الطعام نحو 87 يومًا، واستُشهد في زنزانته في 2 أيار 2023 عن 45 عامًا، فكان أولَ أسير مضرب عن الطعام يموت في سجون الاحتلال منذ أكثر من 30 عامًا بحسب الجزيرة. وقال مقرّرون خاصون للأمم المتحدة إن السلطات رفضت، بحسب التقارير، نقله إلى مستشفى، ووصفوا وفاته بأنها شهادة مأساوية على سياسة الاحتجاز الإسرائيلية. وطالبت اللجنة الدولية للصليب الأحمر سلطات الاحتلال بتسليم جثمانه إلى عائلته، وفي حزيران 2023 أدرج نادي الأسير الفلسطيني جثمانه بين الجثامين التي يحتجزها الاحتلال.", "bio": "Khader Adnan, born in Arraba near Jenin on 24 March 1978, was a baker and a political leader of Palestinian Islamic Jihad; occupation forces arrested him at least 12 times and held him about eight years in all, mostly in administrative detention without charge. Arrested on 17 December 2011, he said soldiers kicked and slapped him with his hands shackled behind his back; he refused food for 66 days until the occupation authorities agreed on 21 February 2012 not to renew his detention, and before 2023 he went on hunger strike five times. Arrested again on 5 February 2023 and facing charges brought by the occupation authorities, he refused food for about 87 days and died in his cell on 2 May 2023, aged 45, the first hunger striker to die in an occupation prison in more than 30 years, according to Al Jazeera; UN special rapporteurs said the authorities had reportedly refused to move him to a hospital, and called his death a tragic testament to Israel's detention policy. The ICRC asked the occupation authorities to return his body to his family, and in June 2023 the Palestinian Prisoners' Club listed it among the bodies the occupation was withholding.", "related_events": ["e2012_04_hunger_strikes", "e2023_05_khader_adnan"], "sources": ["https://en.wikipedia.org/wiki/Khader_Adnan", "https://www.aljazeera.com/news/2012/2/21/israel-to-free-palestinian-hunger-striker", "https://news.un.org/en/story/2023/05/1136327", "https://www.aljazeera.com/news/2023/5/3/gaza-truce-holds-as-palestinians-protest-death-of-hunger-striker", "https://www.icrc.org/en/document/icrc-statement-death-khader-adnan", "https://alquds.com/en/posts/74262"], "sensitive": true}
  - {"id": "fig_refaat_alareer", "name_ar": "رفعت العرعير", "name": "Refaat Alareer", "born": "1979-09", "died": "2023-12", "chapters": ["2000_2023", "2023_2026"], "role_ar": "شاعر وأستاذ الأدب الإنجليزي في غزة", "role": "Gaza poet and professor of English literature", "bio_ar": "وُلد رفعت العرعير في حي الشجاعية في مدينة غزة عام 1979، ودرّس الأدب والكتابة الإبداعية في الجامعة الإسلامية في غزة منذ عام 2007، وحرّر كتاب «غزة تكتب ردًّا» (2014) الذي جمع قصصًا لكتّاب شبان من غزة. وفي حرب الاحتلال على غزة عام 2014 قُصف بيته في الشجاعية وقُتل أكثر من 30 من أفراد عائلته وعائلة زوجته، بحسب المرصد الأورومتوسطي لحقوق الإنسان، وبعدها شارك في تأسيس مشروع «نحن لسنا أرقامًا» لرعاية جيل جديد من الكتّاب. وفي 1 تشرين الثاني 2023 ثبّت على حسابه قصيدته «إذا كان لا بد أن أموت»، التي انتشرت على نطاق واسع بعد رحيله. وفي 6 كانون الأول 2023 استُشهد في غارة جوية لجيش الاحتلال على شقة أخته في حي الدرج في غزة، ومعه أخوه صلاح وابن صلاح، وأخته أسماء وثلاثة من أطفالها، بحسب المرصد، الذي قال إن الاستهداف بدا متعمّدًا بعد أسابيع من تهديدات بالقتل تلقّاها من حسابات إسرائيلية عبر الإنترنت والهاتف. وفي 26 نيسان 2024 قتلت غارة للاحتلال على حي الرمال ابنته الكبرى شيماء وزوجها محمد صيام وطفلهما الرضيع، بحسب وكالة الأناضول نقلًا عن مصدر طبي في مستشفى الشفاء.", "bio": "Refaat Alareer was born in Shujaiya, in Ghazza (Gaza City), in 1979, taught literature and creative writing at the Islamic University of Gaza from 2007 and edited Gaza Writes Back (2014), a collection of stories by young Gaza writers. In the occupation's 2014 war on Gaza his home in Shujaiya was bombed and more than 30 members of his and his wife's families were killed, according to Euro-Med Human Rights Monitor; afterwards he co-founded We Are Not Numbers to nurture a new generation of writers. On 1 November 2023 he pinned his poem \"If I Must Die\" to his account, and it spread widely after he was killed. On 6 December 2023 an occupation air strike on his sister's apartment in al-Daraj, Ghazza, killed him with his brother Salah and Salah's son, and his sister Asmaa and three of her children, according to Euro-Med, which said the strike appeared deliberate after weeks of death threats he had received from Israeli accounts online and by phone. On 26 April 2024 an occupation air strike in al-Rimal killed his eldest daughter Shaimaa, her husband Mohammed Siyam and their infant son, according to Anadolu Agency, citing a medical source at al-Shifa Hospital.", "related_events": ["e2014_07_gaza_51_days"], "sources": ["https://euromedmonitor.org/en/article/6014", "https://lithub.com/poet-and-scholar-refaat-alareer-has-been-killed-by-an-israeli-airstrike/", "https://www.aa.com.tr/en/europe/daughter-of-palestinian-poet-refaat-alareer-killed-in-israeli-airstrike-in-gaza/3203310", "https://lithub.com/refaat-alareers-daughter-and-grandchild-have-been-killed-in-an-israeli-airstrike/", "https://en.wikipedia.org/wiki/Refaat_Alareer"], "sensitive": true}
  - {"id": "fig_issa_amro", "name_ar": "عيسى عمرو", "name": "Issa Amro", "born": "1980", "chapters": ["2000_2023", "2023_2026"], "role_ar": "مدافع عن حقوق الإنسان ومؤسس تجمّع شباب ضد الاستيطان في الخليل", "role": "Human rights defender, founder of Youth Against Settlements in al-Khalil (Hebron)", "bio_ar": "وُلد عيسى عمرو في الخليل عام 1980، وأسّس عام 2007 تجمّع «شباب ضد الاستيطان» الذي يواجه التوسع الاستيطاني بالمقاومة المدنية اللاعنفية، ويقود حملة «افتحوا شارع الشهداء» التي تُحيي ذكرى مجزرة الحرم الإبراهيمي عام 1994 وتطالب بإعادة فتح الشارع الذي لا يزال مغلقًا أمام الفلسطينيين. وفي 6 كانون الثاني 2021 دانته محكمة عوفر العسكرية التابعة للاحتلال بستّ تهم تتعلق بنشاطه بين عامَي 2010 و2016، ثلاث منها المشاركة في مظاهرات دون تصريح، وفي 22 آذار 2021 حكمت عليه بالسجن ثلاثة أشهر مع وقف التنفيذ وبفترة اختبار مدتها سنتان وبغرامة قدرها 3,500 شيكل، وقال خبراء في الأمم المتحدة إن الإدانة تبدو ذات دوافع سياسية. واحتجزته السلطة الفلسطينية أيضًا عام 2017 بعد أن انتقد اعتقالها صحفيًّا، ثم أُسقطت التهم عنه في نيسان 2021. وبحسب مؤسسة «رايت لايفليهود» التي منحته جائزتها عام 2024، احتجزه جنود الاحتلال في 7 تشرين الأول 2023 وضربوه وعذّبوه، ثم طرده جيش الاحتلال من بيته في الشهر نفسه فلم يعد إليه إلا بعد معركة قضائية. وفي مطلع تشرين الأول 2026 احتجزه جنود الاحتلال سبع ساعات في قاعدة عسكرية مكبَّل اليدين معصوب العينين، بعد أن ذهب لمساعدة عائلة قال إن مستوطنين مسلّحين هاجموها.", "bio": "Issa Amro, born in al-Khalil (Hebron) in 1980, founded Youth Against Settlements in 2007, a group that confronts settlement expansion through non-violent civil resistance, and leads the Open Shuhada Street campaign, which marks the anniversary of the 1994 Ibrahimi Mosque massacre and calls for reopening the street, still closed to Palestinians. On 6 January 2021 the occupation's military court at Ofer convicted him on six charges over his activism between 2010 and 2016, three of them for taking part in demonstrations without a permit, and on 22 March 2021 it gave him a three-month suspended sentence, two years' probation and a fine of 3,500 shekels; UN experts said the conviction appeared politically motivated. The Palestinian Authority also detained him in 2017 after he criticised its arrest of a journalist, and the charges were dropped in April 2021. According to Right Livelihood, which gave him its award in 2024, occupation soldiers detained, beat and tortured him on 7 October 2023, and later that month the occupation army forced him out of his home, to which he returned only after a legal battle. In early October 2026 occupation soldiers held him handcuffed and blindfolded at a military base for seven hours after he went to help a family that he said armed settlers had attacked.", "related_events": ["e1994_03_hebron_curfew"], "sources": ["https://rightlivelihood.org/the-change-makers/find-a-laureate/issa-amro/", "https://news.un.org/en/story/2021/01/1082992", "https://www.ecoi.net/en/document/2044303.html", "https://www.fidh.org/en/issues/human-rights-defenders/israel-opt-sentencing-of-issa-amro", "https://frontlinedefenders.org/en/case/issa-amro-acquitted", "https://www.democracynow.org/2026/10/5/issa_amro_detained"], "sensitive": false}
  - {"id": "fig_razan_al_najjar", "name_ar": "رزان النجار", "name": "Razan al-Najjar", "born": "1997", "died": "2018-06", "chapters": ["2000_2023"], "role_ar": "مسعفة متطوعة في مسيرة العودة الكبرى", "role": "Volunteer paramedic at the Great March of Return", "bio_ar": "كانت رزان النجار، ابنة خزاعة قرب خان يونس، مسعفة متطوعة في جمعية الإغاثة الطبية الفلسطينية، وفي 1 حزيران 2018 استُشهدت برصاصة حية أطلقتها قوات الاحتلال قرب السياج المحيط بقطاع غزة وهي تحاول مع زملائها الوصول إلى جرحى مسيرة العودة الكبرى، وكانت في الحادية والعشرين بحسب وكالات الأمم المتحدة، ترتدي لباس المسعفين الذي قالت هذه الوكالات إنه يميّزها بوضوح بوصفها عاملة صحية، وأُصيب ثلاثة آخرون من فريقها. وزعم جيش الاحتلال أنه لم تُصوَّب نحوها أي رصاصة عمدًا، ثم نشر مقطعًا مجتزأً من مقابلة لها مع قناة الميادين وصفت فيها نفسها بأنها «درع بشري» لحماية الجرحى، فبتر كلامها ليوحي بأنها كانت تحمي مسلحين. وخلصت منظمة بتسيلم إلى أن جنديًّا صوّب نحوها وأطلق النار عليها مباشرة وهي على بعد نحو 25 مترًا من السياج ولا تشكّل خطرًا على أحد، فيما وجد تحقيق لصحيفة «نيويورك تايمز» نُشر في كانون الأول 2018 أن الرصاصة أُطلقت من نحو 110 أمتار وارتدّت عن الأرض قبل أن تصيبها، ووصف إطلاق النار بأنه متهوّر في أحسن الأحوال وقد يرقى إلى جريمة حرب.", "bio": "Razan al-Najjar, from Khuza'a near Khan Yunis, was a volunteer first responder with the Palestinian Medical Relief Society; on 1 June 2018 Israeli occupation forces shot her dead with live ammunition near the fence around Gaza as she and other first responders tried to reach wounded demonstrators of the Great March of Return. She was 21 according to UN agencies, wore first-responder clothing that they said clearly marked her as a health worker, and three others on her team were wounded. The Israeli army claimed that no shots were deliberately aimed at her, then released an edited clip of an interview she gave to Al Mayadeen, in which she called herself a \"human shield\" for the wounded, cut to suggest that she shielded militants. B'Tselem concluded that a soldier aimed and fired directly at her when she was about 25 metres from the fence and posed no danger to anyone, while a New York Times investigation published in December 2018 found that the bullet, fired from about 110 metres, ricocheted off the ground before hitting her, and called the shooting reckless at best and possibly a war crime.", "related_events": ["e2018_03_march_of_return"], "sources": ["https://www.ochaopt.org/content/un-agencies-deeply-concerned-over-killing-health-volunteer-gaza", "https://www.hrw.org/news/2018/06/11/medical-workers-shot-gaza-demonstrations", "https://www.aljazeera.com/news/2018/07/israeli-forces-deliberately-killed-palestinian-paramedic-razan-180717070735436.html", "https://theintercept.com/2018/06/08/israel-attempts-smear-razan-al-najjar-palestinian-medic-killed-calling-no-angel/", "https://en.wikipedia.org/wiki/Razan_al-Najjar"], "sensitive": true}
  - {"id": "fig_ahed_tamimi", "name_ar": "عهد التميمي", "name": "Ahed Tamimi", "born": "2001", "chapters": ["2000_2023", "2023_2026"], "role_ar": "ناشطة من قرية النبي صالح وأسيرة سابقة في سجون الاحتلال", "role": "Activist from Nabi Saleh, twice held in Israeli occupation prisons", "bio_ar": "وُلدت عهد التميمي عام 2001 ونشأت في قرية النبي صالح، التي بدأت فيها مسيرات أسبوعية في 9 كانون الأول 2009 بعد أن استولى مستوطنون من مستوطنة حلميش على نبع القوس في أرض القرية، بحسب منظمة العفو الدولية، التي عدّت والدها باسم التميمي، أحد منظّمي المسيرات، سجين رأي حين اعتقلته قوات الاحتلال عام 2012. وفي 15 كانون الأول 2017، بعد أن أصاب جنود الاحتلال قريبها محمد، 15 عامًا، في وجهه برصاصة معدنية مغلّفة بالمطاط، صُوّرت وهي تصفع جنديَّين وتضربهما أمام بيتها، فاعتقلتها قوات الاحتلال في مداهمة ليلية يوم 19 كانون الأول، ثم اعتقلت أمها ناريمان. وفي آذار 2018 قبلت صفقة إقرار بالذنب أمام محكمة عوفر العسكرية التابعة للاحتلال، فأقرّت بأربع من 12 تهمة بينها «الاعتداء» على جنديين، وحُكم عليها، كما حُكم على أمها، بالسجن ثمانية أشهر وبغرامة، وأُفرج عنهما في 29 تموز 2018. واعتقلتها قوات الاحتلال مجددًا في 6 تشرين الثاني 2023 بزعم التحريض في منشور على إنستغرام قالت عائلتها إنه مزيّف وإنها لا تملك حسابًا على المنصة، وأُفرج عنها دون أي تهمة في 30 تشرين الثاني 2023 ضمن تبادل الأسرى خلال الهدنة في غزة.", "bio": "Ahed Tamimi was born in 2001 and grew up in Nabi Saleh, where weekly protests began on 9 December 2009 after settlers from the settlement of Halamish took over al-Qaws spring on the village's land, according to Amnesty International, which named her father Bassem, an organiser of the protests, a prisoner of conscience when occupation forces arrested him in 2012. On 15 December 2017, after occupation soldiers shot her 15-year-old cousin Mohammed in the face with a rubber-coated steel bullet, she was filmed slapping and hitting two soldiers outside her house; occupation forces arrested her in a night raid on 19 December and then arrested her mother, Nariman. In March 2018 she accepted a plea deal at the Israeli military court at Ofer, pleading guilty to four of 12 charges, including \"assault\" on two soldiers; she and her mother were each sentenced to eight months in prison and a fine, and both were released on 29 July 2018. Occupation forces arrested her again on 6 November 2023, alleging incitement in an Instagram post that her family said was fake, adding that she has no account on the platform; she was freed without any charge on 30 November 2023 in the prisoner exchange during the truce in Gaza.", "related_events": ["gz_2023_11_truce"], "sources": ["https://www.amnesty.org/en/latest/press-release/2012/11/israeli-authorities-must-release-palestinian-prisoner-conscience-west-bank/", "https://www.aljazeera.com/amp/news/2018/03/ahed-tamimi-months-prison-plea-deal-180321201412587.html", "https://www.aljazeera.com/news/2018/07/palestinian-ahed-tamimi-freed-jail-180729051621393.html", "https://www.aljazeera.com/gallery/2023/11/30/hamas-and-israel-free-more-detainees-in-sixth-captive-exchange", "https://newarab.com/news/ahed-tamimi-among-palestinians-freed-gaza-truce-swap", "https://en.wikipedia.org/wiki/Ahed_Tamimi"], "sensitive": false}
  - {"id": "fig_abu_obaida", "name_ar": "أبو عبيدة", "name": "Abu Obaida", "died": "2025-08", "chapters": ["2000_2023", "2023_2026"], "role_ar": "الناطق العسكري باسم كتائب القسام", "role": "Spokesman of the Qassam Brigades", "bio_ar": "أبو عبيدة اسمٌ حمله الناطق الملثّم باسم كتائب القسام، الجناح العسكري لحركة حماس، الذي ظهر في هذا الدور لأول مرة في تشرين الأول 2004 خلال اجتياح جيش الاحتلال لشمال غزة، وصار الناطق الوحيد باسمها. واغتاله جيش الاحتلال بغارة على مدينة غزة في 30 آب 2025، فاستُشهد مع زوجته وثلاثة من أبنائه بحسب «العربي الجديد»، وأعلن وزير الحرب في حكومة الاحتلال يسرائيل كاتس مقتله في اليوم التالي. وفي 29 كانون الأول 2025 أكّدت كتائب القسام استشهاده في بيان مصوّر، وكشفت للمرة الأولى اسمه، حذيفة سمير عبد الله الكحلوت، ابن عائلة هُجّرت في نكبة 1948، وتولّى ناطق ملثّم جديد الاسم نفسه.", "bio": "Abu Obaida was the name used by the masked spokesman of Hamas's armed wing, the Qassam Brigades, who first appeared in October 2004, during an occupation army assault on northern Gaza, and became its sole spokesman. The Israeli army assassinated him in an air strike on Ghazza (Gaza City) on 30 August 2025, killing his wife and three of his children with him according to The New Arab, and the occupation government's defence minister, Israel Katz, announced his death the next day. On 29 December 2025 the Qassam Brigades confirmed his death in a video statement, naming him for the first time as Hudhayfa Samir Abdullah al-Kahlout, from a family driven out in 1948, and a new masked spokesman took over the name.", "related_events": [], "sources": ["https://www.aljazeera.com/news/2025/12/29/hamas-armed-wing-confirms-deaths-of-figures-israel-earlier-said-it-killed-2", "https://www.middleeasteye.net/news/hamas-military-wing-announces-new-spokesman-after-abu-obeida-killing", "https://www.dawn.com/news/1963944", "https://www.euronews.com/2025/08/31/israel-claims-death-of-hamas-armed-wing-spokesperson-abu-obeida", "https://www.newarab.com/news/gaza-mourns-abu-obeida-voice-resistance", "https://en.wikipedia.org/wiki/Abu_Obaida"], "sensitive": true}
  - {"id": "fig_bassem_abu_rahmah", "name_ar": "باسم أبو رحمة", "name": "Bassem Abu Rahmah", "died": "2009-04", "chapters": ["2000_2023"], "role_ar": "ناشط في المسيرات الأسبوعية ضد الجدار في بلعين", "role": "Activist in Bil'in's weekly protests against the wall", "bio_ar": "شارك باسم أبو رحمة في المسيرات الأسبوعية في بلعين، غربيّ رام الله، ضد جدار رُسم مساره ليضمّ نحو 60 في المئة من أرض القرية. وفي 17 نيسان 2009 أطلق جنود الاحتلال عليه قنبلة غاز مسيل للدموع عالية السرعة أصابته في صدره من مسافة نحو 40 مترًا، فاستُشهد قبل وصوله إلى المستشفى وهو في الثلاثين، وسجّلت ثلاث كاميرات فيديو لحظة إصابته. وزعم جيش الاحتلال أولًا أنه كان بين راشقي الحجارة؛ وبعد أن خلص تحليل خبراء بتكليف من منظمة بتسيلم إلى أن القنبلة أُطلقت نحوه مباشرة، أمر المدعي العسكري العام في تموز 2010 بفتح تحقيق جنائي، ثم أغلقه في أيلول 2013 دون أي لائحة اتهام. وكان جنود الاحتلال قد قيّدوا أخاه أشرف وعصبوا عينيه في نعلين في تموز 2008 ثم أطلقوا على قدمه رصاصة معدنية مغلّفة بالمطاط من مسافة قريبة، واستُشهدت أخته جواهر، 36 عامًا، متأثرةً باستنشاق الغاز المسيل للدموع الذي أطلقته قوات الاحتلال في مسيرة القرية يوم 31 كانون الأول 2010، وزعمت سلطات الاحتلال أن الغاز لم يكن سبب وفاتها.", "bio": "Bassem Abu Rahmah joined the weekly protests in Bil'in, west of Ramallah, against a wall whose route would take almost 60 per cent of the village's land. On 17 April 2009 occupation soldiers fired a high-velocity tear-gas canister that hit him in the chest from about 40 metres, and he died before reaching hospital, aged 30; three cameras filmed the moment he was hit. The Israeli army first claimed he was among stone-throwers; after an expert analysis commissioned by B'Tselem found that the canister had been fired directly at him, the Military Advocate General ordered a criminal investigation in July 2010, then closed it in September 2013 with no indictment. In July 2008 soldiers tied up and blindfolded his brother Ashraf in Ni'lin and shot him in the foot at close range with a rubber-coated steel bullet; his sister Jawaher, 36, died after inhaling tear gas at the village's protest on 31 December 2010, and the occupation authorities claimed tear gas was not the cause.", "related_events": ["e2005_02_bilin"], "sources": ["https://www.aljazeera.com/features/2011/1/7/bilin-a-village-in-mourning", "https://palsolidarity.org/?p=12916", "https://situ.nyc/research/projects/bilin-report", "https://palsolidarity.org/2011/01/bilin-female-protester-in-critical-condition-from-tear-gas-inhalation-2/", "https://globalvoices.org/2011/01/07/palestine-eyewitnesses-report-tear-gas-at-bilin-demonstration/"], "sensitive": true}
  - {"id": "fig_basil_al_araj", "name_ar": "باسل الأعرج", "name": "Basil al-Araj", "died": "2017-03", "chapters": ["2000_2023"], "role_ar": "صيدلي وكاتب وناشط من قرية الولجة", "role": "Pharmacist, writer and activist from al-Walaja", "bio_ar": "درس باسل الأعرج، ابن قرية الولجة قرب بيت لحم، حيث اقتطع الجدار جزءًا من أرض عائلته، الصيدلة في مصر، وعمل باحثًا يلقي المحاضرات وينظّم جولات عن تاريخ تهجير الفلسطينيين، وقاد حراكًا شبابيًّا ضد التطبيع مع الاحتلال. وفي نيسان 2016 اعتقلته أجهزة أمن السلطة الفلسطينية مع خمسة آخرين بدعوى حيازة أسلحة غير مرخّصة والتخطيط لهجوم على أهداف إسرائيلية، فأضرب الستة عن الطعام تسعة أيام احتجاجًا على ما وصفوه بالتعذيب وسوء المعاملة في الاحتجاز، وأُفرج عنهم دون تهمة في أيلول 2016، ثم اعتقلت قوات الاحتلال أربعة منهم. وطاردته قوات الاحتلال فتوارى عن الأنظار، وفي 6 آذار 2017 اقتحمت قوة خاصة تابعة لها البيت الذي كان يقيم فيه في البيرة، فاستُشهد بعد اشتباك مسلح معها، وزعمت شرطة الاحتلال أنه كان يرأس خلية تخطط لهجمات، وقالت وزارة الصحة الفلسطينية إن التشريح كشف ما لا يقل عن 10 إصابات بالرصاص، بينها إصابة في القلب. واحتجزت سلطات الاحتلال جثمانه 11 يومًا قبل تشييعه في الولجة يوم 17 آذار 2017، ونُشرت كتاباته بعد استشهاده في كتاب «وجدت أجوبتي» عام 2018.", "bio": "Basil al-Araj, from al-Walaja near Bayt Lahm (Bethlehem), where the wall took part of his family's land, studied pharmacy in Egypt and worked as a researcher, giving lectures and tours on the history of Palestinian dispossession, and led a youth movement against normalisation with the occupation. In April 2016 Palestinian Authority security forces arrested him and five others, saying they held unlicensed weapons and planned an attack on Israeli targets; the six went on a nine-day hunger strike against what they described as torture and mistreatment in detention and were released without charge in September 2016, after which occupation forces arrested four of them. Hunted by the occupation forces, he went into hiding, and on 6 March 2017 an Israeli special forces unit stormed the house where he was staying in al-Bireh and killed him after an exchange of fire; Israeli police claimed he headed a cell planning attacks, and the Palestinian Ministry of Health said the autopsy found at least 10 bullet wounds, one of them to the heart. The occupation authorities held his body for 11 days before his funeral in al-Walaja on 17 March 2017, and his writings were published after his death as \"I Have Found My Answers\" (2018).", "related_events": [], "sources": ["https://www.aljazeera.com/features/2017/3/7/basil-al-araj-was-a-beacon-for-palestinian-youth", "https://www.aljazeera.com/news/2017/3/18/basil-al-araj-palestine-activist-buried-in-west-bank", "https://www.goodshepherdcollective.org/figures/basil-al-araj", "https://en.wikipedia.org/wiki/Bassel_al-Araj"], "sensitive": true}
  - {"id": "fig_abu_safiya", "name_ar": "حسام أبو صفية", "name": "Hussam Abu Safiya", "born": "1973-11", "chapters": ["2023_2026"], "role_ar": "مدير مستشفى كمال عدوان وأسير في سجون الاحتلال", "role": "Kamal Adwan Hospital director held in Israeli occupation prisons", "bio_ar": "وُلد حسام أبو صفية، طبيب الأطفال، في مخيم جباليا للاجئين عام 1973 لعائلة هُجّرت من قرية حمامة عام 1948، وأدار مستشفى كمال عدوان في شمال غزة ورفض أوامر جيش الاحتلال المتكررة بإخلائه. وفي أواخر تشرين الأول 2024 قتلت غارة بطائرة مسيّرة للاحتلال عند بوابة المستشفى ابنه إبراهيم ذا الخمسة عشر عامًا، وفي 23 تشرين الثاني أصيب هو بشظايا مسيّرة استهدفت المستشفى. وفي 27 كانون الأول 2024 اقتحمت قوات الاحتلال المستشفى واعتقلته مع نحو 240 من العاملين والمرضى، وزعم جيش الاحتلال دون تقديم دليل أنه يحمل «رتبة» في حماس، وهو ما ترفضه عائلته وزملاؤه. ومنذ ذلك الحين تحتجزه سلطات الاحتلال دون تهمة أو محاكمة بموجب قانون «المقاتلين غير الشرعيين»، وقد نُقل إلى قسم «ركيفت» تحت الأرض الذي أُغلق عام 1985 بسبب ظروفه اللاإنسانية ثم أُعيد فتحه في الحرب، بحسب منظمة العفو الدولية، ورأى محاميه في تموز 2026 آثار تعذيب على رأسه وجسده. وخلص الفريق العامل المعني بالاحتجاز التعسفي التابع للأمم المتحدة في الشهر نفسه إلى أن احتجازه تعسفي، وما زال محتجزًا حتى تشرين الأول 2026.", "bio": "Hussam Abu Safiya, a paediatrician, was born in Jabalia refugee camp in 1973 to a family driven out of the village of Hamama in 1948; he directed Kamal Adwan Hospital in northern Gaza and refused repeated occupation army orders to leave it. In late October 2024 an Israeli drone strike at the hospital gate killed his 15-year-old son Ibrahim, and on 23 November he was wounded by shrapnel from a drone attack on the hospital. On 27 December 2024 occupation forces raided the hospital and detained him with about 240 staff and patients; the Israeli army claimed, without evidence, that he held \"a rank\" in Hamas, which his family and colleagues reject. The occupation authorities have since held him without charge or trial under the Unlawful Combatants Law, moving him to the underground Rakefet section, closed in 1985 over its inhumane conditions and reopened during the war, according to Amnesty International; in July 2026 his lawyer saw signs of torture on his head and body. The UN Working Group on Arbitrary Detention found his detention arbitrary that same month, and he was still held in October 2026.", "related_events": ["gz_2024_12_kamal_adwan", "gz_2026_07_abu_safiya"], "sources": ["https://www.aljazeera.com/news/2024/12/29/who-is-hussam-abu-safia-director-of-key-gaza-hospital-detained-by-israel", "https://www.trtworld.com/middle-east/hussam-abu-safiya-the-doctor-who-says-no-to-israel-18248103", "https://www.nbcwashington.com/news/national-international/un-experts-israel-release-gaza-doctor-severe-torture/4081327/", "https://www.aljazeera.com/amp/video/fault-lines/2025/9/18/the-disappearance-of-dr-abu-safiya", "https://www.amnesty.org/fr/latest/news/2026/07/israel-opt-fears-mounting-for-arbitrarily-detained-palestinian-doctor-hussam-abu-safiya-amidst-reports-his-life-is-in-grave-danger/", "https://www.khaleejtimes.com/world/mena/un-asks-immediate-release-israel-detention-gaza-doctor-abu-safiya", "https://www.aljazeera.com/news/2026/10/6/us-lawmakers-call-on-israel-to-release-imprisoned-doctor-hussam-abu-safia", "https://en.wikipedia.org/wiki/Hussam_Abu_Safiya"], "sensitive": true}
  - {"id": "fig_hamza_dahdouh", "name_ar": "حمزة الدحدوح", "name": "Hamza Dahdouh", "born": "1996-07", "died": "2024-01", "chapters": ["2023_2026"], "role_ar": "صحفي ومصور في قناة الجزيرة", "role": "Al Jazeera journalist and camera operator", "bio_ar": "وُلد حمزة الدحدوح، الابن البكر لوائل الدحدوح مدير مكتب الجزيرة في غزة، في مدينة غزة عام 1996، وكان قد انضمّ حديثًا إلى قناة الجزيرة صحفيًّا ومصوّرًا. وبعد أن أمر جيش الاحتلال سكان شمال القطاع في 13 تشرين الأول 2023 بالنزوح جنوبًا، لجأت العائلة إلى مخيم النصيرات، وهناك قتلت غارة للاحتلال في 25 تشرين الأول أمّه آمنة وأخاه محمودًا وأخته شام والرضيع آدم حفيد وائل، ضمن 13 فردًا من العائلة أحصتهم منظمة «إيروورز». وفي 7 كانون الثاني 2024 استُشهد وهو في السابعة والعشرين مع الصحفي المستقل مصطفى ثريا والسائق قصي سالم حين أصابت غارة بطائرة مسيّرة للاحتلال سيارتهم في جنوب القطاع وهم عائدون من مهمة صحفية، وأُصيب الصحفي حازم رجب بجروح خطيرة. وزعم جيش الاحتلال أنه استهدف من يشغّل طائرة مسيّرة تهدد قواته، ثم زعم أن حمزة عضو في حركة الجهاد الإسلامي مستندًا إلى وثيقة شكّك فيها خبراء، فيما لم يجد تحقيق لصحيفة «واشنطن بوست» في آذار 2024 ما يدل على أن أيًّا من الصحفيَّين كان يفعل غير العمل الصحفي، وذكر أن حمزة كان قد نال إذنًا بمغادرة غزة، وهو إذن لا يُمنح للمسلحين.", "bio": "Hamza Dahdouh, the eldest son of Al Jazeera's Gaza bureau chief Wael Dahdouh, was born in Ghazza (Gaza City) in 1996 and had recently joined Al Jazeera as a journalist and camera operator. After the Israeli occupation army ordered northern Gaza's residents south on 13 October 2023, the family sheltered in Nuseirat refugee camp, where an Israeli strike on 25 October killed his mother Amna, his brother Mahmoud, his sister Sham and Wael's infant grandson Adam, among 13 family members counted by Airwars. On 7 January 2024, aged 27, he was killed with freelance journalist Mustafa Thuraya and their driver Qusai Salem when an Israeli drone strike hit their car in southern Gaza as they returned from an assignment; journalist Hazem Rajab was badly wounded. The Israeli army claimed it had struck a person operating a drone that threatened its troops, and later claimed Hamza was a member of Islamic Jihad, citing a document that experts questioned; a Washington Post investigation published in March 2024 found no sign that either journalist was doing anything other than reporting, and noted that Hamza had been granted permission to leave Gaza, a privilege not given to militants.", "related_events": ["gz_2024_01_hamza", "gz_2023_10_dahdouh"], "sources": ["https://cpj.org/data/people/hamza-al-dahdouh/", "https://alquds.com/en/posts/114098", "https://en.wikipedia.org/wiki/Hamza_Al-Dahdouh", "https://www.theguardian.com/world/2024/oct/31/wael-al-dahdouh-gaza-palestinian-journalist-tragedy", "https://airwars.org/?p=103322", "https://www.aljazeera.com/news/2024/1/7/hamza-son-of-al-jazeeras-wael-dahdouh-killed-in-israeli-attack-in-gaza"], "sensitive": true}
  - {"id": "fig_anas_al_sharif", "name_ar": "أنس الشريف", "name": "Anas al-Sharif", "born": "1996-12", "died": "2025-08", "chapters": ["2023_2026"], "role_ar": "مراسل قناة الجزيرة في شمال غزة", "role": "Al Jazeera correspondent in northern Gaza", "bio_ar": "وُلد أنس الشريف في مخيم جباليا للاجئين عام 1996، ودرس الإذاعة والتلفزيون في جامعة الأقصى، وأُصيب بشظية رصاصة في بطنه في 23 أيلول 2018 وهو يغطّي مسيرة شمال شرقي جباليا، ثم صار مراسلًا لقناة الجزيرة في شمال غزة بعد تشرين الأول 2023. ومنذ تشرين الثاني 2023 اتصل به ضباط في جيش الاحتلال يأمرونه بالتوقف عن التغطية ومغادرة الشمال، وفي 11 كانون الأول 2023 قتلت غارة للاحتلال على بيت العائلة في جباليا والده جمال. وفي تموز 2025 زعم المتحدث باسم جيش الاحتلال بالعربية أنه عضو في الجناح العسكري لحماس، فحذّرت لجنة حماية الصحفيين من أن هذه الاتهامات محاولة لتهيئة الرأي العام لقتله. وفي ساعة متأخرة من ليل 10 آب 2025 اغتاله الجيش الصهيوني بغارة بطائرة مسيّرة على خيمة للصحفيين أمام مستشفى الشفاء في مدينة غزة، فاستُشهد مع زملائه في الجزيرة محمد قريقع وإبراهيم ظاهر ومحمد نوفل والصحفيَّين المستقلَّين مؤمن عليوة ومحمد الخالدي، وزعم جيش الاحتلال أنه كان يرأس خلية لحماس، فيما قالت لجنة حماية الصحفيين إن الوثائق التي استند إليها غير موثوقة، ووصف مكتب الأمم المتحدة لحقوق الإنسان الغارة بأنها انتهاك جسيم للقانون الإنساني الدولي.", "bio": "Anas al-Sharif was born in Jabalia refugee camp in 1996, studied radio and television at al-Aqsa University, was wounded by bullet shrapnel in the abdomen on 23 September 2018 while covering a march north-east of Jabalia, and became an Al Jazeera correspondent in northern Gaza after October 2023. From November 2023 Israeli occupation army officers phoned him ordering him to stop reporting and leave the north, and on 11 December 2023 an Israeli air strike on the family home in Jabalia killed his father, Jamal. In July 2025 the Israeli army's Arabic-language spokesperson claimed he belonged to Hamas's armed wing, and the Committee to Protect Journalists warned that the accusations were an effort to manufacture consent to kill him. Late on 10 August 2025 an Israeli drone strike on a journalists' tent outside al-Shifa Hospital in Ghazza (Gaza City) assassinated him with his Al Jazeera colleagues Mohammed Qreiqeh, Ibrahim Zaher and Mohammed Noufal and the freelance journalists Moamen Aliwa and Mohammed al-Khalidi; the Israeli army claimed he headed a Hamas cell, while CPJ said the documents it cited were not credible and the UN human rights office called the strike a grave breach of international humanitarian law.", "related_events": ["gz_2025_08_anas"], "sources": ["https://cpj.org/data/people/anas-al-sharif/", "https://www.aljazeera.com/news/2023/12/11/father-of-al-jazeera-journalist-killed-in-israeli-air-strike-on-gaza", "https://www.aljazeera.net/encyclopedia/2025/8/11/%d8%a3%d9%86%d8%b3-%d8%a7%d9%84%d8%b4%d8%b1%d9%8a%d9%81-%d8%b5%d9%88%d8%aa-%d8%ba%d8%b2%d8%a9-%d8%a7%d9%84%d8%b0%d9%8a-%d8%a7%d8%ba%d8%aa%d8%a7%d9%84%d9%87-%d8%ac%d9%8a%d8%b4", "https://cpj.org/2025/07/cpj-calls-for-anas-al-sharifs-protection-in-face-of-israeli-smears/", "https://www.aljazeera.com/news/2025/8/11/tributes-condemnation-pour-in-for-slain-al-jazeera-journalists-in-gaza", "https://en.wikipedia.org/wiki/Anas_Al-Sharif"], "sensitive": true}
  - {"id": "fig_hind_rajab", "name_ar": "هند رجب", "name": "Hind Rajab", "born": "2018-05", "died": "2024-01", "chapters": ["2023_2026"], "role_ar": "طفلة من غزة استُشهدت مع ستة من أقاربها بنيران قوات الاحتلال", "role": "Gaza child killed by occupation forces with six relatives", "bio_ar": "وُلدت هند رجب عام 2018 وعاشت في مدينة غزة. وفي 29 كانون الثاني 2024 أطلقت قوات الاحتلال النار على السيارة التي كانت تقلّها مع أقاربها في حي تل الهوا، فقتلت ستة منهم بينهم قريبتها ليان ذات الخمسة عشر عامًا، وظلت هند ساعات تستنجد هاتفيًّا بالهلال الأحمر الفلسطيني وتصف دبابات أمام السيارة. وبعد ثلاث ساعات سُمح بالاقتراب لسيارة إسعاف جرى تنسيق مرورها مع جيش الاحتلال، فاستُشهد المسعفان يوسف زينو وأحمد المدهون حين قصفتها قوات الاحتلال، وفي 10 شباط عُثر على جثامين هند وأقاربها والمسعفَين. وأحصى تحقيق مجموعة «العمارة الجنائية» 335 رصاصة أصابت السيارة، ورجّح أن دبابة للاحتلال كانت على بُعد 13 إلى 23 مترًا منها. ونفى جيش الاحتلال أولًا وجود قواته في المنطقة، ثم أقرّ في 19 آب 2026 بأن جنوده أطلقوا النار على السيارة، زاعمًا أنها سارت خلافًا لإنذار وجّهه إلى السكان، وفتح تحقيقًا جنائيًّا تصفه والدتها وسام حمادة بأنه محاولة لتبييض ما جرى.", "bio": "Hind Rajab was born in 2018 and lived in Ghazza (Gaza City). On 29 January 2024 Israeli occupation forces opened fire on the car carrying her and her relatives in Tel al-Hawa, killing six of them, among them her 15-year-old cousin Layan, and for hours Hind pleaded by phone with the Palestine Red Crescent for help, describing tanks in front of the car. Three hours into the call an ambulance whose route had been coordinated with the Israeli army was cleared to approach, and its paramedics, Yusuf Zeino and Ahmed al-Madhoun, were killed when occupation forces shelled it; on 10 February Hind, her relatives and the paramedics were found dead. Forensic Architecture counted 335 bullets that hit the car and found that an Israeli tank was likely 13 to 23 metres away. The Israeli army first denied its forces were in the area; on 19 August 2026 it admitted that its troops had fired at the car, claiming it had travelled contrary to a notice to residents, and opened a criminal investigation that her mother, Wissam Hamada, calls a whitewash.", "related_events": ["gz_2024_01_hind"], "sources": ["https://www.middleeasteye.net/news/forensic-architecture-probe-says-israeli-tank-fire-likely-killed-palestinian-child-hind-rajab", "https://www.bbc.com/news/articles/crl7yjlpx2po", "https://www.nbcnews.com/world/israel/hind-rajab-killing-gaza-israel-military-investigation-mother-justice-rcna593554", "https://en.wikipedia.org/wiki/Killing_of_Hind_Rajab"], "sensitive": true}
