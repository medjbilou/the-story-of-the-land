currencies:
  - {"id": "ottoman_lira", "from_year": 1844, "from_month": 1, "to_year": 1918, "to_month": 1, "region": "national", "name_ar": "الليرة العثمانية", "name": "Ottoman lira", "symbol_ar": "ليرة", "symbol": "LT", "subunit_ar": "القرش، والليرة مئة قرش؛ والمجيدي خُمس الليرة", "subunit": "piastre (qirsh), 100 to the lira; the mecidiye, a fifth of the lira", "note": "The currency of Palestine as part of the Ottoman Empire, from 1844; the piastre kept circulating as its hundredth. On gold from 1881 to 1914; in the First World War the paper money lost value (a gold lira was worth about 9 paper liras by the early 1920s). The British army took the south and Jerusalem in late 1917 and the north in September 1918; January 1918 is the switch month chosen here.", "sources": ["https://en.wikipedia.org/wiki/Ottoman_lira", "https://en.wikipedia.org/wiki/Kuru%C5%9F", "https://en.wikipedia.org/wiki/Palestine_pound"]}
  - {"id": "egyptian_pound_1918", "from_year": 1918, "from_month": 1, "to_year": 1927, "to_month": 11, "region": "national", "name_ar": "الجنيه المصري", "name": "Egyptian pound", "symbol_ar": "ج.م", "symbol": "£E", "subunit_ar": "القرش والمليم: الجنيه مئة قرش أو ألف مليم", "subunit": "piastre (qirsh) and millieme: 100 piastres or 1,000 milliemes to the pound", "note": "The official currency under the British military occupation of 1917-1918, with other coins legal at enforced fixed rates (Turkish coins but not Turkish notes). The civil administration made Egyptian currency and the British gold sovereign the only legal tender from 22 January 1921. It stayed legal tender beside the Palestine pound until 1 March 1928.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Egyptian_pound", "https://www.ajnet.me/news/2015/4/29/%d8%a7%d9%84%d8%ac%d9%86%d9%8a%d9%87-%d8%a7%d9%84%d9%81%d9%84%d8%b3%d8%b7%d9%8a%d9%86%d9%8a-%d8%b5%d8%b1%d8%a7%d8%b9-%d8%a7%d9%84%d8%aa%d8%a7%d8%b1%d9%8a%d8%ae"]}
  - {"id": "palestine_pound", "from_year": 1927, "from_month": 11, "to_year": 1948, "to_month": 5, "region": "national", "name_ar": "الجنيه الفلسطيني", "name": "Palestine pound", "symbol_ar": "ج.ف", "symbol": "£P", "subunit_ar": "المِل، والجنيه ألف مِل", "subunit": "mil, 1,000 to the pound", "note": "Issued by the Palestine Currency Board (London) from 1 November 1927 under the Palestine Currency Order 1927, at par with sterling. Notes and coins were written in Arabic, English and Hebrew; the 10-mil coin was also called a qirsh. In circulation until the Nakba of 1948.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://www.ajnet.me/news/2015/4/29/%d8%a7%d9%84%d8%ac%d9%86%d9%8a%d9%87-%d8%a7%d9%84%d9%81%d9%84%d8%b3%d8%b7%d9%8a%d9%86%d9%8a-%d8%b5%d8%b1%d8%a7%d8%b9-%d8%a7%d9%84%d8%aa%d8%a7%d8%b1%d9%8a%d8%ae"]}
  - {"id": "palestine_pound_1948", "from_year": 1948, "from_month": 5, "to_year": 1948, "to_month": 9, "region": "inside_1948", "name_ar": "الجنيه الفلسطيني", "name": "Palestine pound", "symbol_ar": "ج.ف", "symbol": "£P", "subunit_ar": "المِل، والجنيه ألف مِل", "subunit": "mil, 1,000 to the pound", "note": "The Mandate ended on 15 May 1948 and the Currency Board was dissolved, but its notes and coins kept circulating until new notes came in August 1948.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Israeli_pound"]}
  - {"id": "palestine_pound_apb_1948", "from_year": 1948, "from_month": 9, "to_year": 1949, "to_month": 6, "region": "inside_1948", "name_ar": "الجنيه الفلسطيني (فرضته دولة الاحتلال)", "name": "Palestine pound (imposed by the occupying state)", "symbol_ar": "ج.ف", "symbol": "£P", "subunit_ar": "المِل، والجنيه ألف مِل", "subunit": "mil, 1,000 to the pound", "note": "The first notes of the state that took the land in 1948. Imposed on the Palestinians who remained inside the 1949 lines. Printed in New York for the Anglo-Palestine Bank (owned by the Jewish Agency) and named \"Palestine Pound\", the Mandate currency, because the new state's name had not been decided when they were ordered; declared legal tender on 17 August 1948 and put into circulation on 18 August. Still divided into mils: the state's first coin, 25 mil, was issued on 6 April 1949.", "sources": ["https://web.archive.org/web/20260410160014/https://boi.org.il/en/economic-roles/banknotes-and-coins/anglo-palestine-bank-series/", "https://web.archive.org/web/20260121004016/https://boi.org.il/en/economic-roles/coins/25-mil-coin-the-state-of-israels-first-coin/", "https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Israeli_pound"]}
  - {"id": "palestine_pound_prutah_1948", "from_year": 1949, "from_month": 6, "to_year": 1952, "to_month": 7, "region": "inside_1948", "name_ar": "الجنيه الفلسطيني (فرضته دولة الاحتلال)", "name": "Palestine pound (imposed by the occupying state)", "symbol_ar": "ج.ف", "symbol": "£P", "subunit_ar": "البروطة، وفي الجنيه ألف منها", "subunit": "prutah, 1,000 to the pound", "note": "The same Anglo-Palestine Bank \"Palestine Pound\" notes. Imposed on the Palestinians who remained inside the 1949 lines. The prutah replaced the mil: the first coin of the prutah series, 50 prutah, was put into circulation on 11 May 1949, and mil and prutah fractional notes were issued beside the coins. On 1 May 1951 the bank's assets and liabilities passed to Bank Leumi le-Israel.", "sources": ["https://web.archive.org/web/20260121004016/https://boi.org.il/en/economic-roles/coins/25-mil-coin-the-state-of-israels-first-coin/", "https://web.archive.org/web/20260615110150/https://boi.org.il/en/economic-roles/coins/pruta-series/", "https://web.archive.org/web/20260214233524/https://www.boi.org.il/en/economic-roles/coins/currency-system/", "https://web.archive.org/web/20260815120948/https://boi.org.il/en/economic-roles/banknotes-and-coins/bank-leumi-le-israel-series/", "https://en.wikipedia.org/wiki/Israeli_pound", "https://en.wikipedia.org/wiki/Palestine_pound"]}
  - {"id": "israeli_pound_1948", "from_year": 1952, "from_month": 7, "to_year": 1960, "to_month": 1, "region": "inside_1948", "name_ar": "الليرة الإسرائيلية (فرضتها دولة الاحتلال)", "name": "Israeli pound (imposed by the occupying state)", "symbol_ar": "ليرة", "symbol": "lira", "subunit_ar": "البروطة، وفي الليرة ألف منها", "subunit": "prutah, 1,000 to the pound", "note": "Renamed the Israeli pound (lira): Bank Leumi le-Israel notes issued on 9 June 1952, with a 10 percent compulsory loan levied on cash holdings and current accounts; the \"Palestine Pound\" notes were cancelled on 23 June 1952. Imposed on the Palestinians who remained inside the 1949 lines. Divided into 1,000 prutah until 1960.", "sources": ["https://web.archive.org/web/20260815120948/https://boi.org.il/en/economic-roles/banknotes-and-coins/bank-leumi-le-israel-series/", "https://web.archive.org/web/20260410160014/https://boi.org.il/en/economic-roles/banknotes-and-coins/anglo-palestine-bank-series/", "https://web.archive.org/web/20260214233524/https://www.boi.org.il/en/economic-roles/coins/currency-system/", "https://en.wikipedia.org/wiki/Israeli_pound", "https://en.wikipedia.org/wiki/Palestine_pound"]}
  - {"id": "israeli_pound_agora_1948", "from_year": 1960, "from_month": 1, "to_year": 1980, "to_month": 3, "region": "inside_1948", "name_ar": "الليرة الإسرائيلية (فرضتها دولة الاحتلال)", "name": "Israeli pound (imposed by the occupying state)", "symbol_ar": "ليرة", "symbol": "lira", "subunit_ar": "الأغورة، وفي الليرة مئة منها", "subunit": "agora, 100 to the pound", "note": "Imposed on the Palestinians who remained inside the 1949 lines. The government changed the division of the pound from 1,000 prutah to 100 agorot; the agora coins were put into circulation from 1 January 1960. Replaced by the shekel on 24 February 1980.", "sources": ["https://web.archive.org/web/20260416135447/https://www.boi.org.il/en/economic-roles/coins/agora-and-pound-series/", "https://web.archive.org/web/20260214233524/https://www.boi.org.il/en/economic-roles/coins/currency-system/", "https://en.wikipedia.org/wiki/Agora_(currency)", "https://en.wikipedia.org/wiki/Israeli_pound", "https://en.wikipedia.org/wiki/Israeli_new_shekel"]}
  - {"id": "israeli_shekel_1948", "from_year": 1980, "from_month": 3, "to_year": 1986, "to_month": 1, "region": "inside_1948", "name_ar": "الشيكل الإسرائيلي (فرضته دولة الاحتلال)", "name": "Israeli shekel (imposed by the occupying state)", "symbol_ar": "شيكل", "symbol": "IS", "subunit_ar": "الأغورة الجديدة، وفي الشيكل مئة منها", "subunit": "new agora, 100 to the shekel", "note": "Replaced the Israeli pound at 10 to 1 on 24 February 1980; hyperinflation in the early 1980s.", "sources": ["https://en.wikipedia.org/wiki/Israeli_new_shekel", "https://en.wikipedia.org/wiki/Israeli_pound"]}
  - {"id": "israeli_new_shekel_1948", "from_year": 1986, "from_month": 1, "region": "inside_1948", "name_ar": "الشيكل الإسرائيلي الجديد (فرضته دولة الاحتلال)", "name": "Israeli new shekel (imposed by the occupying state)", "symbol_ar": "ش.ج", "symbol": "₪", "subunit_ar": "الأغورة، وفي الشيكل مئة منها", "subunit": "agora, 100 to the shekel", "note": "Replaced the old shekel at 1,000 to 1 on 1 January 1986.", "sources": ["https://en.wikipedia.org/wiki/Israeli_new_shekel"]}
  - {"id": "palestine_pound_wb", "from_year": 1948, "from_month": 5, "to_year": 1950, "to_month": 7, "region": "west_bank", "name_ar": "الجنيه الفلسطيني", "name": "Palestine pound", "symbol_ar": "ج.ف", "symbol": "£P", "subunit_ar": "المِل، والجنيه ألف مِل", "subunit": "mil, 1,000 to the pound", "note": "Kept circulating in the West Bank under Jordanian rule until the Jordanian dinar became legal tender on 1 July 1950; the Palestine pound ceased to be used in the kingdom on 30 September 1950.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Jordanian_dinar"]}
  - {"id": "jordanian_dinar_wb", "from_year": 1950, "from_month": 7, "to_year": 1967, "to_month": 7, "region": "west_bank", "name_ar": "الدينار الأردني", "name": "Jordanian dinar", "symbol_ar": "د.أ", "symbol": "JD", "subunit_ar": "الفلس، والدينار ألف فلس", "subunit": "fils, 1,000 to the dinar", "note": "Issued by the Jordan Currency Board from 1949, at par with the Palestine pound; legal tender in the West Bank from 1 July 1950. The occupation began on 5-7 June 1967, so June 1967 still shows the dinar.", "sources": ["https://en.wikipedia.org/wiki/Jordanian_dinar", "https://en.wikipedia.org/wiki/Palestine_pound"]}
  - {"id": "israeli_pound_wb", "from_year": 1967, "from_month": 7, "to_year": 1980, "to_month": 3, "region": "west_bank", "name_ar": "الليرة الإسرائيلية (فرضها الاحتلال)", "name": "Israeli pound (imposed by the occupation)", "symbol_ar": "ليرة", "symbol": "lira", "subunit_ar": "الأغورة، وفي الليرة مئة منها", "subunit": "agora, 100 to the pound", "note": "Imposed by the Israeli occupation from June 1967. Military Order No. 7 of 7 June 1967 closed every bank in the West Bank and Gaza; Israeli banks then opened branches. The Jordanian dinar stayed in use in the West Bank. The pound had been divided into 100 agorot since 1 January 1960.", "sources": ["https://backup.amf.org.ae/sites/default/files/publications/2022-01/pma-experience-book.pdf", "https://en.wikipedia.org/wiki/Jordanian_dinar", "https://en.wikipedia.org/wiki/Palestine_pound", "https://web.archive.org/web/20260416135447/https://www.boi.org.il/en/economic-roles/coins/agora-and-pound-series/", "https://en.wikipedia.org/wiki/Agora_(currency)"]}
  - {"id": "israeli_shekel_wb", "from_year": 1980, "from_month": 3, "to_year": 1986, "to_month": 1, "region": "west_bank", "name_ar": "الشيكل الإسرائيلي (فرضه الاحتلال)", "name": "Israeli shekel (imposed by the occupation)", "symbol_ar": "شيكل", "symbol": "IS", "subunit_ar": "الأغورة الجديدة، وفي الشيكل مئة منها", "subunit": "new agora, 100 to the shekel", "note": "The occupation's currency after 24 February 1980. The Israeli banks in the occupied areas dealt only in the shekel, and its instability cost Palestinians heavy losses in their savings. The Jordanian dinar stayed in use.", "sources": ["https://en.wikipedia.org/wiki/Israeli_new_shekel", "https://backup.amf.org.ae/sites/default/files/publications/2022-01/pma-experience-book.pdf", "https://en.wikipedia.org/wiki/Jordanian_dinar"]}
  - {"id": "israeli_new_shekel_wb", "from_year": 1986, "from_month": 1, "to_year": 1994, "to_month": 5, "region": "west_bank", "name_ar": "الشيكل الإسرائيلي الجديد (فرضه الاحتلال)", "name": "Israeli new shekel (imposed by the occupation)", "symbol_ar": "ش.ج", "symbol": "₪", "subunit_ar": "الأغورة، وفي الشيكل مئة منها", "subunit": "agora, 100 to the shekel", "note": "Replaced the shekel at 1,000 to 1 on 1 January 1986, imposed under military rule as the shekel was. The Jordanian dinar stayed in use.", "sources": ["https://en.wikipedia.org/wiki/Israeli_new_shekel", "https://backup.amf.org.ae/sites/default/files/publications/2022-01/pma-experience-book.pdf", "https://en.wikipedia.org/wiki/Jordanian_dinar"]}
  - {"id": "israeli_new_shekel_wb_1994", "from_year": 1994, "from_month": 5, "region": "west_bank", "name_ar": "الشيكل الإسرائيلي الجديد (تحت الاحتلال)", "name": "Israeli new shekel (under occupation)", "symbol_ar": "ش.ج", "symbol": "₪", "subunit_ar": "الأغورة، وفي الشيكل مئة منها", "subunit": "agora, 100 to the shekel", "note": "Legal tender under the Paris Protocol (29 April 1994, Article IV), which makes the shekel a legal means of payment for all purposes and leaves a Palestinian currency to future talks with Israel; the Palestine Monetary Authority issues none, so Palestinians have no currency of their own. Used for most transactions; families also hold the Jordanian dinar (savings and large purchases; about 23% of West Bank bank deposits) and the US dollar.", "sources": ["https://en.wikipedia.org/wiki/Israeli_new_shekel", "https://web.archive.org/web/20121126160945/http://www.nad-plo.org/userfiles/file/Document/ParisPro.pdf", "https://backup.amf.org.ae/sites/default/files/publications/2022-01/pma-experience-book.pdf", "https://en.wikipedia.org/wiki/Palestine_Monetary_Authority", "https://unispal.un.org/pdfs/C8D0EEBE6B975E0185257627004F144A.pdf", "https://www.aljazeera.com/economy/2021/6/24/palestine-monetary-authority-mulls-digital-currency", "https://www.atlanticcouncil.org/in-depth-research-reports/issue-brief/currency-policy-options-for-the-palestinian-economy/", "https://en.wikipedia.org/wiki/Palestine_pound"]}
  - {"id": "palestine_pound_gz", "from_year": 1948, "from_month": 5, "to_year": 1951, "to_month": 4, "region": "gaza", "name_ar": "الجنيه الفلسطيني", "name": "Palestine pound", "symbol_ar": "ج.ف", "symbol": "£P", "subunit_ar": "المِل، والجنيه ألف مِل", "subunit": "mil, 1,000 to the pound", "note": "Kept circulating in the Gaza Strip under Egyptian administration until April 1951.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound"]}
  - {"id": "egyptian_pound_gz", "from_year": 1951, "from_month": 4, "to_year": 1957, "to_month": 1, "region": "gaza", "name_ar": "الجنيه المصري", "name": "Egyptian pound", "symbol_ar": "ج.م", "symbol": "£E", "subunit_ar": "القرش والمليم: الجنيه مئة قرش أو ألف مليم", "subunit": "piastre (qirsh) and millieme: 100 piastres or 1,000 milliemes to the pound", "note": "Replaced the Palestine pound in April 1951; the Gaza Strip's main currency under Egyptian administration.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Egyptian_pound"]}
  - {"id": "israeli_pound_gz_1956", "from_year": 1957, "from_month": 1, "to_year": 1957, "to_month": 4, "region": "gaza", "name_ar": "الليرة الإسرائيلية (فرضها الاحتلال)", "name": "Israeli pound (imposed by the occupation)", "symbol_ar": "ليرة", "symbol": "lira", "subunit_ar": "البروطة، وفي الليرة ألف منها", "subunit": "prutah, 1,000 to the pound", "note": "Israel invaded the Gaza Strip in November 1956; a military decree of 3 December 1956 made its lira the only legal currency, with a rate set to pull Egyptian pounds out of circulation. Israel ended the occupation in March 1957. The pound was still divided into 1,000 prutah: the agora came only on 1 January 1960.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Gaza_Strip", "https://en.wikipedia.org/wiki/Occupation_of_the_Gaza_Strip_by_Egypt", "https://web.archive.org/web/20260416135447/https://www.boi.org.il/en/economic-roles/coins/agora-and-pound-series/", "https://web.archive.org/web/20260121004016/https://boi.org.il/en/economic-roles/coins/25-mil-coin-the-state-of-israels-first-coin/"]}
  - {"id": "egyptian_pound_gz_1957", "from_year": 1957, "from_month": 4, "to_year": 1967, "to_month": 7, "region": "gaza", "name_ar": "الجنيه المصري", "name": "Egyptian pound", "symbol_ar": "ج.م", "symbol": "£E", "subunit_ar": "القرش والمليم: الجنيه مئة قرش أو ألف مليم", "subunit": "piastre (qirsh) and millieme: 100 piastres or 1,000 milliemes to the pound", "note": "Back under Egyptian administration after the Israeli withdrawal of March 1957, until the occupation of June 1967.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://en.wikipedia.org/wiki/Gaza_Strip", "https://en.wikipedia.org/wiki/Occupation_of_the_Gaza_Strip_by_Egypt", "https://en.wikipedia.org/wiki/Egyptian_pound"]}
  - {"id": "israeli_pound_gz", "from_year": 1967, "from_month": 7, "to_year": 1980, "to_month": 3, "region": "gaza", "name_ar": "الليرة الإسرائيلية (فرضها الاحتلال)", "name": "Israeli pound (imposed by the occupation)", "symbol_ar": "ليرة", "symbol": "lira", "subunit_ar": "الأغورة، وفي الليرة مئة منها", "subunit": "agora, 100 to the pound", "note": "Imposed by the Israeli occupation from June 1967; Military Order No. 7 of 7 June 1967 closed every bank in the West Bank and Gaza. The pound had been divided into 100 agorot since 1 January 1960.", "sources": ["https://en.wikipedia.org/wiki/Palestine_pound", "https://backup.amf.org.ae/sites/default/files/publications/2022-01/pma-experience-book.pdf", "https://web.archive.org/web/20260416135447/https://www.boi.org.il/en/economic-roles/coins/agora-and-pound-series/", "https://en.wikipedia.org/wiki/Agora_(currency)"]}
