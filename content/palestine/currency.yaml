  - {"id": "israeli_new_shekel_gz_1994", "from_year": 1994, "from_month": 5, "region": "gaza", "name_ar": "الشيكل الإسرائيلي الجديد (تحت الاحتلال)", "name": "Israeli new shekel (under occupation)", "symbol_ar": "ش.ج", "symbol": "₪", "subunit_ar": "الأغورة، وفي الشيكل مئة منها", "subunit": "agora, 100 to the shekel", "note": "Legal tender under the Paris Protocol (29 April 1994, Article IV), which makes the shekel a legal means of payment for all purposes and leaves a Palestinian currency to future talks with Israel; the Palestine Monetary Authority issues none, so Palestinians have no currency of their own. The main currency in the Gaza Strip; the US dollar is also used. Israel limits how many shekels Palestinian banks can send back.", "sources": ["https://en.wikipedia.org/wiki/Israeli_new_shekel", "https://en.wikipedia.org/wiki/Palestine_pound", "https://web.archive.org/web/20121126160945/http://www.nad-plo.org/userfiles/file/Document/ParisPro.pdf", "https://backup.amf.org.ae/sites/default/files/publications/2022-01/pma-experience-book.pdf", "https://en.wikipedia.org/wiki/Palestine_Monetary_Authority", "https://unispal.un.org/pdfs/C8D0EEBE6B975E0185257627004F144A.pdf", "https://www.aljazeera.com/economy/2021/6/24/palestine-monetary-authority-mulls-digital-currency"]}
