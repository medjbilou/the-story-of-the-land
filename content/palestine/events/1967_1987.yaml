  - id: e1967_06_jericho_camps
    title: "Driven from the Ariha camps"
    title_ar: "تهجير مخيمات أريحا"
    text: "In June 1967 the people of the refugee camps around Ariha (Jericho), Aqabat Jabr, Ein al-Sultan and Nu'eima, fled or were driven by the occupying forces east across the Jordan River, until the camps were almost empty. The historian Nur Masalha puts them at about 50,000. Most had already lost their homes once, in 1948."
    text_ar: "في حزيران 1967 فرّ سكان مخيمات اللاجئين حول أريحا، عقبة جبر وعين السلطان والنويعمة، أو طردتهم قوات الاحتلال شرقًا عبر نهر الأردن، حتى خلت المخيمات من أهلها تقريبًا. ويقدّر المؤرخ نور الدين مصالحة عددهم بنحو 50 ألفًا. وكان أكثرهم قد فقدوا بيوتهم من قبل، عام 1948."
