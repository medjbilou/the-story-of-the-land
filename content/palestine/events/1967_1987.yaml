  - id: e1967_07_jerusalem_annex
    title: "The annexation of al-Quds"
    title_ar: "ضمّ القدس"
    text: "On 27–28 June 1967 the Zionist government extended the municipal boundaries of West al-Quds (West Jerusalem) over about 70 km² of the West Bank, the area now called East al-Quds (East Jerusalem). Only about 6 km² of it had been the Jordanian-ruled city; the rest was the land of 28 villages and parts of the Bethlehem and Beit Jala municipalities. On 4 July the UN General Assembly, in Resolution 2253, called Israel's measures in East al-Quds invalid and asked Israel to rescind them and not to change the city's character."
    text_ar: "في 27–28 حزيران 1967 وسّعت الحكومة الصهيونية حدود بلدية القدس الغربية لتضمّ نحو 70 كيلومترًا مربعًا من الضفة الغربية، وهي المنطقة التي تُعرف اليوم بالقدس الشرقية، ولم تكن القدس التي حكمها الأردن منها إلا نحو 6 كيلومترات مربعة، والباقي أراضي 28 قرية وأجزاء من بلديتَي بيت لحم وبيت جالا. وفي 4 تموز عدّت الجمعية العامة للأمم المتحدة في قرارها 2253 الإجراءات الإسرائيلية في القدس الشرقية باطلة، وطالبت إسرائيل بإلغائها والامتناع عن تغيير معالم المدينة."
