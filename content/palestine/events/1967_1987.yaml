  - id: e1971_07_gaza_camps
    title: "Sharon's bulldozers in the Gaza camps"
    title_ar: "جرّافات شارون في مخيمات غزة"
    text: "In 1971 Ariel Sharon, head of the occupation army's Southern Command, was put in charge of crushing the resistance in the Gaza Strip. In January the army cordoned off part of the Beach camp (al-Shati) for almost four weeks under strict curfews, with interrogations, searches and the demolition of some shelters. In July and August 1971 the occupation forces demolished 7,729 shelter rooms in the Jabalia, Beach and Rafah camps, with the stated purpose of cutting roads through them: 2,554 refugee families, 15,855 people who had first been driven out in 1948, lost their homes, by the UN's count. Human Rights Watch puts the houses destroyed at about 2,000, the Institute for Palestine Studies' encyclopedia (PalQuest) at more than 2,500. The counts also differ on how many were uprooted and sent to Sinai: nearly 16,000 displaced, at least 2,000 of them moved to al-Arish in occupied Sinai and several hundred to the West Bank, by Human Rights Watch's count; 38,000 refugees uprooted for a second time in 1971, 12,000 of them sent to camps in Sinai, by PalQuest's. On 16 August Israel's foreign ministry told the US embassy the moves were part of a plan to \"thin out\" Gaza's population. Al Jazeera counts more than 100 Palestinians killed and hundreds detained in the campaign. By 1977 only 67 of the 2,554 families had been given free alternative housing by the occupation authorities."
    text_ar: "في عام 1971 كُلّف أرييل شارون، قائد المنطقة الجنوبية في جيش الاحتلال، بسحق المقاومة في قطاع غزة. ففي كانون الثاني طوّق الجيش جزءًا من مخيم الشاطئ قرابة أربعة أسابيع، وفرض عليه حظر تجوّل مشدّدًا، وأخضع أهله للتحقيق والتفتيش، وهدم بعض مساكنه. وفي تموز وآب 1971 هدمت قوات الاحتلال 7,729 غرفة سكنية في مخيمات جباليا والشاطئ ورفح، بحجة شقّ طرق داخلها، فخسرت 2,554 أسرة لاجئة مساكنَها، أي 15,855 إنسانًا كانوا قد هُجّروا أول مرة عام 1948، بحسب أرقام الأمم المتحدة. وتقدّر هيومن رايتس ووتش البيوت المهدومة بنحو ألفين، والموسوعة التفاعلية لمؤسسة الدراسات الفلسطينية بأكثر من 2,500. وتختلف الأرقام أيضًا في عدد من اقتُلعوا ومن نُقلوا إلى سيناء: فبحسب هيومن رايتس ووتش هُجّر نحو 16 ألف إنسان، نُقل منهم ألفان على الأقل إلى العريش في سيناء المحتلة ومئات إلى الضفة الغربية، وبحسب الموسوعة اقتُلع 38 ألف لاجئ للمرة الثانية عام 1971، أُرسل 12 ألفًا منهم إلى معسكرات في سيناء. وفي 16 آب أبلغت الخارجية الإسرائيلية السفارة الأمريكية أن عمليات النقل جزء من خطة لتقليل عدد سكان غزة. وتُحصي الجزيرة أكثر من 100 شهيد فلسطيني ومئات المعتقلين في تلك الحملة. وحتى عام 1977 لم تحصل إلا 67 أسرة من تلك الأسر على مسكن بديل مجاني من سلطات الاحتلال."
    scope: "national"
