  - id: e1978_09_camp_david
    title: "Camp David and the autonomy plan"
    title_ar: "كامب ديفيد والحكم الذاتي"
    text: "On 17 September 1978 Egypt's President Anwar Sadat and Israel's Prime Minister Menachem Begin signed the Camp David Accords, witnessed by President Jimmy Carter. For the West Bank and Gaza the framework proposed an elected \"self-governing authority\" for a transition of no more than five years; it was drafted without Palestinian participation, left out al-Quds (Jerusalem) and the right of return, and Begin insisted there would be no Palestinian state under any condition. In December 1978 the UN General Assembly, in Resolution 33/28 A, declared that agreements were valid only within the UN framework and only if they secured the Palestinians' rights, return among them; after the Egypt–Israel peace treaty of March 1979 Egypt was suspended from the Arab League."
    text_ar: "في 17 أيلول 1978 وقّع الرئيس المصري أنور السادات ورئيس الوزراء الإسرائيلي مناحيم بيغن اتفاقيتي كامب ديفيد بشهادة الرئيس الأمريكي جيمي كارتر. واقترح إطار السلام للضفة الغربية وغزة «سلطة حكم ذاتي» منتخبة لمرحلة انتقالية لا تتجاوز خمس سنوات، وقد صيغ دون مشاركة فلسطينية ولم يتناول القدس ولا حق العودة، وأصرّ بيغن على أنه لن تقوم دولة فلسطينية بأي حال. وفي كانون الأول 1978 أعلنت الجمعية العامة للأمم المتحدة في قرارها 33/28 ألف أن الاتفاقات لا تصحّ إلا إذا جاءت في إطار الأمم المتحدة وضمنت حقوق الشعب الفلسطيني، ومنها حق العودة. وبعد معاهدة السلام المصرية الإسرائيلية في آذار 1979 عُلّقت عضوية مصر في جامعة الدول العربية."
    scope: "national"
