  - id: e1970_07_kiryat_arba
    title: "Kiryat Arba"
    title_ar: "كريات أربع"
    text: "At Passover 1968 a group led by Rabbi Moshe Levinger settled into a hotel in the middle of al-Khalil (Hebron) without government authorisation, then moved into a nearby compound of the occupation army. Kiryat Arba, founded beside the city in 1968, began with the expropriation of Palestinian land, officially for a military base. Minutes of a July 1970 meeting in Defence Minister Moshe Dayan's office record that homes would be built there \"for military purposes\" and then handed over to Israeli civilians."
    text_ar: "في عيد الفصح اليهودي عام 1968 أقامت مجموعة يقودها الحاخام موشيه ليفنغر في فندق وسط الخليل دون إذن من الحكومة، ثم انتقل أفرادها إلى معسكر قريب لجيش الاحتلال. وبدأت مستوطنة كريات أربع، التي أُسّست قرب المدينة عام 1968، بمصادرة أرض فلسطينية رسميًّا لإقامة قاعدة عسكرية. وتسجّل محاضر اجتماع عُقد في تموز 1970 في مكتب وزير الدفاع موشيه دايان أن البيوت ستُبنى هناك «لأغراض عسكرية» ثم تُسلَّم إلى مدنيين إسرائيليين."
