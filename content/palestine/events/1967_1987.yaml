  - id: e1980_07_jerusalem_law
    title: "The Jerusalem Law"
    title_ar: "قانون القدس"
    text: "On 30 July 1980 the Knesset passed the Jerusalem Law, declaring \"Jerusalem, complete and united\" the capital of Israel. On 20 August the UN Security Council, in Resolution 478, adopted by 14 votes to none with the United States abstaining, declared the law null and void and called on states with diplomatic missions in al-Quds (Jerusalem) to withdraw them; most of the states with embassies there moved them to Tel Aviv and its suburbs."
    text_ar: "في 30 تموز 1980 أقرّ الكنيست «قانون القدس» الذي أعلن «القدس الكاملة والموحّدة» عاصمةً لإسرائيل. وفي 20 آب عدّ مجلس الأمن الدولي في قراره 478، بأغلبية 14 صوتًا دون معارضة وامتناع الولايات المتحدة، القانونَ لاغيًا وباطلًا، ودعا الدول التي لها بعثات دبلوماسية في القدس إلى سحبها، فنقلت معظم الدول التي كانت لها سفارات في المدينة سفاراتها إلى تل أبيب وضواحيها."
    scope: "national"
    place: jerusalem
    from: 1980-07-01
