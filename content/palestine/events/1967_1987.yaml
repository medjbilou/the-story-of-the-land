  - id: e1967_06_moroccan_quarter
    title: "The occupation levels the Moroccan Quarter"
    title_ar: "الاحتلال يهدم حارة المغاربة"
    text: "On the evening of 10 June 1967, the last day of the war, bulldozers began levelling the Moroccan (Maghariba) Quarter beside the Western Wall in the Old City of al-Quds (Jerusalem), on the direct orders, Jerusalem Story says, of the city's Israeli mayor, Teddy Kollek. The quarter had been endowed in 1193 by al-Afdal, a son of Saladin, for Muslims from North Africa. Residents were given minutes to leave, three hours in other accounts; about 135 houses, two mosques and a Sufi lodge were destroyed, and at least 650 people were made homeless. A woman of the quarter was pulled from the rubble and died that night, and the site became a wide plaza in front of the Wall."
    text_ar: "مساء 10 حزيران 1967، في آخر أيام الحرب، بدأت الجرّافات هدم حارة المغاربة الملاصقة لحائط البراق في القدس القديمة، بأمر مباشر من رئيس بلدية القدس الإسرائيلي تيدي كوليك بحسب موسوعة «جيروزالم ستوري». وكان الملك الأفضل ابن صلاح الدين قد وقَفَ الحارة عام 1193 على المسلمين القادمين من شمال إفريقيا. ولم يُعطَ السكان سوى دقائق للخروج، وثلاث ساعات في روايات أخرى، ثم هُدم نحو 135 بيتًا ومسجدان وزاوية، وشُرّد ما لا يقل عن 650 شخصًا. وانتُشلت امرأة من سكان الحارة من تحت الأنقاض فاستُشهدت في الليلة نفسها، وصار مكان الحارة ساحةً واسعة أمام الحائط."
