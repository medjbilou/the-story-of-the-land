  - id: e1982_06_lebanon
    title: "Lebanon invaded, Beirut besieged"
    title_ar: "اجتياح لبنان وحصار بيروت"
    text: "After almost a year of calm on the Lebanese border unprecedented since 1968, under the ceasefire of July 1981 (Israel claimed 270 PLO attacks in that time), Israeli aircraft struck Palestinian targets in Lebanon on 4 June 1982, bombing Sabra and Shatila for four hours; about 200 people were killed. On 6 June the Zionist army invaded Lebanon, citing the attempted assassination of Israel's ambassador in London on 3 June by the Abu Nidal group, a rival of the PLO. From mid-June it besieged West Beirut and cut off food, water and electricity. Lebanese police counted 19,085 killed from 4 June to 31 August, 6,775 of them in Beirut, 84 per cent of those civilians. Mahmoud Darwish wrote of the siege in Memory for Forgetfulness."
    text_ar: "في ظل وقف إطلاق النار المعقود في تموز 1981 عرفت الحدود اللبنانية قرابة عام من هدوء لم يُعرف مثله منذ 1968، وإن زعمت إسرائيل وقوع 270 هجومًا لمنظمة التحرير خلاله. ثم قصفت الطائرات الإسرائيلية في 4 حزيران 1982 أهدافًا فلسطينية في لبنان، منها مخيما صبرا وشاتيلا اللذان قُصفا أربع ساعات، فاستُشهد نحو 200 شخص. وفي 6 حزيران اجتاح الجيش الصهيوني لبنان، متذرّعًا بمحاولة اغتيال السفير الإسرائيلي في لندن في 3 حزيران على يد جماعة أبو نضال المناوئة لمنظمة التحرير. ومنذ منتصف حزيران حاصر بيروت الغربية وقطع عنها الطعام والماء والكهرباء. وأحصت الشرطة اللبنانية 19,085 قتيلًا بين 4 حزيران و31 آب، منهم 6775 في بيروت كان 84 في المئة منهم مدنيين. وقد كتب محمود درويش عن ذلك الحصار كتابه «ذاكرة للنسيان»."
