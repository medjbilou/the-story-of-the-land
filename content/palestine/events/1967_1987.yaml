  - id: e1967_11_res242
    title: "Resolution 242"
    title_ar: "القرار 242"
    text: "On 22 November 1967 the UN Security Council unanimously adopted Resolution 242. It stressed the inadmissibility of acquiring territory by war and called for the withdrawal of Israeli forces \"from territories occupied in the recent conflict\" and for a \"just settlement of the refugee problem\", without naming the Palestinians. The next day the PLO rejected it as gravely inconsistent with the Palestinian people's right to self-determination."
    text_ar: "في 22 تشرين الثاني 1967 أقرّ مجلس الأمن الدولي بالإجماع القرار 242، الذي أكّد عدم جواز الاستيلاء على الأراضي بالحرب، ودعا إلى انسحاب القوات الإسرائيلية «من أراضٍ احتلّتها في النزاع الأخير» وإلى «تسوية عادلة لمشكلة اللاجئين»، دون أن يذكر الفلسطينيين بالاسم. وفي اليوم التالي رفضته منظمة التحرير الفلسطينية لتعارضه الجوهري مع حق الشعب الفلسطيني في تقرير مصيره."
    scope: "national"
