  - id: e1969_08_aqsa_fire
    title: "Al-Aqsa Mosque set on fire"
    title_ar: "حريق المسجد الأقصى"
    text: "On the morning of 21 August 1969 an Australian, Denis Michael Rohan, set fire to al-Aqsa Mosque. The blaze destroyed the twelfth-century minbar of Saladin and much of the mosque's south-eastern part. Al Jazeera's encyclopedia says the occupation cut off water to the Qibli prayer hall and was slow to send fire engines, so Palestinians fought the flames with their clothes and the mosque's well water. Anger swept the Muslim world and the fire became a key catalyst for the Organisation of Islamic Cooperation; Rohan was found insane and sent to a mental hospital."
    text_ar: "صباح 21 آب 1969 أضرم الأسترالي دينيس مايكل روهان النار في المسجد الأقصى، فأتت على منبر صلاح الدين الذي يعود إلى القرن الثاني عشر وعلى جزء كبير من الجهة الجنوبية الشرقية للمسجد. وتذكر موسوعة الجزيرة أن الاحتلال قطع الماء عن المصلى القبلي ومحيطه وتباطأ في إرسال سيارات الإطفاء، فهرع الفلسطينيون إلى إطفاء النيران بملابسهم وبمياه آبار المسجد. وعمّ الغضب العالمَ الإسلامي، وكان الحريق من أبرز ما دفع إلى إنشاء منظمة المؤتمر الإسلامي (منظمة التعاون الإسلامي اليوم)، أما روهان فقضت المحكمة بأنه مختلّ عقليًّا، فأُودع مصحّة."
