  - id: e1985_10_hammam_chott
    title: "The bombing of Hammam Chott"
    title_ar: "قصف حمّام الشط"
    text: "On 1 October 1985 Israeli F-15s, refuelled in mid-air, flew some 2,000 km to bomb the PLO headquarters at Hammam Chott, near Tunis. The Zionist government cited the killing of three Israelis on a yacht in Larnaca on 25 September, which PLO officials denied. Counts of the dead range from 47 (hospital sources) to 71 (the writer Patrick Seale: 56 Palestinians and 15 Tunisians); Israel claimed about 60 PLO members killed. Arafat was not there. Israel had obtained the intelligence on Tunisia's air defences through Jonathan Pollard, a US Navy analyst spying for it. On 4 October the Security Council condemned the raid as a flagrant violation of the UN Charter, with the United States abstaining."
    text_ar: "في 1 تشرين الأول 1985 قطعت طائرات إسرائيلية من طراز إف-15، تزوّدت بالوقود في الجو، نحو 2000 كيلومتر لتقصف مقرّ منظمة التحرير في حمّام الشط قرب تونس. وتذرّعت الحكومة الصهيونية بقتل ثلاثة إسرائيليين على يخت في لارنكا في 25 أيلول، وقد نفى مسؤولون في المنظمة صلتها بذلك. وتتراوح أعداد الشهداء بين 47 بحسب مصادر المستشفيات و71 بحسب الكاتب باتريك سيل (56 فلسطينيًّا و15 تونسيًّا)، فيما زعمت إسرائيل أنها قتلت نحو 60 من أعضاء المنظمة. ولم يكن عرفات في المقرّ. وكانت إسرائيل قد حصلت على معلومات الدفاعات الجوية التونسية عن طريق جوناثان بولارد، المحلّل في البحرية الأمريكية الذي كان يتجسّس لصالحها. وفي 4 تشرين الأول دان مجلس الأمن الغارة بوصفها انتهاكًا صارخًا لميثاق الأمم المتحدة، مع امتناع الولايات المتحدة عن التصويت."
