  - id: e1982_08_plo_departs
    title: "The PLO leaves Beirut"
    title_ar: "الخروج من بيروت"
    text: "Under a ceasefire negotiated through the US envoy Philip Habib, the PLO agreed to leave Beirut. French paratroopers arrived on 21 August 1982 to oversee the evacuation; about 8,500 fighters went to Tunisia and some 2,500 overland to other Arab countries, and Arafat left by way of Greece for Tunis, where the PLO set up its new headquarters. The United States and the multinational force gave assurances that the refugees and civilians left behind would be protected."
    text_ar: "بموجب وقف لإطلاق النار تفاوض عليه المبعوث الأمريكي فيليب حبيب، وافقت منظمة التحرير على مغادرة بيروت. ووصل مظليون فرنسيون في 21 آب 1982 للإشراف على الإجلاء، فتوجّه نحو 8500 مقاتل إلى تونس ونحو 2500 برًّا إلى بلدان عربية أخرى، وغادر عرفات عبر اليونان إلى تونس حيث أقامت المنظمة مقرّها الجديد. وقدّمت الولايات المتحدة والقوة المتعددة الجنسيات ضمانات بحماية اللاجئين والمدنيين الباقين."
