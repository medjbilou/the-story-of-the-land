    text_ar: "على أرض {village_ar} أقام الصندوق القومي اليهودي «متنزّه كندا»، بأموال جمعها في كندا، وأقيمت على جزء من أراضي بيت نوبا مستوطنة مِفو حورون عام 1970. وما زالت العائلة تحفظ اسم القرية وحدود حقولها."
