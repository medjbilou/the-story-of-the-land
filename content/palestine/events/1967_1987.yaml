  - id: e1971_02_darwish
    title: "Mahmoud Darwish in exile"
    title_ar: "محمود درويش في المنفى"
    text: "Mahmoud Darwish, born in al-Birwa in 1941, had fled to Lebanon as a child before his family came back and settled in Deir al-Asad, and his poem \"Identity Card\" (1964), with its refrain \"Write down! I am an Arab\", had become one of the best-known poems of the occupied land. The Israeli authorities arrested him several times from 1961, last in 1969, and more than once placed him under house arrest. In 1970 he left to study in Moscow, and in February 1971 he moved to Cairo, having decided not to return. When he joined the PLO in Beirut in 1973, the Zionist government barred him from returning."
    text_ar: "كان محمود درويش، المولود في البروة عام 1941، قد لجأ طفلًا مع عائلته إلى لبنان قبل أن تعود وتستقر في دير الأسد، وصارت قصيدته «بطاقة هوية» (1964)، بلازمتها «سجّل! أنا عربي»، من أشهر قصائد الأرض المحتلة. واعتقلته السلطات الإسرائيلية مرات عدة منذ عام 1961، كان آخرها عام 1969، وفرضت عليه الإقامة الجبرية أكثر من مرة. وفي عام 1970 غادر إلى موسكو للدراسة، ثم انتقل في شباط 1971 إلى القاهرة عازمًا على ألّا يعود. ولمّا انضمّ عام 1973 إلى منظمة التحرير الفلسطينية في بيروت منعته حكومة الاحتلال من العودة."
