  - id: e1980_09_gallery79
    title: "Gallery 79 and the watermelon"
    title_ar: "غاليري 79 والبطيخة"
    text: "In 1980 the occupation army closed an exhibition by Sliman Mansour, Nabil Anani and Issam Badr at Gallery 79 in Ramallah three hours after it opened. Two weeks later the artists were summoned and told that painting the flag was forbidden, and its colours too; when Badr asked about a flower in red, green, black and white, the officer replied that even a painted watermelon would be confiscated. Mansour always stressed that the watermelon came from the officer, not the artists, while Anani's own account dates a closure to 1981. Displaying the flag had been banned since 1967 and could mean prison."
    text_ar: "في عام 1980 أغلق جيش الاحتلال معرضًا لسليمان منصور ونبيل عناني وعصام بدر في «غاليري 79» برام الله بعد ثلاث ساعات من افتتاحه. وبعد أسبوعين استُدعي الفنانون وقيل لهم إن رسم العلم ممنوع، بل ألوانه أيضًا، ولمّا سأل بدر عن زهرة بالأحمر والأخضر والأسود والأبيض ردّ الضابط بأنهم سيصادرون حتى البطيخة المرسومة. وقد أكّد منصور أن فكرة البطيخة جاءت من الضابط لا من الفنانين، أما عناني فيؤرّخ في روايته إغلاقًا عام 1981. وكان رفع العلم محظورًا منذ 1967، وقد يكلّف صاحبه السجن."
