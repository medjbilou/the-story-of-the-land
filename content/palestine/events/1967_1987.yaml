  - id: e1983_02_kahan
    title: "The Kahan report"
    title_ar: "تقرير لجنة كاهان"
    text: "In February 1983 Israel's Kahan Commission found that Israel bore \"indirect\" responsibility for Sabra and Shatila and that Defence Minister Ariel Sharon was personally responsible for ignoring the danger of bloodshed and revenge. An international commission chaired by the Irish diplomat Seán MacBride found instead that Israel, as the occupying power, bore responsibility, and called the massacre a form of genocide. Sharon resigned as defence minister but stayed in the cabinet as a minister without portfolio. No Lebanese or Israeli fighter or official was ever punished for the massacre."
    text_ar: "في شباط 1983 خلصت لجنة كاهان الإسرائيلية إلى أن إسرائيل تتحمّل مسؤولية «غير مباشرة» عن مجزرة صبرا وشاتيلا، وأن وزير الدفاع أرييل شارون يتحمّل مسؤولية شخصية لتجاهله خطر سفك الدماء والانتقام. أما اللجنة الدولية التي ترأسها الدبلوماسي الإيرلندي شون ماكبرايد فخلصت إلى أن إسرائيل، بصفتها قوة الاحتلال، تتحمّل المسؤولية، ووصفت المجزرة بأنها شكل من أشكال الإبادة الجماعية. واستقال شارون من وزارة الدفاع لكنه بقي في الحكومة وزيرًا بلا حقيبة. ولم يُعاقَب أيّ مقاتل أو مسؤول لبناني أو إسرائيلي على المجزرة."
