  - id: e1967_09_first_settlement
    title: "The first settlements"
    title_ar: "أولى المستوطنات"
    text: "From September 1967 the Labour-led Zionist government of Levi Eshkol began encouraging Jewish settlement in the occupied territories; the first settlement was Kfar Etzion in the southern West Bank. The government went ahead although its Foreign Ministry legal adviser, Theodor Meron, had written that civilian settlement there would breach the explicit terms of the Fourth Geneva Convention, which forbids an occupier to transfer its own civilians into the land it occupies; his opinion was not made public at the time. The Allon Plan of that period in effect meant annexing large areas, among them East al-Quds (East Jerusalem), Gush Etzion and the Jordan Valley."
    text_ar: "ابتداءً من أيلول 1967 أخذت حكومة حزب العمل الصهيونية برئاسة ليفي إشكول تشجّع الاستيطان اليهودي في الأراضي المحتلة، وكانت أولى المستوطنات كفار عتصيون في جنوب الضفة الغربية. ومضت الحكومة في ذلك مع أن المستشار القانوني لوزارة خارجيتها، ثيودور ميرون، كتب أن الاستيطان المدني هناك يخالف صراحةً اتفاقية جنيف الرابعة التي تحظر على دولة الاحتلال نقل سكانها المدنيين إلى الأرض التي تحتلها، وظلّ رأيه طيّ الكتمان آنذاك. وكانت خطة ألون في تلك المرحلة تقضي عمليًّا بضمّ أجزاء واسعة، منها القدس الشرقية وغوش عتصيون وغور الأردن."
    scope: "national"
