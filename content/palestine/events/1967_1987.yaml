  - id: e1983_07_islamic_college
    title: "The attack on the Islamic College"
    title_ar: "الهجوم على الكلية الإسلامية"
    text: "On 26 July 1983 three gunmen of the Zionist settler underground opened fire on students at the Islamic College in al-Khalil (Hebron) and threw a grenade into a corridor, killing three people and wounding 33. In April 1984 the Shin Bet caught members of the same group just after they had fixed bombs under five Arab buses in East al-Quds (East Jerusalem), timed to go off that afternoon when the buses would be full of worshippers returning from the Isra and Mi'raj. The three gunmen were sentenced to life, then had their sentences commuted and were freed in 1990."
    text_ar: "في 26 تموز 1983 أطلق ثلاثة مسلحين من التنظيم السري الصهيوني للمستوطنين النار على طلاب الكلية الإسلامية في الخليل وألقوا قنبلة يدوية في أحد ممراتها، فاستُشهد ثلاثة أشخاص وجُرح 33. وفي نيسان 1984 اعتقل جهاز الشاباك أفرادًا من التنظيم نفسه فور تثبيتهم قنابل تحت خمس حافلات عربية في القدس الشرقية، وُقّتت لتنفجر بعد الظهر حين تكون مكتظة بالمصلّين العائدين من إحياء ذكرى الإسراء والمعراج. وحُكم على المسلحين الثلاثة بالمؤبد، ثم خُفّفت أحكامهم وأُطلق سراحهم عام 1990."
