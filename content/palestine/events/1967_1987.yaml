  - id: e1987_08_naji_dies
    title: "Naji al-Ali dies"
    title_ar: "رحيل ناجي العلي"
    text: "Naji al-Ali died in Charing Cross Hospital in London on 29 August 1987, after five weeks in a coma. His will asked that he be buried in Ain al-Hilweh camp beside his father, but that could not be arranged, and he lies in Brookwood Islamic Cemetery outside London. His killing has never been solved. British police found that Ismail Sowan, a Palestinian arrested in 1987, was a Mossad double agent inside the PLO's Force 17, which he blamed; because the Mossad had hidden what it knew from British intelligence, Margaret Thatcher's government expelled Israeli diplomats and closed the Mossad's London base. The weapon was found in 1989 and British police reopened the case in 2017."
    text_ar: "تُوفي ناجي العلي في مستشفى تشارينغ كروس بلندن في 29 آب 1987 بعد خمسة أسابيع في الغيبوبة. وكان قد أوصى بأن يُدفن في مخيم عين الحلوة إلى جانب أبيه، لكن ذلك تعذّر، فدُفن في مقبرة بروكوود الإسلامية خارج لندن. ولم تُكشف ملابسات اغتياله حتى اليوم. وقد تبيّن للشرطة البريطانية أن الفلسطيني إسماعيل صوان، الذي اعتُقل عام 1987، عميل مزدوج للموساد داخل «القوة 17» التابعة لمنظمة التحرير، وقد اتّهم صوان هذه القوة باغتياله، غير أن إخفاء الموساد ما يعرفه عن الاستخبارات البريطانية دفع حكومة مارغريت تاتشر إلى طرد دبلوماسيين إسرائيليين وإغلاق مقرّ الموساد في لندن. وعُثر على السلاح عام 1989، وأعادت الشرطة البريطانية فتح التحقيق عام 2017."
