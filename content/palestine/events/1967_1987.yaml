  - id: e1983_12_settlers
    title: "The settlements spread"
    title_ar: "الاستيطان يتّسع"
    text: "By 1983 the settler population of the West Bank outside East al-Quds (East Jerusalem) had grown from 1,182 in 1972 to 22,800, about seven times the 3,200 of 1977, when Menachem Begin's Likud government took office; that same year, 1977, Ariel Sharon spoke of a plan to settle two million Jews in the West Bank by 2000. From 1979 the Zionist government said it would build or extend settlements only on what it counted as \"state land\", and the Drobles Plan of 1978 became the framework of its settlement policy. In Gaza the occupation government confiscated about 11,500 acres (some 46,000 dunams) for settlements between 1978 and 1985."
    text_ar: "بحلول عام 1983 ارتفع عدد المستوطنين في الضفة الغربية، دون القدس الشرقية، من 1182 عام 1972 إلى 22,800، أي نحو سبعة أضعاف عددهم عام 1977 (3200) حين وصلت حكومة الليكود برئاسة مناحيم بيغن إلى الحكم، وفي العام نفسه، 1977، تحدّث أرييل شارون عن خطة لإسكان مليوني يهودي في الضفة الغربية بحلول عام 2000. ومنذ عام 1979 قرّرت الحكومة الصهيونية ألّا تبني المستوطنات أو توسّعها إلا على ما تعدّه «أراضي دولة»، وصارت خطة دروبلس (1978) إطارًا لسياستها الاستيطانية. وفي غزة صادرت حكومة الاحتلال بين عامي 1978 و1985 نحو 46 ألف دونم لصالح المستوطنات."
    scope: "national"
    from: 1983-12-01
    to: 1984-01-01
