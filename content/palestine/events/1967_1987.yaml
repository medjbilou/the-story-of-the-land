  - id: e1982_09_sabra_shatila
    title: "The Sabra and Shatila massacre"
    title_ar: "مجزرة صبرا وشاتيلا"
    text: "The multinational force left Beirut early, on 10 September 1982. After Lebanon's president-elect Bashir Gemayel was assassinated on 14 September, Israeli forces entered West Beirut, sealed off the Sabra and Shatila camps and let in the Phalangist Lebanese Forces militia under Elie Hobeika, whose men gathered at Beirut airport, held by the Israeli army, and drove in on Israeli-supplied jeeps. They killed refugees and Lebanese civilians from 6 pm on 16 September to 1 pm on 18 September while Israeli flares lit the camps at night. The toll depends on who counted: 700–800 claimed by Israeli military intelligence, 460 by a Lebanese army prosecutor, over 2,000 by the Palestinian Red Crescent, and 3,000–3,500 by the journalist Amnon Kapeliouk. On 16 December 1982 the UN General Assembly condemned the massacre as \"an act of genocide\"."
    text_ar: "غادرت القوة المتعددة الجنسيات بيروت قبل موعدها، في 10 أيلول 1982. وبعد اغتيال الرئيس اللبناني المنتخب بشير الجميّل في 14 أيلول دخل جيش الاحتلال بيروت الغربية وطوّق مخيمي صبرا وشاتيلا وسمح بدخول ميليشيا القوات اللبنانية الكتائبية بقيادة إيلي حبيقة، التي تجمّع عناصرها في مطار بيروت الخاضع للجيش الصهيوني وتقدّموا في سيارات جيب زوّدهم بها ذلك الجيش، فقتلوا لاجئين ومدنيين لبنانيين من السادسة مساء 16 أيلول حتى الواحدة ظهر 18 أيلول، فيما كانت القنابل المضيئة الإسرائيلية تنير المخيمين ليلًا. ويختلف عدد الشهداء باختلاف من أحصاهم: 700–800 بحسب ما زعمته الاستخبارات العسكرية الإسرائيلية، و460 بحسب مدّعٍ عام في الجيش اللبناني، وأكثر من 2000 بحسب الهلال الأحمر الفلسطيني، و3000–3500 بحسب الصحفي أمنون كابليوك. وفي 16 كانون الأول 1982 دانت الجمعية العامة للأمم المتحدة المجزرة وعدّتها عملًا من أعمال الإبادة الجماعية."
