  - id: e1972_07_kanafani
    title: "Ghassan Kanafani assassinated"
    title_ar: "اغتيال غسان كنفاني"
    text: "On 8 July 1972 a bomb planted in Ghassan Kanafani's car in Beirut killed him and his 17-year-old niece, Lamees Najim. Born in 'Akka (Acre) in 1936 and driven out with his family in 1948, Kanafani was a novelist, editor of the weekly al-Hadaf and spokesman of the PFLP; his novella Men in the Sun ends with the question \"Why didn't you knock on the sides of the tank?\" He was the first to call Palestinian writing \"resistance literature\", and his killing is attributed to Israel's Mossad."
    text_ar: "في 8 تموز 1972 انفجرت قنبلة زُرعت في سيارة غسان كنفاني في بيروت، فاستُشهد مع ابنة أخته لميس نجم ذات السبعة عشر عامًا. وُلد كنفاني في عكا عام 1936 وهُجّر مع عائلته عام 1948، وكان روائيًّا ورئيس تحرير مجلة «الهدف» الأسبوعية والناطق باسم الجبهة الشعبية لتحرير فلسطين، وتنتهي روايته «رجال في الشمس» بالسؤال: «لماذا لم تدقّوا جدران الخزان؟» وهو أول من وصف الكتابة الفلسطينية بـ«أدب المقاومة»، ويُنسب اغتياله إلى جهاز الموساد الإسرائيلي."
    scope: "national"
