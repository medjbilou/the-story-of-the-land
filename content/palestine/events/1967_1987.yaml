  - id: e1967_06_naksa
    title: "The Naksa"
    title_ar: "النكسة"
    text: "On 5 June 1967 Israel opened the war with a surprise air attack on Egypt's airfields, and by 10 June the Zionist army had occupied the West Bank including East al-Quds (East Jerusalem), the Gaza Strip, the Golan Heights and Sinai. Around 300,000 Palestinians were displaced, most of them to the East Bank of the Jordan; estimates run from 280,000 to 325,000, and the historian David McDowall counts about 145,000 of them as 1948 refugees uprooted for a second time. Palestinians call the defeat al-Naksa, \"the setback\"."
    text_ar: "في 5 حزيران 1967 بدأت إسرائيل الحرب بهجوم جوي مفاجئ على المطارات المصرية، وبحلول 10 حزيران كان الجيش الصهيوني قد احتلّ الضفة الغربية بما فيها القدس الشرقية، وقطاع غزة، ومرتفعات الجولان، وشبه جزيرة سيناء. ونزح نحو 300 ألف فلسطيني، أكثرهم إلى الضفة الشرقية لنهر الأردن، وتتراوح التقديرات بين 280 و325 ألفًا، ويحصي المؤرخ ديفيد ماكدويل بينهم نحو 145 ألف لاجئ من عام 1948 اقتُلعوا للمرة الثانية. ويسمّي الفلسطينيون تلك الهزيمة «النكسة»."
