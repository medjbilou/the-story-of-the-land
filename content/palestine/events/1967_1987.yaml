  - id: e1974_11_arafat_un
    title: "Arafat at the United Nations"
    title_ar: "عرفات في الأمم المتحدة"
    text: "On 13 November 1974 Yasser Arafat addressed the UN General Assembly, the first representative of a non-governmental organisation to speak at a plenary session: \"Today I have come bearing an olive branch and a freedom fighter's gun. Do not let the olive branch fall from my hand.\" On 22 November the Assembly adopted Resolution 3236 by 89 votes to 8, with 37 abstentions, recognising the Palestinian people's rights to self-determination, to national independence and sovereignty, and to return to their homes and property. Earlier that year the Arab summit in Rabat had recognised the PLO as the sole legitimate representative of the Palestinian people."
    text_ar: "في 13 تشرين الثاني 1974 ألقى ياسر عرفات كلمة أمام الجمعية العامة للأمم المتحدة، فكان أول ممثل لمنظمة غير حكومية يخاطبها في جلسة عامة، وقال إنه جاء يحمل بندقية الثائر في يد وغصن الزيتون في الأخرى، ثم قال: «فلا تُسقطوا الغصن الأخضر من يدي». وفي 22 تشرين الثاني أقرّت الجمعية القرار 3236 بأغلبية 89 صوتًا مقابل 8 وامتناع 37، فاعترفت بحق الشعب الفلسطيني في تقرير مصيره، وفي الاستقلال والسيادة الوطنيين، وفي العودة إلى دياره وممتلكاته. وكانت قمة الرباط العربية قد اعترفت في العام نفسه بمنظمة التحرير ممثلًا شرعيًّا وحيدًا للشعب الفلسطيني."
    scope: "national"
    from: 1974-11-01
