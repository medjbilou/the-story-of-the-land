  - id: e1973_10_october_war
    title: "The October War"
    title_ar: "حرب تشرين"
    text: "In February 1971 Egypt told the UN mediator Gunnar Jarring it was ready to sign a peace agreement if Resolution 242 was carried out, the first Arab government to say so publicly; Prime Minister Golda Meir shelved her own committee's finding that full withdrawal would serve Israel's interests. On 6 October 1973 Egypt and Syria launched a surprise attack on the occupation forces in Sinai and the Golan, and PLO factions in Lebanon fought on the Arab side. Both sides accepted a UN-brokered ceasefire on 22 October that broke down the next day, and a second ceasefire ended the war on 25 October."
    text_ar: "في شباط 1971 أبلغت مصر وسيط الأمم المتحدة غونار يارنغ استعدادها لتوقيع اتفاق سلام إذا نُفّذ القرار 242، فكانت أول حكومة عربية تعلن ذلك، لكن رئيسة الوزراء الإسرائيلية غولدا مائير طوت تقرير لجنتها التي خلصت إلى أن الانسحاب الكامل يخدم مصالح إسرائيل. وفي 6 تشرين الأول 1973 شنّت مصر وسوريا هجومًا مفاجئًا على قوات الاحتلال في سيناء والجولان، وقاتلت فصائل من منظمة التحرير في لبنان إلى جانب مصر وسوريا. ووافق الطرفان على وقف لإطلاق النار برعاية الأمم المتحدة في 22 تشرين الأول، لكنه انهار في اليوم التالي، ثم أنهى وقفٌ ثانٍ الحرب في 25 تشرين الأول."
