  - id: e1970_09_black_september
    title: "Black September"
    title_ar: "أيلول الأسود"
    text: "In early September 1970 the PFLP hijacked passenger planes and on 12 September blew up those it had flown to a desert airstrip in Jordan, in front of the world's press. From 17 September the Jordanian army attacked the fedayeen; the main fighting lasted until 27 September, when Gamal Abdel Nasser brokered an agreement between King Hussein and Arafat in Cairo, a day before his own death. By 22 September Israel had readied its air force and was flying jets over the Syrian forces that had entered Jordan, while the US Sixth Fleet moved off the Palestinian coast. Estimates of Palestinians killed run from 2,000 to 3,400, and Arafat claimed 25,000; the Jordanian army lost 537 dead. By July 1971 the last fighters had been driven from the Ajloun and Jerash forests, and the PLO moved to Lebanon."
    text_ar: "في مطلع أيلول 1970 خطفت الجبهة الشعبية لتحرير فلسطين طائرات ركاب، ثم فجّرت في 12 أيلول ما هبط منها في مطار صحراوي بالأردن أمام عدسات الصحافة العالمية. وابتداءً من 17 أيلول هاجم الجيش الأردني الفدائيين، واستمر القتال الرئيسي حتى 27 أيلول حين رعى جمال عبد الناصر في القاهرة اتفاقًا بين الملك حسين وعرفات، قبل يوم واحد من وفاة عبد الناصر. وبحلول 22 أيلول كانت إسرائيل قد جهّزت سلاحها الجوي، وحلّقت طائراتها فوق القوات السورية التي دخلت الأردن، فيما تحرّك الأسطول السادس الأمريكي قبالة الساحل الفلسطيني. وتتراوح تقديرات عدد الفلسطينيين الذين قُتلوا بين 2000 و3400، وقال عرفات إنهم 25 ألفًا، فيما خسر الجيش الأردني 537 قتيلًا. وبحلول تموز 1971 أُخرج آخر المقاتلين من أحراج عجلون وجرش، وانتقلت منظمة التحرير إلى لبنان."
