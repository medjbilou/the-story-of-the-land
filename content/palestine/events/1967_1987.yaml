    text: "This month soldiers of the occupation army ordered the people of {village_en} out of their homes, and loudspeakers told them to walk to Ramallah. The family carries what it can, not knowing that roadblocks will close the way back."
    text_ar: "في هذا الشهر أمر جنود الاحتلال أهل {village_ar} بمغادرة بيوتهم، ونادت مكبّرات الصوت بأن يسيروا إلى رام الله. وتحمل العائلة ما تقدر على حمله، دون أن تعلم أن الحواجز ستغلق عليها طريق العودة."
