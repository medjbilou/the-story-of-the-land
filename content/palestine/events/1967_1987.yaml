  - id: e1980_06_mayors
    title: "The mayors' car bombs"
    title_ar: "تفجير سيارات رؤساء البلديات"
    text: "On 2 June 1980 a Zionist settler underground planted bombs in the cars of West Bank mayors elected in 1976, when supporters of the PLO had won most town councils: Bassam Shakaa of Nablus lost both legs and Karim Khalaf of Ramallah lost a leg. The bomb in the car of al-Bireh's mayor, Ibrahim Tawil, exploded while it was being defused, blinding an Israeli Druze police sapper. Members of the group were arrested in 1984, and with them two officers of the occupation army, one of them charged with planting car bombs; those sentenced to life had their sentences commuted and were freed in 1990."
    text_ar: "في 2 حزيران 1980 زرع تنظيم سرّي صهيوني من المستوطنين قنابل في سيارات رؤساء بلديات في الضفة الغربية انتُخبوا عام 1976، حين فاز أنصار منظمة التحرير بمعظم المجالس البلدية، فبُترت ساقا بسام الشكعة رئيس بلدية نابلس، وفقد كريم خلف رئيس بلدية رام الله إحدى ساقيه. أما العبوة التي وُضعت في سيارة إبراهيم الطويل رئيس بلدية البيرة فانفجرت أثناء تفكيكها وأفقدت خبير متفجرات درزيًّا في الشرطة الإسرائيلية بصره. واعتُقل أعضاء التنظيم عام 1984، ومعهم ضابطان في جيش الاحتلال اتُّهم أحدهما بزرع قنابل في السيارات، ثم خُفّفت أحكام المؤبد الصادرة على بعضهم فأُطلق سراحهم عام 1990."
