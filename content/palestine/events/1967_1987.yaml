  - id: e1978_12_sumud_fund
    title: "The Steadfastness Fund"
    title_ar: "صندوق الصمود"
    text: "In 1978 the Arab summit in Baghdad set up a Steadfastness (Sumud) Fund, run by a Jordanian–Palestinian Joint Committee, to help Palestinians stay on their land. Since 1967 sumud had become a strategy in the West Bank and Gaza, its ideal the peasant who stays on his land and its emblem the olive tree. By the late 1970s it was described as a third way between submission and exile, and in 1982 the lawyer Raja Shehadeh gave his book on it that title, The Third Way."
    text_ar: "في عام 1978 أنشأت القمة العربية في بغداد صندوقًا لدعم الصمود تديره لجنة أردنية فلسطينية مشتركة، لمساعدة الفلسطينيين على البقاء في أرضهم. فمنذ عام 1967 صار الصمود استراتيجية في الضفة الغربية وغزة، مثالها الفلاح الذي لا يغادر أرضه ورمزها شجرة الزيتون. ووُصف في أواخر السبعينيات بأنه طريق ثالث بين الخضوع والمنفى، وبهذا العنوان، «الطريق الثالث»، نشر المحامي رجا شحادة كتابه عنه عام 1982."
    scope: "national"
