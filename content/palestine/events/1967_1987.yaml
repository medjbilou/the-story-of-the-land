  - id: e1967_06_latrun
    title: "Imwas, Yalo and Beit Nuba"
    title_ar: "عمواس ويالو وبيت نوبا"
    text: "In June 1967 the occupation army ordered the people of Imwas, Yalo and Beit Nuba in the Latrun salient out of their homes, and loudspeakers told them to walk to Ramallah. About 8,000 people were expelled, by the historian Tom Segev's count; Ahmad Abughoush, head of the Imwas villagers' committee, told BADIL that thirteen old people who could not walk stayed behind and were never heard of again. Those who tried to return a week later were stopped at army roadblocks while the army blew up and bulldozed the villages; in Yalo alone 539 houses were destroyed. In 1968 the Israeli embassy in London claimed the damage was done in fighting with Egyptian commando units. In 1973 the Jewish National Fund of Canada raised money to lay out a picnic park on the land, now called Canada Park."
    text_ar: "في حزيران 1967 أمر جيش الاحتلال أهالي عمواس ويالو وبيت نوبا في منطقة اللطرون بمغادرة بيوتهم، ونادت فيهم مكبّرات الصوت بأن يسيروا إلى رام الله. وطُرد نحو 8000 شخص بحسب المؤرخ توم سيغف، وروى أحمد أبو غوش، رئيس لجنة أهالي عمواس، لمركز «بديل» أن ثلاثة عشر مسنًّا عجزوا عن المشي بقوا في القرية ولم يُعرف عنهم شيء بعد ذلك. ومن حاول العودة بعد نحو أسبوع أوقفته الحواجز العسكرية بينما كان الجيش ينسف القرى ويجرفها، وقد هُدم في يالو وحدها 539 بيتًا. وزعمت السفارة الإسرائيلية في لندن عام 1968 أن الدمار وقع أثناء القتال مع وحدات كوماندوس مصرية. وفي عام 1973 جمع الصندوق القومي اليهودي في كندا الأموال لإقامة متنزّه على أراضيها يُعرف اليوم بـ«متنزّه كندا»."
