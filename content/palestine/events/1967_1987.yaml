  - id: e1974_11_birzeit
    title: "Birzeit's president exiled"
    title_ar: "إبعاد رئيس بيرزيت"
    text: "In November 1974 the occupation authorities deported Hanna Nasir, president of Birzeit College, which he was turning into a university. He kept running it from Amman, and in 1975 it was renamed Birzeit University; he was not allowed back until May 1993. The Israeli army forcibly closed the university fifteen times between 1973 and 1992. The institution had begun in 1924 as a girls' school founded by Nabiha Nasir."
    text_ar: "في تشرين الثاني 1974 أبعدت سلطات الاحتلال حنا ناصر، رئيس كلية بيرزيت التي كان يعمل على تحويلها إلى جامعة. فواصل إدارتها من عمّان، وفي عام 1975 صار اسمها جامعة بيرزيت، ولم يُسمح له بالعودة إلا في أيار 1993. وقد أغلق جيش الاحتلال الجامعة بالقوة خمس عشرة مرة بين عامي 1973 و1992. وكانت المؤسسة قد بدأت عام 1924 مدرسةً للبنات أسّستها نبيهة ناصر."
