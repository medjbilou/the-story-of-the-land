  - id: e1970_03_tatreez
    title: "The dress and the needle"
    title_ar: "الثوب والتطريز"
    text: "After 1948, and especially after 1967, women in the refugee camps kept embroidering, and each village's own patterns gave way to a shared \"Palestinian\" style, such as the dress of the 1960s with six wide bands of embroidery running down from the waist. Welfare and income projects in the camps and the occupied territories carried tatreez onto bags and purses as well as dresses. Among them was In'ash al-Usra, which Samiha Khalil founded in her garage in 1965 and which grew into the largest Palestinian welfare organisation."
    text_ar: "بعد النكبة، وخصوصًا بعد عام 1967، واصلت النساء في المخيمات التطريز، وأفسحت نقوش كل قرية المجال لطراز «فلسطيني» جامع، منه ثوب ظهر في الستينيات تنزل فيه من الخصر ستة أشرطة عريضة من التطريز. ونقلت مشاريع الرعاية الاجتماعية وتوليد الدخل في المخيمات والأراضي المحتلة التطريز إلى الحقائب والمحافظ إلى جانب الأثواب. ومن هذه المشاريع جمعية إنعاش الأسرة التي أسّستها سميحة خليل في مرآب بيتها عام 1965، فصارت أكبر منظمة اجتماعية فلسطينية."
