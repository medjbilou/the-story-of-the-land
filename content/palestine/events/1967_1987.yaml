  - id: e1981_12_golan
    title: "The Golan Heights Law"
    title_ar: "قانون الجولان"
    text: "On 14 December 1981 the Knesset passed the Golan Heights Law by 63 votes to 21, applying Israeli law, jurisdiction and administration to the Syrian territory occupied since 1967. Three days later the Security Council unanimously declared it \"null and void and without international legal effect\" in Resolution 497. The leaders of the Syrian Druze of the Golan wrote to Menachem Begin that they were \"first of all Syrian Arabs\", and in 1982 they held a five-month general strike, during which the occupation army blockaded their towns."
    text_ar: "في 14 كانون الأول 1981 أقرّ الكنيست «قانون الجولان» بأغلبية 63 صوتًا مقابل 21، فطبّق القانون والقضاء والإدارة الإسرائيلية على الأرض السورية المحتلة منذ 1967. وبعد ثلاثة أيام عدّه مجلس الأمن بالإجماع في قراره 497 لاغيًا وباطلًا ولا أثر قانونيًّا دوليًّا له. وكتب زعماء الدروز السوريين في الجولان إلى مناحيم بيغن أنهم عرب سوريون قبل كل شيء، ثم خاضوا عام 1982 إضرابًا عامًّا استمر خمسة أشهر، حاصر خلاله جيش الاحتلال بلداتهم."
    scope: "national"
