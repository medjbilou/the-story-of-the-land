  - id: e1976_03_land_day
    title: "Land Day"
    title_ar: "يوم الأرض"
    text: "On 11 March 1976 the Zionist government published a plan to expropriate about 20,000 dunams between Sakhnin and Arraba in the Galilee, some 6,300 of them Arab-owned, part of what scholars call the \"Judaisation of the Galilee\". Arab leaders, among them Tawfiq Ziad of the Rakah party, called a general strike and marches for 30 March. The government put Sakhnin, Arraba, Deir Hanna and other villages under curfew from the evening of 29 March, and at dawn troops, police and Border Guards with tanks and tracked vehicles raided Arab towns. Israeli army and police killed six unarmed demonstrators: five Palestinian citizens of Israel and Raafat al-Zuheiri, from Nur Shams refugee camp near Tulkarm in the West Bank, who was killed in Taybeh. The Institute for Palestine Studies' encyclopedia counts about fifty wounded and about 300 arrested; Al Jazeera puts the wounded at more than 100. Ever since, Palestinians everywhere mark 30 March as Land Day."
    text_ar: "في 11 آذار 1976 نشرت الحكومة الصهيونية خطة لمصادرة نحو 20 ألف دونم بين سخنين وعرابة في الجليل، منها نحو 6300 دونم يملكها عرب، ضمن ما يسمّيه باحثون «تهويد الجليل». فدعا قادة عرب، منهم توفيق زيّاد من حزب راكاح، إلى إضراب عام ومسيرات يوم 30 آذار. وفرضت الحكومة حظر التجوّل على سخنين وعرابة ودير حنا وقرى أخرى ابتداءً من مساء 29 آذار، وفجر اليوم التالي اقتحم الجنود ورجال الشرطة وحرس الحدود البلدات العربية بالدبابات والآليات المجنزرة. واستُشهد ستة من المتظاهرين العُزّل على أيدي قوات الجيش والشرطة الإسرائيلية، خمسة منهم من المواطنين الفلسطينيين في إسرائيل، والسادس رأفت الزهيري من مخيم نور شمس قرب طولكرم في الضفة الغربية، وقد استُشهد في الطيبة. وأحصت الموسوعة التفاعلية لمؤسسة الدراسات الفلسطينية نحو خمسين جريحًا ونحو 300 معتقل، فيما ذكرت الجزيرة أن الجرحى تجاوزوا المئة. ومنذ ذلك اليوم يُحيي الفلسطينيون في كل مكان 30 آذار يومًا للأرض."
