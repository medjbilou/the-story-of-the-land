  - id: e1973_05_camel
    title: "Camel of Hardships"
    title_ar: "جمل المحامل"
    text: "In 1973 the painter Sliman Mansour, born in Birzeit in 1947, painted Camel of Hardships (Jamal al-Mahamel): an old Palestinian man carrying al-Quds (Jerusalem) on his back. Widely reproduced as a poster, it became a symbol of sumud, steadfastness."
    text_ar: "في عام 1973 رسم الفنان سليمان منصور، المولود في بيرزيت عام 1947، لوحة «جمل المحامل»: رجل فلسطيني مسنّ يحمل القدس على ظهره. وانتشرت اللوحة على نطاق واسع ملصقًا، فصارت رمزًا للصمود."
