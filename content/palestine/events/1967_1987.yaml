  - id: e1968_03_karameh
    title: "The Battle of Karameh"
    title_ar: "معركة الكرامة"
    text: "On 21 March 1968 the occupation army crossed the Jordan River to destroy Fatah's bases in the Karameh refugee camp and capture Yasser Arafat. Fatah fighters and the Jordanian army, with its artillery, fought it for some fifteen hours, and the Israeli forces withdrew leaving tanks and vehicles behind, after their paratroopers had destroyed most of the camp. Sources differ on the dead: about 28–33 Israeli soldiers, 40–84 Jordanian soldiers and 100–200 Palestinian fighters. Karameh means \"dignity\" and the name became a symbol; Fatah said more than 5,000 volunteers applied to join within 48 hours."
    text_ar: "في 21 آذار 1968 عبرت قوات الاحتلال نهر الأردن لتدمير قواعد حركة فتح في مخيم الكرامة وأسر ياسر عرفات. فتصدّى لها مقاتلو فتح والجيش الأردني بمدفعيته نحو خمس عشرة ساعة، وانسحبت القوات الإسرائيلية تاركةً وراءها دبابات وآليات، بعد أن دمّر مظلّيوها معظم المخيم. وتختلف المصادر في أعداد من سقطوا: نحو 28–33 قتيلًا من الجنود الإسرائيليين، و40–84 شهيدًا من الجيش الأردني، و100–200 شهيد من المقاتلين الفلسطينيين. وصار اسم الكرامة رمزًا، وقالت فتح إن أكثر من 5000 متطوع تقدّموا للانضمام إليها خلال 48 ساعة."
