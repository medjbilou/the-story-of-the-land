  - id: e1976_08_tal_zaatar
    title: "Tal al-Zaatar camp"
    title_ar: "مخيم تل الزعتر"
    text: "From January 1976 Lebanese Christian militias of the Lebanese Front, led by the Phalange, blockaded Tal al-Zaatar refugee camp in Beirut, home to more than 30,000 people, most of them Palestinians; the full assault began in June, and food, medicine and water were cut off. The camp fell on 12 August 1976. As women and children were evacuated, Helena Cobban wrote, the Front's fighters picked out the men and youths they could spot for summary execution, and the camp was then bulldozed. Estimates of the dead differ: about 1,500 on the day it fell and some 2,200 over the whole siege (Cobban), 2,000–3,000 (other historians), and 4,280 including fighters (Yezid Sayigh). About 12,000 survivors were displaced."
    text_ar: "منذ كانون الثاني 1976 حاصرت ميليشيات مسيحية لبنانية من «الجبهة اللبنانية»، بقيادة حزب الكتائب، مخيم تل الزعتر في بيروت، وكان يسكنه أكثر من 30 ألف إنسان أكثرهم فلسطينيون، ثم بدأ الهجوم الشامل في حزيران وقُطع عن المخيم الطعام والدواء والماء. وسقط المخيم في 12 آب 1976. وكتبت الباحثة هيلينا كوبان أن مقاتلي الجبهة انتقوا، أثناء إجلاء النساء والأطفال، كل من استطاعوا رصده من الرجال والشبان لإعدامهم دون محاكمة، ثم جرفوا المخيم بالجرّافات. وتختلف تقديرات القتلى: نحو 1500 يوم سقوطه ونحو 2200 طوال الحصار بحسب كوبان، وما بين 2000 و3000 بحسب مؤرخين آخرين، و4280 مع المقاتلين بحسب يزيد صايغ. وهُجّر نحو 12 ألفًا من الناجين."
