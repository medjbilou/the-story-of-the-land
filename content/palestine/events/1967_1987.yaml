  - id: e1967_06_qalqilya
    title: "The occupation army tears down Qalqilya"
    title_ar: "جيش الاحتلال يهدم قلقيلية"
    text: "During the June 1967 war the occupation army's psychological warfare men came to Qalqilya at night with loudspeakers and, as an Israeli colonel told an official inquiry, warned residents that an Iraqi attack was about to hit the town; people left en masse. The UN representative Nils-Göran Gussing later reported that 850 of its roughly 2,000 houses had been demolished, and Defence Minister Moshe Dayan wrote in his memoirs that this amounted to \"collective punishment\"."
    text_ar: "خلال حرب حزيران 1967 جاء رجال وحدة الحرب النفسية في جيش الاحتلال إلى قلقيلية ليلًا بمكبّرات الصوت، وقالوا للسكان، بحسب شهادة عقيد إسرائيلي أمام لجنة تحقيق رسمية، إن هجومًا عراقيًّا وشيكًا سيضرب البلدة، فخرج الأهالي منها جماعاتٍ. وأفاد ممثل الأمم المتحدة نيلس-غوران غوسينغ لاحقًا بأن 850 بيتًا من أصل نحو 2000 في البلدة قد هُدمت، وكتب وزير الدفاع موشيه دايان في مذكراته أن ذلك كان «عقابًا جماعيًّا»."
    scope: "region:qalqilya"
