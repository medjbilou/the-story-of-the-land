  - id: e1969_10_handala
    title: "Handala is born"
    title_ar: "ولادة حنظلة"
    text: "In 1969 the cartoonist Naji al-Ali, a refugee from al-Shajara, between Tabariyya (Tiberias) and al-Nasira (Nazareth), who grew up in Ain al-Hilweh camp near Sidon, created Handala for the Kuwaiti paper al-Siyasa. Handala is a barefoot ten-year-old in ragged clothes, the age at which al-Ali was forced out of Palestine; from 1973 he is drawn with his back turned and his hands clasped behind him, rejecting solutions imposed from outside. It was Ghassan Kanafani who first published al-Ali's drawings, in the magazine al-Hurriya in 1961."
    text_ar: "في عام 1969 رسم ناجي العلي، اللاجئ من قرية الشجرة بين طبرية والناصرة، الذي نشأ في مخيم عين الحلوة قرب صيدا، شخصية حنظلة لصحيفة «السياسة» الكويتية. حنظلة طفل في العاشرة، حافي القدمين رثّ الثياب، وهي السنّ التي أُخرج فيها العلي من فلسطين، ومنذ عام 1973 صار يُرسم مديرًا ظهره عاقدًا يديه خلفه، رفضًا للحلول المفروضة من الخارج. وكان غسان كنفاني أول من نشر رسوم العلي، في مجلة «الحرية» عام 1961."
