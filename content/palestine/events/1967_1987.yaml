  - id: e1987_07_naji_al_ali
    title: "Naji al-Ali shot"
    title_ar: "إطلاق النار على ناجي العلي"
    text: "On 22 July 1987 the cartoonist Naji al-Ali was shot outside the London office of the Kuwaiti paper al-Qabas on Ives Street, and fell into a coma. During the 1982 invasion of Lebanon the occupation army had briefly detained him with other residents of Ain al-Hilweh. The Institute for Palestine Studies' encyclopedia puts his drawings at nearly 14,000; the sociologist Samih Farsoun, in Culture and Customs of the Palestinians (2004), gives more than 40,000."
    text_ar: "في 22 تموز 1987 أُطلقت النار على رسام الكاريكاتير ناجي العلي أمام مكتب صحيفة «القبس» الكويتية في شارع آيفز بلندن، فدخل في غيبوبة. وكان جيش الاحتلال قد احتجزه مدة قصيرة مع غيره من سكان مخيم عين الحلوة أثناء اجتياح لبنان عام 1982. وتقدّر الموسوعة التفاعلية لمؤسسة الدراسات الفلسطينية رسومه بنحو 14 ألف رسم، فيما يذكر عالم الاجتماع سميح فرسون في كتابه عن ثقافة الفلسطينيين وعاداتهم (2004) أنها تزيد على 40 ألفًا."
    scope: "national"
    tags: [sensitive]
