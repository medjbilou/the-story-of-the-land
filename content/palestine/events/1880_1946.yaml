  - id: e1916_05_promises
    title: "Conflicting promises"
    title_ar: "وعود متناقضة"
    text: "In a letter of 24 October 1915 the British High Commissioner in Egypt, Henry McMahon, promised Sharif Hussein of Mecca that Britain would recognise Arab independence, excluding only \"portions of Syria lying to the west of the districts of Damascus, Homs, Hama and Aleppo\"; whether Palestine fell inside that exclusion is still disputed. In May 1916 Britain and France secretly agreed the Sykes–Picot division of the Arab provinces, with most of Palestine under an \"international administration\". The agreement became public only in November 1917, after the Bolshevik revolution in Russia."
    text_ar: "في رسالة مؤرّخة 24 تشرين الأول 1915 وعد المندوب السامي البريطاني في مصر هنري مكماهون شريفَ مكة الحسين بن علي بأن تعترف بريطانيا باستقلال العرب، ولم يستثنِ إلا «أجزاء من بلاد الشام الواقعة في الجهة الغربية لولايات دمشق الشام وحمص وحماه وحلب»، وما زال الخلاف قائمًا حول دخول فلسطين في هذا الاستثناء. ثم اتفقت بريطانيا وفرنسا سرًّا في أيار 1916 على اتفاقية سايكس–بيكو لتقاسم الولايات العربية، ووُضع معظم فلسطين تحت «إدارة دولية». ولم يُكشف الاتفاق إلا في تشرين الثاني 1917 بعد الثورة البلشفية في روسيا."
