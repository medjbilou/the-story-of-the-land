  - id: e1919_08_king_crane
    title: "The first congress and the King–Crane Commission"
    title_ar: "المؤتمر الأول ولجنة كينغ–كرين"
    text: "From 27 January to 10 February 1919 the first Palestine Arab Congress met in al-Quds (Jerusalem), with delegates of the Muslim-Christian Associations; it rejected the Balfour Declaration and demanded that Palestine stay part of an independent Arab Syria. That summer the American King–Crane Commission collected petitions across the region, and its report of August 1919 found nearly 90% of Palestine's population emphatically against the entire Zionist programme, noted that Jews were only about 10% of Palestine's population, and judged that a Jewish state could only be imposed by armed force. It recommended a greatly reduced Zionist programme, but the peace conference did not adopt its recommendations, and the report was kept from the public until 1922."
    text_ar: "من 27 كانون الثاني إلى 10 شباط 1919 انعقد في القدس المؤتمر العربي الفلسطيني الأول، بمندوبين عن الجمعيات الإسلامية المسيحية، فرفض وعد بلفور وطالب بأن تبقى فلسطين جزءًا من سوريا العربية المستقلة. وفي صيف ذلك العام جمعت لجنة كينغ–كرين الأمريكية العرائض في أنحاء المنطقة، وأفاد تقريرها في آب 1919 بأن نحو 90% من أهل فلسطين يرفضون البرنامج الصهيوني كله رفضًا قاطعًا، وبأن اليهود لا يتجاوزون نحو 10% من سكان فلسطين، وبأن الدولة اليهودية لا يمكن فرضها إلا بقوة السلاح. وأوصت اللجنة بتقليص البرنامج الصهيوني تقليصًا كبيرًا، لكن مؤتمر الصلح لم يأخذ بتوصياتها، وظلّ التقرير طيّ الكتمان حتى عام 1922."
