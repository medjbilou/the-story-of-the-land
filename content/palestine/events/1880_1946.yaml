  - id: e1882_07_colonies
    title: "The first colonies"
    title_ar: "أولى المستعمرات"
    text: "On 31 July 1882 ten settlers of the Hovevei Zion (\"Lovers of Zion\") movement from the Russian Empire founded Rishon LeZion, southeast of Yafa (Jaffa), on some 338 hectares at the springs of Uyun Qara bought through Haim Amzaleg, the British vice-consul in Yafa. It was one of the first colonies of the First Aliyah (1881–1903), along with Rosh Pinna and Zikhron Ya'akov. Petah Tikva, founded in 1878, stood on land bought from two Yafa merchants and worked by some thirty tenant farmers. From late 1882 the Ottoman authorities began restricting Jewish entry, and when the colonies ran out of money Baron Edmond de Rothschild took them over. Al Jazeera says he spent more than 14 million francs on about 30 colonies."
    text_ar: "في 31 تموز 1882 أسّس عشرة مستوطنين من حركة «أحبّاء صهيون» قدموا من الإمبراطورية الروسية مستعمرة ريشون لتسيون جنوب شرقي يافا، على نحو 338 هكتارًا عند ينابيع عيون قارة اشتُريت بوساطة نائب القنصل البريطاني في يافا حاييم أمزالاغ. وكانت من أوائل مستعمرات موجة الهجرة الأولى (1881–1903)، ومعها روش بينا وزخرون يعكوف. أما بتاح تكفا، التي أُسّست عام 1878، فقامت على أرض اشتُريت من تاجرَين من يافا وكان يفلحها نحو ثلاثين مزارعًا مستأجرًا. ومنذ أواخر 1882 بدأت السلطات العثمانية تقييد دخول اليهود، ولمّا نفدت أموال المستعمرات تولّاها البارون إدموند دي روتشيلد، وتقول الجزيرة إنه أنفق أكثر من 14 مليون فرنك على نحو 30 مستعمرة."
