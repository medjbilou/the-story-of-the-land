  - id: e1915_04_locusts
    title: "Seferberlik and the year of the locust"
    title_ar: "السفربرلك وعام الجراد"
    text: "The Ottoman Empire entered the First World War in late 1914, and the seferberlik, the general mobilisation, took men into the army by force. From March to October 1915 swarms of locusts stripped Palestine and Syria of almost all vegetation, destroying 60–100% of the summer and autumn fruit and vegetable crops. Food prices soared, and the famine that followed killed nearly half the people of Mount Lebanon by 1918."
    text_ar: "دخلت الدولة العثمانية الحرب العالمية الأولى أواخر عام 1914، وساق «السفربرلك»، أي النفير العام، الرجال قسرًا إلى الجيش. ومن آذار إلى تشرين الأول 1915 جرّدت أسراب الجراد فلسطين وسوريا من كل خضرة تقريبًا، فأتلفت ما بين 60 و100% من محاصيل الفاكهة والخضار في الصيف والخريف. وارتفعت أسعار الطعام ارتفاعًا هائلًا، وأودت المجاعة التي تلت ذلك بنحو نصف سكان جبل لبنان حتى عام 1918."
    scope: "national"
    from: 1915-04-01
    to: 1915-05-01
    effects:
