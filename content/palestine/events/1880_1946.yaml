  - id: e1921_05_jaffa
    title: "Yafa, May 1921"
    title_ar: "أحداث يافا 1921"
    text: "On 1 May 1921 a clash between two rival Jewish May Day marches in Yafa (Jaffa) set off a week of violence that spread to Petah Tikva, Rehovot, Kfar Saba and Hadera. Arab rioters killed Jews in their homes and at an immigrant hostel, and other Arabs sheltered Jewish neighbours in their homes. From 2 May armed groups of the Zionist Haganah broke into Arab homes, one of them under orders to \"destroy everything, sparing only small children\", and the Haganah founder Eliyahu Golomb reported that one of its men had killed a disabled Arab man and his children in an orange grove. In all 47 Jews and 48 Arabs were killed, most of the Arabs by the British-run police. The Haycraft inquiry found the fundamental cause to be Arab discontent with Jewish immigration and Zionist policy."
    text_ar: "في 1 أيار 1921 أشعل اشتباكٌ بين مسيرتين يهوديتين متنافستين بمناسبة عيد العمال في يافا أسبوعًا من العنف امتدّ إلى بتاح تكفا ورحوفوت وكفار سابا والخضيرة. قتل مشاغبون عرب يهودًا في بيوتهم وفي نُزُل للمهاجرين، وآوى عرب آخرون جيرانهم اليهود في بيوتهم. ومنذ 2 أيار اقتحمت مجموعات مسلّحة من عصابة الهاغاناه الصهيونية بيوتًا عربية، وكانت إحداها قد أُمرت بتدمير كل شيء وألّا تستثني إلا الأطفال الصغار، وأفاد إلياهو غولومب، أبرز مؤسسي الهاغاناه، بأن أحد عناصرها قتل رجلًا عربيًّا معاقًا وأطفاله في بيارة. وقُتل في المجموع 47 يهوديًّا و48 عربيًّا، سقط معظم العرب منهم برصاص الشرطة التي تديرها بريطانيا. ووجدت لجنة هيكرافت أن السبب الأساسي هو سخط العرب على الهجرة اليهودية وعلى السياسة الصهيونية."
