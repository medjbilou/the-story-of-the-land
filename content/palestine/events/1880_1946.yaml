  - id: e1936_06_jaffa_old_city
    title: "Yafa's Old City blown open"
    title_ar: "نسف البلدة القديمة في يافا"
    text: "On 16 June 1936 British army engineers set off large gelignite charges to cut long roads through the Old City of Yafa (Jaffa). Between 220 and 240 buildings were destroyed and up to 6,000 Palestinians were left homeless. Palestine's Chief Justice, Sir Michael McDonnell, sharply criticised the operation, and he was soon removed from the country."
    text_ar: "في 16 حزيران 1936 فجّر مهندسو الجيش البريطاني شحنات كبيرة من المتفجرات ليشقّوا طرقًا طويلة عبر البلدة القديمة في يافا. فدُمّر ما بين 220 و240 مبنى، وصار ما يصل إلى 6000 فلسطيني بلا مأوى. وانتقد رئيس المحكمة العليا في فلسطين السير مايكل ماكدونل هذه العملية بشدة، فلم يلبث أن أُبعد عن البلاد."
