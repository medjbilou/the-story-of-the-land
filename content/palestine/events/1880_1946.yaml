  - id: e1917_12_jerusalem
    title: "Al-Quds falls to the British"
    title_ar: "سقوط القدس بيد البريطانيين"
    text: "On 9 December 1917 the mayor of al-Quds (Jerusalem), Hussein Salim al-Husseini, carried to two British sergeants outside the city the Ottoman governor's letter surrendering it for fear that the shelling would hit the holy places. Two days later General Edmund Allenby made his formal entry on foot through the Jaffa Gate. The Jewish Legion, which some accounts place beside him, reached the front only in 1918. Four centuries of Ottoman rule were over, and British military rule began."
    text_ar: "في 9 كانون الأول 1917 حمل رئيس بلدية القدس حسين سليم الحسيني إلى رقيبَين بريطانيَّين خارج المدينة رسالةَ الحاكم العثماني، التي يسلّم فيها المدينة خشيةَ أن تصيب القذائف أماكنها المقدسة. وبعد يومين دخلها الجنرال إدموند ألنبي دخولًا رسميًّا ماشيًا على قدميه من باب الخليل. أما «الفيلق اليهودي»، الذي تضعه بعض الروايات إلى جانبه، فلم يصل إلى الجبهة إلا عام 1918. وهكذا انتهى حكم عثماني دام أربعة قرون، وبدأ حكم عسكري بريطاني."
