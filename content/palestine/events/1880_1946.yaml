  - id: e1936_10_strike_ends
    title: "The great strike ends"
    title_ar: "نهاية الإضراب الكبير"
    text: "On 11 October 1936, after six months, the Arab Higher Committee called off the general strike under British pressure and at the appeal of Arab rulers, and agreed to appear before a British royal commission. Throughout the strike British forces, with the ranks of British and Jewish police swollen, had subjected Palestinians to house searches, night raids, beatings, imprisonment, torture and deportation. Britain's official list, as cited by the Peel Commission, counts 195 Arabs killed or dead of wounds and 804 wounded in the 1936 disturbances, and the commission called an estimate of about 1,000 killed credible."
    text_ar: "في 11 تشرين الأول 1936، بعد ستة أشهر، أنهت اللجنة العربية العليا الإضراب العام تحت ضغط السياسة البريطانية واستجابةً لنداء الحكّام العرب، وقبلت المثول أمام لجنة ملكية بريطانية. وطوال الإضراب، وقد تضخّمت صفوف الشرطة البريطانية واليهودية، أخضعت القوات البريطانية الفلسطينيين لتفتيش البيوت والمداهمات الليلية والضرب والسجن والتعذيب والنفي. وتحصي القائمة البريطانية الرسمية التي أوردتها لجنة بيل 195 عربيًّا قُتلوا أو ماتوا متأثرين بجراحهم و804 جرحى في أحداث 1936، ووصفت اللجنة تقديرًا بنحو ألف قتيل بأنه موثوق."
