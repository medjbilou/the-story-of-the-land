        text_ar: "نسلّم بندقية الجدّ القديمة للسلطات البريطانية"
        outcome: "The British policeman took the rifle and wrote the grandfather's name in a ledger, and the grandfather wept that night."
        outcome_ar: "أخذ الشرطي البريطاني البندقية وكتب اسم الجدّ في دفتر، وبكى الجدّ تلك الليلة."
