  - id: e1920_04_nabi_musa
    title: "The Nabi Musa events"
    title_ar: "أحداث موسم النبي موسى"
    text: "On 4–7 April 1920, during the Nabi Musa festival in al-Quds (Jerusalem), a political rally against Zionism turned into attacks on Jews in the Old City. By British figures 5 Jews were killed and 211 injured, and 4 Arabs were killed and 21 injured. For a month Ze'ev Jabotinsky had been openly drilling some 600 Jewish volunteers in the city; he was sentenced to 15 years, mainly for holding a pistol, a term soon cut to one year. A British military inquiry traced the causes to Arab disappointment at unfulfilled promises of independence and the belief that the Balfour Declaration denied them self-determination, and laid much of the blame on the Zionists' \"impatience\" and \"indiscretion\". Afterwards the British removed Musa Kazim al-Husseini as mayor of al-Quds, and in June 1920 Zionist leaders founded their own armed force, the Haganah."
    text_ar: "في 4–7 نيسان 1920، خلال موسم النبي موسى في القدس، تحوّل تجمّع سياسي ضد الصهيونية إلى اعتداءات على اليهود في البلدة القديمة. وبحسب الأرقام البريطانية قُتل 5 يهود وجُرح 211، وقُتل 4 عرب وجُرح 21. وكان زئيف جابوتنسكي يدرّب علنًا نحو 600 متطوع يهودي في المدينة منذ شهر، وحُكم عليه بالسجن 15 عامًا، أساسًا لحيازته مسدسًا، ثم خُفّف الحكم إلى عام واحد. وأرجعت لجنة تحقيق عسكرية بريطانية الأسباب إلى خيبة العرب من وعود الاستقلال التي لم تُنفَّذ، وإلى اعتقادهم أن وعد بلفور يحرمهم حق تقرير المصير، وألقت قسطًا كبيرًا من اللوم على «نفاد صبر» الصهيونيين و«طيشهم». وعقب الأحداث عزل البريطانيون موسى كاظم الحسيني من رئاسة بلدية القدس، وفي حزيران 1920 أسّس قادة صهيونيون عصابة مسلّحة خاصة بهم هي الهاغاناه."
