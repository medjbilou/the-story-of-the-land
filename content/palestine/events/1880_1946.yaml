  - id: e1939_09_toll
    title: "The cost of the revolt"
    title_ar: "حصيلة الثورة"
    text: "By the late summer of 1939 the revolt had been crushed by up to 50,000 British troops, with some 15,000 men of the Zionist Haganah at their side, and by the end of September 1939 Britain had authorised about 20,000 Jewish policemen, supernumerary police and settlement guards to carry arms. Walid Khalidi, working from British figures, counts 5,032 Arabs killed (3,832 by the British and 1,200 in internal violence) and 14,760 wounded; 108 were hanged, and over 300 Jews and 262 Britons were also killed. By one estimate one in ten Palestinian men aged 20 to 60 had been killed, wounded, imprisoned or exiled, and the leadership was scattered as the Second World War began in September 1939."
    text_ar: "بحلول أواخر صيف 1939 كانت الثورة قد سُحقت على يد ما يصل إلى 50 ألف جندي بريطاني وإلى جانبهم نحو 15 ألفًا من رجال عصابة الهاغاناه الصهيونية، وبنهاية أيلول 1939 كانت بريطانيا قد رخّصت بحمل السلاح لنحو 20 ألفًا من رجال الشرطة والشرطة الإضافية وحرّاس المستوطنات اليهود. ويحصي وليد الخالدي، اعتمادًا على الأرقام البريطانية، 5032 قتيلًا عربيًّا (3832 قتلهم البريطانيون و1200 في العنف الداخلي) و14,760 جريحًا، وأُعدم 108 شنقًا، وقُتل كذلك أكثر من 300 يهودي و262 بريطانيًّا. وبحسب أحد التقديرات قُتل أو جُرح أو سُجن أو نُفي واحد من كل عشرة رجال فلسطينيين بين العشرين والستين من العمر، وتشتّتت القيادة عشية اندلاع الحرب العالمية الثانية في أيلول 1939."
