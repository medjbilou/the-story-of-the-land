  - id: e1920_07_high_commissioner
    title: "The Mandate and the High Commissioner"
    title_ar: "الانتداب والمندوب السامي"
    text: "On 25 April 1920 the Allied conference at San Remo assigned the Mandate for Palestine to Britain. In July Herbert Samuel arrived as the first High Commissioner, and military rule ended. The Muslim-Christian Association cabled that it regarded him as a Zionist leader and his appointment as a first step towards a Zionist national home \"in the midst of Arab people contrary to their wishes\". Samuel tried to win Arab confidence but refused them any authority that could stop Jewish immigration and land purchase."
    text_ar: "في 25 نيسان 1920 أسند مؤتمر سان ريمو، الذي عقدته دول الحلفاء، الانتدابَ على فلسطين إلى بريطانيا. وفي تموز وصل هربرت صموئيل أول مندوب سامٍ، فانتهى الحكم العسكري. وأبرقت الجمعية الإسلامية المسيحية بأنها تعدّه زعيمًا صهيونيًّا، وأن تعيينه خطوة أولى نحو إقامة وطن قومي صهيوني «في وسط شعب عربي وخلافًا لرغبته». وحاول صموئيل كسب ثقة العرب، لكنه رفض أن يمنحهم أي سلطة تمكّنهم من وقف الهجرة اليهودية وشراء الأراضي."
    scope: "national"
