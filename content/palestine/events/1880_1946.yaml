    title: "The White Paper and the \"black letter\""
    title_ar: "الكتاب الأبيض و«الرسالة السوداء»"
    text: "The Shaw report of March 1930 led to the Hope Simpson inquiry, which found far less cultivable land than had been assumed and wrote that land bought by the Jewish National Fund became \"extra territorial\", closed for ever to Arab tenants and workers. On 20 October 1930 the Passfield White Paper proposed tying Jewish immigration to Arab unemployment and restricting land sales. In 1931, under Zionist pressure, Prime Minister Ramsay MacDonald sent Chaim Weizmann a letter that in effect emptied the White Paper of meaning, and Palestinians called it the \"black letter\"."
    text_ar: "أفضى تقرير لجنة شو، الصادر في آذار 1930، إلى تحقيق هوب سمبسون، الذي وجد أن الأرض الصالحة للزراعة أقلّ بكثير مما كان مقدّرًا، وكتب أن الأرض التي يشتريها الصندوق القومي اليهودي تصبح «خارج الإقليم»، فلا يستطيع العربي أن يستأجرها أو يعمل فيها أبدًا. وفي 20 تشرين الأول 1930 اقترح الكتاب الأبيض المعروف بكتاب باسفيلد الأبيض ربط الهجرة اليهودية بمعدلات البطالة بين العرب وتقييد بيع الأراضي. لكن رئيس الوزراء رامزي ماكدونالد، تحت ضغط الحركة الصهيونية، بعث عام 1931 برسالة إلى حاييم وايزمان أفرغت عمليًّا الكتاب الأبيض من مضمونه، فسمّاها الفلسطينيون «الرسالة السوداء»."
