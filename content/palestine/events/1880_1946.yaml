  - id: e1937_07_peel
    title: "The Peel Commission and partition"
    title_ar: "لجنة بيل ومشروع التقسيم"
    text: "On 7 July 1937 the Peel Commission recommended partitioning Palestine: a Jewish state in the Galilee, the Jezreel Valley and the coast from Mount Carmel to south of Be'er Tuvia, the rest of the country joined to Transjordan, and a British zone around al-Quds (Jerusalem) with a corridor to Yafa (Jaffa). The proposed Jewish state held about 225,000 Arabs against 1,250 Jews in the Arab state, so the report proposed an exchange of population that would be \"in the last resort\" compulsory, and David Ben-Gurion welcomed the commission's support for transferring the Arabs. In secret evidence that March, Winston Churchill had used the image of a dog in a manger and denied that it had \"the final right to the manger\" (wording from the transcript Martin Gilbert published). Palestinians condemned the plan, and the revolt resumed."
    text_ar: "في 7 تموز 1937 أوصت لجنة بيل بتقسيم فلسطين: دولة يهودية في الجليل ومرج ابن عامر والساحل من جبل الكرمل إلى جنوب بئر طوفيا، وضمّ باقي البلاد إلى شرق الأردن، وإبقاء منطقة بريطانية حول القدس مع ممرّ إلى يافا. وكان في الدولة اليهودية المقترحة نحو 225 ألف عربي مقابل 1250 يهوديًّا في الدولة العربية، فاقترح التقرير تبادلًا للسكان يكون «إجباريًّا كملاذ أخير»، ورحّب دافيد بن غوريون بتأييد اللجنة لترحيل العرب. وفي شهادة سرّية أمام اللجنة في آذار من ذلك العام كان ونستون تشرشل قد استعار صورة الكلب الرابض في المعلف، وأنكر أن يكون له «الحقّ الأخير في المعلف» (ترجمة عن الإنجليزية لنصّ المحضر الذي نشره مارتن غيلبرت). فندّد الفلسطينيون بالخطة، واستُؤنفت الثورة."
