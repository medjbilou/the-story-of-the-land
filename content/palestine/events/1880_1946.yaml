  - id: e1936_04_revolt
    title: "The Great Revolt begins"
    title_ar: "اندلاع الثورة الكبرى"
    text: "Between 1933 and 1936 more than 164,000 Jewish immigrants arrived, and the Jewish share of the population rose from 17% in 1931 to 27% in 1936, while peasants uprooted by debt, Zionist land purchases and British policy crowded into the slums of Hayfa (Haifa) and Yafa (Jaffa). On 15 April 1936 followers of al-Qassam stopped a convoy on the Nablus–Tulkarm road near Anabta and shot three Jewish passengers, killing two. The next day members of the Irgun, then known as Haganah-Bet, killed two sleeping Palestinian workers in a hut near Petah Tikva, and deadly clashes followed in Tel Aviv and Yafa. On 19 April Nablus declared a strike, on 25 April the parties formed the Arab Higher Committee, and from 8 May a nationwide general strike halted Palestinian commerce and transport. The Great Revolt had begun."
    text_ar: "بين 1933 و1936 وصل إلى فلسطين أكثر من 164 ألف مهاجر يهودي، فارتفعت نسبة اليهود من 17% من السكان عام 1931 إلى 27% عام 1936، في حين كان الفلاحون الذين اقتلعهم الدَّين وشراء الصهيونيين للأراضي والسياسة البريطانية يتكدّسون في أحياء الفقر في حيفا ويافا. وفي 15 نيسان 1936 أوقف مقاتلون من أتباع القسّام قافلة على طريق نابلس–طولكرم قرب عنبتا، وأطلقوا النار على ثلاثة ركّاب يهود فقتلوا اثنين منهم. وفي اليوم التالي قتل عناصر من عصابة الإرغون الصهيونية، وكانت تُعرف آنذاك باسم «الهاغاناه ب»، عاملَين فلسطينيَّين وهما نائمان في كوخ قرب بتاح تكفا، وتلت ذلك اشتباكات دامية في تل أبيب ويافا. وفي 19 نيسان أعلنت نابلس الإضراب، وفي 25 نيسان شكّلت الأحزاب اللجنة العربية العليا، ومنذ 8 أيار شلّ إضراب عام شامل التجارة والنقل في المجتمع الفلسطيني. وهكذا بدأت الثورة الكبرى."
