  - id: e1897_08_basel
    title: "The Basel Congress"
    title_ar: "مؤتمر بازل"
    text: "On 29–31 August 1897 Theodor Herzl convened the First Zionist Congress in Basel, Switzerland, attended by 208 people from 17 countries. Its Basel Program declared that Zionism sought a home for the Jewish people in Palestine secured under public law, and the congress founded the Zionist Organization. Herzl wrote in his diary: \"At Basel I founded the Jewish State.\" The people of Palestine, about 600,000 by 1900 and 94% of them Arabs, had no voice in it."
    text_ar: "في 29–31 آب 1897 عقد تيودور هرتسل المؤتمر الصهيوني الأول في مدينة بازل السويسرية، بحضور 208 مشاركين من 17 دولة. وأعلن «برنامج بازل» أن الصهيونية تسعى إلى إقامة وطن للشعب اليهودي في فلسطين يضمنه القانون العام، وأسّس المؤتمر المنظمة الصهيونية. وكتب هرتسل في مذكراته: «في بازل أسّستُ الدولة اليهودية». ولم يكن لأهل فلسطين، وكانوا نحو 600 ألف نسمة عام 1900 والعرب منهم 94%، أي صوت في ذلك المؤتمر."
    scope: "national"
    from: 1897-08-01
    to: 1897-09-01
    day: 29
    effects:
      - { target: land, delta: -0.02 }
      - { target: safety, delta: -0.02 }
    options:
      - id: continue
        text: "Continue"
        text_ar: "متابعة"
    sources:
      - { url: "https://en.wikipedia.org/wiki/First_Zionist_Congress", checked: 2026-10-19 }
      - { url: "https://en.wikipedia.org/wiki/Demographic_history_of_Palestine_(region)", checked: 2026-10-19 }
  - id: e1899_03_khalidi
    title: "Al-Khalidi's letter to Herzl"
    title_ar: "رسالة الخالدي إلى هرتسل"
    text: "On 1 March 1899 Yusuf Diya al-Khalidi, a former mayor of al-Quds (Jerusalem) and a deputy in the first Ottoman parliament, wrote to France's chief rabbi, Zadoc Kahn, asking that the Zionists leave Palestine in peace and pointing out that most of its people were not Jews. On 19 March Herzl replied that the Ottoman Empire and Palestine's non-Jewish population would gain from Jewish immigration, asking: \"who would think of sending them away?\" He added that if the Sultan refused, the Zionists would find elsewhere what they needed. Four years earlier, in 1895, Herzl had written in his diary, of whatever land the Jewish state would take, that \"we shall try to spirit the penniless population across the border\", \"discreetly and circumspectly\"."
    text_ar: "في 1 آذار 1899 كتب يوسف ضياء الدين الخالدي، رئيس بلدية القدس الأسبق والنائب في أول برلمان عثماني، رسالة إلى حاخام فرنسا الأكبر زادوك كان يرجو فيها أن يترك الصهيونيون فلسطين وشأنها، منبّهًا إلى أن أغلبية أهلها ليسوا يهودًا. وفي 19 آذار أجاب هرتسل بأن الدولة العثمانية وسكان فلسطين من غير اليهود سيجنون الفائدة من الهجرة اليهودية، متسائلًا: «من يفكّر في إبعادهم؟» (ترجمة عن الفرنسية). وأضاف أنه إن رفض السلطان، فسيجد الصهيونيون في مكان آخر ما يحتاجون إليه. وكان هرتسل قد كتب في مذكراته عام 1895، أيًّا كانت الأرض التي ستُختار للدولة اليهودية، أن الصهيونيين سيسعون إلى نقل السكان المعدمين خفيةً عبر الحدود، «بتكتّم وحذر»."
    scope: "national"
    place: jerusalem
    from: 1899-03-01
    to: 1899-04-01
    day: 1
    effects:
      - { target: memory, delta: 0.03 }
      - { target: solidarity, delta: 0.02 }
    options:
