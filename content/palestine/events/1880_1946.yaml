  - id: e1939_05_white_paper
    title: "The 1939 White Paper"
    title_ar: "الكتاب الأبيض 1939"
    text: "On 17 May 1939 Britain issued a new White Paper: about 75,000 Jewish immigrants over five years, after which no further Jewish immigration would be permitted \"unless the Arabs of Palestine are prepared to acquiesce in it\"; restrictions on land sales; and an independent Palestine State within ten years in which Arabs and Jews would share government. It admitted that expanding the Jewish national home against the will of the Arabs would mean \"rule by force\". Zionist groups rejected it and attacked government property for months; on 19 June 1939 an Irgun bomb in the Hayfa (Haifa) vegetable market killed 18 people, most of them Arabs, by the Colonial Secretary's figures. The Arab Higher Committee rejected it too, arguing that the promised independence would prove illusory. Land Transfer Regulations followed in February 1940, severely restricting land sales to non-Arabs in all but 5% of the country."
    text_ar: "في 17 أيار 1939 أصدرت بريطانيا كتابًا أبيض جديدًا: نحو 75 ألف مهاجر يهودي خلال خمس سنوات، لا يُسمح بعدها بهجرة يهودية أخرى «إلا إذا كان عرب فلسطين على استعداد للقبول بها»، وتقييد بيع الأراضي، وإقامة دولة فلسطينية مستقلة خلال عشر سنوات يتقاسم فيها العرب واليهود الحكم. واعترف الكتاب بأن توسيع الوطن القومي اليهودي رغم إرادة العرب يعني «الحكم بالقوة». فرفضته المنظمات الصهيونية وشنّت أشهرًا من الهجمات على المنشآت الحكومية، وفي 19 حزيران 1939 قتلت قنبلة لعصابة الإرغون الصهيونية في سوق الخضار بحيفا 18 شخصًا، أكثرهم عرب، بحسب أرقام وزير المستعمرات البريطاني. ورفضته اللجنة العربية العليا أيضًا لأنها رأت أن الاستقلال الموعود سيكون وهميًّا. وفي شباط 1940 صدرت أنظمة انتقال الأراضي، فقيّدت بشدة بيع الأرض لغير العرب في البلاد كلها إلا 5% من مساحتها."
