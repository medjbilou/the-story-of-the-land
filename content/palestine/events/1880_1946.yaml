  - id: e1938_07_market_bombs
    title: "Irgun bombs in the markets"
    title_ar: "قنابل الإرغون في الأسواق"
    text: "On 14 November 1937 the Zionist Irgun dropped the Haganah's policy of \"restraint\": its attacks around al-Quds (Jerusalem) killed ten Arabs that day, and it went on to set off bombs among Arab crowds and on buses. In July 1938 it planted bombs and mines in Arab markets. A bomb in the market of al-Quds on 15 July killed ten Palestinians, as The New York Times reported, and two bombs in the vegetable market of Hayfa (Haifa) that month killed 21 and then 53 people, most of them Arabs, by the figures the British Colonial Secretary gave Parliament in 1939."
    text_ar: "في 14 تشرين الثاني 1937 تخلّت عصابة الإرغون الصهيونية عن سياسة «ضبط النفس» التي اتّبعتها عصابة الهاغاناه، فقتلت في ذلك اليوم عشرة عرب في هجمات حول القدس، ثم مضت تفجّر القنابل وسط الحشود العربية وفي الحافلات. وفي تموز 1938 زرعت قنابل وألغامًا في أسواق عربية. فقتلت قنبلة في سوق القدس في 15 تموز عشرة فلسطينيين بحسب صحيفة نيويورك تايمز، وقتلت قنبلتان في سوق الخضار بحيفا في ذلك الشهر 21 شخصًا ثم 53، أكثرهم عرب، بحسب الأرقام التي قدّمها وزير المستعمرات البريطاني إلى البرلمان عام 1939."
    scope: "region:haifa"
    place: haifa
    tags: [sensitive]
    from: 1938-07-01
