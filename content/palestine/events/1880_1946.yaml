        text_ar: "ينام الشبان في الكروم بعيدًا عن البيوت"
        outcome: "The sons slept under the olive trees for weeks, and their mother brought them food before dawn."
        outcome_ar: "نام الأبناء تحت الزيتون أسابيع، وكانت الأم تحمل إليهم الطعام قبل الفجر."
        effects:
          - { target: safety, delta: 0.05 }
          - { target: home, delta: -0.02 }
