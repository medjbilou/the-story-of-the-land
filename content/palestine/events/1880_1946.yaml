  - id: e1942_05_biltmore
    title: "The Biltmore Conference"
    title_ar: "مؤتمر بلتمور"
    text: "On 6–11 May 1942 some 600 delegates met at the Biltmore Hotel in New York and demanded that the gates of Palestine be opened, that the Jewish Agency control immigration, and that Palestine be established as a \"Jewish Commonwealth\", and spoke of developing the country's \"unoccupied and uncultivated lands\". It was the first time Zionist leaders openly called for a Jewish state, and it marked the movement's turn from London towards Washington. The programme mentioned the Arabs of Palestine only to say that they had shared in what the settlers built."
    text_ar: "في 6–11 أيار 1942 اجتمع نحو 600 مندوب في فندق بلتمور في نيويورك، وطالبوا بفتح أبواب فلسطين، وبمنح الوكالة اليهودية السيطرة على الهجرة، وبجعل فلسطين «كومنولثًا يهوديًّا»، وتحدّثوا عن تطوير «الأراضي غير المأهولة وغير المزروعة» في البلاد. وكانت تلك أول مرة يطالب فيها القادة الصهيونيون علنًا بدولة يهودية، وإيذانًا بتحوّل الحركة من الاعتماد على لندن إلى الاعتماد على واشنطن. أما عرب فلسطين فلم يُذكروا في البرنامج إلا للقول إنهم استفادوا مما أنجزه المستوطنون."
