  - id: e1917_11_balfour
    title: "The Balfour Declaration"
    title_ar: "وعد بلفور"
    text: "On 2 November 1917 Foreign Secretary Arthur Balfour wrote to Lord Rothschild that his government viewed with favour \"the establishment in Palestine of a national home for the Jewish people\". Arabs were about 90% of the population, yet the declaration named them only as \"existing non-Jewish communities in Palestine\" and safeguarded only their \"civil and religious rights\". The people of the country were never asked, and in 1919 Balfour said Britain deliberately declined to apply the principle of self-determination in Palestine. In 1905 Balfour himself had driven through the Aliens Act, which restricted Jews fleeing the Russian Empire from entering Britain."
    text_ar: "في 2 تشرين الثاني 1917 كتب وزير الخارجية البريطاني آرثر بلفور إلى اللورد روتشيلد أن حكومته تنظر بعين العطف إلى «تأسيس وطن قومي للشعب اليهودي في فلسطين». وكان العرب نحو 90% من السكان، لكن التصريح لم يذكرهم إلا بوصفهم «الطوائف غير اليهودية المقيمة الآن في فلسطين»، ولم يضمن لهم إلا «الحقوق المدنية والدينية». ولم يُسأل أهل البلاد، بل صرّح بلفور عام 1919 بأن بريطانيا ترفض عمدًا تطبيق مبدأ تقرير المصير في فلسطين. وكان بلفور نفسه قد دفع عام 1905 بقانون الأجانب الذي قيّد هجرة اليهود الفارّين من الإمبراطورية الروسية إلى بريطانيا."
