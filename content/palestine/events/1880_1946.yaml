  - id: e1911_01_fula
    title: "The al-Fula affair"
    title_ar: "قضية الفولة"
    text: "In 1910–11 Elias Sursock, an absentee landlord in Beirut, sold about 10,000 dunams around the village of al-Fula in Marj Ibn Amer to the Zionist movement's Jewish National Fund. The peasants refused to leave, the Ottoman district governor of al-Nasira (Nazareth), Shukri al-Asali, refused to finalise the sale, and the villagers petitioned the Grand Vizier that it would take the livelihood of 1,000 people. Historians call it the first concerted action against Zionist activity; in January 1911 the cousins Isa and Yusuf al-Isa launched the newspaper Filastin in Yafa (Jaffa), which became Zionism's fiercest critic."
    text_ar: "في 1910–1911 باع إلياس سرسق، المالك البيروتي الغائب عن أرضه، نحو 10 آلاف دونم حول قرية الفولة في مرج ابن عامر للصندوق القومي اليهودي التابع للحركة الصهيونية. فرفض الفلاحون الرحيل، ورفض قائمقام الناصرة العثماني شكري العسلي إتمام الصفقة، وأرسل الأهالي عريضة إلى الصدر الأعظم يقولون فيها إن البيع سيحرم ألف قروي من رزقهم. ويَعُدّ المؤرخون ذلك أول تحرّك منظّم ضد النشاط الصهيوني، وفي كانون الثاني 1911 أصدر عيسى العيسى وابن عمه يوسف العيسى في يافا جريدة «فلسطين»، التي صارت أشدّ منتقدي الصهيونية."
