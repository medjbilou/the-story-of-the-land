        text: "Stay away from the city market for now"
        text_ar: "نتجنّب سوق المدينة هذه الأيام"
        outcome: "The family sold its vegetables to a neighbour who took them to market, at half the price."
        outcome_ar: "باعت العائلة خضارها لجار يحملها إلى السوق، بنصف الثمن."
        effects:
          - { target: safety, delta: 0.05 }
