  - id: e1921_09_marj
    title: "Evicting the farmers of Marj Ibn Amer"
    title_ar: "اقتلاع فلاحي مرج ابن عامر"
    text: "On 11 September 1921 Zionist settlers arrived in Marj Ibn Amer to found Nahalal, the country's first moshav, on the land of the Arab village of Ma'lul: that year the Sursock family, absentee landlords in Beirut, had sold all but 2,000 dunams of it to the Zionist Palestine Land Development Company. The Ottomans had refused many such sales, but a British ordinance of 1920 lifted the restrictions, and between 1921 and 1925 the Sursocks sold their land in the valley to Zionist buyers, chiefly the American Zion Commonwealth. The British authorities classed the farmers as mere tenants, and the buyers demanded that they be removed: 1,746 families, about 8,730 people, were evicted from some 240,000 dunams, 20–25 villages were emptied, and British police enforced the evictions on those who refused to leave. Many of the evicted ended up in the shantytowns on the edges of Hayfa (Haifa) and Yafa (Jaffa)."
    text_ar: "في 11 أيلول 1921 وصل مستوطنون صهيونيون إلى مرج ابن عامر ليقيموا نهلال، أول موشاف (مستوطنة زراعية تعاونية) في البلاد، على أرض قرية معلول العربية، وكان آل سرسق، الملّاك الغائبون المقيمون في بيروت، قد باعوا في ذلك العام أراضيها كلها إلا ألفي دونم لشركة تطوير أراضي فلسطين الصهيونية. وكانت الدولة العثمانية قد رفضت كثيرًا من هذه الصفقات، فلمّا رفع قانون انتقال الأراضي البريطاني لعام 1920 القيود، باع آل سرسق بين 1921 و1925 أراضيهم في المرج لجهات صهيونية، أكبرها «كومنولث صهيون الأمريكي». وعدّت السلطات البريطانية الفلاحين مجرد مستأجرين، وطالب المشترون بإخلاء الأرض من أهلها، فطُردت 1746 أسرة، نحو 8730 نسمة، من نحو 240 ألف دونم، وأُفرغت ما بين 20 و25 قرية، ونفّذت الشرطة البريطانية أوامر الإخلاء بحق من رفضوا الرحيل. وانتهى المطاف بكثير من المطرودين في أحياء الصفيح على أطراف حيفا ويافا."
