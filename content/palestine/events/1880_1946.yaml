  - id: e1935_11_qassam
    title: "Izz ad-Din al-Qassam is killed"
    title_ar: "استشهاد عز الدين القسّام"
    text: "In October 1935 a shipment of arms bound for the Haganah was discovered in Yafa (Jaffa) port, deepening Palestinian fears. Sheikh Izz ad-Din al-Qassam, a Syrian-born preacher at the Istiqlal mosque in Hayfa (Haifa) who had organised poor peasants driven off their land into secret cells, declared jihad on the night of 12 November and took to the hills with eleven companions. On 20 November, in the woods of Ya'bad near Jenin, they fought a much larger British force for six hours; al-Qassam was killed with three of his men by the historian Beverley Milton-Edwards's account, or four by the Institute for Palestine Studies'. Hayfa held a general strike on the day of his funeral, the largest the city had ever seen."
    text_ar: "في تشرين الأول 1935 اكتُشفت في ميناء يافا شحنة سلاح مرسلة إلى عصابة الهاغاناه الصهيونية، فازدادت مخاوف الفلسطينيين. وكان الشيخ عز الدين القسّام، الخطيب السوري المولد في جامع الاستقلال بحيفا، قد نظّم في خلايا سرّية فلاحين فقراء طُردوا من أراضيهم، فأعلن الجهاد ليلة 12 تشرين الثاني وخرج مع أحد عشر رفيقًا إلى الجبال. وفي 20 تشرين الثاني، في أحراج يعبد قرب جنين، قاتلوا ست ساعات قوة بريطانية أكبر منهم بكثير، فاستُشهد القسّام ومعه ثلاثة من رجاله بحسب المؤرخة بيفرلي ميلتون إدواردز، أو أربعة بحسب مؤسسة الدراسات الفلسطينية. وأضربت حيفا إضرابًا عامًّا يوم تشييعه، في أكبر جنازة شهدتها المدينة."
