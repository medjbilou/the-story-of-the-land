  - id: e1915_01_samuel
    title: "Herbert Samuel's memorandum"
    title_ar: "مذكرة هربرت صموئيل"
    text: "In January 1915 Herbert Samuel, the first practising Jew to serve as a British cabinet minister and a supporter of Zionism, circulated a memorandum titled \"The Future of Palestine\" to his colleagues. It argued that Britain should take Palestine to protect the Suez Canal and that the country should become a home for the Jewish people, and it said annexation to the British Empire was the solution Zionist leaders would most welcome. In March he replaced it with a toned-down version, but his ideas shaped the Balfour Declaration."
    text_ar: "في كانون الثاني 1915 وزّع هربرت صموئيل، أول يهودي ممارس لديانته يتولّى منصبًا وزاريًّا في بريطانيا ومن أنصار الصهيونية، مذكرة بعنوان «مستقبل فلسطين» على زملائه الوزراء. ودعا فيها إلى أن تستولي بريطانيا على فلسطين لحماية قناة السويس وأن تصبح البلاد وطنًا للشعب اليهودي، وكتب أن ضمّها إلى الإمبراطورية البريطانية هو الحلّ الأحبّ إلى قادة الحركة الصهيونية. وفي آذار استبدل بها نسخة مخفّفة، لكن أفكاره أثّرت في وعد بلفور."
    scope: "national"
    from: 1915-01-01
    to: 1915-02-01
    effects:
