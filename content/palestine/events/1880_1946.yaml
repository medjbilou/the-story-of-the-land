        text: "Help the people of al-Bassa rebuild"
        text_ar: "نساعد أهل البصة على إعادة البناء"
        outcome: "The sons carried stones for days, and the first house had a wall before the rains."
        outcome_ar: "حمل الأبناء الحجارة أيامًا، وارتفع جدار أول بيت قبل المطر."
        effects:
