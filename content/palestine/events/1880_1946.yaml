        text_ar: "نشتري «الكرمل» ونقرؤها في المضافة"
        outcome: "Every week the men gathered around the paper, and the talk about the land went on late."
        outcome_ar: "اجتمع الرجال كل أسبوع حول الجريدة، وطال النقاش في أمر الأرض."
