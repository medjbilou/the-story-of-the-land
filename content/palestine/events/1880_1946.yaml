  - id: e1939_03_abd_rahim
    title: "Abd al-Rahim al-Hajj Muhammad is killed"
    title_ar: "استشهاد عبد الرحيم الحاج محمد"
    text: "On 27 March 1939 Abd al-Rahim al-Hajj Muhammad (Abu Kamal), from Dhinnaba near Tulkarm and general commander of the revolt, was killed in a firefight with British troops at Sanur between Jenin and Nablus, together with one of his deputies, after one of the British-backed \"peace bands\" had tracked him through informers. He had refused to carry out political assassinations for rival factions, saying he worked not for \"Husayniya\" but for \"wataniya\", the nation. A general strike was held across Palestine for several days in his honour."
    text_ar: "في 27 آذار 1939 استُشهد عبد الرحيم الحاج محمد (أبو كمال)، ابن ذنابة قرب طولكرم والقائد العام للثورة، في اشتباك مع الجيش البريطاني قرب قرية صانور بين جنين ونابلس، ومعه أحد نوّابه، بعد أن تعقّبت إحدى «فصائل السلام» التي دعمها البريطانيون تحرّكاته عبر مخبرين. وكان قد رفض تنفيذ اغتيالات سياسية لحساب زعامات متنافسة، قائلًا إنه لا يعمل للحسينية بل للوطنية. وعمّ فلسطين إضراب عام استمرّ عدة أيام إجلالًا لذكراه."
    scope: "region:sanur_jenin"
