  - id: e1946_07_king_david
    title: "The King David Hotel bombing"
    title_ar: "تفجير فندق الملك داود"
    text: "On 22 July 1946 members of the Zionist Irgun militia, led by Menachem Begin, disguised as Arab workmen and waiters, planted explosives in the King David Hotel in al-Quds (Jerusalem), whose southern wing housed the British administration and military headquarters. The blast killed 91 people, 41 Arabs, 28 Britons, 17 Jews and 5 others, most of them officials, clerks and hotel staff. The Haganah had approved the operation when it was planned but had withdrawn its approval before it was carried out. Whether and when a warning was given is still disputed."
    text_ar: "في 22 تموز 1946 زرع عناصر من عصابة الإرغون الصهيونية، التي كان يقودها مناحيم بيغن، متفجرات في فندق الملك داود في القدس، متنكّرين في هيئة عمّال عرب ونُدُل، وكان الجناح الجنوبي للفندق مقرًّا للإدارة البريطانية وقيادة الجيش. فقُتل 91 شخصًا: 41 عربيًّا و28 بريطانيًّا و17 يهوديًّا و5 آخرون، معظمهم موظفون وكتبة وعاملون في الفندق. وكانت عصابة الهاغاناه الصهيونية قد وافقت على التفجير عند التخطيط له، ثم سحبت موافقتها قبل تنفيذه. وما زال الخلاف قائمًا حول ما إذا كان تحذير قد وُجّه ومتى."
