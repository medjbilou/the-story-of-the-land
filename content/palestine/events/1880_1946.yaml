        text: "Register every member of the family in the census"
        text_ar: "نسجّل أفراد العائلة في التعداد"
        outcome: "The official wrote down every name, and the mother asked that the village be written out in full."
        outcome_ar: "كتب الموظف أسماء الجميع، وطلبت الأم أن يُكتب اسم القرية كاملًا."
