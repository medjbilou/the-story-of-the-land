  - id: e1930_06_red_tuesday
    title: "Red Tuesday"
    title_ar: "الثلاثاء الحمراء"
    text: "Of 26 Arabs sentenced to death after the 1929 events, all but three had their sentences commuted. On Tuesday 17 June 1930 Britain hanged those three in 'Akka (Acre) prison: Fuad Hijazi of Safad (Safed), about 26 years old, and Ata al-Zeer and Muhammad Jamjoum of al-Khalil (Hebron). It had convicted them of killing Jews at Safad and al-Khalil, \"particularly brutal murders\" in its report to the League of Nations. Adnan Jamjoum, a relative of Muhammad's, told Al Jazeera that the court relied on a Jewish boy who had hidden in a closet when his father was killed and did not see the killer. The Jewish policeman Simha Hinkis, convicted of killing five people in the home of Sheikh 'Awn, imam of a Yafa (Jaffa) mosque, on 25 August 1929, was also sentenced to death; his sentence was commuted to 15 years, and he was freed in an amnesty in 1935. Palestinians remember the day of the hangings as \"Red Tuesday\", from Ibrahim Tuqan's poem, and the folk poet Nuh Ibrahim wrote an elegy for the three that is still sung."
    text_ar: "من بين 26 عربيًّا صدرت بحقهم أحكام بالإعدام بعد أحداث 1929، خُفّفت الأحكام جميعًا إلا ثلاثة. وفي يوم الثلاثاء 17 حزيران 1930 أعدمت بريطانيا شنقًا في سجن عكا فؤاد حجازي من صفد، وهو في نحو السادسة والعشرين، وعطا الزير ومحمد جمجوم من الخليل، وقد أدانتهم بقتل يهود في صفد والخليل، ووصفت ذلك في تقريرها إلى عصبة الأمم بأنه «جرائم قتل وحشية على نحو خاص». ويقول عدنان جمجوم، أحد أقارب محمد جمجوم، للجزيرة إن المحكمة استندت إلى شهادة صبيّ يهودي كان مختبئًا في خزانة حين قُتل أبوه فلم يرَ القاتل. أما الشرطي اليهودي سمحا هينكيس، الذي أُدين بقتل خمسة أشخاص في بيت الشيخ عون، إمام أحد مساجد يافا، في 25 آب 1929، فقد حُكم عليه بالإعدام ثم خُفّف الحكم إلى السجن 15 عامًا، وأُطلق سراحه بعفو عام 1935. ويذكر الفلسطينيون يوم الإعدام باسم «الثلاثاء الحمراء» من قصيدة إبراهيم طوقان، ورثى الشاعر الشعبي نوح إبراهيم الشهداء الثلاثة بقصيدة ما زالت تُغنّى إلى اليوم."
