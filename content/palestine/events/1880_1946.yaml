  - id: e1929_08_buraq
    title: "The Buraq uprising"
    title_ar: "هبّة البراق"
    text: "On 15 August 1929 members of the Zionist Betar movement demonstrated at the Buraq (Western) Wall, shouting \"the Wall is ours\" and raising the Zionist flag, stirring Palestinian fears for their holy places, and from 23 to 29 August violence spread from al-Quds (Jerusalem) across the country. Arab attackers killed 133 Jews by the official count, between 59 (the historian Colin Shindler's figure) and 67 (Alex Winder's) of them in al-Khalil (Hebron) and, by Shindler's count, 20 in Safad (Safed); in al-Khalil hundreds of Jews survived because Arab neighbours hid them in their homes. 116 Arabs were killed by the same count, most of them by British police and troops suppressing the riots. The Shaw Commission found the fundamental cause to be Arab disappointment of their political and national aspirations and fear for their economic future."
    text_ar: "في 15 آب 1929 تظاهر أعضاء من حركة «بيتار» الصهيونية عند حائط البراق هاتفين «الحائط حائطنا»، ورفعوا العلم الصهيوني، فأثاروا مخاوف الفلسطينيين على مقدّساتهم، ومن 23 إلى 29 آب امتدّ العنف من القدس إلى أنحاء البلاد. قتل مهاجمون عرب 133 يهوديًّا بحسب الأرقام الرسمية، منهم في الخليل ما بين 59 بحسب المؤرخ كولن شندلر و67 بحسب المؤرخ أليكس ويندر، و20 في صفد بحسب شندلر، وفي الخليل نجا مئات اليهود لأن جيرانهم العرب خبّؤوهم في بيوتهم. وقُتل 116 عربيًّا بحسب الأرقام نفسها، أكثرهم برصاص الشرطة والجيش البريطانيين أثناء قمع الأحداث. ووجدت لجنة شو أن السبب الأساسي هو خيبة آمال العرب السياسية والقومية وخوفهم على مستقبلهم الاقتصادي."
