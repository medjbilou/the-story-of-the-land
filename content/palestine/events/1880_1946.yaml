  - id: e1933_10_jaffa
    title: "The Yafa demonstration of 1933"
    title_ar: "مظاهرة يافا 1933"
    text: "On 27 October 1933 thousands marched in Yafa (Jaffa) in defiance of a ban, in a protest called by the Arab Executive against British policy and the surge in Jewish immigration. Police under the officer Faraday fired into the crowd, and the government's commission of inquiry counted 15 dead in Yafa: one policeman killed by a stone, and the rest shot, among them a six-year-old boy hit by a stray bullet. Demonstrations and a week-long strike spread to Hayfa (Haifa), Nablus and al-Quds (Jerusalem), police gunfire killed 26 people that month by the same commission's count, and it cleared the police entirely. At the Yafa march British police clubbed the elderly leader Musa Kazim al-Husseini, about 80, to the ground; he died in March 1934."
    text_ar: "في 27 تشرين الأول 1933 خرج الآلاف في يافا، متحدّين قرار المنع، في مظاهرة دعت إليها اللجنة التنفيذية العربية احتجاجًا على السياسة البريطانية وتصاعد الهجرة اليهودية. فأطلقت الشرطة بقيادة الضابط فاراداي النار على الحشد، وأحصت لجنة التحقيق الحكومية 15 قتيلًا في يافا، منهم شرطي قُتل بحجر، أما الباقون فقُتلوا بالرصاص، ومنهم طفل في السادسة أصابته رصاصة طائشة. وامتدّت المظاهرات، ومعها إضراب استمرّ أسبوعًا، إلى حيفا ونابلس والقدس، فبلغ عدد من قتلهم رصاص الشرطة في ذلك الشهر 26 شخصًا بحسب اللجنة نفسها، التي برّأت الشرطة تمامًا. وفي مظاهرة يافا ضربت الشرطة البريطانية الزعيم المسنّ موسى كاظم الحسيني، وهو في نحو الثمانين، حتى أسقطته أرضًا، وتوفّي في آذار 1934."
