  - id: e1937_11_farhan
    title: "Sheikh Farhan al-Sa'di is hanged"
    title_ar: "إعدام الشيخ فرحان السعدي"
    text: "From June 1937 Britain made unlicensed possession of weapons or ammunition a capital offence; since many Jews carried arms under licence, the law fell mainly on Palestinians, and most of the 108 men hanged in 'Akka (Acre) prison during the revolt were executed for possessing arms. On 27 November 1937 Britain hanged Sheikh Farhan al-Sa'di, a Qassamite commander from the Jenin area aged about 75, who had led the Anabta ambush. He was sentenced to death for carrying a single bullet and hanged while fasting in Ramadan."
    text_ar: "منذ حزيران 1937 جعلت بريطانيا حيازة السلاح أو الذخيرة دون ترخيص جريمة عقوبتها الإعدام، ولأن كثيرًا من اليهود كانوا يحملون السلاح بترخيص، وقع القانون على الفلسطينيين أساسًا، وأُعدم معظم الـ108 الذين شُنقوا في سجن عكا خلال الثورة بتهمة حيازة السلاح. وفي 27 تشرين الثاني 1937 أعدمت بريطانيا الشيخ فرحان السعدي، القائد القسّامي من منطقة جنين وهو في نحو الخامسة والسبعين، وكان قد قاد كمين عنبتا. وقد حُكم عليه بالإعدام لحمله رصاصة واحدة، وشُنق وهو صائم في رمضان."
    scope: "region:jenin"
    place: jenin
