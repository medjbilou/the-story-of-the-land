  - id: e1938_09_bassa
    title: "The al-Bassa massacre of 1938"
    title_ar: "مجزرة البصة 1938"
    text: "On 6 September 1938 a landmine near al-Bassa in the western Galilee killed four soldiers of the Royal Ulster Rifles. The next day British troops razed the village and rounded up about 50 of its people. By British testimony, the soldiers shot those who tried to run and forced the rest onto a bus that was driven over a mine they had laid; at least 20 Palestinians were killed. The soldiers then made the villagers dig a pit and throw the remains of the bodies into it."
    text_ar: "في 6 أيلول 1938 قتل لغم قرب قرية البصة في الجليل الغربي أربعة جنود من فوج بنادق ألستر الملكية البريطاني. وفي اليوم التالي دمّرت القوات البريطانية القرية وجمعت نحو 50 من أهلها. وبحسب شهادات بريطانية أطلق الجنود النار على من حاول الفرار، وأجبروا الباقين على ركوب حافلة سيقت فوق لغم زرعوه، فقُتل 20 فلسطينيًّا على الأقل. ثم أجبر الجنود أهل القرية على حفر حفرة وإلقاء أشلاء الجثث فيها."
    scope: "region:al_bassa"
    place: al_bassa
    tags: [sensitive]
    from: 1938-09-01
    to: 1938-10-01
    day: 6
    effects:
