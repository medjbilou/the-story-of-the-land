  - id: e1922_07_mandate
    title: "The Mandate is confirmed"
    title_ar: "صكّ الانتداب"
    text: "In July 1922 the League of Nations approved the Mandate for Palestine, which wrote the Balfour Declaration into international law. Article 2 made Britain responsible for securing \"the establishment of the Jewish national home\", Article 6 required it to facilitate Jewish immigration and encourage \"close settlement by Jews on the land\", and the text never once names the Arabs of Palestine. The first British census, on 23 October 1922, counted 757,182 people, of whom 83,794, about 11%, were Jews."
    text_ar: "في تموز 1922 أقرّت عصبة الأمم صكّ الانتداب على فلسطين، فصار وعد بلفور جزءًا من القانون الدولي. وحمّلت المادة الثانية بريطانيا مسؤولية تهيئة البلاد «لإنشاء الوطن القومي اليهودي»، وألزمتها المادة السادسة بتسهيل الهجرة اليهودية وتشجيع «حشد اليهود» في الأراضي، ولم يذكر الصكّ عرب فلسطين بالاسم مرة واحدة. وأحصى أول تعداد بريطاني للسكان، في 23 تشرين الأول 1922، 757,182 نسمة، منهم 83,794 يهوديًّا، أي نحو 11%."
    scope: "national"
    from: 1922-07-01
    to: 1922-08-01
    effects:
