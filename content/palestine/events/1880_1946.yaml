  - id: e1929_10_women
    title: "The first Arab Women's Congress"
    title_ar: "المؤتمر النسائي العربي الأول"
    text: "On 26 October 1929 between 200 and 300 women from across Palestine met in al-Quds (Jerusalem) for the first Palestine Arab Women's Congress, led by Salma al-Husseini. They demanded the repeal of the Balfour Declaration, an end to Jewish immigration, the cancellation of the collective punishment ordinance and an end to the mistreatment of prisoners and demonstrators, and a delegation took their demands to the High Commissioner. The congress elected a 14-member executive committee and called for women's societies in the cities, which went on to support the strikers and rebels of 1936–39."
    text_ar: "في 26 تشرين الأول 1929 اجتمعت في القدس ما بين 200 و300 امرأة من أنحاء فلسطين في المؤتمر النسائي العربي الفلسطيني الأول، برئاسة سلمى الحسيني. وطالبن بإلغاء وعد بلفور، ووقف الهجرة اليهودية، وإلغاء قانون العقوبات الجماعية، ووقف التنكيل بالسجناء والمتظاهرين، وحملت المندوبات مطالبهن إلى المندوب السامي. وانتخب المؤتمر لجنة تنفيذية من 14 عضوًا ودعا إلى تأسيس جمعيات نسائية في المدن، وقد ساندت هذه الجمعيات المضربين والثوار في 1936–1939."
