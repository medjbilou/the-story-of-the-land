    options:
      - id: hide_stores
        text: "Hide the winter stores in a cave"
        text_ar: "نخبّئ مؤونة الشتاء في مغارة"
        outcome: "The wheat and oil stayed safe in the cave, and only the father and mother knew where it was."
        outcome_ar: "بقي القمح والزيت سالمين في المغارة، ولم يعرف مكانها إلا الأب والأم."
