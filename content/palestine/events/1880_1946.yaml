  - id: e1938_10_repression
    title: "Collective punishment"
    title_ar: "العقاب الجماعي"
    text: "On 15 October 1938 rebels seized the Old City of al-Quds (Jerusalem) and barricaded its gates; British troops retook it that same month, by which time the army had taken over security from the civil authorities. That month Britain razed the Galilee village of Mi'ar, and across the country houses were blown up, sometimes with sea mines from the battleship HMS Malaya. Collective fines over the revolt came to about £1 million, livestock was confiscated, and witnesses recall soldiers mixing the flour with the grain and the oil during searches."
    text_ar: "في 15 تشرين الأول 1938 سيطر الثوار على البلدة القديمة في القدس وأغلقوا أبوابها، فاستعادتها القوات البريطانية في الشهر نفسه، وكان الجيش قد تسلّم زمام الأمن من السلطات المدنية. وفي ذلك الشهر سوّت بريطانيا قرية ميعار في الجليل بالأرض، وكانت تنسف البيوت في قرى كثيرة، أحيانًا بألغام بحرية من البارجة «مالايا». وبلغت الغرامات الجماعية خلال الثورة نحو مليون جنيه، وصودرت المواشي، وتروي شهادات أن الجنود كانوا يخلطون الطحين بالحبوب والزيت أثناء التفتيش."
    scope: "national"
    from: 1938-10-01
    to: 1938-11-01
    day: 15
