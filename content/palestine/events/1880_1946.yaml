  - id: e1946_12_eve
    title: "On the eve of partition"
    title_ar: "عشية التقسيم"
    text: "At the end of 1946 Palestine had about 1,846,000 people, some 1,203,000 Arabs and 608,000 Jews, and Jews owned only about 6–7% of the land. Through the 1940s, after a 1940 proposal to the Jewish National Fund, Haganah intelligence compiled \"village files\" on every Arab village: its access roads, the ages of its men from 16 to 50 and, by Ilan Pappé's account, a \"hostility\" index based on its part in the 1936 revolt. Meanwhile the British authorities were arresting Palestinians for holding arms; Al Jazeera says more than 300 were arrested in the first half of 1946 alone. In April 1946 an Anglo-American committee recommended admitting 100,000 Jewish displaced persons from Europe, as President Truman had asked."
    text_ar: "في نهاية 1946 كان في فلسطين نحو مليون و846 ألف نسمة، منهم قرابة مليون و203 آلاف عربي و608 آلاف يهودي، ولم يكن اليهود يملكون إلا نحو 6–7% من الأرض. وطوال الأربعينيات كان جهاز استخبارات عصابة الهاغاناه الصهيونية يجمع «ملفات القرى» عن كل قرية عربية، وهو مشروع اقتُرح على الصندوق القومي اليهودي عام 1940، وتضمّن ملفّ كل قرية طرق الوصول إليها وأعمار رجالها من السادسة عشرة إلى الخمسين، و«مؤشر عداء» يقيس مشاركتها في ثورة 1936 بحسب المؤرخ إيلان بابيه. وفي الوقت نفسه كانت السلطات البريطانية تعتقل الفلسطينيين بتهمة حيازة السلاح، وتقول الجزيرة إن أكثر من 300 منهم اعتُقلوا في النصف الأول من 1946 وحده. وفي نيسان 1946 أوصت لجنة تحقيق أنجلو-أمريكية بإدخال 100 ألف من اليهود المهجّرين في أوروبا، كما كان قد طلب الرئيس الأمريكي ترومان."
    scope: "national"
