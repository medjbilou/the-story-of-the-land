  - id: e1938_06_night_squads
    title: "The Special Night Squads"
    title_ar: "فرق الليل الخاصة"
    text: "In early June 1938 the British officer Orde Wingate set up the Special Night Squads, joint units of British soldiers and Jewish supernumerary police all drawn from the Zionist Haganah; Moshe Dayan and Yigal Allon were among the men he trained. They raided villages such as Daburiyya at night to protect the oil pipeline from Iraq to Hayfa (Haifa). The British official Hugh Foot called their methods \"extreme and cruel\", including torture, whipping and the execution of Arabs, and by the account of the Israeli military historian Martin van Creveld the men were trained to interrogate prisoners by shooting every tenth man. Britain paid, uniformed and armed some 14,000 Jewish Settlement Police, a thinly veiled front for the Haganah."
    text_ar: "في مطلع حزيران 1938 أنشأ الضابط البريطاني أورد وينغيت «فرق الليل الخاصة»، وهي وحدات مشتركة من جنود بريطانيين وشرطة يهودية إضافية كان أفرادها جميعًا من عصابة الهاغاناه الصهيونية، وكان موشيه دايان ويغآل ألون ممّن درّبهم. وكانت تداهم القرى ليلًا، مثل دبورية، لحماية خط أنابيب النفط الممتد من العراق إلى حيفا. ووصف المسؤول البريطاني هيو فوت أساليبها بأنها «متطرفة وقاسية»، وشملت التعذيب والجلد وإعدام عرب، وبحسب المؤرخ العسكري الإسرائيلي مارتن فان كريفلد كان رجالها يُدرَّبون على استجواب الأسرى بقتل واحد من كل عشرة منهم رميًا بالرصاص. وكانت بريطانيا تموّل نحو 14 ألفًا من شرطة المستوطنات اليهودية وتُلبسهم الزيّ الرسمي وتسلّحهم، وكانت هذه الشرطة واجهة لا تكاد تخفي الهاغاناه."
    scope: "national"
    tags: [sensitive]
    from: 1938-06-01
    to: 1938-07-01
    effects:
      - { target: safety, delta: -0.1 }
      - { target: family, delta: -0.03 }
    options:
      - id: night_watch
        text: "Take turns keeping watch at the edge of the village"
        text_ar: "نتناوب على السهر عند أطراف القرية"
        outcome: "The men whistled at any strange light, and the whole house woke."
        outcome_ar: "كان الرجال يطلقون صفيرًا عند أي ضوء غريب، فيستيقظ البيت كله."
        effects:
          - { target: safety, delta: 0.03 }
          - { target: community, delta: 0.03 }
          - { target: family, delta: -0.02 }
