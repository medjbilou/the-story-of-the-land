  - id: e1937_10_seychelles
    title: "The leadership outlawed and exiled"
    title_ar: "حظر اللجنة العليا ونفي القادة"
    text: "On 26 September 1937 Qassamite gunmen shot dead Lewis Andrews, the acting District Commissioner of the Galilee, in al-Nasira (Nazareth). Palestinians hated him for his harsh enforcement of British measures after the 1936 strike and for helping Zionist land purchases in the Hula Valley. Britain outlawed the Arab Higher Committee and the National Committees, removed Haj Amin al-Husseini from the Supreme Muslim Council, deported five leaders to the Seychelles and opened a special detention camp near 'Akka (Acre). In October the Mufti fled to Lebanon, and Britain closed the borders and censored the press."
    text_ar: "في 26 أيلول 1937 قتل مسلّحون من أتباع القسّام لويس أندروز، حاكم لواء الجليل بالوكالة، في الناصرة. وكان الفلسطينيون يمقتونه لقسوته في تنفيذ الإجراءات البريطانية بعد إضراب 1936، ولمساعدته الصهيونيين على شراء الأراضي في سهل الحولة. فحظرت بريطانيا اللجنة العربية العليا واللجان القومية، وعزلت الحاج أمين الحسيني من رئاسة المجلس الإسلامي الأعلى، ونفت خمسة من القادة إلى جزر سيشل، وفتحت معتقلًا خاصًّا قرب عكا. وفي تشرين الأول فرّ المفتي إلى لبنان، وأغلقت بريطانيا الحدود وفرضت الرقابة على الصحف."
    scope: "national"
    place: nazareth
    tags: [sensitive]
