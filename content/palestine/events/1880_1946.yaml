  - id: e1880_01_ottoman
    title: "Ottoman Palestine"
    title_ar: "فلسطين العثمانية"
    text: "The Ottoman census of 1878 counted about 462,000 Ottoman subjects in Palestine: some 87% Muslims, 9% Christians and 3% Jews, plus a few thousand foreign-born Jews. The economy rested on grain, olive oil and the Yafa (Jaffa) orange, whose exports grew from 200,000 oranges in 1845 to 38 million in 1870, and by 1907 Nablus had 30 soap works making nearly 5,000 tons of olive-oil soap a year. By 1914 the population was estimated at about 690,000 or more, the great majority of them Arab Muslims and Christians."
    text_ar: "بحسب الإحصاء العثماني لعام 1878 بلغ عدد الرعايا العثمانيين في فلسطين نحو 462 ألفًا: قرابة 87% مسلمون و9% مسيحيون و3% يهود، فضلًا عن بضعة آلاف من اليهود الأجانب. وقام اقتصاد البلاد على الحبوب وزيت الزيتون وبرتقال يافا، الذي ارتفعت صادراته من 200 ألف برتقالة عام 1845 إلى 38 مليونًا عام 1870، وكان في نابلس عام 1907 ثلاثون مصبنة تنتج نحو 5000 طن من صابون زيت الزيتون في السنة. وبحلول عام 1914 قُدّر عدد السكان بنحو 690 ألفًا أو أكثر، أغلبيتهم الساحقة من العرب المسلمين والمسيحيين."
