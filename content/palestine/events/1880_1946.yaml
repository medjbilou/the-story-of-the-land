  - id: e1908_12_karmil
    title: "Al-Karmil"
    title_ar: "جريدة «الكرمل»"
    text: "In December 1908, after the Young Turk Revolution lifted press censorship, Najib Nassar began publishing al-Karmil in Hayfa (Haifa), the first Arabic weekly in Palestine devoted to opposing Zionism. He warned his readers against selling land to Zionist buyers, helped found an association in Hayfa to resist Zionist and colonial schemes, and in 1911 published a book, Zionism: Its History, Objective and Importance."
    text_ar: "في كانون الأول 1908، بعد أن رفعت ثورة «تركيا الفتاة» الرقابة عن الصحف، أصدر نجيب نصّار في حيفا جريدة «الكرمل»، أول صحيفة عربية أسبوعية في فلسطين تتصدّى للصهيونية. وحذّر قرّاءه من بيع الأرض للصهيونيين، وشارك في تأسيس جمعية في حيفا لمقاومة المشاريع الصهيونية والاستعمارية، ونشر عام 1911 كتابه «الصهيونية: تاريخها، غرضها، أهميتها»."
    scope: "region:haifa"
    place: haifa
    from: 1908-12-01
    to: 1909-01-01
    effects:
