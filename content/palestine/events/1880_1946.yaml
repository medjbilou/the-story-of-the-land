  - id: e1925_04_balfour_visit
    title: "Balfour visits Palestine"
    title_ar: "بلفور في فلسطين"
    text: "In spring 1925 Lord Balfour came to Palestine to open the Hebrew University in al-Quds (Jerusalem), and Palestinians met him with a general strike and black flags. One witness recalls Muslim women from al-Khalil (Hebron) and al-Quds marching with Christian women to the High Commissioner's residence. Britain's 1925 report to the League of Nations recorded 33,801 Jewish immigrants that year, nearly three times as many as in 1924, the purchase by Jews of 32,500 acres (about 131,000 dunams) of farmland, and 13 new Jewish agricultural settlements."
    text_ar: "في ربيع 1925 جاء اللورد بلفور إلى فلسطين لافتتاح الجامعة العبرية في القدس، فاستقبله الفلسطينيون بإضراب عام وبالرايات السوداء. وتروي إحدى الشاهدات أن نساءً مسلمات من الخليل والقدس سرن مع نساء مسيحيات حتى مقرّ المندوب السامي. وسجّل تقرير بريطانيا إلى عصبة الأمم عن عام 1925 دخول 33,801 مهاجر يهودي في ذلك العام، أي قرابة ثلاثة أضعاف هجرة 1924، وشراء اليهود نحو 131 ألف دونم من الأراضي الزراعية، وإنشاء 13 مستوطنة زراعية يهودية جديدة."
    scope: "national"
