  - id: e1949_03_faluja
    title: "Al-Faluja and Iraq al-Manshiyya"
    title_ar: "الفالوجة وعراق المنشية"
    text: "About 4,000 Egyptian troops, among them Major Gamal Abdel Nasser, were besieged in al-Faluja and Iraq al-Manshiyya from late October 1948 to late February 1949. The armistice guaranteed the safety and property of the two villages' 3,140 Arab civilians, locals and refugees. After the Egyptian brigade left on 26 February, Israeli forces broke the agreement and intimidated the people into flight; UN observers reported beatings, robberies and attempted rape. The last villagers left on 22 April, and five days later Yitzhak Rabin ordered the villages demolished."
    text_ar: "حوصر نحو 4000 جندي مصري، بينهم الرائد جمال عبد الناصر، في الفالوجة وعراق المنشية من أواخر تشرين الأول 1948 حتى أواخر شباط 1949. وضمنت اتفاقية الهدنة سلامة المدنيين العرب في القريتين وأملاكهم، وكانوا 3140 نسمة من الأهالي واللاجئين. لكن بعد انسحاب اللواء المصري في 26 شباط خرقت قوات الاحتلال الاتفاقية وأخذت تروّع السكان لدفعهم إلى الرحيل، وسجّل مراقبو الأمم المتحدة حالات ضرب وسرقة ومحاولات اغتصاب. وخرج آخر الأهالي في 22 نيسان، وبعد خمسة أيام أمر يتسحاق رابين بهدم القريتين."
    scope: "region:al_faluja"
    place: al_faluja
