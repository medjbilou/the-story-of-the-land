  - id: e1948_02_qisarya
    title: "The expulsion of Qisarya"
    title_ar: "طرد أهالي قيسارية"
    text: "In February 1948 units of the Palmach, the Haganah's strike force, expelled the Arab residents of Qisarya, on the coast south of Hayfa (Haifa); the houses were looted, and on 19–20 February the Palmach's Fourth Battalion demolished them. Al Jazeera's documentary dates the expulsion to 15 February and puts the number expelled at about 1,500; Mandate statistics had counted 960 residents in 1945."
    text_ar: "في شباط 1948 طردت وحدات من البالماخ، القوة الضاربة لعصابة الهاغاناه الصهيونية، السكانَ العرب من قيسارية على الساحل جنوبي حيفا، ونُهبت البيوت ثم هدمتها الكتيبة الرابعة في البالماخ يومي 19 و20 شباط. ويؤرّخ وثائقي الجزيرة الطرد بيوم 15 شباط ويقدّر عدد المطرودين بنحو 1500، في حين سجّلت إحصاءات الانتداب لعام 1945 في القرية 960 نسمة."
    scope: "region:caesarea"
