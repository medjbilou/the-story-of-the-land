  - id: e1948_07_second_truce
    title: "The second truce"
    title_ar: "الهدنة الثانية"
    text: "After ten days of fighting, from 8 to 18 July 1948, a second truce began on 18 July and held until 15 October. In those ten days al-Lydd (Lydda), al-Ramla (Ramle) and the villages of the Lower Galilee, Saffuriya among them, were captured. Meanwhile the new Israeli state set up a \"Transfer Committee\" and a policy of faits accomplis to prevent the refugees' return, and many emptied villages were levelled."
    text_ar: "بعد عشرة أيام من القتال، من 8 إلى 18 تموز 1948، بدأت هدنة ثانية في 18 تموز استمرت حتى 15 تشرين الأول. وفي تلك الأيام العشرة احتُلّت اللد والرملة وقرى الجليل الأدنى، ومنها صفورية. وفي الأثناء أنشأت الدولة الإسرائيلية الجديدة «لجنة ترحيل» واتّبعت سياسة الأمر الواقع لمنع عودة اللاجئين، فسوّت قرى مهجّرة كثيرة بالأرض."
