  - id: e1947_12_strike
    title: "General strike and the outbreak of fighting"
    title_ar: "إضراب عام واندلاع القتال"
    text: "After the vote, the Arab Higher Committee called a three-day general strike in early December 1947. Blood was soon shed: gunmen from Yafa (Jaffa) killed seven passengers on two Jewish buses on 30 November; an Irgun bomb killed 20 Arabs at the Damascus Gate of al-Quds (Jerusalem) on 12 December; and a Palmach raid on al-Khisas on 18 December killed 10–15 villagers, five of them children."
    text_ar: "بعد صدور القرار أعلنت الهيئة العربية العليا إضرابًا عامًّا استمر ثلاثة أيام في مطلع كانون الأول 1947. وسرعان ما سال الدم: قتل مسلّحون من يافا سبعة ركاب في حافلتين يهوديتين في 30 تشرين الثاني، وقتلت قنبلة لعصابة الإرغون الصهيونية 20 عربيًّا عند باب العامود في القدس في 12 كانون الأول، وقتل البالماخ، القوة الضاربة لعصابة الهاغاناه الصهيونية، ما بين 10 و15 من أهالي الخصاص، بينهم خمسة أطفال، في 18 كانون الأول."
    scope: "national"
