        text_ar: "ينضمّ الابن الأكبر إلى الحراسة الليلية"
        outcome: "The son kept watch with the village men on its edges and slept only at dawn."
        outcome_ar: "سهر الابن مع رجال القرية على أطرافها، ولم ينم إلا مع الفجر."
