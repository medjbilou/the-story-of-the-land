  - id: e1948_04_qastal
    title: "Al-Qastal and the death of Abd al-Qadir al-Husseini"
    title_ar: "القسطل واستشهاد عبد القادر الحسيني"
    text: "Al-Qastal, eight kilometres west of al-Quds (Jerusalem), commanded the Yafa (Jaffa)–al-Quds road; the Palmach took it on 3 April 1948 during the Haganah operation it called \"Nachshon\". The Army of the Holy War besieged it, and its commander Abd al-Qadir al-Husseini was shot dead by a Haganah sentry before dawn on 8 April while scouting the fog-bound hill, two days after writing to the Arab League that it had left Palestinians without arms. His fighters retook the village that day, but most then went to al-Quds for his funeral at al-Aqsa, and the Palmach retook the almost empty village on the night of 8–9 April and blew up most of its houses."
    text_ar: "كانت القسطل، على بعد ثمانية كيلومترات غرب القدس، تتحكّم في طريق يافا–القدس، وقد احتلّها البالماخ في 3 نيسان 1948 خلال عملية سمّتها عصابة الهاغاناه الصهيونية «نحشون». حاصرها جيش الجهاد المقدس، واستُشهد قائده عبد القادر الحسيني فجر 8 نيسان برصاص حارس من الهاغاناه وهو يستطلع التلّة في الضباب، بعد يومين من رسالة حمّل فيها الجامعة العربية مسؤولية ترك الفلسطينيين بلا سلاح. استعاد المقاتلون القرية في اليوم نفسه، لكن أكثرهم توجّهوا إلى القدس لتشييعه في المسجد الأقصى، فعاد البالماخ واحتلّ القرية شبه الخالية ليلة 8–9 نيسان ونسف معظم بيوتها."
