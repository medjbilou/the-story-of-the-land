  - id: e1948_03_dalet
    title: "Plan Dalet"
    title_ar: "خطة دالِت"
    text: "On 10 March 1948 the command of the Haganah, the main Zionist militia, finalised Plan Dalet, drawn up at David Ben-Gurion's request. It provided for destroying Arab villages by fire, explosives and mines, and for expelling their people wherever there was resistance; Ilan Pappé writes that each brigade commander received a list of villages to take, destroy and empty. Between 1 April and 14 May, 8 of its 13 major operations took place outside the area the partition plan allotted to the Jewish state."
    text_ar: "في 10 آذار 1948 أقرّت قيادة الهاغاناه، كبرى العصابات الصهيونية، خطة دالِت التي وُضعت بطلب من دافيد بن غوريون. ونصّت الخطة على تدمير القرى العربية بالإحراق والنسف وزرع الألغام، وعلى طرد سكانها حيثما وُجدت مقاومة، ويذكر إيلان بابيه أن كل قائد لواء تسلّم قائمة بالقرى التي عليه احتلالها وتدميرها وتهجير أهلها. وبين 1 نيسان و14 أيار نُفّذت 8 من عملياتها الكبرى الثلاث عشرة خارج المنطقة التي خصّصها قرار التقسيم للدولة اليهودية."
    scope: "national"
    from: 1948-03-01
    to: 1948-04-01
    day: 10
