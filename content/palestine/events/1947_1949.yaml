  - id: e1949_04_armistices
    title: "Armistices with Lebanon and Jordan"
    title_ar: "الهدنة مع لبنان والأردن"
    text: "Israel signed armistices with Lebanon on 23 March 1949 and with Jordan on 3 April. Under the Jordan agreement the Wadi Ara villages of the \"Little Triangle\" passed to Israeli control and were handed over in May 1949. The West Bank stayed under Jordanian control, and Jordan annexed it in 1950."
    text_ar: "وقّعت إسرائيل اتفاقية هدنة مع لبنان في 23 آذار 1949، ومع الأردن في 3 نيسان. وبموجب الاتفاقية مع الأردن انتقلت قرى وادي عارة في «المثلث الصغير» إلى السيطرة الإسرائيلية، وسُلّمت في أيار 1949. وبقيت الضفة الغربية تحت سيطرة الأردن الذي ضمّها عام 1950."
    scope: "national"
