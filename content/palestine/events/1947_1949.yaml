  - id: e1948_01_ala
    title: "The Arab Liberation Army arrives"
    title_ar: "دخول جيش الإنقاذ"
    text: "From January 1948, Arab volunteers of the Arab Liberation Army, set up by the Arab League and led by Fawzi al-Qawuqji, entered Palestine. About 6,000 had joined by mid-March, and by General Ismail Safwat's estimate perhaps as few as 3,500 were actually deployed. Meanwhile the Army of the Holy War, led by Abd al-Qadir al-Husseini and Hasan Salama, was fighting around al-Quds (Jerusalem) and around al-Lydd (Lydda) and al-Ramla (Ramle)."
    text_ar: "ابتداءً من كانون الثاني 1948 دخل فلسطينَ متطوعون عرب في جيش الإنقاذ العربي، الذي أنشأته جامعة الدول العربية وقاده فوزي القاوقجي. بلغ عدد المنضمّين إليه نحو 6000 بحلول منتصف آذار، وقدّر اللواء إسماعيل صفوت أن من انتشر منهم فعلًا ربما لم يتجاوز 3500. وفي الوقت نفسه كان جيش الجهاد المقدس، بقيادة عبد القادر الحسيني وحسن سلامة، يقاتل في منطقة القدس وفي منطقة اللد والرملة."
    scope: "national"
    from: 1948-01-01
    to: 1948-02-01
    effects:
