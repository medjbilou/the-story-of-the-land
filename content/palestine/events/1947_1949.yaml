  - id: e1948_12_absentee
    title: "\"Absentee\" property"
    title_ar: "أملاك «الغائبين»"
    text: "In December 1948 Israel issued emergency regulations on absentees' property, placing refugees' homes and land in state hands; the Absentees' Property Law of 1950 replaced them. These laws barred the people it had uprooted from returning or reclaiming their property, even the 46,000 internally displaced among the 156,000 Palestinians left inside its lines (UNRWA, 1950), who became \"present absentees\". By 1954 more than a third of Israel's Jewish population lived on absentee property."
    text_ar: "في كانون الأول 1948 أصدرت إسرائيل أنظمة طوارئ بشأن أملاك الغائبين، فوضعت بيوت اللاجئين وأراضيهم في يد الدولة، ثم حلّ محلها قانون أملاك الغائبين عام 1950. وبهذه القوانين مُنع من هجّرتهم من العودة أو المطالبة بأملاكهم، حتى المهجّرون داخل وطنهم، وعددهم 46 ألفًا من أصل 156 ألف فلسطيني بقوا داخل خطوطها (الأونروا، 1950)، فصاروا «حاضرين غائبين». وبحلول عام 1954 كان أكثر من ثلث السكان اليهود في إسرائيل يعيشون في أملاك الغائبين."
    scope: "national"
    from: 1948-12-01
    to: 1949-01-01
    effects:
      - { target: land, delta: -0.1 }
      - { target: documents, delta: -0.05 }
      - { target: home, delta: -0.05 }
    options:
      - id: hide_deeds
        text: "Hide the land deeds somewhere safe"
        text_ar: "نخبّئ سندات الأرض في مكان آمن"
        outcome: "The mother sewed the deeds into a cloth bag and hid it at the bottom of the chest."
        outcome_ar: "خاطت الأم السندات في كيس من القماش، وأخفته في قاع الصندوق."
        effects:
