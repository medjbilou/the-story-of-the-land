  - id: e1948_11_first_winter
    title: "The first winter of exile"
    title_ar: "شتاء المنفى الأول"
    text: "On 19 November 1948 the UN General Assembly, in Resolution 212, set up the UN Relief for Palestine Refugees for emergency aid. One refugee woman recalls hunger under the olive trees, people selling the wool from their mattresses to buy flour, and two families sharing one tent with stones on the pegs against the winter wind. Her three-year-old brother died of a simple illness."
    text_ar: "في 19 تشرين الثاني 1948 أنشأت الجمعية العامة للأمم المتحدة بقرارها 212 هيئة الأمم المتحدة لإغاثة اللاجئين الفلسطينيين لتقديم الإغاثة العاجلة. وتروي لاجئة كيف جاع الناس تحت أشجار الزيتون، وكيف باعوا صوف فُرُشهم ليشتروا الطحين، وكيف تقاسمت عائلتان خيمة واحدة ثبّتتا أوتادها بالحجارة في وجه رياح الشتاء. ومات أخوها ابن السنوات الثلاث من مرض بسيط."
    scope: "national"
    from: 1948-11-01
    to: 1948-12-01
    day: 19
    effects:
