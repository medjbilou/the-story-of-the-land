  - id: e1949_09_count
    title: "The count of the Nakba"
    title_ar: "حصيلة النكبة"
    text: "In September 1949 the UN Conciliation Commission for Palestine estimated 711,000 refugees outside Israel; other estimates reach about 750,000. About 160,000 Palestinians remained inside Israel, roughly a quarter of them displaced within their own country. Counts of depopulated villages and towns depend on the method: 369 (Morris), 418 villages (Walid Khalidi) and about 530 localities (Salman Abu Sitta). The Syrian intellectual Constantin Zureiq first gave the catastrophe its name in his 1948 book Ma'na al-Nakba (The Meaning of the Nakba). The last armistice, with Syria, had been signed on 20 July 1949."
    text_ar: "في أيلول 1949 قدّرت لجنة الأمم المتحدة للتوفيق بشأن فلسطين عدد اللاجئين خارج إسرائيل بنحو 711 ألفًا، وتصل تقديرات أخرى إلى نحو 750 ألفًا. وبقي داخل إسرائيل نحو 160 ألف فلسطيني، ربعهم تقريبًا مهجّرون داخل وطنهم. وتختلف أعداد القرى والبلدات المهجّرة باختلاف طريقة العدّ: 369 عند موريس، و418 قرية عند وليد الخالدي، ونحو 530 موقعًا عند سلمان أبو ستة. وأول من أطلق اسم «النكبة» على ما جرى هو المفكّر السوري قسطنطين زريق في كتابه «معنى النكبة» الصادر عام 1948. وكانت آخر اتفاقيات الهدنة، مع سوريا، قد وُقّعت في 20 تموز 1949."
    scope: "national"
    from: 1949-09-01
    to: 1949-10-01
    effects:
      - { target: memory, delta: 0.05 }
    options:
