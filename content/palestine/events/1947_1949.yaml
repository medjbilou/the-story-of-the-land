  - id: e1949_12_unrwa
    title: "UNRWA is founded"
    title_ar: "تأسيس الأونروا"
    text: "On 8 December 1949 the UN General Assembly, in Resolution 302, created the UN Relief and Works Agency for Palestine Refugees in the Near East (UNRWA), citing paragraph 11 of Resolution 194. It was meant to provide relief and work until a political solution was found, and it began operating in 1950, serving about 700,000 refugees."
    text_ar: "في 8 كانون الأول 1949 أنشأت الجمعية العامة للأمم المتحدة، بقرارها 302، وكالة الأمم المتحدة لإغاثة وتشغيل اللاجئين الفلسطينيين في الشرق الأدنى (الأونروا)، مستندةً إلى الفقرة 11 من القرار 194. وقد أُنشئت لتقديم الإغاثة وفرص العمل إلى أن تُحلّ القضية سياسيًّا، وبدأت عملها عام 1950 وهي تخدم نحو 700 ألف لاجئ."
    scope: "national"
    from: 1949-12-01
    to: 1950-01-01
    day: 8
    effects:
      - { target: livelihood, delta: 0.05 }
      - { target: documents, delta: 0.05 }
    options:
      - id: register
        text: "Register the family and keep the refugee card"
        text_ar: "نسجّل العائلة ونحتفظ ببطاقة اللاجئ"
        outcome: "The family now had a card bearing its members' names and its village's name."
        outcome_ar: "صارت للعائلة بطاقة تحمل أسماء أفرادها واسم قريتها."
        effects:
          - { target: documents, delta: 0.1 }
          - { target: livelihood, delta: 0.05 }
      - id: write_village
        text: "Write the village's name on every paper"
        text_ar: "نكتب اسم القرية على كل ورقة"
        outcome: "No paper in the chest was without the village's name."
        outcome_ar: "لم تخلُ ورقة في الصندوق من اسم القرية."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: documents, delta: 0.03 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/UNRWA", checked: 2026-10-19 }
  - id: fate_depopulated
    title: "The day {village_en} was emptied"
    title_ar: "يوم التهجير من {village_ar}"
    text: "This month the people of {village_en} were forced from their homes. In that war people were driven out under fire, by expulsion orders, or by fear of what had been done in other villages, and Israeli forces almost always barred them from coming back. Your family has a few hours to decide what to carry and what to leave."
    text_ar: "في هذا الشهر أُخرج أهل {village_ar} من بيوتهم. ففي تلك الحرب هُجّر الناس تحت النار، أو بأوامر الطرد، أو خوفًا مما ارتُكب في قرى أخرى، وكانت قوات الاحتلال تمنعهم من العودة في كل الأحوال تقريبًا. وأمام عائلتك ساعات قليلة لتقرّر ما تحمله وما تتركه."
    scope: "fate:depopulated"
    from: 1947-11-01
    to: 1950-01-01
    effects:
      - { target: home, delta: -0.15 }
      - { target: land, delta: -0.1 }
      - { target: safety, delta: -0.05 }
    options:
      - id: key_and_deeds
        text: "Carry the key and the land deeds"
        text_ar: "نحمل المفتاح وسندات الأرض"
        outcome: "The father locked the door and pocketed the key, and the mother wrapped the deeds in her scarf."
        outcome_ar: "أقفل الأب الباب ووضع المفتاح في جيبه، ولفّت الأم السندات في منديلها."
        effects:
          - { target: documents, delta: 0.1 }
          - { target: memory, delta: 0.05 }
          - { target: livelihood, delta: -0.05 }
      - id: food_children
        text: "Carry food, and the children first"
        text_ar: "نحمل الطعام والأطفال أولًا"
        outcome: "Each adult carried a child and a bundle of bread, and the papers stayed on the shelf."
        outcome_ar: "حمل كل كبير طفلًا وصرّة خبز، وبقيت الأوراق على الرفّ."
        effects:
          - { target: family, delta: 0.1 }
          - { target: documents, delta: -0.05 }
      - id: hide_orchards
        text: "Hide in the orchards near the village"
        text_ar: "نختبئ في البساتين قرب القرية"
        outcome: "The family hid among the trees for days, able to see its house but not reach it."
        outcome_ar: "اختبأت العائلة بين الأشجار أيامًا، ترى بيتها ولا تستطيع الوصول إليه."
        effects:
          - { target: sumud, delta: 0.1 }
          - { target: safety, delta: -0.15 }
          - { target: land, delta: 0.03 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/1948_Palestinian_expulsion_and_flight", checked: 2026-10-19 }
  - id: fate_destroyed
    title: "{village_en} is destroyed"
    title_ar: "هدم {village_ar}"
    text: "News reaches the family in exile that the houses of {village_en} have been demolished. Of the 418 villages Walid Khalidi documented, 292 were completely destroyed and 90 largely destroyed, and Israeli forces levelled many emptied villages to prevent any return."
    text_ar: "يبلغ العائلةَ في منفاها أن بيوت {village_ar} قد هُدمت. فمن بين 418 قرية وثّقها وليد الخالدي، دُمّرت 292 قرية تدميرًا كاملًا و90 قرية تدميرًا شبه كامل، وسوّت قوات الاحتلال كثيرًا من القرى المهجّرة بالأرض لمنع أي عودة."
    scope: "fate:destroyed"
    from: 1947-11-01
    to: 1950-01-01
    effects:
      - { target: home, delta: -0.15 }
      - { target: memory, delta: 0.05 }
    options:
      - id: record_houses
        text: "Write down every house and its owner"
        text_ar: "نكتب أسماء البيوت وأصحابها"
        outcome: "The grandfather drew the lanes on paper and wrote each family's name on its house."
        outcome_ar: "رسم الجدّ الأزقّة على ورقة، وكتب على كل بيت اسم أهله."
        effects:
          - { target: memory, delta: 0.1 }
          - { target: documents, delta: 0.03 }
      - id: gather_villagers
        text: "Gather with the other villagers in exile"
        text_ar: "نجتمع بأهل القرية في المنفى"
        outcome: "The villagers sat together and recalled the village house by house late into the night."
        outcome_ar: "جلس أهل القرية معًا، واستعادوا بيتًا بعد بيت حتى ساعة متأخرة."
        effects:
          - { target: community, delta: 0.1 }
          - { target: memory, delta: 0.03 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/1948_Palestinian_expulsion_and_flight", checked: 2026-10-19 }
      - { url: "https://en.wikipedia.org/wiki/Plan_Dalet", checked: 2026-10-19 }
      - { url: "https://en.wikipedia.org/wiki/Palestinian_right_of_return", checked: 2026-10-19 }
  - id: fate_built_over
    title: "On the land of {village_en}"
    title_ar: "على أرض {village_ar}"
    text: "An Israeli locality now stands on the land of {village_en}. Of 370 new Jewish settlements established between 1948 and 1953, 350 were built on absentee property. The family still keeps the village's name and the boundaries of its fields."
    text_ar: "قامت على أرض {village_ar} بلدة إسرائيلية جديدة. فمن بين 370 مستوطنة يهودية أُنشئت بين عامي 1948 و1953، أُقيمت 350 على أملاك الغائبين. وما زالت العائلة تحفظ اسم القرية وحدود حقولها."
    scope: "fate:built_over"
    from: 1947-11-01
    to: 1950-01-01
    effects:
      - { target: land, delta: -0.15 }
      - { target: memory, delta: 0.05 }
      - { target: sumud, delta: 0.03 }
    options:
      - id: draw_map
        text: "The grandfather draws the village from memory"
        text_ar: "يرسم الجدّ خريطة القرية من الذاكرة"
        outcome: "The grandfather forgot no tree and no well, and hung the map at the head of the room."
        outcome_ar: "لم ينسَ الجدّ شجرة ولا بئرًا، وعلّق الخريطة في صدر البيت."
        effects:
          - { target: memory, delta: 0.1 }
          - { target: family, delta: 0.03 }
      - id: tell_story
        text: "Tell the village's story to the grandchildren"
        text_ar: "نروي حكاية القرية للأحفاد"
        outcome: "The grandchildren came to know the way to the village as if they had walked it themselves."
        outcome_ar: "صار الأحفاد يعرفون طريق القرية كأنهم ساروا فيه بأقدامهم."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: sumud, delta: 0.05 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/1948_Palestinian_expulsion_and_flight", checked: 2026-10-19 }
