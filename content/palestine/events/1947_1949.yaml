  - id: e1948_05_jaffa_surrender
    title: "Yafa surrenders"
    title_ar: "استسلام يافا"
    text: "Yafa (Jaffa) surrendered to the Haganah in mid-May 1948: Al Jazeera's documentary gives 13 May, other sources 14 May. Zionist forces concentrated the roughly 3,800 Arabs who stayed in the Ajami quarter under strict martial law. The partition plan had made Yafa an enclave of the Arab state."
    text_ar: "استسلمت يافا للهاغاناه في منتصف أيار 1948: في 13 أيار بحسب وثائقي الجزيرة، وفي 14 أيار بحسب مصادر أخرى. وجمعت القوات الصهيونية نحو 3800 عربي بقوا في المدينة في حيّ العجمي تحت حكم عسكري صارم. وكان قرار التقسيم قد جعل يافا جيبًا تابعًا للدولة العربية."
