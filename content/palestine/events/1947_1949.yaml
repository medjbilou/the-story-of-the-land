  - id: e1948_04_haifa
    title: "The fall of Hayfa"
    title_ar: "سقوط حيفا"
    text: "On 21–22 April 1948, as British forces pulled out, the Haganah attacked the Arab neighbourhoods of Hayfa (Haifa) in the operation it called \"Bi'ur Hametz\"; by one account a Carmeli Brigade officer, Mordechai Maklef, ordered his men to \"kill any Arab you encounter\". About 15,000 people were driven out in two days, some by boat to 'Akka (Acre); of roughly 65,000 Arabs in the city, only about 4,000 remained by mid-May."
    text_ar: "في 21–22 نيسان 1948، ومع انسحاب البريطانيين، هاجمت عصابة الهاغاناه الصهيونية أحياء حيفا العربية في عملية سمّتها «بيعور حاميتس»، وبحسب إحدى الروايات أمر مردخاي مكليف، ضابط لواء كرملي، جنوده بقتل كل عربي يصادفونه. وطُرد نحو 15 ألفًا في يومين، ونُقل بعضهم بالقوارب إلى عكا، ومن أصل نحو 65 ألف عربي لم يبقَ في المدينة بحلول منتصف أيار إلا قرابة 4000."
