  - id: e1948_04_jaffa_siege
    title: "The bombardment of Yafa"
    title_ar: "قصف يافا"
    text: "On 25 April 1948 the Zionist militia Irgun began three days of mortar fire on Yafa (Jaffa), some twenty tons of explosives, while the Haganah's operation \"Hametz\" overran the villages east of the city and cut it off from the interior. The British High Commissioner said the shelling was indiscriminate and meant to panic civilians. The port filled with refugees; of 50,000–60,000 people in the city on the eve of the attack, only 15,000–25,000 remained by 30 April."
    text_ar: "في 25 نيسان 1948 بدأت عصابة الإرغون الصهيونية قصف يافا بقذائف الهاون ثلاثة أيام متتالية، فأطلقت عليها نحو عشرين طنًّا من المتفجرات، بينما اجتاحت عصابة الهاغاناه القرى الواقعة شرقها في عملية سمّتها «حاميتس» وقطعت المدينة عن الداخل. وصف المندوب السامي البريطاني القصف بأنه عشوائي يُقصد به بثّ الذعر بين المدنيين. امتلأ الميناء بالنازحين، ومن أصل ما بين 50 و60 ألفًا كانوا في المدينة عشية الهجوم، لم يبقَ فيها بحلول 30 نيسان إلا ما بين 15 و25 ألفًا."
    scope: "region:jaffa"
