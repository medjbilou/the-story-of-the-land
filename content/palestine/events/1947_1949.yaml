  - id: e1948_10_yoav_hiram
    title: "Operations Yoav and Hiram"
    title_ar: "عمليتا يوآف وحيرام"
    text: "The second truce ended on 15 October 1948, and that day the Israeli army launched Operation \"Yoav\" in the south; the Israeli cabinet had approved it on 6 October, eight days before the convoy clash that preceded it. It ended with the capture of Bir al-Sab' (Beersheba), and the refugees in the Gaza area grew from 100,000 to 230,000. Then came Operation \"Hiram\" in the Upper Galilee, 29–31 October: more than 50,000 Palestinians were expelled, and killings of civilians and prisoners were recorded in villages such as Saliha, Safsaf, Jish and Eilabun. Morris estimates that 200,000–230,000 Palestinians were uprooted in the two operations."
    text_ar: "انتهت الهدنة الثانية في 15 تشرين الأول 1948، فشنّ جيش الاحتلال في اليوم نفسه عملية «يوآف» في الجنوب، وكانت الحكومة الصهيونية قد أقرّتها في 6 تشرين الأول، قبل ثمانية أيام من حادثة القافلة التي سبقتها. انتهت العملية باحتلال بئر السبع، وارتفع بسببها عدد اللاجئين في منطقة غزة من 100 ألف إلى 230 ألفًا. ثم جاءت عملية «حيرام» في الجليل الأعلى بين 29 و31 تشرين الأول، فطُرد أكثر من 50 ألف فلسطيني، وسُجّل قتل مدنيين وأسرى في قرى منها صلحة وصفصاف والجش وعيلبون. ويقدّر موريس أن ما بين 200 و230 ألف فلسطيني اقتُلعوا خلال العمليتين."
