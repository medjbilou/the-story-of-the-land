  - id: e1948_05_safad
    title: "The fall of Safad"
    title_ar: "سقوط صفد"
    text: "After a Haganah mortar barrage on the Arab quarters of Safad (Safed) from the evening of 9 May 1948, the Palmach took the citadel in the operation it called \"Yiftach\", and some 12,000 Arabs, by some estimates 15,000, fled the shelling and the assault. In the same operation, Yigal Allon later wrote, Jewish mukhtars were told to whisper to Arabs that huge reinforcements had come to \"clean out\" the Hula villages."
    text_ar: "بعد قصف بالهاون شنّته عصابة الهاغاناه الصهيونية على أحياء صفد العربية منذ مساء 9 أيار 1948، سيطر البالماخ على قلعة المدينة في عملية سمّتها «يفتاح»، وفرّ من القصف والهجوم نحو 12 ألف عربي، وتصل بعض التقديرات إلى 15 ألفًا. وفي العملية نفسها، كما كتب يغآل ألون لاحقًا، طُلب من مخاتير يهود أن يهمسوا في آذان العرب بأن تعزيزات ضخمة وصلت «لتنظيف» قرى الحولة."
    scope: "region:safed"
    place: safed
    from: 1948-05-01
    to: 1948-06-01
