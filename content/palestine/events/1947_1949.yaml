  - id: e1948_10_dawayima
    title: "The al-Dawayima massacre"
    title_ar: "مجزرة الدوايمة"
    text: "On 29 October 1948, during Operation \"Yoav\", the Israeli army's 89th Battalion stormed al-Dawayima, west of al-Khalil (Hebron), meeting little resistance; about 6,000 people were there, some 4,000 of them refugees. The soldiers killed many civilians: an Israeli military intelligence inquiry found about 80 killed plus 22 executed, the mukhtar's sworn statement gave 145, Abdel Jawad estimates 100–200 and Morris speaks of \"hundreds\". A soldier's account passed on by Mapam party members told of sappers blowing up houses with old women inside. No one was prosecuted."
    text_ar: "في 29 تشرين الأول 1948، خلال عملية «يوآف»، اقتحمت الكتيبة 89 من الجيش الصهيوني بلدة الدوايمة غرب الخليل دون مقاومة تُذكر، وكان فيها نحو 6000 نسمة، منهم قرابة 4000 لاجئ. وقتل الجنود عددًا كبيرًا من المدنيين: أحصى تحقيق للاستخبارات العسكرية الإسرائيلية نحو 80 قتيلًا إضافةً إلى 22 أُعدموا، وقدّر مختار البلدة في إفادة مشفوعة باليمين عدد القتلى بـ145، ويقدّره عبد الجواد بما بين 100 و200، ويتحدث موريس عن «المئات». وروى جندي، في شهادة تناقلها أعضاء في حزب مبام، أن خبراء المتفجرات نسفوا بيوتًا وفيها نساء عجائز. ولم يُحاكَم أحد."
