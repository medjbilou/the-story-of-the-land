  - id: e1948_03_hunaiti
    title: "The death of Muhammad al-Hunaiti"
    title_ar: "استشهاد محمد الحنيطي"
    text: "On 17 March 1948 Muhammad al-Hamad al-Hunaiti, the Jordanian volunteer commanding the defence of Hayfa (Haifa), was killed with about 12 of his men in an ambush on a convoy bringing 15 tons of arms from Beirut. The historian Jon Kimche wrote that the Haganah, using an informer, intercepted nine of eleven Arab arms convoys bound for the city, which lost its commander weeks before it fell."
    text_ar: "في 17 آذار 1948 استُشهد محمد الحمد الحنيطي، المتطوع الأردني الذي قاد الدفاع عن حيفا، مع نحو 12 من رجاله في كمين نُصب لقافلة تحمل 15 طنًّا من السلاح قادمة من بيروت. وكتب المؤرخ جون كيمحي أن عصابة الهاغاناه الصهيونية، مستعينةً بمخبر، اعترضت تسعًا من إحدى عشرة قافلة سلاح عربية متجهة إلى المدينة، وفقدت حيفا قائدها قبل أسابيع من سقوطها."
