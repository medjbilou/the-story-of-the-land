  - id: e1949_05_lausanne
    title: "Lausanne and Israel's UN seat"
    title_ar: "لوزان وعضوية إسرائيل في الأمم المتحدة"
    text: "On 11 May 1949 the General Assembly admitted Israel to the UN by 37 votes to 12, in a resolution that referred to Resolutions 181 and 194, after its envoy Abba Eban pledged to honour its obligations under them. The next day Israel and the Arab states signed the Lausanne Protocol, with the partition map attached as a basis for discussion. The Lausanne conference ended in September 1949 without agreement; Israel offered to take back only 100,000 refugees, not to their own homes, and only under a peace that let it keep the land of the Arab state it had captured."
    text_ar: "في 11 أيار 1949 قبلت الجمعية العامة إسرائيل عضوًا في الأمم المتحدة بأغلبية 37 صوتًا مقابل 12، في قرار أشار إلى القرارين 181 و194، بعد أن تعهّد مندوبها أبا إيبان باحترام التزاماتها بموجبهما. وفي اليوم التالي وقّعت إسرائيل والدول العربية بروتوكول لوزان، وأُرفقت به خريطة التقسيم أساسًا للنقاش. لكن مؤتمر لوزان انتهى في أيلول 1949 دون اتفاق، ولم تعرض إسرائيل إلا إعادة 100 ألف لاجئ، لا إلى بيوتهم، وبشرط سلام يُبقي لها ما احتلّته من أراضي الدولة العربية."
    scope: "national"
    from: 1949-05-01
    to: 1949-06-01
    day: 11
