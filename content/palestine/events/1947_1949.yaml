  - id: e1948_07_saffuriya
    title: "Saffuriya"
    title_ar: "صفورية"
    text: "Israeli aircraft bombed Saffuriya, near al-Nasira (Nazareth), on 1 July 1948, and on 16 July Israeli forces captured it in the operation they called \"Dekel\". Villagers resisted and destroyed several armoured cars in an ambush, but the resistance collapsed and all but about 80 fled. Those who returned were evicted again in September, and on 20 February 1949 the moshav of Tzippori was founded beside the village; the poet Taha Muhammad Ali was among the expelled. Some refugees settled in al-Nasira's al-Safafra quarter."
    text_ar: "قصفت الطائرات الصهيونية قرية صفورية قرب الناصرة في 1 تموز 1948، ثم اجتاحتها قوات الاحتلال في 16 تموز في عملية سمّتها «ديكل». قاوم الأهالي ودمّروا عددًا من المصفّحات في كمين، لكن المقاومة انهارت ففرّ السكان جميعًا إلا نحو 80. ومن عاد منهم طُرد مجددًا في أيلول، وفي 20 شباط 1949 أُقيم موشاف تسيبوري قرب القرية، وكان الشاعر طه محمد علي بين المطرودين. واستقرّ بعض لاجئيها في حيّ الصفافرة في الناصرة."
