  - id: e1948_06_first_truce
    title: "The first truce and the closed road home"
    title_ar: "الهدنة الأولى وطريق العودة المغلق"
    text: "On 11 June 1948 a first truce, arranged by the UN mediator Count Folke Bernadotte, came into force; it lasted until 8 July. That June the Israeli government stated that the refugee problem should be solved by resettling refugees in other countries, not by their return, and its forces were already barring the people they had uprooted from going home; a Haganah intelligence report attributed at least 55% of the exodus so far to Haganah and Israeli army operations. On 27 June Bernadotte proposed that the displaced be recognised as having the right to return home and recover their property."
    text_ar: "في 11 حزيران 1948 بدأت هدنة أولى رتّبها وسيط الأمم المتحدة الكونت فولكه برنادوت، واستمرت حتى 8 تموز. وفي حزيران أعلنت حكومة الاحتلال أن حلّ قضية اللاجئين يكون بتوطينهم في بلدان أخرى لا بعودتهم، وكانت قواتها تمنع أصلًا من هجّرتهم من الرجوع إلى بيوتهم، بل نسب تقرير لاستخبارات الهاغاناه ما لا يقلّ عن 55% من التهجير حتى ذلك الحين إلى عمليات الهاغاناه وجيش الاحتلال. أما برنادوت فاقترح في 27 حزيران الاعتراف بحق المهجّرين في العودة إلى بيوتهم واستعادة أملاكهم."
