  - id: e1948_07_lydda_march
    title: "The death march from al-Lydd"
    title_ar: "مسيرة الموت من اللد"
    text: "On the morning of 13 July 1948 the people of al-Lydd (Lydda) were driven out on foot: six to seven kilometres to Beit Nabala, then ten to twelve more to Barfiliya, in heat of 30–35 °C, carrying their children and what they could. Soldiers were ordered to strip them of watches, jewellery and money, while the residents of al-Ramla (Ramle) were taken out by bus, by truck and on foot. Some died on the way from exhaustion and thirst; estimates run from \"a handful and perhaps dozens\" (Morris) to 335 (Nimr al-Khatib) and 500 (Aref al-Aref). Among those expelled were George Habash and, from al-Ramla, 12-year-old Khalil al-Wazir."
    text_ar: "صباح 13 تموز 1948 سيق أهالي اللد خارج مدينتهم سيرًا على الأقدام: ستة إلى سبعة كيلومترات حتى بيت نبالا، ثم عشرة إلى اثني عشر كيلومترًا أخرى حتى برفيليا، في حرّ بلغ 30–35 درجة، يحملون أطفالهم وما خفّ من متاعهم. وقد أُمر الجنود بتجريدهم من الساعات والحليّ والمال، أما أهالي الرملة فأُخرجوا بالحافلات والشاحنات وسيرًا. مات بعض المهجّرين في الطريق من الإنهاك والعطش، وتتراوح التقديرات بين «قلّة وربما عشرات» (موريس) و335 (نمر الخطيب) و500 (عارف العارف). وكان بين المهجّرين جورج حبش، ومن الرملة خليل الوزير ابن الثانية عشرة."
