  - id: e1948_04_tiberias
    title: "Tabariyya emptied of its Arabs"
    title_ar: "تهجير عرب طبرية"
    text: "On 10 April 1948 the Haganah shelled the Arab quarters of Tabariyya (Tiberias) with mortars, then attacked the town and refused to negotiate a truce; news of killings in nearby Nasir al-Din spread panic. On 18 April British forces evacuated the entire Arab population, about 6,000 people. They were refused re-entry, and most of the Old City was later demolished: 477 of its 696 houses, by Israeli official estimates."
    text_ar: "في 10 نيسان 1948 قصفت عصابة الهاغاناه الصهيونية أحياء طبرية العربية بالهاون، ثم هاجمت المدينة ورفضت التفاوض على هدنة، وأشاعت أنباءُ القتل في قرية ناصر الدين المجاورة الذعرَ بين الأهالي. وفي 18 نيسان أجلت القوات البريطانية سكان المدينة العرب جميعًا، وكانوا نحو 6000 نسمة. ومُنعوا من العودة، ثم هُدم معظم البلدة القديمة: 477 بيتًا من أصل 696 بحسب التقديرات الإسرائيلية الرسمية."
    scope: "region:tiberias"
