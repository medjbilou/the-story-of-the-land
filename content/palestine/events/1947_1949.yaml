  - id: e1948_01_jaffa_saraya
    title: "The Saraya bombing in Yafa"
    title_ar: "تفجير السرايا في يافا"
    text: "On 4 January 1948 the Zionist militia Lehi (the Stern Gang) set off a truck bomb outside the Saraya in Yafa (Jaffa), which housed the Arab National Committee. The building and those next to it were destroyed and 26 Palestinian civilians were killed, most of them passers-by and staff of a food programme for poor children run from the same building."
    text_ar: "في 4 كانون الثاني 1948 فجّرت عصابة ليحي (شتيرن) الصهيونية شاحنة مفخّخة أمام مبنى السرايا في يافا، وكان مقرًّا للجنة القومية العربية. دُمّر المبنى وما جاوره، واستُشهد 26 مدنيًّا فلسطينيًّا، أكثرهم من المارّة ومن العاملين في برنامج لتوزيع الطعام على الأطفال الفقراء كان يُدار من المبنى نفسه."
