  - id: e1948_02_night_guard
    title: "Guarding the village"
    title_ar: "حراسة القرية"
    text: "Britain's crushing of the 1936–1939 revolt had killed, wounded, jailed or exiled about a tenth of Palestinian men, by one estimate, while the Mandate armed some 20,000 Jewish police and guards. One witness recalls his father giving him 100 Palestinian pounds for a rifle with only three bullets. In the orange season, with pickers shot at from a nearby settlement, village men took turns guarding at night with their few rifles."
    text_ar: "كان القمع البريطاني لثورة 1936–1939 قد أصاب، بحسب أحد التقديرات، نحو عُشر الرجال الفلسطينيين بين قتيل وجريح وسجين ومنفيّ، في حين سلّح الانتداب نحو 20 ألفًا من الشرطة والحرّاس اليهود. يروي أحد الشهود أن أباه أعطاه مئة جنيه فلسطيني ثمنًا لبندقية لم يكن معها سوى ثلاث رصاصات. وفي موسم قطاف البرتقال، والقاطفون يتعرّضون للرصاص من مستعمرة قريبة، كان رجال القرى يتناوبون على الحراسة ليلًا ببنادقهم القليلة."
    scope: "national"
    from: 1948-02-01
    to: 1948-03-01
    effects:
