  - id: e1949_02_rhodes
    title: "The Rhodes armistice"
    title_ar: "هدنة رودس"
    text: "On 24 February 1949 Israel and Egypt signed an armistice on the island of Rhodes, the first of four. The coastal strip that became known as the Gaza Strip stayed under Egyptian administration. Together the armistice agreements drew the line later called the Green Line, leaving Israel about 78% of Mandate Palestine, against the 56% the partition plan had proposed."
    text_ar: "في 24 شباط 1949 وقّعت إسرائيل ومصر اتفاقية هدنة في جزيرة رودس، وهي الأولى من أربع اتفاقيات هدنة. وبقي الشريط الساحلي الذي صار يُعرف بقطاع غزة تحت الإدارة المصرية. ورسمت هذه الاتفاقيات مجتمعةً الخطّ الذي عُرف لاحقًا بالخط الأخضر، فبقي لإسرائيل نحو 78% من فلسطين الانتدابية، بعد أن كان قرار التقسيم قد اقترح لدولتها 56%."
    scope: "national"
    from: 1949-02-01
    to: 1949-03-01
    day: 24
    effects:
