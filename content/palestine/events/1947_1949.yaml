  - id: e1948_10_tarshiha
    title: "The bombing of Tarshiha"
    title_ar: "قصف ترشيحا"
    text: "From 22 October 1948 Israeli aircraft bombed Tarshiha, Jish and Sa'sa; on the heaviest night, 29–30 October, 21 tons of bombs were dropped on seven villages. The bombing killed 24 of Tarshiha's people, buried about 60 under the rubble and set off a mass flight. Earlier, by one resident's account, the people of Tarshiha had asked an Arab commander for weapons and received two old rifles with one bullet each."
    text_ar: "منذ 22 تشرين الأول 1948 قصفت طائرات الاحتلال ترشيحا والجش وسعسع، وكانت أعنف الليالي ليلة 29–30 تشرين الأول حين أُلقي 21 طنًّا من القنابل على سبع قرى. استُشهد 24 من أهالي ترشيحا في القصف ودُفن نحو 60 تحت الأنقاض، فبدأ منها نزوح جماعي. وكان أهلها قد طلبوا السلاح من أحد القادة العرب، فلم يُعطَوا، بحسب رواية أحدهم، إلا بندقيتين قديمتين مع كل منهما رصاصة واحدة."
    scope: "region:tarshiha"
