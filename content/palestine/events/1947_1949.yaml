  - id: e1947_11_partition
    title: "The Partition Resolution"
    title_ar: "قرار التقسيم"
    text: "On 29 November 1947 the UN General Assembly adopted Resolution 181 by 33 votes to 13, with 10 abstentions. It recommended dividing Palestine and gave the proposed Jewish state about 56% of the country, although Jews were about a third of the population and owned only about 7% of the land; by the UN Special Committee's own figures, that state would have held 407,000 Arabs beside 498,000 Jews. Palestinians rejected partition, and unease spread through the towns and villages."
    text_ar: "في 29 تشرين الثاني 1947 أقرّت الجمعية العامة للأمم المتحدة القرار 181 بأغلبية 33 صوتًا مقابل 13 وامتناع 10 دول عن التصويت. أوصى القرار بتقسيم فلسطين، وخصّص للدولة اليهودية المقترحة نحو 56% من مساحتها، مع أن اليهود كانوا نحو ثلث السكان ولم يملكوا إلا قرابة 7% من الأرض، بل إن أرقام لجنة الأمم المتحدة الخاصة بفلسطين نفسها جعلت في تلك الدولة 407 آلاف عربي إلى جانب 498 ألف يهودي. رفض الفلسطينيون التقسيم، وعمّ القلق المدن والقرى."
    scope: "national"
    from: 1947-11-01
    to: 1947-12-01
    day: 29
