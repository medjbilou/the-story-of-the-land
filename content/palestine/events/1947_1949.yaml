  - id: e1948_05_tantura
    title: "The Tantura massacre"
    title_ar: "مجزرة الطنطورة"
    text: "On the night of 22–23 May 1948 the 33rd Battalion of the Haganah's Alexandroni Brigade attacked Tantura, a coastal village of about 1,500 people south of Hayfa (Haifa). After the village surrendered many of its men were killed; estimates range from \"dozens\" (Morris) through 52–85 including battle deaths (Abdel Jawad) and 70–200 (Masalha) to over 200 (Pilger), while other men were taken to prisoner camps and later exchanged. Women and children were moved to nearby al-Fureidis; Kibbutz Nahsholim and the Dor beach resort now stand on the village land, and a 2023 Forensic Architecture study found two sites it judged \"very likely\" to be mass graves beneath the beach car park."
    text_ar: "في ليلة 22–23 أيار 1948 هاجمت الكتيبة 33 من لواء ألكسندروني التابع للهاغاناه قرية الطنطورة الساحلية جنوبي حيفا، وكان سكانها نحو 1500 نسمة. بعد استسلام القرية استُشهد كثير من رجالها، وتتراوح التقديرات بين «عشرات» (موريس) و52–85 مع قتلى المعركة (عبد الجواد) و70–200 (مصالحة) وأكثر من 200 (بيلجر)، فيما نُقل آخرون إلى معسكرات أسرى وبودلوا لاحقًا. نُقلت النساء والأطفال إلى قرية الفريديس المجاورة، ويقوم اليوم على أرض القرية كيبوتس نحشوليم ومنتجع شاطئ دور، وقد وجدت دراسة لمجموعة «العمارة الجنائية» عام 2023 موقعين رجّحت بقوة أنهما مقبرتان جماعيتان تحت موقف سيارات الشاطئ."
