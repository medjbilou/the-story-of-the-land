  - id: e1948_04_deir_yassin
    title: "The Deir Yassin massacre"
    title_ar: "مجزرة دير ياسين"
    text: "On 9 April 1948 the Zionist militias Irgun and Lehi, supported by the Haganah, attacked Deir Yassin near al-Quds (Jerusalem), although the village had agreed a non-aggression pact with the nearby Jewish neighbourhood of Givat Shaul. The attackers killed about 100 to 120 villagers, women and children among them; a Birzeit University study counted 107, and the figure of 254 was announced by an Irgun commander at a press conference the next day. Some captives were paraded through West Jerusalem, where they were jeered and stoned; the survivors were expelled, and news of the massacre spread terror across Palestine."
    text_ar: "في 9 نيسان 1948 هاجمت العصابتان الصهيونيتان الإرغون وليحي، بدعم من الهاغاناه، قرية دير ياسين قرب القدس، مع أنها كانت قد عقدت اتفاق عدم اعتداء مع حيّ جفعات شاؤول اليهودي المجاور. قتل المهاجمون ما بين 100 و120 من أهلها تقريبًا، بينهم نساء وأطفال، وأحصت دراسة لجامعة بيرزيت 107 ضحايا، أما رقم 254 فقد أعلنه قائد في الإرغون في مؤتمر صحفي في اليوم التالي. واقتيد بعض الأسرى في شوارع القدس الغربية حيث شُتموا ورُجموا بالحجارة، وطُرد من نجا، وبثّت أخبار المجزرة الرعب في أنحاء فلسطين."
    scope: "national"
    tags: [sensitive]
