  - id: e1948_12_res194
    title: "Resolution 194"
    title_ar: "القرار 194"
    text: "On 11 December 1948 the UN General Assembly adopted Resolution 194 by 35 votes to 15, with 8 abstentions. Its paragraph 11 resolved that refugees wishing to return home and live at peace with their neighbours should be allowed to do so at the earliest practicable date, and that compensation be paid for the property of those choosing not to return. The six Arab League states then at the UN voted against it, and Israel, not yet a member, objected to many of its articles. Paragraph 11 became the basis of the Palestinian claim to a right of return, which Israel has rejected."
    text_ar: "في 11 كانون الأول 1948 أقرّت الجمعية العامة للأمم المتحدة القرار 194 بأغلبية 35 صوتًا مقابل 15 وامتناع 8 دول. تقرّر الفقرة 11 منه السماح للاجئين الراغبين في العودة إلى ديارهم والعيش بسلام مع جيرانهم بأن يعودوا في أقرب وقت ممكن، ودفع تعويضات عن ممتلكات من لا يرغب في العودة. وقد صوّتت ضدّه الدول العربية الست الأعضاء في الأمم المتحدة آنذاك، واعترضت إسرائيل، ولم تكن عضوًا بعد، على كثير من مواده. وصارت الفقرة 11 الأساس الذي يستند إليه الفلسطينيون في المطالبة بحق العودة، وهو ما ترفضه إسرائيل."
    scope: "national"
    from: 1948-12-01
    to: 1949-01-01
    day: 11
    effects:
