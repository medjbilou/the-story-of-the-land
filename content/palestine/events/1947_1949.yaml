        text: "Stay despite the intimidation"
        text_ar: "نبقى رغم التخويف"
        outcome: "The family stayed in its home, and the nights were longer than ever."
        outcome_ar: "بقيت العائلة في بيتها، وكانت الليالي أطول من أي وقت مضى."
