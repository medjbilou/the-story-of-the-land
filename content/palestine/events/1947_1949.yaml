        text_ar: "نبيع صوف الفُرُش لنشتري الطحين"
        outcome: "The children slept on straw mats, but they did not sleep hungry."
        outcome_ar: "نام الأطفال على الحصير، لكنهم لم يناموا جائعين."
        effects:
