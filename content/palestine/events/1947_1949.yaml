  - id: e1948_07_lydda_ramle
    title: "The capture of al-Lydd and al-Ramla"
    title_ar: "احتلال اللد والرملة"
    text: "In July 1948, in the operation Israel called \"Dani\", the Israeli army captured al-Lydd (Lydda) and al-Ramla (Ramle), both inside the Arab state of the partition plan. On 12 July many unarmed detainees were killed in al-Lydd's Dahmash mosque; estimates range from \"dozens\" (Morris) to 175–250 (Abdel Jawad), 176 (Aref al-Aref) and 250 (Pappé). The same day Yitzhak Rabin signed an order to expel al-Lydd's inhabitants quickly, \"without attention to age\", and 50,000–70,000 people were driven out of the two towns."
    text_ar: "في تموز 1948 استولت قوات الاحتلال على مدينتي اللد والرملة في عملية سمّتها «داني»، وكانتا ضمن الدولة العربية في قرار التقسيم. وفي 12 تموز استُشهد عدد كبير من المحتجزين العُزّل في مسجد دهمش في اللد، وتتراوح التقديرات بين «عشرات» (موريس) و175–250 (عبد الجواد) و176 (عارف العارف) و250 (بابيه). وفي اليوم نفسه وقّع يتسحاق رابين أمرًا بطرد سكان اللد بسرعة «دون اعتبار للعمر»، فطُرد من المدينتين ما بين 50 و70 ألف إنسان."
