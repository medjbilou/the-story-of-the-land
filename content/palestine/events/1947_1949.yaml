  - id: e1948_05_mandate_ends
    title: "The Mandate ends and Arab armies enter"
    title_ar: "نهاية الانتداب ودخول الجيوش العربية"
    text: "On 14 May 1948 David Ben-Gurion declared the State of Israel, just before the British Mandate expired at midnight; on the morning of 15 May forces from Egypt, Transjordan, Syria and Iraq entered Palestine. By then the Zionist militias had already expelled or put to flight 250,000–350,000 Palestinians: Morris gives 250,000–300,000, Pappé and Al Jazeera about 350,000. By Avi Shlaim's best estimates, Israel fielded 35,000 troops on 15 May against 20,000–25,000 Arab troops. Palestinians mark 15 May as Nakba Day."
    text_ar: "في 14 أيار 1948 أعلن دافيد بن غوريون قيام دولة إسرائيل قبيل انتهاء الانتداب البريطاني عند منتصف الليل، وفي صباح 15 أيار دخلت فلسطينَ قواتٌ من مصر وشرق الأردن وسوريا والعراق. وكانت العصابات الصهيونية قد طردت قبل ذلك ما بين 250 و350 ألف فلسطيني أو أرغمتهم على الفرار: يقدّرهم موريس بما بين 250 و300 ألف، ويقدّرهم بابيه ووثائقي الجزيرة بنحو 350 ألفًا. وبحسب أفضل التقديرات عند آفي شلايم حشدت إسرائيل يوم 15 أيار 35 ألف جندي، مقابل 20 إلى 25 ألفًا من الجنود العرب. ويُحيي الفلسطينيون ذكرى النكبة يوم 15 أيار."
