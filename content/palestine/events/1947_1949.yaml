  - id: e1948_05_bassa
    title: "Al-Bassa"
    title_ar: "البصة"
    text: "On 14 May 1948 Haganah forces captured al-Bassa in the western Galilee in the operation they called \"Ben-Ami\". Soldiers gathered the villagers in the church and shot dead a number of young men: witnesses speak of five or seven, and Saleh Abdel Jawad counts at least 14 killed in all. The people were expelled, most of them towards Lebanon, and the village was almost completely destroyed except for a few buildings, among them a church, a mosque and a shrine; its ruins now lie within the town of Shlomi."
    text_ar: "في 14 أيار 1948 احتلت عصابة الهاغاناه الصهيونية قرية البصة في الجليل الغربي في عملية سمّتها «بن عامي». جمع الجنود الأهالي في كنيسة القرية وقتلوا عددًا من الشبان رميًا بالرصاص: يتحدث الشهود عن خمسة أو سبعة، ويُحصي صالح عبد الجواد 14 قتيلًا على الأقل. ثم طُرد السكان، وأكثرهم نحو لبنان، وهُدمت القرية كلها تقريبًا ولم يبقَ منها إلا مبانٍ قليلة، منها كنيسة ومسجد ومقام، وتقع أطلالها اليوم داخل بلدة شلومي."
