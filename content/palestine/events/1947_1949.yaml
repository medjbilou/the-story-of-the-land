  - id: e1948_09_bernadotte
    title: "Bernadotte assassinated"
    title_ar: "اغتيال برنادوت"
    text: "In his report of 16 September 1948 the UN mediator Count Folke Bernadotte wrote that denying innocent refugees the right to return home, while Jewish immigrants flowed into Palestine, would offend \"the principles of elemental justice\". The next day, 17 September, gunmen of the Zionist militia Lehi, dressed as Israeli soldiers, assassinated him in al-Quds (Jerusalem) together with the French Colonel André Serot. Yitzhak Shamir, later Israel's prime minister, was one of the three Lehi leaders who approved the killing. The case was closed with no one convicted of it, and Yehoshua Cohen, who fired the shots, later served as Ben-Gurion's bodyguard."
    text_ar: "في تقريره المؤرخ 16 أيلول 1948 كتب وسيط الأمم المتحدة الكونت فولكه برنادوت أن حرمان اللاجئين الأبرياء من حق العودة إلى بيوتهم، بينما يتدفّق المهاجرون اليهود إلى فلسطين، يخالف أبسط مبادئ العدالة. وفي اليوم التالي، 17 أيلول، اغتاله في القدس مسلّحون من عصابة ليحي الصهيونية متنكّرين بزيّ جنود إسرائيليين، ومعه العقيد الفرنسي أندريه سيرو. وكان يتسحاق شامير، الذي صار لاحقًا رئيسًا لوزراء إسرائيل، أحد القادة الثلاثة في ليحي الذين وافقوا على الاغتيال. وأُغلق الملف دون أن يُدان أحد بالقتل، وعمل يهوشوع كوهين، مطلق الرصاص، لاحقًا حارسًا شخصيًّا لبن غوريون."
