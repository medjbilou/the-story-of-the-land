  - id: e1947_12_haifa_refinery
    title: "The Hayfa refinery and Balad al-Shaykh"
    title_ar: "مصفاة حيفا وبلد الشيخ"
    text: "On 30 December 1947 Irgun members threw two bombs into a crowd of Arab day labourers queueing outside the Hayfa (Haifa) oil refinery, killing 6 and wounding 42. An angry crowd then killed 39 Jewish workers until British soldiers restored calm. On the night of 31 December Palmach and Carmeli Brigade forces raided the villages of Balad al-Shaykh and Hawassa and killed 60 to 70 villagers, women and children among them; a Haganah raid on Balad al-Shaykh in mid-December had already killed six."
    text_ar: "في 30 كانون الأول 1947 ألقى عناصر من عصابة الإرغون الصهيونية قنبلتين على حشد من العمال العرب المياومين المصطفّين أمام مصفاة النفط في حيفا، فقتلوا 6 وجرحوا 42. ثم قتل حشدٌ غاضب 39 عاملًا يهوديًّا، إلى أن أعاد الجنود البريطانيون الهدوء. وفي ليلة 31 كانون الأول هاجمت قوات من البالماخ ولواء كرملي، التابعَين لعصابة الهاغاناه الصهيونية، قريتي بلد الشيخ وحواسة، فقتلت ما بين 60 و70 من أهلهما، بينهم نساء وأطفال، وكانت غارة للهاغاناه على بلد الشيخ في منتصف كانون الأول قد قتلت ستة من أهلها."
