  - id: e2023_02_huwara
    title: "The night of Huwara"
    title_ar: "ليلة حوارة"
    text: "On 26 February 2023 a Palestinian gunman killed two settler brothers, Hallel and Yagel Yaniv, in Huwara. That evening hundreds of settlers, about 400 by Palestinian officials' estimate, came from Yitzhar, Bracha, Kfar Tapuah and outposts and attacked Huwara and nearby villages, among them Za'tara, Burin and Asira al-Qibliya. The UN's humanitarian office counted at least 37 homes damaged and 55 cars and 1,200 scrapped vehicles burnt; Sameh Aqtash, 37, a relief worker from Za'tara, was shot dead, by settlers or soldiers according to the office, which counted ten more Palestinians injured by live fire or by settlers; the Palestinian Red Crescent said it treated about 100 people that night, most for tear gas inhalation. An Israeli general called it a \"pogrom\", and Finance Minister Bezalel Smotrich said days later that Huwara \"needs to be wiped out\", then said the word may have been wrong."
    text_ar: "في 26 شباط 2023 قتل مسلّح فلسطيني شقيقين مستوطنَين، هليل ويغئيل يانيف، في حوارة. وفي المساء هاجم مئات المستوطنين، نحو 400 بحسب تقدير مسؤولين فلسطينيين، جاؤوا من يتسهار وبراخا وكفار تبوح وبؤر استيطانية، حوارة وقرى مجاورة منها زعترة وبورين وعصيرة القبلية. وأحصى مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية 37 بيتًا متضرّرًا على الأقل و55 سيارة و1,200 مركبة خردة محروقة، واستُشهد سامح أقطش، 37 عامًا، وهو متطوّع إغاثة من زعترة، برصاص مستوطنين أو جنود بحسب المكتب، الذي أحصى عشرة فلسطينيين آخرين أُصيبوا بالرصاص الحي أو بأيدي المستوطنين؛ وقال الهلال الأحمر الفلسطيني إنه عالج نحو 100 شخص تلك الليلة، معظمهم من استنشاق الغاز المسيل للدموع. ووصف جنرال إسرائيلي ما جرى بأنه «بوغروم»، وقال وزير المالية بتسلئيل سموتريتش بعد أيام إن حوارة «يجب أن تُمحى»، ثم قال إن الكلمة ربما كانت خاطئة."
