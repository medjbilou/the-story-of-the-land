  - id: e2018_03_march_of_return
    title: "The Great March of Return"
    title_ar: "مسيرة العودة الكبرى"
    text: "On 30 March 2018, Land Day, Gazans began the Great March of Return: mass popular protests by the fence every week, demanding the return of refugees and an end to the blockade. Israeli occupation forces shot at them week after week: journalist Yaser Murtaja was killed on 6 April wearing a \"press\" vest; on 14 May, the day the US opened its embassy in al-Quds (Jerusalem), on the eve of the Nakba's 70th anniversary, 59 Palestinians were killed, 7 of them children, the highest toll in a single day since 2014 according to the UN's humanitarian office; and on 1 June volunteer paramedic Razan al-Najjar, 21, was shot dead in her white uniform. By the last march, on 27 December 2019, the office counted 212 killed at the protests and 36,134 injured, and a UN Commission of Inquiry found reasonable grounds to believe soldiers shot at children, disabled people, health workers and journalists knowing who they were, which may amount to war crimes or crimes against humanity."
    text_ar: "في 30 آذار 2018، يوم الأرض، بدأ أهل غزة مسيرة العودة الكبرى: احتجاجات شعبية حاشدة كل أسبوع قرب السياج، تطالب بعودة اللاجئين وبرفع الحصار. وأطلقت قوات الاحتلال النار عليهم أسبوعًا بعد أسبوع: استُشهد الصحفي ياسر مرتجى في 6 نيسان وهو يرتدي سترة «صحافة»، وفي 14 أيار، يوم افتتاح السفارة الأمريكية في القدس عشية الذكرى السبعين للنكبة، استُشهد 59 فلسطينيًا بينهم سبعة أطفال، في أعلى حصيلة ليوم واحد منذ 2014 بحسب مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية، وفي 1 حزيران استُشهدت المسعفة المتطوّعة رزان النجار، 21 عامًا، وهي بزيّها الأبيض. وحتى آخر مسيرة في 27 كانون الأول 2019 أحصى المكتب 212 شهيدًا في الاحتجاجات و36,134 جريحًا، ووجدت لجنة تحقيق أممية أسبابًا معقولة للاعتقاد بأن الجنود أطلقوا النار على أطفال وأشخاص ذوي إعاقة وعاملين صحيين وصحفيين مع علمهم بصفتهم، وأن ذلك قد يرقى إلى جرائم حرب أو جرائم ضد الإنسانية."
