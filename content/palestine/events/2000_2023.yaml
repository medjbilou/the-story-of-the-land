  - id: e2000_09_durrah
    title: "Muhammad al-Durrah"
    title_ar: "محمد الدرة"
    text: "On the afternoon of 30 September 2000, at Netzarim junction south of Ghazza (Gaza City), which Palestinians call al-Shuhada junction, twelve-year-old Muhammad al-Durrah sheltered behind his father Jamal from gunfire that, Palestinian cameraman Talal Abu Rahma said, came from the Israeli army post. Abu Rahma filmed it for France 2; Muhammad was killed, Jamal was hit by several bullets in the arm, thigh and legs, and an ambulance driver on his way to the scene, Bassam al-Bilbeisi, was killed too. On 3 October an Israeli general said Israeli soldiers had apparently fired the shots and apologised; the army withdrew that admission in 2005, and in 2013 an Israeli government review claimed the boy was probably not hit by Israeli fire; France 2, Reporters Without Borders and the Palestinian Centre for Human Rights rejected it. The same year a Paris appeal court convicted a man who had called the footage staged of defaming the channel."
    text_ar: "بعد ظهر 30 أيلول 2000، عند مفترق نتساريم جنوب مدينة غزة، وهو ما يسمّيه الفلسطينيون مفترق الشهداء، احتمى الطفل محمد الدرة، ابن الثانية عشرة، خلف أبيه جمال من رصاص قال المصوّر الفلسطيني طلال أبو رحمة إنه انطلق من موقع جيش الاحتلال. وصوّر أبو رحمة المشهد لقناة «فرانس 2»، فاستُشهد محمد وأصيب جمال برصاصات عدة في ذراعه وفخذه وساقيه، واستُشهد كذلك سائق الإسعاف بسام البلبيسي وهو في طريقه إلى المكان. وفي 3 تشرين الأول قال جنرال إسرائيلي إن الجنود الإسرائيليين هم على ما يبدو من أطلقوا الرصاص، وأبدى أسفه، ثم سحب الجيش اعترافه عام 2005، وزعمت مراجعة حكومية إسرائيلية عام 2013 أن الطفل لم يُصب على الأرجح بنيران إسرائيلية، فرفضتها «فرانس 2» ومنظمة مراسلون بلا حدود والمركز الفلسطيني لحقوق الإنسان. وفي العام نفسه أدانت محكمة الاستئناف في باريس بتهمة التشهير بالقناة رجلًا ادّعى أن الشريط مُفبرك."
