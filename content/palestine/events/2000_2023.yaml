  - id: e2012_11_gaza_war
    title: "The eight-day war"
    title_ar: "حرب الأيام الثمانية"
    text: "On 8 November 2012 fire from an Israeli helicopter killed 13-year-old Hmeid Abu Daqqa during an incursion east of Khan Yunis, according to Gaza's health ministry. On 14 November an Israeli airstrike in Ghazza (Gaza City) killed Ahmed al-Jabari, a commander of Hamas's armed wing, opening eight days of bombardment that Israel called \"Pillar of Defence\" and the Qassam Brigades \"Stones of Baked Clay\"; Palestinian groups fired more than 1,500 rockets into Israel, according to the UN human rights office. That office counted 174 Palestinians killed, 101 believed to be civilians, including 33 children; B'Tselem counted 167, at least 87 of whom took no part in the fighting, and Gaza's health ministry 189. On 18 November a bomb destroyed the al-Dalu family home in Ghazza, killing ten of the household, four of them children, and two neighbours, which Human Rights Watch called a clear violation of the laws of war. Four Israeli civilians and two soldiers were killed according to B'Tselem, three soldiers according to the UN, before an Egyptian-brokered ceasefire on 21 November."
    text_ar: "في 8 تشرين الثاني 2012 قتلت نيران مروحية إسرائيلية الطفلَ حميد يونس أبو دقة، 13 عامًا، خلال توغّل شرق خان يونس، بحسب وزارة الصحة في غزة. وفي 14 تشرين الثاني اغتالت غارة إسرائيلية أحمد الجعبري، أحد قادة الجناح العسكري لحركة حماس، في مدينة غزة، فبدأت ثمانية أيام من القصف سمّتها إسرائيل «عمود السحاب» وسمّتها كتائب القسام «حجارة السجيل»، وأطلقت الفصائل الفلسطينية أكثر من 1,500 صاروخ على إسرائيل بحسب مكتب الأمم المتحدة لحقوق الإنسان. وأحصى المكتب 174 فلسطينيًا استُشهدوا، يُعتقد أن 101 منهم مدنيون بينهم 33 طفلًا، وأحصت بتسيلم 167 منهم 87 على الأقل لم يشاركوا في القتال، ووزارة الصحة في غزة 189. وفي 18 تشرين الثاني دمّرت قنبلة بيت عائلة الدلو في مدينة غزة، فاستُشهد عشرة من أهله، بينهم أربعة أطفال، واثنان من جيرانهم، ووصفت هيومن رايتس ووتش الغارة بأنها انتهاك واضح لقوانين الحرب. وقُتل أربعة مدنيين إسرائيليين وجنديان بحسب بتسيلم، وثلاثة جنود بحسب الأمم المتحدة، قبل وقف إطلاق النار برعاية مصرية في 21 تشرين الثاني."
