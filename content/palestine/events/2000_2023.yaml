  - id: e2004_07_icj
    title: "The World Court: the Wall is unlawful"
    title_ar: "محكمة العدل الدولية: الجدار مخالف للقانون"
    text: "On 9 July 2004 the International Court of Justice gave its advisory opinion, by 14 votes to 1: building the wall in occupied Palestinian territory, and the regime tied to it, is contrary to international law. Israel must stop building it, dismantle what stands inside the occupied territory and make reparation for all the damage, and all states must not recognise the illegal situation it creates. On 20 July the UN General Assembly demanded that Israel comply, by 150 votes to 6."
    text_ar: "في 9 تموز 2004 أصدرت محكمة العدل الدولية رأيها الاستشاري، بأغلبية 14 صوتًا مقابل صوت واحد: بناء الجدار في الأرض الفلسطينية المحتلة، والنظام المرتبط به، مخالف للقانون الدولي. وعلى إسرائيل أن توقف بناءه وتفكّك ما بُني منه داخل الأرض المحتلة وتعوّض عن كل الأضرار، وعلى جميع الدول ألّا تعترف بالوضع غير القانوني الناشئ عنه. وفي 20 تموز طالبت الجمعية العامة للأمم المتحدة إسرائيل بالامتثال للرأي، بأغلبية 150 صوتًا مقابل 6."
    scope: "national"
    from: 2004-07-01
    to: 2004-08-01
    day: 9
