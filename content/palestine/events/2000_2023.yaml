  - id: e2012_04_hunger_strikes
    title: "The battle of the empty stomachs"
    title_ar: "معركة الأمعاء الخاوية"
    text: "Khader Adnan was arrested on 17 December 2011 and held without charge in administrative detention; he refused food for 66 days until, on 21 February 2012, Israel agreed not to renew his detention, and he was freed in April. Hana Shalabi followed with a 43-day strike that ended in a deal exiling her to Gaza for three years, which Amnesty International said may amount to forcible deportation. On Prisoners' Day, 17 April 2012, about 1,200 prisoners began an open hunger strike and about 2,300 more refused prison meals; on 14 May the strike ended in an Egyptian-brokered deal to end the solitary confinement of 19 prisoners and restore family visits for Gaza prisoners, banned since 2007."
    text_ar: "اعتُقل خضر عدنان في 17 كانون الأول 2011 وحُبس بلا تهمة في الاعتقال الإداري، فأضرب عن الطعام 66 يومًا حتى وافقت إسرائيل في 21 شباط 2012 على عدم تجديد اعتقاله، وأُفرج عنه في نيسان. وتبعته هناء الشلبي بإضراب دام 43 يومًا انتهى باتفاق أبعدها إلى غزة ثلاث سنوات، وقالت منظمة العفو الدولية إنه قد يرقى إلى ترحيل قسري. وفي يوم الأسير، 17 نيسان 2012، بدأ نحو 1,200 أسير إضرابًا مفتوحًا عن الطعام ورفض نحو 2,300 آخرين وجبات السجن، وفي 14 أيار انتهى الإضراب باتفاق رعته مصر نصّ على إنهاء العزل الانفرادي لـ19 أسيرًا وإعادة زيارات عائلات أسرى غزة الممنوعة منذ 2007."
