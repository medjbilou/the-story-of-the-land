  - id: e2005_08_disengagement
    title: "\"Disengagement\": settlers out, control stays"
    title_ar: "«فكّ الارتباط»: انسحاب المستوطنين وبقاء السيطرة"
    text: "Between 15 and 22 August 2005 Israel removed its settlers from the Gaza Strip, more than 8,000 people in 21 settlements, and in September it withdrew its army and dismantled four settlements in the northern West Bank. But it kept control of Gaza's airspace and territorial waters, six of its seven land crossings, a no-go buffer zone and the population registry, and Gaza still depended on it for water, electricity and telecommunications. That is why the International Committee of the Red Cross, the UN and human rights groups still regard Gaza as occupied territory, while Israel claims the occupation ended with the withdrawal."
    text_ar: "بين 15 و22 آب 2005 أخلت إسرائيل مستوطنيها من قطاع غزة، وهم أكثر من 8,000 إنسان في 21 مستوطنة، وفي أيلول سحبت جيشها وفكّكت أربع مستوطنات في شمال الضفة الغربية. لكنها أبقت سيطرتها على أجواء غزة ومياهها الإقليمية وعلى ستة من معابرها البرية السبعة وعلى منطقة عازلة يُمنع دخولها وعلى سجلّ السكان، وظلّت غزة معتمدة عليها في الماء والكهرباء والاتصالات. لذلك تعدّ اللجنة الدولية للصليب الأحمر والأمم المتحدة ومنظمات حقوق الإنسان غزة أرضًا محتلة حتى اليوم، فيما تزعم إسرائيل أن الاحتلال انتهى بالانسحاب."
