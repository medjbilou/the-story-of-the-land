  - id: e2022_09_lions_den
    title: "The Jenin Brigade and the Lions' Den"
    title_ar: "كتيبة جنين و«عرين الأسود»"
    text: "Under the near-daily raids of what Israel called \"Operation Break the Wave\", new armed groups grew up in the north of the West Bank: the Jenin Brigade, founded in 2021 by Jamil al-Amouri of Islamic Jihad and bringing together fighters from Islamic Jihad, Hamas and the al-Aqsa Brigades, and in Nablus the \"Lions' Den\", which first appeared in public on 2 September 2022 at a memorial for its founder Mohammed al-Azizi, killed by Israeli forces 40 days earlier. On 9 August 2022 occupation forces in Nablus killed Ibrahim al-Nabulsi, 19, one of its best-known members, along with Islam Sabbouh, 32, and Hussein Taha, 16. After an Israeli soldier was killed on 11 October, the occupation army besieged Nablus, restricting the movement of about 420,000 Palestinians, Al Jazeera reported. By mid-December the UN's humanitarian office had counted 140 Palestinians killed by Israeli forces in the West Bank, making 2022 the deadliest year since the UN began counting in 2005."
    text_ar: "في ظلّ الاقتحامات شبه اليومية في عملية سمّتها إسرائيل «كاسر الأمواج»، نشأت في شمال الضفة مجموعات مسلّحة جديدة: كتيبة جنين، التي أسّسها جميل العموري من الجهاد الإسلامي عام 2021 وتضمّ مقاتلين من الجهاد وحماس وكتائب شهداء الأقصى، وفي نابلس «عرين الأسود»، التي ظهرت علنًا أول مرة في 2 أيلول 2022 في تأبين مؤسّسها محمد العزيزي، الذي قتلته قوات الاحتلال قبل ذلك بأربعين يومًا. وفي 9 آب 2022 قتلت قوات الاحتلال في نابلس إبراهيم النابلسي، 19 عامًا، أحد أبرز عناصرها، ومعه إسلام صبوح، 32 عامًا، والفتى حسين طه، 16 عامًا. وبعد مقتل جندي إسرائيلي في 11 تشرين الأول حاصر جيش الاحتلال نابلس وقيّد حركة نحو 420,000 فلسطيني، بحسب الجزيرة. وبحلول منتصف كانون الأول أحصى مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية 140 فلسطينيًا قتلتهم قوات الاحتلال في الضفة، فكان 2022 أشدّ الأعوام دموية منذ بدأت الأمم المتحدة العدّ عام 2005."
    scope: "region:nablus"
    place: nablus
