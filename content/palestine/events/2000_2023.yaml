  - id: e2015_07_duma
    title: "The Duma arson"
    title_ar: "حريق دوما"
    text: "On 31 July 2015 settlers threw firebombs into the Dawabsheh family home in the village of Duma near Nablus, and 18-month-old Ali burned to death. His father Saad died of his burns on 8 August and his mother Riham on 6 September; only four-year-old Ahmad survived, badly burned. In 2020 an Israeli court convicted the settler Amiram Ben-Uliel of racially motivated murder and sentenced him to three life terms."
    text_ar: "في 31 تموز 2015 ألقى مستوطنون زجاجات حارقة على بيت عائلة دوابشة في قرية دوما قرب نابلس، فاستُشهد الرضيع علي، ابن الثمانية عشر شهرًا، حرقًا. واستُشهد أبوه سعد متأثرًا بحروقه في 8 آب، وأمه ريهام في 6 أيلول، ولم ينجُ من العائلة إلا أحمد، ابن الرابعة، مصابًا بحروق بالغة. وفي 2020 أدانت محكمة إسرائيلية المستوطن عميرام بن أوليئيل بالقتل بدافع عنصري، وحكمت عليه بالسجن المؤبد ثلاث مرات."
