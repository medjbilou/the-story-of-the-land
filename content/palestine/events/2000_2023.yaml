  - id: e2002_07_shehadeh
    title: "The one-ton bomb on al-Daraj"
    title_ar: "قنبلة الطن في حي الدرج"
    text: "Shortly before midnight on 22 July 2002 an Israeli F-16 dropped a one-ton bomb on a house in the crowded al-Daraj neighbourhood of Ghazza (Gaza City) to kill Salah Shehadeh, commander of Hamas's armed wing. Al Mezan documented 15 Palestinians killed, among them eight children, one a two-month-old baby, and two mothers, with more than 150 wounded and more than 50 homes destroyed or damaged; Shehadeh's wife and daughter and seven of the neighbouring Matar family were among the dead. Prime Minister Ariel Sharon called it \"one of our greatest successes\", and an Israeli commission claimed in 2011 that it was an intelligence failure with no intent to kill civilians."
    text_ar: "قبيل منتصف ليل 22 تموز 2002 ألقت طائرة إسرائيلية من طراز إف-16 قنبلة تزن طنًّا على بيت في حي الدرج المكتظّ في مدينة غزة لاغتيال صلاح شحادة، قائد الجناح العسكري لحركة حماس. ووثّق مركز الميزان لحقوق الإنسان 15 شهيدًا فلسطينيًا، بينهم ثمانية أطفال أحدهم رضيع في شهره الثاني، وأمّان، وأكثر من 150 جريحًا، وأكثر من 50 بيتًا دُمّرت أو تضرّرت، وكان بين الشهداء زوجة شحادة وابنته وسبعة من عائلة مطر المجاورة. ووصف رئيس الوزراء الإسرائيلي أرييل شارون الغارة بأنها «من أعظم نجاحاتنا»، وزعمت لجنة إسرائيلية عام 2011 أن ما جرى إخفاق استخباري لم يُقصد به قتل المدنيين."
    scope: "region:gaza"
