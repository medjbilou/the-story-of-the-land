  - id: e2021_05_sheikh_jarrah
    title: "Save Sheikh Jarrah"
    title_ar: "أنقذوا حي الشيخ جراح"
    text: "In 1956, 28 refugee families driven out of Yafa (Jaffa) and Hayfa (Haifa) in 1948 settled in Karm al-Ja'ouni in the Sheikh Jarrah neighbourhood of al-Quds (Jerusalem). In 2021 an Israeli court ordered several of them out in favour of settlers; the UN human rights office said eight families faced forced eviction after a legal challenge by the settler organisation Nahalat Shimon, and Muna El-Kurd, from one of the threatened families, launched the campaign #SaveSheikhJarrah. In Ramadan the occupation police barricaded Damascus Gate and then raided al-Aqsa: on 7 May the Palestinian Red Crescent treated 163 injured, and on 10 May the Palestinian Centre for Human Rights counted 305 wounded, a day after the Supreme Court postponed its ruling on the evictions."
    text_ar: "عام 1956 استقرّت 28 عائلة لاجئة، هُجّرت من يافا وحيفا عام 1948، في كرم الجاعوني بحي الشيخ جراح في القدس. وفي 2021 أمرت محكمة إسرائيلية بإخلاء عدد منها لصالح مستوطنين، وقال مكتب الأمم المتحدة لحقوق الإنسان إن ثماني عائلات مهدّدة بالإخلاء القسري إثر دعوى رفعتها جمعية «نحلات شمعون» الاستيطانية، وأطلقت منى الكرد، من إحدى العائلات المهدّدة، حملة #أنقذوا_حي_الشيخ_جراح. وفي رمضان نصبت شرطة الاحتلال حواجز عند باب العامود، ثم اقتحمت المسجد الأقصى: في 7 أيار عالج الهلال الأحمر الفلسطيني 163 مصابًا، وفي 10 أيار أحصى المركز الفلسطيني لحقوق الإنسان 305 جرحى، بعد يوم من تأجيل المحكمة العليا قرارها في الإخلاءات."
