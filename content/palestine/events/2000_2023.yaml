  - id: e2007_06_blockade
    title: "The blockade"
    title_ar: "الحصار"
    text: "In June 2007, after a week of fighting between Hamas and Fatah in which the Palestinian Centre for Human Rights counted at least 161 killed, Hamas took control of the Gaza Strip and President Mahmoud Abbas dismissed the unity government. The Zionist government, with Egypt's cooperation, closed the Strip: it cut imports to a \"humanitarian minimum\" and banned nearly all exports, and in September 2007 its security cabinet declared Gaza \"hostile territory\" and approved cuts to fuel and electricity, which the UN Secretary-General said ran against Israel's obligations to civilians. Two years on, the UN's humanitarian office found that only 147 truckloads of exports had left, about 120,000 jobs had been lost, three in four Gazans were food insecure and about 1.1 million were living on food aid. Coriander, jam and chocolate were among the banned goods, according to a partial list compiled by Gisha."
    text_ar: "في حزيران 2007، بعد أسبوع من الاقتتال بين حماس وفتح أحصى فيه المركز الفلسطيني لحقوق الإنسان 161 قتيلًا على الأقل، سيطرت حماس على قطاع غزة، وأقال الرئيس محمود عباس حكومة الوحدة. وأغلقت حكومة الاحتلال، بتعاون مصري، القطاع: قلّصت الواردات إلى «الحد الأدنى الإنساني» ومنعت الصادرات كلها تقريبًا، وفي أيلول 2007 أعلن مجلسها الوزاري الأمني غزة «كيانًا معاديًا» وأقرّ تقليص الوقود والكهرباء، وهو ما قال الأمين العام للأمم المتحدة إنه يخالف التزامات إسرائيل تجاه المدنيين. وبعد عامين وجد مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية أن 147 شاحنة صادرات فقط خرجت، وأن نحو 120,000 وظيفة ضاعت، وأن ثلاثة من كل أربعة من سكان غزة يعانون انعدام الأمن الغذائي، ونحو 1.1 مليون منهم يعيشون على المساعدات الغذائية. وكانت الكزبرة والمربّى والشوكولاتة بين المواد الممنوعة، بحسب قائمة جزئية جمعتها منظمة «جيشاه»."
