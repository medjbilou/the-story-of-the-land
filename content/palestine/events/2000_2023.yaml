  - id: e2002_06_wall
    title: "The Apartheid Wall"
    title_ar: "جدار الفصل العنصري"
    text: "In June 2002 the Zionist government began building the wall it calls a \"security fence\" and Palestinians call the Apartheid Wall. About 85% of its route runs inside the West Bank, cutting up to 18 km into it. By 2003, Human Rights Watch reported, the 41,000 people of Qalqilya were completely encircled, able to enter and leave their city through a single gate."
    text_ar: "في حزيران 2002 بدأت الحكومة الصهيونية بناء الجدار الذي تسمّيه «السياج الأمني»، ويسمّيه الفلسطينيون جدار الفصل العنصري. ويمرّ نحو 85% من مساره داخل الضفة الغربية، متوغّلًا حتى 18 كيلومترًا فيها. وفي عام 2003 أفادت هيومن رايتس ووتش بأن سكان قلقيلية، وعددهم 41,000، صاروا محاصَرين بالكامل، لا يدخلون مدينتهم ولا يخرجون منها إلا من بوابة واحدة."
    scope: "national"
    place: qalqilya
    from: 2002-06-01
    to: 2002-07-01
