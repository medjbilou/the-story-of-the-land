  - id: e2009_01_samouni
    title: "The Samouni house"
    title_ar: "بيت آل السموني"
    text: "On 4 January 2009 occupation soldiers gathered about 100 members of the extended Samouni family, mostly women and children, into Wa'el al-Samouni's house in al-Zeitoun, south of Ghazza (Gaza City), and ordered them to stay when they asked to leave for somewhere safer. On the morning of 5 January an Israeli projectile struck beside men gathering firewood outside, then two or three more hit the house itself; 21 family members were killed and 19 injured, and 23 Samounis were killed in the two attacks on the family's houses, according to the UN fact-finding mission. The mission said that \"everything indicates\" the Israeli forces knew about 100 civilians were in the house, and that the army kept the Red Crescent from the wounded until 7 January, when rescuers found 15 bodies and two badly injured children in the house."
    text_ar: "في 4 كانون الثاني 2009 جمع جنود الاحتلال نحو 100 من أفراد عائلة السموني الممتدّة، معظمهم نساء وأطفال، في بيت وائل السموني في حي الزيتون جنوب مدينة غزة، وأمروهم بالبقاء فيه حين طلبوا الرحيل إلى مكان آمن. وصباح 5 كانون الثاني سقطت قذيفة إسرائيلية قرب رجال يجمعون الحطب أمام البيت، ثم أصابت قذيفتان أو ثلاث البيت نفسه، فاستُشهد 21 من أفراد العائلة وجُرح 19، وبلغ عدد من استُشهدوا من العائلة في الهجومين على بيتَيها 23، بحسب بعثة الأمم المتحدة لتقصّي الحقائق. وقالت البعثة إن «كل شيء يدلّ» على أن القوات الإسرائيلية كانت تعلم بوجود نحو 100 مدني في البيت، وإن الجيش منع الهلال الأحمر من الوصول إلى الجرحى حتى 7 كانون الثاني، حين وجد المسعفون في البيت 15 جثة وطفلين مصابين بجروح بالغة."
