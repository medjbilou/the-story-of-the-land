  - id: e2005_02_bilin
    title: "Bil'in, Friday after Friday"
    title_ar: "بلعين: جمعة بعد جمعة"
    text: "In February 2005 the people of Bil'in, west of Ramallah, began marching every Friday against the wall, whose planned route left about half the village's land on its far side to make room for the expansion of the settlement of Modi'in Illit, according to B'Tselem. Israeli and international activists joined them, and the village took its case to Israel's High Court, which ruled in September 2007 that the route was disproportionate; work to move the barrier began only in 2011, and about 1,500 dunams of village land stayed beyond it. On 17 April 2009 Bassem Abu Rahmah, 30, was killed at the march when an extended-range tear-gas canister fired by occupation forces hit him in the chest."
    text_ar: "في شباط 2005 بدأ أهالي بلعين، غربيّ رام الله، مسيرة كل يوم جمعة ضد الجدار، الذي ترك مسارُه المخطَّط نحو نصف أراضي القرية خلفه لإفساح المجال لتوسيع مستوطنة موديعين عيليت، بحسب منظمة بتسيلم. وانضمّ إليهم متضامنون إسرائيليون وأجانب، ورفعت القرية قضيتها إلى المحكمة العليا الإسرائيلية التي قضت في أيلول 2007 بأن المسار غير متناسب، لكن العمل على تغييره لم يبدأ إلا عام 2011، وبقي نحو 1,500 دونم من أرض القرية خلف الجدار. وفي 17 نيسان 2009 استُشهد باسم أبو رحمة، 30 عامًا، في المسيرة حين أصابته في صدره قنبلة غاز بعيدة المدى أطلقتها قوات الاحتلال."
