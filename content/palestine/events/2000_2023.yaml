  - id: e2008_12_cast_lead
    title: "The 2008–09 war (\"Cast Lead\")"
    title_ar: "حرب 2008–2009 («الرصاص المصبوب»)"
    text: "The \"period of calm\" agreed through Egypt's mediation in June 2008 had largely held: in October, by Israeli sources' own count, one rocket and one mortar were fired from Gaza. On 4 November Israeli troops raided the Strip and, with an airstrike, killed six members of the Qassam Brigades; rocket fire resumed, and Israel shut the crossings for most of November, forcing UNRWA to halt food aid to 750,000 people for five days, according to the UN fact-finding mission. On 27 December 2008 the Israeli occupation army began a 22-day war on the Gaza Strip, which Israel called \"Cast Lead\" and Hamas called \"the Battle of al-Furqan\". B'Tselem counted 1,387 Palestinians killed by Israeli forces, 773 of whom took no part in the fighting, including 320 minors and 109 women, and 248 police officers, most killed in strikes on police stations on the first day; the UN's humanitarian office counted 1,383, including 333 children, and the Israeli army claimed 1,166. Thirteen Israelis were killed: three civilians and one security-forces member by rockets, and nine soldiers inside Gaza, four of them by their own side's fire. Human Rights Watch found the army fired white phosphorus repeatedly over crowded neighbourhoods, and the UN mission led by Richard Goldstone found Israeli violations that could amount to war crimes, and that the armed groups' rockets on civilians in southern Israel were war crimes too."
    text_ar: "كانت «التهدئة» التي تُوصّل إليها بوساطة مصرية في حزيران 2008 صامدة إلى حدّ بعيد: ففي تشرين الأول لم يُطلق من غزة، بحسب مصادر إسرائيلية، إلا صاروخ واحد وقذيفة هاون واحدة. وفي 4 تشرين الثاني توغّلت قوات الاحتلال في القطاع وقتلت في التوغّل وفي غارة جوية تلته ستة من مقاتلي كتائب القسام، فاستؤنف إطلاق الصواريخ، وأغلقت إسرائيل المعابر معظم تشرين الثاني، فاضطرت الأونروا إلى وقف توزيع الغذاء على 750,000 إنسان خمسة أيام، بحسب بعثة الأمم المتحدة لتقصّي الحقائق. وفي 27 كانون الأول 2008 شنّ جيش الاحتلال حربًا على قطاع غزة دامت 22 يومًا، سمّتها إسرائيل «الرصاص المصبوب» وسمّتها حماس «معركة الفرقان». وأحصت منظمة بتسيلم 1,387 فلسطينيًا قتلتهم قوات الاحتلال، منهم 773 لم يشاركوا في القتال، بينهم 320 قاصرًا و109 نساء، وكان بين الشهداء أيضًا 248 شرطيًا استُشهد معظمهم في قصف مراكز الشرطة في اليوم الأول؛ وأحصى مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية 1,383 شهيدًا بينهم 333 طفلًا، وزعم الجيش الصهيوني أن العدد 1,166. وقُتل 13 إسرائيليًا: ثلاثة مدنيين وعنصر أمن بالصواريخ، وتسعة جنود داخل غزة، أربعة منهم بنيران زملائهم. ووجدت هيومن رايتس ووتش أن الجيش أطلق الفسفور الأبيض مرارًا فوق أحياء مكتظة، وخلصت بعثة الأمم المتحدة برئاسة ريتشارد غولدستون إلى أن إسرائيل ارتكبت انتهاكات قد ترقى إلى جرائم حرب، وأن صواريخ الفصائل على المدنيين في جنوب إسرائيل تشكّل هي الأخرى جرائم حرب."
