  - id: e2014_07_shujaiya
    title: "Shuja'iyya, and the Bakr boys on the beach"
    title_ar: "الشجاعية، وأولاد بكر على الشاطئ"
    text: "On 16 July 2014 an Israeli naval vessel fired two shells at Gaza beach, killing four boys of the Bakr family, aged 9 to 11, who were playing there; an internal army review cleared its soldiers, and the UN Commission of Inquiry said it was \"disturbed\" that the criminal investigation was closed. On the night of 19 to 20 July the occupation army stormed al-Shuja'iyya, east of Ghazza (Gaza City), under heavy shelling: Al Jazeera counted 72 killed and more than 200 wounded in a single day, and the bureau of the UN committee on Palestinian rights said the next day that more than 70 had been killed, most of them civilians; the UN Protection Cluster, cited by the Commission of Inquiry, counted 55 civilians killed on 19 and 20 July, 19 of them children and 14 women. 16 Israeli soldiers were killed in the fighting."
    text_ar: "في 16 تموز 2014 أطلقت سفينة حربية إسرائيلية قذيفتين على شاطئ غزة فقتلت أربعة أطفال من عائلة بكر، أعمارهم بين 9 و11 عامًا، كانوا يلعبون هناك؛ وبرّأت مراجعة داخلية للجيش جنوده، وأبدت لجنة التحقيق الأممية «انزعاجها» من إغلاق التحقيق الجنائي. وفي ليل 19 إلى 20 تموز اقتحم جيش الاحتلال حي الشجاعية شرق مدينة غزة تحت قصف كثيف، فأحصت الجزيرة 72 شهيدًا وأكثر من 200 جريح في يوم واحد، وقال مكتب لجنة الأمم المتحدة المعنية بحقوق الشعب الفلسطيني في اليوم التالي إن أكثر من 70 فلسطينيًا استُشهدوا، معظمهم مدنيون؛ وأحصت مجموعة الحماية الأممية، كما تنقل عنها لجنة التحقيق، 55 مدنيًا استُشهدوا يومي 19 و20 تموز، بينهم 19 طفلًا و14 امرأة. وقُتل في المعركة 16 جنديًا إسرائيليًا."
