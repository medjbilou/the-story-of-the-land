  - id: e2023_05_khader_adnan
    title: "Khader Adnan dies in his cell"
    title_ar: "خضر عدنان يرحل في زنزانته"
    text: "On 2 May 2023 Khader Adnan, who had won his freedom in 2012 with a 66-day hunger strike, died in his cell in an Israeli prison after a hunger strike of about 87 days, begun when he was arrested on 5 February. UN special rapporteurs called his death a \"tragic testament to Israel's cruel and inhumane detention policy\", and noted that about 1,000 Palestinians were held in administrative detention without charge, the most since 2008."
    text_ar: "في 2 أيار 2023 استُشهد خضر عدنان، الذي انتزع حريته عام 2012 بإضراب عن الطعام دام 66 يومًا، في زنزانته في سجن إسرائيلي، بعد إضراب عن الطعام دام نحو 87 يومًا بدأه يوم اعتقاله في 5 شباط. ووصف مقرّرون خاصون للأمم المتحدة وفاته بأنها «شهادة مأساوية على سياسة الاحتجاز القاسية واللاإنسانية» لإسرائيل، وذكروا أن نحو 1,000 فلسطيني محتجزون إداريًا بلا تهمة، وهو أعلى عدد منذ 2008."
    scope: "national"
    tags: [sensitive]
    from: 2023-05-01
