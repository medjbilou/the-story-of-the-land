  - id: e2000_10_habbat_october
    title: "The October 2000 uprising inside Israel"
    title_ar: "هبّة تشرين الأول"
    text: "Between 1 and 8 October 2000, as protests spread to Palestinian towns inside Israel, Israeli police killed 13 young men and men: 12 Palestinian citizens of Israel and Misleh Abu Jarad, 19, from Deir al-Balah in Gaza, who lived and worked in Umm al-Fahm. The dead came from Umm al-Fahm, Mu'awiya, Jatt, al-Nasira (Nazareth), Arraba, Sakhnin, Kafr Manda and Kafr Kanna; the youngest, Asel Asleh of Arraba, was 17. On 7 October a Jewish Israeli driver, Bachor Jan, was killed by a stone near Jisr az-Zarqa. In 2003 the official Or Commission found no justification whatsoever for the gunfire that killed the 13, yet in 2005 the police investigations unit decided not to indict anyone in any of the cases, and in 2008 the attorney general closed the file."
    text_ar: "بين 1 و8 تشرين الأول 2000، حين امتدّت الاحتجاجات إلى البلدات الفلسطينية داخل إسرائيل، قتلت الشرطة الإسرائيلية 13 شابًا ورجلًا: 12 مواطنًا فلسطينيًا في إسرائيل، ومصلح أبو جراد، 19 عامًا، من دير البلح في غزة، وكان يعمل ويسكن في أم الفحم. وجاء الشهداء من أم الفحم ومعاوية وجت والناصرة وعرّابة وسخنين وكفر مندا وكفر كنّا، وكان أصغرهم أسيل عاصلة من عرّابة، ابن السابعة عشرة. وفي 7 تشرين الأول قُتل سائق يهودي إسرائيلي، بخور جان، بحجر قرب جسر الزرقاء. وخلصت لجنة أور الرسمية عام 2003 إلى أنه لا مبرّر على الإطلاق لإطلاق النار الذي قتل الثلاثة عشر، لكن وحدة التحقيق مع الشرطة قرّرت عام 2005 عدم تقديم لائحة اتهام في أيٍّ من القضايا، وأغلق المستشار القضائي للحكومة الملف عام 2008."
