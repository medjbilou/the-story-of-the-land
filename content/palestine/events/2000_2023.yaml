  - id: e2023_06_settlers
    title: "Turmus Ayya and Ein Samiya"
    title_ar: "ترمسعيا وعين سامية"
    text: "Settler violence rose year after year: the UN's humanitarian office counted about one incident a day in 2021, two in 2022 and three in the first half of 2023, 591 in all. On 21 June 2023 hundreds of settlers, 200 to 400 by residents' estimate, attacked the town of Turmus Ayya north of Ramallah, burning homes and cars, and Omar Qattin, 27, was shot dead, by Israeli forces according to Human Rights Watch. In May settler attacks drove out the herding community of Ein Samiya, 26 households of 132 people including 68 children, and in 2022–23, 134 people, 83 of them children, were forced out of the communities of Wadi as-Seeq and Ras al-Tin."
    text_ar: "ازداد عنف المستوطنين عامًا بعد عام: أحصى مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية نحو حادثة واحدة يوميًا في 2021، واثنتين في 2022، وثلاثًا في النصف الأول من 2023 بلغ مجموعها 591 حادثة. وفي 21 حزيران 2023 هاجم مئات المستوطنين، بين 200 و400 بتقدير الأهالي، بلدة ترمسعيا شمال رام الله فأحرقوا بيوتًا وسيارات، واستُشهد عمر قطين، 27 عامًا، برصاص قوات الاحتلال بحسب هيومن رايتس ووتش. وفي أيار هجّرت اعتداءات المستوطنين تجمّع عين سامية للرعاة، 26 أسرة تضمّ 132 إنسانًا بينهم 68 طفلًا، وفي 2022–2023 أُجبر 134 من أهالي تجمّعَي وادي السيق ورأس التين، بينهم 83 طفلًا، على الرحيل."
    scope: "region:ramallah"
    tags: [sensitive]
