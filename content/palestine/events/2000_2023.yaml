  - id: e2022_02_apartheid
    title: "\"This is apartheid\""
    title_ar: "«هذا أبارتهايد»"
    text: "On 12 January 2021 the Israeli rights group B'Tselem published \"A regime of Jewish supremacy from the Jordan River to the Mediterranean Sea: This is apartheid\", concluding that a single regime rules the whole area and works to entrench Jewish supremacy over Palestinians. On 27 April 2021 Human Rights Watch, in \"A Threshold Crossed\", found that Israeli authorities are committing the crimes against humanity of apartheid and persecution. On 1 February 2022 Amnesty International concluded that Israel's system of oppression and domination over Palestinians amounts to apartheid, a crime against humanity."
    text_ar: "في 12 كانون الثاني 2021 نشرت منظمة بتسيلم الإسرائيلية لحقوق الإنسان تقريرها «نظام تفوّق يهودي من النهر إلى البحر: هذا أبارتهايد»، وخلصت إلى أن نظامًا واحدًا يحكم المنطقة كلها ويعمل على ترسيخ تفوّق اليهود على الفلسطينيين. وفي 27 نيسان 2021 وجدت هيومن رايتس ووتش في تقريرها «تجاوَزوا الحدّ» أن السلطات الإسرائيلية ترتكب جريمتين ضد الإنسانية هما الفصل العنصري والاضطهاد. وفي 1 شباط 2022 خلصت منظمة العفو الدولية إلى أن نظام القمع والهيمنة الإسرائيلي على الفلسطينيين يرقى إلى الفصل العنصري، وهو جريمة ضد الإنسانية."
