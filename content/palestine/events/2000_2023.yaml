  - id: e2002_03_defensive_shield
    title: "\"Defensive Shield\": the cities reoccupied"
    title_ar: "«السور الواقي»: إعادة احتلال المدن"
    text: "From 27 February 2002 the Israeli occupation army stormed West Bank refugee camps and towns, and on 8 and 9 March alone its raids killed 48 Palestinians, while two Palestinian attacks killed 18 Israelis, according to the UN Secretary-General's report. On 27 March Abdel-Basset Odeh of Tulkarm blew himself up at a Passover meal at the Park Hotel in Netanya, killing 30 civilians, in an attack claimed by Hamas. On 29 March the Zionist government launched what it called \"Operation Defensive Shield\", its largest incursion in a decade, and reoccupied the West Bank's cities: it stormed the Muqata'a compound in Ramallah and penned Yasser Arafat into a few rooms, then entered Tulkarm, Qalqilya, Bayt Lahm (Bethlehem), Jenin and Nablus under curfews that touched about a million people. The same report counts 497 Palestinians killed in the reoccupation and its immediate aftermath (1 March to 7 May), about 1,447 wounded, some 7,000 arrested by 6 May and 878 homes demolished or destroyed; 30 Israeli soldiers were killed."
    text_ar: "منذ 27 شباط 2002 راح جيش الاحتلال يقتحم مخيمات اللاجئين والبلدات في الضفة الغربية، وفي يومي 8 و9 آذار وحدهما قتلت اقتحاماته 48 فلسطينيًا، فيما قتل هجومان فلسطينيان 18 إسرائيليًا، بحسب تقرير الأمين العام للأمم المتحدة. وفي 27 آذار فجّر عبد الباسط عودة من طولكرم نفسه في عشاء عيد الفصح اليهودي في فندق «بارك» في نتانيا، فقتل 30 مدنيًا، في هجوم تبنّته حركة حماس. وفي 29 آذار أطلقت الحكومة الصهيونية عملية سمّتها «السور الواقي»، هي أوسع اجتياحاتها منذ عقد، وأعادت احتلال مدن الضفة: اقتحمت مقرّ المقاطعة في رام الله وحاصرت ياسر عرفات في بضع غرف منه، ثم دخلت طولكرم وقلقيلية وبيت لحم وجنين ونابلس، وفرضت حظر تجوّل طال نحو مليون إنسان. ويُحصي التقرير نفسه 497 فلسطينيًا استُشهدوا في إعادة الاحتلال وما تلاها مباشرة (1 آذار إلى 7 أيار)، ونحو 1,447 جريحًا، ونحو 7,000 معتقل حتى 6 أيار، و878 بيتًا هُدمت أو دُمّرت، فيما قُتل 30 جنديًا إسرائيليًا."
