  - id: e2023_09_eve
    title: "On the eve of October"
    title_ar: "عشية تشرين الأول"
    text: "The al-Aqsa Intifada began in September 2000, and by 15 October 2005 B'Tselem had counted 3,334 Palestinians killed by Israelis and 974 Israelis killed by Palestinians. Twenty-three years on, in August 2023, the UN envoy told the Security Council that more than 200 Palestinians and nearly 30 Israelis had been killed in the West Bank and Israel since the start of the year, the highest figure since 2005, and Gaza was entering its seventeenth year under blockade, after the August 2022 bombardment alone had killed 49 Palestinians, 17 of them children, and five days of strikes in May 2023 another 33, at least 12 of them civilians, according to the UN human rights office. In the West Bank the UN counted 645 obstacles to movement, a 712 km barrier 65% built and 69 farm gates kept shut most of the time, and Israeli jails held about 5,200 Palestinian prisoners, among them 170 children and 1,264 administrative detainees held without charge."
    text_ar: "في أيلول 2000 بدأت انتفاضة الأقصى، وحتى 15 تشرين الأول 2005 أحصت بتسيلم 3,334 فلسطينيًا قتلهم إسرائيليون، و974 إسرائيليًا قتلهم فلسطينيون. وبعد ثلاثة وعشرين عامًا قال مبعوث الأمم المتحدة لمجلس الأمن في آب 2023 إن أكثر من 200 فلسطيني ونحو 30 إسرائيليًا قُتلوا في الضفة وإسرائيل منذ مطلع العام، وهو أعلى رقم منذ 2005، وكانت غزة تدخل عامها السابع عشر تحت الحصار بعد أن قتل قصف آب 2022 وحده 49 فلسطينيًا بينهم 17 طفلًا، وقتلت غارات أيار 2023 في خمسة أيام 33 آخرين، 12 منهم على الأقل مدنيون، بحسب مكتب الأمم المتحدة لحقوق الإنسان. وأحصت الأمم المتحدة في الضفة 645 عائقًا أمام الحركة، وجدارًا طوله 712 كيلومترًا بُني 65% منه، و69 بوابة زراعية تبقى مغلقة معظم الوقت، وكان في السجون الإسرائيلية نحو 5,200 أسير فلسطيني، بينهم 170 طفلًا و1,264 معتقلًا إداريًا بلا تهمة."
    scope: "national"
