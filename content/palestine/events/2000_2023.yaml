  - id: e2014_07_gaza_51_days
    title: "The fifty-one days"
    title_ar: "الأيام الواحد والخمسون"
    text: "On 8 July 2014, after the June sweep of the West Bank and with Gaza in the eighth year of its blockade, the Zionist government began a war on the Strip that it called \"Protective Edge\" and the resistance called \"al-Asf al-Ma'koul\"; it lasted 51 days. The UN Commission of Inquiry, as cited by the UN's humanitarian office, counted 2,251 Palestinians killed, 1,462 of them civilians, including 551 children and 299 women; B'Tselem counted 2,202, and an Israeli government report claimed 2,125, at least 44% of them combatants. In 142 families three or more members were killed in a single strike, about 500,000 people were displaced at the peak and 18,000 homes were destroyed in whole or in part. In Rafah, after officer Hadar Goldin was captured on 1 August, the army invoked the \"Hannibal Directive\" and pounded the city for four days, killing at least 135 civilians, 75 of them children, according to Amnesty International and Forensic Architecture. On the Israeli side 67 soldiers and 6 civilians were killed, among them four-year-old Daniel Tregerman at Nahal Oz, and the Commission found credible allegations of possible war crimes by Israel and by Palestinian armed groups, which fired 4,881 rockets and 1,753 mortars."
    text_ar: "في 8 تموز 2014، بعد حملة حزيران على الضفة وفي العام الثامن من حصار غزة، شنّت الحكومة الصهيونية حربًا على القطاع سمّتها «الجرف الصامد» وسمّتها المقاومة «العصف المأكول»، ودامت 51 يومًا. وأحصت لجنة التحقيق الأممية، كما ينقل عنها مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية، 2,251 فلسطينيًا استُشهدوا، منهم 1,462 مدنيًا بينهم 551 طفلًا و299 امرأة، وأحصت بتسيلم 2,202، وزعم تقرير للحكومة الإسرائيلية أن العدد 2,125 وأن 44% منهم على الأقل مقاتلون؛ وفقدت 142 عائلة ثلاثة من أفرادها أو أكثر في غارة واحدة، ونزح نحو 500,000 إنسان في الذروة، ودُمّرت 18,000 وحدة سكنية كليًا أو جزئيًا. وفي رفح، بعد أسر الضابط هدار غولدن في 1 آب، طبّق جيش الاحتلال «إجراء هانيبال» وقصف المدينة أربعة أيام، فقتل 135 مدنيًا على الأقل بينهم 75 طفلًا، بحسب منظمة العفو الدولية ومجموعة «العمارة الجنائية». وقُتل من الإسرائيليين 67 جنديًا و6 مدنيين، بينهم الطفل دانيال تريغرمان، 4 أعوام، في ناحال عوز، ووجدت لجنة التحقيق ادعاءات موثوقة بجرائم حرب محتملة ارتكبتها إسرائيل والفصائل الفلسطينية، التي أطلقت 4,881 صاروخًا و1,753 قذيفة هاون."
