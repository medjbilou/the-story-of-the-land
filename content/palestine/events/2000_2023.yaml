  - id: e2018_07_nation_state_law
    title: "The Nation-State Law"
    title_ar: "قانون القومية"
    text: "On 19 July 2018 the Knesset passed, by 62 votes to 55, the Basic Law \"Israel as the Nation-State of the Jewish People\". It declares that the right to national self-determination in the state is \"unique to the Jewish people\", strips Arabic of its status as an official language and gives it a \"special status\", and makes \"the development of Jewish settlement\" a national value. MK Ayman Odeh called it a law of Jewish supremacy, and Adalah said it has key elements of apartheid and petitioned the High Court against it for the High Follow-Up Committee, the Arab mayors and the Joint List; but in July 2021 the court upheld it by ten justices to one, the dissenter being its only Arab justice, George Karra."
    text_ar: "في 19 تموز 2018 أقرّ الكنيست، بأغلبية 62 صوتًا مقابل 55، قانون الأساس «إسرائيل الدولة القومية للشعب اليهودي». وينصّ القانون على أن حق تقرير المصير القومي في الدولة «يخصّ الشعب اليهودي وحده»، وينزع عن العربية صفة اللغة الرسمية ويمنحها «مكانة خاصة»، ويعدّ «تطوير الاستيطان اليهودي قيمة قومية». ووصفه النائب أيمن عودة بأنه قانون تفوّق يهودي، وقال مركز عدالة إن فيه عناصر أساسية من الأبارتهايد، وطعن فيه أمام المحكمة العليا باسم لجنة المتابعة العليا ورؤساء السلطات المحلية العربية والقائمة المشتركة، لكن المحكمة ثبّتته في تموز 2021 بأغلبية عشرة قضاة مقابل واحد، هو القاضي العربي الوحيد جورج قرّا."
