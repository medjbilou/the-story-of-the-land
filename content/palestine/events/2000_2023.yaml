  - id: e2014_07_abu_khdeir
    title: "Muhammad Abu Khdeir"
    title_ar: "محمد أبو خضير"
    text: "On 12 June 2014 three Israeli teenagers, Eyal Yifrach, Gilad Shaer and Naftali Fraenkel, were abducted and killed near al-Khalil (Hebron), and their bodies were found on 30 June. Meanwhile the Israeli occupation army swept through the West Bank in what it called \"Operation Brother's Keeper\": Human Rights Watch counted at least five Palestinians shot dead and at least 150 held without charge, Addameer about 700 arrests, and HRW called it collective punishment; among those seized, Al Jazeera reported, were 58 prisoners freed in the 2011 exchange, including Nael al-Barghouti, who had already spent 34 years in jail. On 2 July Israeli extremists abducted Muhammad Abu Khdeir, 16, from Shu'fat in occupied East al-Quds (East Jerusalem), beat him and burned him alive in a forest in al-Quds (Jerusalem), saying it was revenge for the three teenagers. Their ringleader was sentenced to life plus 20 years, and two minors with him to life and to 21 years."
    text_ar: "في 12 حزيران 2014 خُطف ثلاثة فتيان إسرائيليين، إيال يفراح وجلعاد شاعر ونفتالي فرنكل، وقُتلوا قرب الخليل، ووُجدت جثثهم في 30 حزيران. وفي الأثناء اجتاح جيش الاحتلال الضفة الغربية في عملية سمّاها «عودة الإخوة»، فأحصت هيومن رايتس ووتش خمسة فلسطينيين على الأقل استُشهدوا بالرصاص و150 على الأقل احتُجزوا بلا تهمة، وأحصت مؤسسة الضمير نحو 700 معتقل، ووصفت هيومن رايتس ووتش ذلك بأنه عقاب جماعي، وكان بين المعتقلين، بحسب الجزيرة، 58 أسيرًا محرَّرًا في صفقة عام 2011، منهم نائل البرغوثي الذي كان قد أمضى 34 عامًا في السجن. وفي 2 تموز خطف متطرفون إسرائيليون محمد أبو خضير، 16 عامًا، من شعفاط في القدس الشرقية المحتلة، وضربوه وأحرقوه حيًّا في أحراش القدس، وقالوا إنهم ينتقمون للفتيان الثلاثة. وحُكم على زعيمهم بالسجن المؤبد وعشرين عامًا، وعلى قاصرَين معه بالمؤبد وبـ21 عامًا."
