  - id: e2005_07_bds
    title: "The call for boycott"
    title_ar: "نداء المقاطعة"
    text: "On 9 July 2005, one year to the day after the World Court's opinion on the wall, about 170 Palestinian unions, refugee networks, women's organisations and civil-society bodies issued a call for Boycott, Divestment and Sanctions against Israel until it complies with international law. The call set three demands: end its occupation and colonisation of all Arab lands and dismantle the wall; recognise the right of the Arab-Palestinian citizens of Israel to full equality; and respect, protect and promote the right of Palestinian refugees to return to their homes and properties as set out in UN Resolution 194."
    text_ar: "في 9 تموز 2005، بعد عام بالضبط من رأي محكمة العدل الدولية في الجدار، أطلقت نحو 170 نقابة وشبكة لاجئين ومنظمة نسائية وهيئة أهلية فلسطينية نداءً لمقاطعة إسرائيل وسحب الاستثمارات منها وفرض العقوبات عليها حتى تلتزم بالقانون الدولي. وحدّد النداء ثلاثة مطالب: إنهاء احتلالها واستعمارها لكل الأراضي العربية وتفكيك الجدار، والاعتراف بحق المواطنين العرب الفلسطينيين في إسرائيل في المساواة الكاملة، واحترام حق اللاجئين الفلسطينيين في العودة إلى ديارهم وممتلكاتهم وحمايته وتعزيزه كما نصّ عليه قرار الأمم المتحدة 194."
