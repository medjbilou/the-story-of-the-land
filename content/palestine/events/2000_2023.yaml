        outcome: "The volunteers slept on mattresses in the living room and learned Arabic words from the children every evening."
        outcome_ar: "نام المتطوّعون على فُرُش في الصالة، وصاروا يتعلّمون من الأولاد كلمات عربية كل مساء."
