  - id: e2002_04_nativity
    title: "The siege of the Church of the Nativity"
    title_ar: "حصار كنيسة المهد"
    text: "On 2 April 2002, as the Israeli occupation army entered Bayt Lahm (Bethlehem), about 200 Palestinians, among them monks, civilians and wanted gunmen, took refuge in the Church of the Nativity, and the army besieged it for 39 days, during which eight Palestinians were killed. The siege ended on 10 May: 13 men were flown to Cyprus and then exiled to European countries, 26 were deported to Gaza, and more than 80 civilians and clergy walked out. Bayt Lahm lived about five weeks under curfew."
    text_ar: "في 2 نيسان 2002، حين دخل جيش الاحتلال بيت لحم، لجأ نحو 200 فلسطيني، بينهم رهبان ومدنيون ومسلّحون مطلوبون، إلى كنيسة المهد، فحاصرها الجيش 39 يومًا استُشهد خلالها ثمانية فلسطينيين. وانتهى الحصار في 10 أيار: نُقل 13 رجلًا جوًّا إلى قبرص ثم أُبعدوا إلى دول أوروبية، وأُبعد 26 إلى غزة، وخرج أكثر من 80 من المدنيين ورجال الدين. وعاشت بيت لحم نحو خمسة أسابيع تحت حظر التجوّل."
