  - id: e2021_09_gilboa
    title: "The tunnel out of Gilboa"
    title_ar: "نفق الحرية"
    text: "Shortly after 1 a.m. on 6 September 2021 six Palestinian prisoners got out of Israel's high-security Gilboa prison through a tunnel dug from beneath their cell: Zakaria Zubeidi, Mahmoud Ardah, Mohammad Ardah, Yaqoub Qadri, Ayham Kamamji and Munadil Nafa'at. Four were recaptured within days, two of them in al-Nasira (Nazareth), and the last two in Jenin on 19 September, so all six were back in custody within thirteen days."
    text_ar: "بُعيد الساعة الواحدة فجر 6 أيلول 2021 خرج ستة أسرى فلسطينيين من سجن جلبوع الإسرائيلي شديد الحراسة عبر نفق حفروه من تحت زنزانتهم: زكريا الزبيدي ومحمود العارضة ومحمد العارضة ويعقوب قادري وأيهم كممجي ومناضل نفيعات. وأُعيد اعتقال أربعة منهم خلال أيام، اثنان منهم في الناصرة، ثم الأخيرَين في جنين في 19 أيلول، فعاد الستة إلى الأسر خلال ثلاثة عشر يومًا."
