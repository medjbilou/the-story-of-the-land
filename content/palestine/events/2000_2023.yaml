  - id: e2017_07_aqsa_gates
    title: "The uprising of the gates"
    title_ar: "هبّة البوابات"
    text: "On 14 July 2017 three cousins from Umm al-Fahm, Palestinian citizens of Israel, shot dead two Israeli Border Police officers at al-Haram al-Sharif and were themselves killed. The occupation authorities closed the compound and cancelled Friday prayers for the first time in years, and their police arrested the Mufti of al-Quds, Muhammad Ahmad Hussein, after he led prayers outside the Old City; when they reopened it on 16 July they put metal detectors at the gates. The Islamic Waqf told worshippers not to pass through them, and for about two weeks the people of al-Quds (Jerusalem) prayed in the streets around the Old City gates in mass civil disobedience; three Palestinians were killed in al-Quds on 21 July. On 25 July Israel removed the detectors, and on 27 July the remaining railings and cameras, and the worshippers went back into al-Aqsa."
    text_ar: "في 14 تموز 2017 أطلق ثلاثة أبناء عمومة من أم الفحم، من المواطنين الفلسطينيين في إسرائيل، النار في الحرم القدسي الشريف على شرطيين إسرائيليين من حرس الحدود فقتلوهما، واستُشهد الثلاثة. وأغلقت سلطات الاحتلال الحرم وألغت صلاة الجمعة لأول مرة منذ سنوات، واعتقلت شرطتها مفتي القدس محمد أحمد حسين بعد أن أمّ المصلين خارج البلدة القديمة، وحين فتحته في 16 تموز نصبت بوابات إلكترونية على مداخله. فدعت دائرة الأوقاف الإسلامية المصلين إلى عدم المرور منها، وصلّى المقدسيون في الشوارع حول أبواب البلدة القديمة نحو أسبوعين في عصيان مدني جماعي، واستُشهد ثلاثة فلسطينيين في القدس في 21 تموز. وفي 25 تموز أزالت إسرائيل البوابات، وفي 27 تموز أزالت ما بقي من حواجز وكاميرات، فعاد المصلون إلى الأقصى."
