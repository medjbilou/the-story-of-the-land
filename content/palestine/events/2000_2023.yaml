events:
  - id: e2000_09_aqsa
    title: "Sharon at the Haram, gunfire the next day"
    title_ar: "شارون في الحرم، والرصاص في اليوم التالي"
    text: "On 28 September 2000 Likud leader Ariel Sharon walked into al-Haram al-Sharif guarded by more than 1,000 Israeli police, according to the international Mitchell Report; the Palestinian observer at the UN said 3,000. The next day, after Friday prayers, Israeli occupation police fired rubber-coated metal bullets and live ammunition at protesters in the compound, killing four and injuring about 200 according to the US State Department, and by the end of the day seven Palestinians had been killed, according to the Palestinian observer. The Mitchell Report said the visit did not cause the uprising but that its provocative effect should have been foreseen, and that more significant was the police decision on 29 September to use lethal means. So began the al-Aqsa Intifada; by 1 October, according to the Palestinian observer, 36 Palestinians had been killed and more than 1,000 injured."
    text_ar: "في 28 أيلول 2000 دخل زعيم حزب الليكود أرييل شارون الحرمَ القدسي الشريف يحرسه أكثر من 1,000 شرطي إسرائيلي بحسب تقرير لجنة ميتشل الدولية، فيما قال المراقب الفلسطيني لدى الأمم المتحدة إنهم كانوا 3,000. وفي اليوم التالي، بعد صلاة الجمعة، أطلقت شرطة الاحتلال الرصاص المعدني المغلّف بالمطاط والرصاص الحي على المحتجّين في ساحات الحرم، فقتلت أربعة وأصابت نحو 200 بحسب وزارة الخارجية الأمريكية، وبلغ عدد القتلى الفلسطينيين سبعة مع نهاية ذلك اليوم بحسب المراقب الفلسطيني. وكتبت لجنة ميتشل أن الزيارة لم تكن هي سبب الانتفاضة، لكن أثرها الاستفزازي كان ينبغي أن يُتوقَّع، وأن الأخطر منها قرار الشرطة في 29 أيلول استخدام وسائل قاتلة. هكذا بدأت انتفاضة الأقصى، وحتى 1 تشرين الأول، بحسب المراقب الفلسطيني، استُشهد 36 فلسطينيًا وأُصيب أكثر من 1,000."
