  - id: e2022_05_masafer_yatta
    title: "Masafer Yatta: \"Firing Zone 918\""
    title_ar: "مسافر يطا: «منطقة إطلاق نار 918»"
    text: "On 4 May 2022 Israel's High Court rejected the petitions of the people of Masafer Yatta in the hills south of al-Khalil (Hebron), whose land the occupation army had declared \"Firing Zone 918\" in the 1980s, clearing the way for their expulsion. The UN's humanitarian office counts 215 households, about 1,150 people including 569 children, in 13 communities at risk of forcible transfer, and B'Tselem called the ruling a \"fast-track war crime\"."
    text_ar: "في 4 أيار 2022 رفضت المحكمة العليا الإسرائيلية التماسات أهالي مسافر يطا في تلال جنوب الخليل، الذين أعلن جيش الاحتلال أرضهم «منطقة إطلاق نار 918» في ثمانينيات القرن الماضي، ففتحت الطريق لطردهم. ويُحصي مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية 215 أسرة، نحو 1,150 إنسانًا بينهم 569 طفلًا، في 13 تجمّعًا مهدّدًا بالترحيل القسري، ووصفت بتسيلم القرار بأنه «جريمة حرب على المسار السريع»."
