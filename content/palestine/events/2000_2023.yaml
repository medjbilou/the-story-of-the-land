  - id: e2003_03_rachel_corrie
    title: "Rachel Corrie"
    title_ar: "راشيل كوري"
    text: "On 16 March 2003 Rachel Corrie, a 23-year-old American volunteer with the International Solidarity Movement, stood in front of an armoured bulldozer of the Israeli occupation army in Rafah to stop it demolishing a Palestinian home, by the movement's account that of pharmacist Samir Nasrallah. The bulldozer ran her over and killed her. Eyewitnesses said she was run over deliberately; the army claimed it was an accident and that the driver could not see her, and in 2012 an Israeli court rejected her family's lawsuit."
    text_ar: "في 16 آذار 2003 وقفت راشيل كوري، المتطوّعة الأمريكية في حركة التضامن الدولية، ابنة الثالثة والعشرين، أمام جرافة مدرّعة لجيش الاحتلال في رفح لتمنعها من هدم بيت فلسطيني، وتقول روايات الحركة إنه بيت الصيدلي سمير نصر الله. فدهستها الجرافة وقتلتها. وقال شهود عيان إنها دُهست عمدًا، وزعم الجيش أنها حادثة وأن السائق لم يرها، ورفضت محكمة إسرائيلية عام 2012 الدعوى التي رفعتها عائلتها."
    scope: "region:rafah"
    place: rafah
    tags: [sensitive]
    from: 2003-03-01
