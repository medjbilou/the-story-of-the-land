  - id: e2017_04_dignity_strike
    title: "The Freedom and Dignity strike"
    title_ar: "إضراب الحرية والكرامة"
    text: "On Prisoners' Day, 17 April 2017, about 1,500 Palestinian prisoners in Israeli jails began the \"Freedom and Dignity\" hunger strike called by the jailed leader Marwan Barghouti, demanding an end to solitary confinement and administrative detention, longer and more regular family visits, phones in the prisons and better healthcare. They held out for 40 days, more than 800 of them to the end, and suspended the strike on 27 May after talks involving the International Committee of the Red Cross and the Palestinian Authority, when the prison service agreed to restore the second monthly family visit."
    text_ar: "في يوم الأسير، 17 نيسان 2017، بدأ نحو 1,500 أسير فلسطيني في السجون الإسرائيلية إضراب «الحرية والكرامة» عن الطعام، بدعوة من القائد الأسير مروان البرغوثي، مطالبين بإنهاء العزل الانفرادي والاعتقال الإداري، وبزيارات عائلية أطول وأكثر انتظامًا، وبهواتف في السجون ورعاية صحية أفضل. وصمدوا 40 يومًا، وبقي أكثر من 800 منهم مضربين حتى النهاية، ثم علّقوا الإضراب في 27 أيار بعد مفاوضات شاركت فيها اللجنة الدولية للصليب الأحمر والسلطة الفلسطينية، ووافقت مصلحة السجون على إعادة الزيارة العائلية الشهرية الثانية."
    scope: "national"
