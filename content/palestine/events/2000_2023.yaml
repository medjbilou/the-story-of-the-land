  - id: e2004_05_rafah
    title: "\"Rainbow\" over Rafah"
    title_ar: "«قوس قزح» فوق رفح"
    text: "In May 2004 the Israeli occupation army swept through Rafah in what it called \"Operation Rainbow\". Human Rights Watch counted 59 Palestinians killed between 12 and 24 May, 11 of them under 18 and 18 of them armed men, and 254 houses destroyed, leaving about 3,800 people homeless; the army claimed 41 of the dead were militants. On 19 May a missile from an Israeli helicopter and Israeli tank shells hit a protest march heading for Tel al-Sultan, killing eight people including four children, according to the Palestinian Centre for Human Rights, or nine according to HRW. HRW's report \"Razing Rafah\" found that about 16,000 people, more than a tenth of Rafah's population, had lost their homes in four years."
    text_ar: "في أيار 2004 اجتاح جيش الاحتلال رفح في عملية سمّاها «قوس قزح»، فأحصت هيومن رايتس ووتش بين 12 و24 أيار 59 شهيدًا فلسطينيًا، 11 منهم دون الثامنة عشرة و18 مسلّحون، و254 بيتًا مدمّرًا وقرابة 3,800 إنسان بلا مأوى، فيما زعم الجيش أن 41 منهم مسلّحون. وفي 19 أيار أصاب صاروخ أطلقته مروحية إسرائيلية وقذائف دبابات إسرائيلية مسيرةً احتجاجية متجهة إلى تل السلطان، فاستُشهد ثمانية بينهم أربعة أطفال بحسب المركز الفلسطيني لحقوق الإنسان، وتسعة بحسب هيومن رايتس ووتش. ووجد تقرير هيومن رايتس ووتش «تدمير رفح» أن نحو 16,000 إنسان، أي أكثر من عُشر سكان رفح، فقدوا بيوتهم في أربع سنوات."
    scope: "region:rafah"
    place: rafah
    tags: [sensitive]
    from: 2004-05-01
