  - id: e2021_05_unity_strike
    title: "The Dignity Strike: the Unity Intifada"
    title_ar: "إضراب الكرامة: هبّة الوحدة"
    text: "On 18 May 2021 Palestinians held a general strike in Gaza, the West Bank, al-Quds (Jerusalem) and the Palestinian towns inside Israel, where the High Follow-Up Committee called it; its head Mohammad Barakeh said it \"encompassed all of historic Palestine\". A \"Manifesto of Dignity and Hope\" spread that day, calling for a united intifada of a people divided by Israeli policies. In al-Lydd (Lydda), Musa Hassuna, 31 and unarmed, had been shot dead by armed Jewish Israelis on the night of 10 May; the five suspects were released within three days and the case was closed. Police then launched \"Operation Law and Order\", and Adalah counted more than 2,140 people detained, about 91% of them Palestinians."
    text_ar: "في 18 أيار 2021 أضرب الفلسطينيون إضرابًا عامًا في غزة والضفة والقدس وفي البلدات الفلسطينية داخل إسرائيل، حيث دعت إليه لجنة المتابعة العليا، وقال رئيسها محمد بركة إنه «شمل فلسطين التاريخية كلها». وانتشر في ذلك اليوم «بيان الكرامة والأمل» الذي دعا إلى انتفاضة موحّدة لشعب فرّقته السياسات الإسرائيلية. وكان موسى حسونة، 31 عامًا، قد استُشهد برصاص مسلّحين يهود في اللد ليلة 10 أيار وهو أعزل، فأُفرج عن المشتبه بهم الخمسة خلال ثلاثة أيام وأُغلق الملف. ثم أطلقت الشرطة عملية «القانون والنظام»، فأحصى مركز عدالة أكثر من 2,140 معتقلًا، نحو 91% منهم فلسطينيون."
