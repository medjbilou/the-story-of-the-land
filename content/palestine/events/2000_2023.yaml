  - id: e2013_11_prawer
    title: "\"Prawer will not pass\""
    title_ar: "«برافر لن يمرّ»"
    text: "In June 2013 the Knesset passed in a first reading, by 43 votes to 40, the Prawer-Begin Plan to uproot tens of thousands of Bedouin Palestinian citizens from their \"unrecognised\" villages in the Naqab: about 40,000 according to Al Jazeera and the UN human rights chief, from up to 35 villages. Palestinians answered with \"days of rage\", and on 30 November 2013 thousands protested in Hura in the Naqab and in Hayfa (Haifa); police fired tear gas and made dozens of arrests, according to Adalah. On 12 December the government shelved the bill, which Adalah called a major achievement in the history of the Palestinians in Israel, while MK Mohammad Barakeh warned the plan lived on in essence. Al-Araqib, first razed in July 2010, was demolished for the 234th time in January 2025, according to the al-Quds newspaper."
    text_ar: "في حزيران 2013 أقرّ الكنيست بالقراءة الأولى، بأغلبية 43 صوتًا مقابل 40، مخطط «برافر-بيغن» لاقتلاع عشرات الآلاف من المواطنين الفلسطينيين البدو من قراهم «غير المعترف بها» في النقب: نحو 40,000 بحسب الجزيرة والمفوّضة السامية لحقوق الإنسان، مما يصل إلى 35 قرية. فخرج الفلسطينيون في «أيام غضب»، وفي 30 تشرين الثاني 2013 تظاهر الآلاف في حورة بالنقب وفي حيفا، فأطلقت الشرطة الغاز واعتقلت العشرات بحسب مركز عدالة. وفي 12 كانون الأول جمّدت الحكومة القانون، فوصف عدالة ذلك بأنه إنجاز كبير في تاريخ الفلسطينيين في الداخل، وحذّر النائب محمد بركة من أن المخطط باقٍ في جوهره. أما قرية العراقيب، التي هُدمت أول مرة في تموز 2010، فقد هُدمت للمرة الـ234 في كانون الثاني 2025، بحسب صحيفة القدس."
