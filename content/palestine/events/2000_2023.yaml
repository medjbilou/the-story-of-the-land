  - id: e2006_01_elections
    title: "The Legislative Council elections"
    title_ar: "انتخابات المجلس التشريعي"
    text: "On 25 January 2006 Palestinians in the occupied territories elected a new Legislative Council: Hamas's Change and Reform list won 74 of 132 seats and Fatah 45. International observers praised the election officials, and the European Parliament's team called the vote free, transparent and without violence. But on 30 January the Quartet made further aid conditional on the new government committing to non-violence, recognising Israel and accepting past agreements; Israel withheld about $50 million a month in customs revenue it collects for the Palestinian Authority, and the United States refused to fund a Hamas-led government."
    text_ar: "في 25 كانون الثاني 2006 انتخب الفلسطينيون في الأراضي المحتلة مجلسًا تشريعيًا جديدًا، ففازت قائمة التغيير والإصلاح التابعة لحركة حماس بـ74 مقعدًا من 132، وحركة فتح بـ45. وأشاد المراقبون الدوليون بأداء لجنة الانتخابات، ووصف فريق البرلمان الأوروبي الاقتراع بأنه حرّ وشفاف وخالٍ من العنف. لكن اللجنة الرباعية اشترطت في 30 كانون الثاني، لاستمرار المساعدات، أن تلتزم الحكومة الجديدة بنبذ العنف والاعتراف بإسرائيل وقبول الاتفاقات السابقة، وحجبت إسرائيل نحو 50 مليون دولار شهريًا من أموال المقاصة، وهي عائدات جمركية تجبيها لحساب السلطة الفلسطينية، ورفضت الولايات المتحدة تمويل حكومة تقودها حماس."
