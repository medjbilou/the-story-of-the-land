  - id: e2021_05_gaza_war
    title: "The May 2021 war (\"Sword of Jerusalem\")"
    title_ar: "حرب أيار 2021 («سيف القدس»)"
    text: "After the raids on al-Aqsa, among them one on the morning of 10 May 2021 that wounded more than 300 Palestinians, and the eviction threats in Sheikh Jarrah, Hamas gave Israel until 6 p.m. that day to pull its forces out of both, then fired rockets. For eleven days, to 21 May, the occupation army bombarded Gaza in what Israel called \"Guardian of the Walls\", while the armed groups, who named the battle \"Sword of Jerusalem\", kept firing rockets into Israel. The UN counted 256 Palestinians killed in Gaza, including 66 children and 40 women, about half of them believed to be civilians; 113,000 people were displaced at the peak and more than 2,000 homes destroyed or badly damaged. On 15 May a strike brought down al-Jalaa tower, home to the offices of Al Jazeera and the Associated Press, after an hour's warning; Israel claimed it housed Hamas intelligence but gave no evidence. In the early hours of 16 May strikes on al-Wahda Street in Ghazza (Gaza City) brought down three residential buildings without warning, killing 44 civilians, 22 of them from the al-Qoulaq family, and Human Rights Watch found no military target there. In Israel 13 people were killed: 12 civilians, two of them children, and one soldier."
    text_ar: "بعد اقتحامات الأقصى، ومنها اقتحام صباح 10 أيار 2021 الذي أصاب أكثر من 300 فلسطيني، وبعد تهديد عائلات الشيخ جراح بالإخلاء، أمهلت حماس إسرائيل حتى السادسة مساء ذلك اليوم لسحب قواتها من المكانين، ثم أطلقت صواريخها. وقصف جيش الاحتلال غزة أحد عشر يومًا، حتى 21 أيار، في عملية سمّتها إسرائيل «حارس الأسوار»، وواصلت الفصائل، التي سمّت المعركة «سيف القدس»، إطلاق الصواريخ على إسرائيل. وأحصت الأمم المتحدة 256 فلسطينيًا استُشهدوا في غزة، بينهم 66 طفلًا و40 امرأة، ويُعتقد أن نحو نصف الشهداء مدنيون، ونزح 113,000 إنسان في الذروة، ودُمّرت أكثر من 2,000 وحدة سكنية أو تضرّرت بشدة. وفي 15 أيار دمّرت غارة برج الجلاء الذي كان يضمّ مكتبَي الجزيرة ووكالة أسوشيتد برس بعد إنذار مدته ساعة، وزعمت إسرائيل أن فيه استخبارات حماس دون أن تقدّم دليلًا. وفجر 16 أيار هدمت غارات على شارع الوحدة في مدينة غزة ثلاث بنايات سكنية دون إنذار، فقتلت 44 مدنيًا، 22 منهم من عائلة القولق، ولم تجد هيومن رايتس ووتش هدفًا عسكريًا هناك. وقُتل في إسرائيل 13 شخصًا: 12 مدنيًا بينهم طفلان، وجندي واحد."
