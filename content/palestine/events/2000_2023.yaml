  - id: e2001_06_dolphinarium
    title: "The Dolphinarium bombing"
    title_ar: "تفجير الدولفيناريوم"
    text: "Just before midnight on 1 June 2001 Saeed Hotari, 22, blew himself up among young people at the Dolphinarium discotheque on the Tel Aviv seafront, killing 21 people, 16 of them teenagers, most from families who had come from the former Soviet Union, and wounding about 120. Hotari was reportedly linked to Hamas; two groups claimed the attack and later withdrew their claims."
