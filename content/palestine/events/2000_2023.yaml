        outcome: "The father waited at the yellow gate from six until it opened, and picked olives in three hours instead of three days."
        outcome_ar: "وقف الأب عند البوابة الصفراء من السادسة حتى فُتحت، وقطف الزيتون في ثلاث ساعات بدل ثلاثة أيام."
