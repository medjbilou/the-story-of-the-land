  - id: e2004_11_arafat
    title: "Yasser Arafat dies"
    title_ar: "رحيل ياسر عرفات"
    text: "After more than two years penned in by the occupation army at his battered Muqata'a compound in Ramallah, Yasser Arafat fell ill and was flown to the Percy military hospital near Paris, where he died on 11 November 2004, aged 75. After a military funeral in Cairo he was buried on 12 November at the Muqata'a. In 2013 Swiss scientists who examined his exhumed remains said their results \"moderately support\" poisoning with polonium-210, but the French and Russian teams did not confirm it, and the cause of his death is still disputed."
    text_ar: "بعد أكثر من عامين حاصره فيهما جيش الاحتلال في مقرّ المقاطعة المدمَّر في رام الله، مرض ياسر عرفات ونُقل إلى مستشفى بيرسي العسكري قرب باريس، وتوفي فيه في 11 تشرين الثاني 2004 عن 75 عامًا. وبعد جنازة عسكرية في القاهرة دُفن في 12 تشرين الثاني في مقرّ المقاطعة. وفي عام 2013 قال فريق علمي سويسري فحص رفاته بعد نبشها إن النتائج «تدعم بدرجة معتدلة» فرضية تسميمه بالبولونيوم 210، لكن الفريقين الفرنسي والروسي لم يؤكّدا ذلك، وما زال سبب وفاته موضع خلاف."
