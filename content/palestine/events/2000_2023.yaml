  - id: e2023_01_jenin_raid
    title: "The raids on Jenin camp and Nablus"
    title_ar: "اقتحام مخيم جنين ونابلس"
    text: "On 26 January 2023 an Israeli occupation army raid on Jenin camp killed ten Palestinians, including two children and a 61-year-old woman, and injured 26: the highest toll of any single West Bank operation since the UN's humanitarian office began recording in 2005. The office said the woman and two boys aged 16 and 17 were shot while reportedly posing no threat. Less than a month later, on 22 February, a raid on Nablus killed 11 Palestinians aged 16 to 72, and the Palestinian Ministry of Health counted 102 wounded, 82 of them by live fire."
    text_ar: "في 26 كانون الثاني 2023 قتل اقتحام لقوات الاحتلال في مخيم جنين عشرة فلسطينيين، بينهم طفلان وامرأة في الحادية والستين، وأصاب 26، في أعلى حصيلة لعملية واحدة في الضفة منذ بدأ مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية التسجيل عام 2005؛ وقال المكتب إن المرأة وفتيين في السادسة عشرة والسابعة عشرة أُطلق عليهم الرصاص وهم لا يشكّلون خطرًا على ما يبدو. وبعد أقل من شهر، في 22 شباط، قتل اقتحام لنابلس 11 فلسطينيًا تراوحت أعمارهم بين 16 و72 عامًا، وأحصت وزارة الصحة الفلسطينية 102 جريح، 82 منهم بالرصاص الحي."
    scope: "region:jenin"
