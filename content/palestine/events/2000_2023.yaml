        outcome: "The father sat with his son a whole night without raising his voice and asked him to promise to come home every evening."
        outcome_ar: "جلس الأب مع ابنه ليلة كاملة، ولم يرفع صوته، وطلب منه أن يعده بأن يعود كل مساء."
