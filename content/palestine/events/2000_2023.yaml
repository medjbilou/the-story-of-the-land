        text_ar: "نستقبل عائلة نزحت من المخيم"
        outcome: "The guests slept in the living room, and in the morning their grandmother insisted on kneading bread for everyone."
        outcome_ar: "نام الضيوف في غرفة الجلوس، وفي الصباح أصرّت جدّتهم على عجن الخبز للجميع."
        effects:
          - { target: community, delta: 0.05 }
          - { target: home, delta: -0.02 }
          - { target: livelihood, delta: -0.03 }
      - id: return_to_camp
        text: "Go back to the camp as soon as the army pulls out"
        text_ar: "نعود إلى المخيم فور انسحاب جيش الاحتلال"
        outcome: "The family walked over the torn-up asphalt to the house and found the door ripped off but the pictures still on the wall."
        outcome_ar: "مشت العائلة فوق الإسفلت المقلوب حتى البيت، ووجدت الباب مخلوعًا والصور ما زالت على الحائط."
        effects:
          - { target: home, delta: 0.03 }
          - { target: sumud, delta: 0.08 }
          - { target: safety, delta: -0.05 }
