  - id: e2006_06_power_plant
    title: "The night the power plant was bombed"
    title_ar: "ليلة قصف محطة الكهرباء"
    text: "On 9 June 2006 a blast on a beach in northern Gaza killed seven members of the Ghalya family; Human Rights Watch concluded it was caused by an Israeli 155mm artillery shell, while the army claimed its artillery could not have been the cause. On 25 June fighters from the Qassam Brigades and two other groups came through a tunnel from Gaza and attacked an Israeli army post near Kerem Shalom, killing two soldiers and capturing a third, Gilad Shalit. Early on 28 June occupation aircraft fired missiles at the six transformers of the Strip's only working power plant, which by B'Tselem's figures produced about 100 of the 220 megawatts Gaza used, and B'Tselem called the strike a war crime against a purely civilian object. In the operation Israel called \"Summer Rains\", B'Tselem counts 405 Palestinians killed by Israeli forces in Gaza by the end of 2006, 88 of them minors and 205 not taking part in the fighting. Shalit was freed in October 2011 in exchange for 1,027 Palestinian prisoners."
    text_ar: "في 9 حزيران 2006 قتل انفجار على شاطئ في شمال غزة سبعة من أفراد عائلة غالية، وخلصت هيومن رايتس ووتش إلى أنه ناجم عن قذيفة مدفعية إسرائيلية من عيار 155 ملم، فيما زعم جيش الاحتلال أن مدفعيته لا يمكن أن تكون السبب. وفي 25 حزيران دخل مقاتلون من كتائب القسام وفصيلين آخرين عبر نفق من غزة، وهاجموا موقعًا لجيش الاحتلال قرب كرم أبو سالم، فقتلوا جنديين وأسروا ثالثًا هو جلعاد شاليط. وفجر 28 حزيران أطلقت طائرات الاحتلال صواريخها على المحوّلات الستة لمحطة الكهرباء الوحيدة العاملة في القطاع، التي كانت تنتج بحسب منظمة بتسيلم نحو 100 من أصل 220 ميغاواط تستهلكها غزة، ووصفت المنظمة الهجوم بأنه جريمة حرب على منشأة مدنية بحتة. وفي العملية التي سمّتها إسرائيل «أمطار الصيف»، أحصت بتسيلم 405 فلسطينيين قتلتهم قوات الاحتلال في غزة حتى نهاية 2006، بينهم 88 قاصرًا و205 لم يشاركوا في القتال. وأُفرج عن شاليط في تشرين الأول 2011 مقابل 1,027 أسيرًا فلسطينيًا."
