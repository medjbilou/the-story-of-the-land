  - id: e2023_07_jenin_operation
    title: "Jenin again"
    title_ar: "جنين مرة أخرى"
    text: "On 3 and 4 July 2023 the Israeli occupation army attacked Jenin camp again in what Israel called \"Home and Garden\": the UN's humanitarian office counted 12 Palestinians killed, four of them children according to the Palestinian Ministry of Health, 143 injured and more than 3,500 people displaced from the camp, the highest Palestinian toll of any single West Bank operation since 2005. Israeli forces bulldozed about 3.9 km of roads, and about 8 km of water pipes were destroyed, cutting off the camp's water. One Israeli soldier was killed, according to official Israeli sources."
    text_ar: "في 3 و4 تموز 2023 هاجم جيش الاحتلال مخيم جنين مجددًا في عملية سمّتها إسرائيل «بيت وحديقة»، فأحصى مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية 12 فلسطينيًا استُشهدوا، بينهم أربعة أطفال بحسب وزارة الصحة الفلسطينية، و143 جريحًا، وأكثر من 3,500 إنسان نزحوا من المخيم، في أعلى حصيلة فلسطينية لعملية واحدة في الضفة منذ 2005. وجرّفت قوات الاحتلال نحو 3.9 كيلومتر من الطرق، ودُمّر نحو 8 كيلومترات من أنابيب المياه فانقطع الماء عن المخيم. وقُتل جندي إسرائيلي واحد بحسب مصادر إسرائيلية رسمية."
    scope: "region:jenin"
    place: jenin
    tags: [sensitive]
