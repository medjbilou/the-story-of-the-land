  - id: e2022_05_shireen
    title: "Shireen Abu Akleh"
    title_ar: "شيرين أبو عاقلة"
    text: "At about 7 a.m. on 11 May 2022 Israeli occupation forces shot dead Al Jazeera correspondent Shireen Abu Akleh as she covered their raid on Jenin refugee camp, wearing a clearly marked press vest and helmet, and wounded her colleague Ali al-Samoudi in the shoulder. On 24 June the UN human rights office found that the shots came from Israeli forces, not from indiscriminate Palestinian fire; in September the Israeli army said there was a \"high possibility\" that one of its soldiers had hit her \"accidentally\", and opened no criminal investigation. At her funeral in al-Quds (Jerusalem) on 13 May Israeli police charged the pallbearers with batons, stun grenades and tear gas, and the coffin nearly fell."
    text_ar: "نحو السابعة صباح 11 أيار 2022 قتلت قوات الاحتلال مراسلة الجزيرة شيرين أبو عاقلة برصاصة وهي تغطّي اقتحامها لمخيم جنين، مرتدية سترة وخوذة تحملان علامة الصحافة بوضوح، وأصابت زميلها علي السمودي في كتفه. وفي 24 حزيران خلص مكتب الأمم المتحدة لحقوق الإنسان إلى أن الرصاص جاء من القوات الإسرائيلية لا من نيران فلسطينية عشوائية، وفي أيلول قال جيش الاحتلال إن ثمة «احتمالًا كبيرًا» أن يكون أحد جنوده أصابها «عن غير قصد»، ولم يفتح تحقيقًا جنائيًا. وفي جنازتها في القدس يوم 13 أيار هاجمت شرطة الاحتلال حاملي النعش بالهراوات وقنابل الصوت والغاز، فكاد النعش يسقط."
