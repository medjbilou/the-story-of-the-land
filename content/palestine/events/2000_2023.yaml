  - id: e2010_05_mavi_marmara
    title: "The Mavi Marmara"
    title_ar: "سفينة مرمرة"
    text: "On 31 May 2010 Israeli naval commandos stormed the Mavi Marmara, one of the ships of the \"Freedom Flotilla\" carrying aid and activists to break the siege of Gaza, in international waters 72 nautical miles from the coast. They killed nine passengers: eight Turkish citizens and Furkan Doğan, 19, a US citizen shot five times at close range; a tenth died in 2014 after four years in a coma. A UN Human Rights Council mission found the interception illegal and the closure of Gaza collective punishment, and even the Secretary-General's panel (the Palmer report), which held the naval blockade lawful, called the boarding \"excessive and unreasonable\"."
    text_ar: "في 31 أيار 2010 اقتحمت قوات كوماندوز بحرية إسرائيلية سفينة «مافي مرمرة»، إحدى سفن «أسطول الحرية» التي حملت مساعدات ونشطاء لكسر الحصار عن غزة، في المياه الدولية على بعد 72 ميلًا بحريًا من الساحل. فقتلت تسعة ركاب: ثمانية مواطنين أتراك، والشاب فرقان دوغان، 19 عامًا، وهو مواطن أمريكي أُطلقت عليه خمس رصاصات من مسافة قريبة، وتوفي عاشر عام 2014 بعد أربع سنوات في غيبوبة. ووجدت بعثة مجلس حقوق الإنسان أن اعتراض الأسطول غير قانوني وأن إغلاق غزة عقاب جماعي، وحتى لجنة الأمين العام (تقرير بالمر)، التي رأت الحصار البحري مشروعًا، وصفت الاقتحام بأنه «مفرط وغير معقول»."
