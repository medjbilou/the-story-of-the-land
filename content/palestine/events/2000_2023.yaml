  - id: e2002_04_jenin
    title: "The battle of Jenin camp"
    title_ar: "معركة مخيم جنين"
    text: "From 3 to 11 April 2002 the Israeli occupation army besieged and stormed Jenin refugee camp, where Palestinian fighters held out for days. On 9 and 10 April its armoured bulldozers levelled the Hawashin quarter, and as the fighting died down it kept ambulances and UN convoys from reaching the wounded for days, according to the UN Secretary-General's report. Counts of the Palestinian dead run from 52 to 54: that report gave at least 52, and Amnesty International counted 54 in the camp and the city from hospital lists. Human Rights Watch documented at least 52 Palestinians killed, 22 of them civilians, while the army claimed only 14 civilians were among them; the dead included Kamal Zghair, 57, shot in his wheelchair and then run over by tanks, and Jamal Fayid, 37, paralysed, who died under the rubble of his home. HRW found that soldiers used civilians as human shields, that at least 140 buildings were levelled and that about 4,000 people were left homeless; 23 Israeli soldiers were killed. Israel refused to cooperate with the fact-finding team set up under Security Council resolution 1405, so the UN wrote its report without visiting Jenin. Early Palestinian figures of hundreds dead were borne out by neither HRW nor the UN."
    text_ar: "من 3 إلى 11 نيسان 2002 حاصر جيش الاحتلال مخيم جنين للاجئين واقتحمه، وقاومه مقاتلون فلسطينيون أيامًا. وفي 9 و10 نيسان سوّت جرافاته المدرّعة حارة الحواشين بالأرض، ومع انحسار القتال منع الجيش سيارات الإسعاف وقوافل الأمم المتحدة من الوصول إلى الجرحى أيامًا، بحسب تقرير الأمين العام للأمم المتحدة. وتتراوح أعداد الشهداء الفلسطينيين بين 52 و54: فقد ذكر التقرير 52 على الأقل، وأحصت منظمة العفو الدولية 54 في المخيم والمدينة استنادًا إلى سجلات المستشفى. ووثّقت هيومن رايتس ووتش 52 شهيدًا فلسطينيًا على الأقل، 22 منهم مدنيون، فيما زعم الجيش أن المدنيين بينهم 14 فقط، وكان بين الشهداء كمال الزغير، 57 عامًا، الذي أُطلقت عليه النار وهو على كرسيه المتحرّك ثم دهسته الدبابات، وجمال فايد، 37 عامًا، المشلول الذي استُشهد تحت أنقاض بيته. ووجدت هيومن رايتس ووتش أن الجنود استخدموا مدنيين دروعًا بشرية، وأن 140 مبنى على الأقل سُوّيت بالأرض وأن نحو 4,000 إنسان صاروا بلا مأوى، وقُتل 23 جنديًا إسرائيليًا. ورفضت إسرائيل التعاون مع فريق تقصّي الحقائق الذي شُكّل بموجب قرار مجلس الأمن 1405، فكتبت الأمم المتحدة تقريرها دون زيارة جنين. أما الأرقام الفلسطينية الأولى عن مئات القتلى فلم تثبتها هيومن رايتس ووتش ولا الأمم المتحدة."
