  - id: gz_2025_09_gaza_city
    title: "The invasion of Ghazza"
    title_ar: "اجتياح مدينة غزة"
    text: "In September 2025 the Israeli occupation army intensified its bombardment of Ghazza (Gaza City), especially of residential tower blocks, and on 16 September it launched a ground invasion of the city. OCHA said more than 250,000 people had been displaced from the city in a month, 60,000 of them in just 72 hours; an Israeli army official put the number at about 350,000 (Israeli military figure). Medical officials told Al Jazeera that at least 106 Palestinians were killed on 16 September alone, 91 of them in Ghazza."
    text_ar: "في أيلول 2025 صعّد الجيش الصهيوني قصفه لمدينة غزة، ولا سيما الأبراج السكنية، ثم بدأ في 16 أيلول اجتياحًا بريًا للمدينة. وقال مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية إن أكثر من 250 ألف شخص نزحوا من المدينة خلال شهر واحد، منهم 60 ألفًا في 72 ساعة فقط، فيما قدّر مسؤول عسكري إسرائيلي العدد بنحو 350 ألفًا (رقم عسكري إسرائيلي). وقال مسؤولون طبيون للجزيرة إن 106 فلسطينيين على الأقل استُشهدوا في 16 أيلول وحده، 91 منهم في مدينة غزة."
    scope: "region:gaza"
    place: gaza
    tags: [sensitive]
    from: 2025-09-01
