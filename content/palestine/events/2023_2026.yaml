  - id: gz_2025_07_israeli_ngos
    title: "Two Israeli groups: \"Our Genocide\""
    title_ar: "منظمتان إسرائيليتان: «إبادتنا الجماعية»"
    text: "On 28 July 2025, two Israeli human rights organisations, B'Tselem and Physicians for Human Rights–Israel, said Israel's conduct in Gaza meets the legal definition of genocide. B'Tselem's report, \"Our Genocide\", focused on attacks on civilians and the dismantling of Palestinian society; PHR-Israel's focused on the deliberate destruction of the health system."
    text_ar: "في 28 تموز 2025 أعلنت منظمتان إسرائيليتان لحقوق الإنسان، «بتسيلم» و«أطباء لحقوق الإنسان – إسرائيل»، أن سلوك إسرائيل في غزة ينطبق عليه التعريف القانوني للإبادة الجماعية. وركّز تقرير بتسيلم، المعنون «إبادتنا الجماعية»، على الهجمات على المدنيين وتفكيك المجتمع الفلسطيني، فيما ركّز تقرير المنظمة الثانية على التدمير المتعمد للمنظومة الصحية."
    scope: "national"
