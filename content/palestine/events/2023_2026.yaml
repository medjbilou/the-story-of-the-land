  - id: gz_2025_08_famine
    title: "Famine confirmed"
    title_ar: "تأكيد المجاعة"
    text: "On 22 August 2025, the Integrated Food Security Phase Classification (IPC) confirmed famine in Gaza Governorate, the first famine ever officially confirmed in the Middle East. More than half a million people were trapped in famine, and more than 640,000 across the Strip were projected to face catastrophic conditions by the end of September, with famine expected to spread to Deir al-Balah and Khan Yunis governorates. In July alone more than 12,000 children were identified as acutely malnourished; the UN Secretary-General called the famine \"a man-made disaster\". UN aid chief Tom Fletcher said food was piling up at the borders \"because of systematic obstruction by Israel\", and UN human rights chief Volker Türk called the famine the \"direct result\" of Israeli government policies."
    text_ar: "في 22 آب 2025 أكّد التصنيف المرحلي المتكامل للأمن الغذائي (IPC) وقوع المجاعة في محافظة غزة، وهي أول مجاعة يُعلَن تأكيدها رسميًا في منطقة الشرق الأوسط. كان أكثر من نصف مليون إنسان عالقين في المجاعة، وتوقّع التصنيف أن يواجه أكثر من 640 ألفًا في أنحاء القطاع ظروفًا كارثية بحلول نهاية أيلول، وأن تمتد المجاعة إلى محافظتَي دير البلح وخان يونس. وفي تموز وحده شُخّص أكثر من 12 ألف طفل بسوء تغذية حاد، ووصف الأمين العام للأمم المتحدة المجاعة بأنها «كارثة من صنع الإنسان»، وقال منسق الإغاثة توم فليتشر إن الغذاء يتكدّس على الحدود بسبب العرقلة المنهجية من جانب إسرائيل، فيما عدّها المفوض السامي لحقوق الإنسان فولكر تورك نتيجةً مباشرة لسياسات الحكومة الإسرائيلية."
    scope: "national"
    place: gaza
    tags: [sensitive]
