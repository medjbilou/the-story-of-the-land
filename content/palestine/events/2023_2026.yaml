  - id: gz_2026_09_journalists
    title: "The journalists who were killed"
    title_ar: "الصحفيون الشهداء"
    text: "By 24 September 2026 the Committee to Protect Journalists had documented 189 Palestinian journalists and media workers killed in Gaza and two more in Israeli detention centres, among 241 killed by Israel across the region's wars. CPJ says Israel has killed more journalists than any other government since it began collecting data in 1992. Gaza's authorities count more: 262 (Tech For Palestine summary, 19 October 2026)."
    text_ar: "حتى 24 أيلول 2026 وثّقت لجنة حماية الصحفيين استشهاد 189 صحفيًا وعاملًا في الإعلام من الفلسطينيين في غزة، واثنين آخرين في مراكز الاحتجاز الإسرائيلية، ضمن 241 قتلتهم إسرائيل في حروب المنطقة. وتقول اللجنة إن إسرائيل قتلت من الصحفيين أكثر مما قتلته أي حكومة أخرى منذ بدأت تسجيل البيانات عام 1992. أما السلطات في غزة فتُحصي عددًا أكبر يبلغ 262 (بحسب ملخص Tech For Palestine في 19 تشرين الأول 2026)."
    scope: "national"
    tags: [sensitive]
    from: 2026-09-01
    to: 2026-10-01
