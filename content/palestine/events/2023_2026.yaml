  - id: gz_2026_10_yellow_line
    title: "The yellow line creeps forward"
    title_ar: "الخط الأصفر يزحف"
    text: "The yellow line kept moving. On 11 October 2026 Israeli occupation forces shifted its yellow concrete blocks several metres west in Shuja'iyya, eastern Ghazza (Gaza City); the UN says, as reported by Al Jazeera, that about 65% of the Strip is now under Israeli control, up from about 53% when the ceasefire was announced. The UN human rights office found no single identifiable line, only shifting lines unknown to Palestinians, and verified 331 people killed near it by the end of July 2026. Displaced families who had pitched tents near the blocks had to move again."
    text_ar: "ظل «الخط الأصفر» يتحرك. ففي 11 تشرين الأول 2026 نقلت قوات الاحتلال كتله الإسمنتية الصفراء عدة أمتار غربًا في حي الشجاعية شرقيّ مدينة غزة، وتقول الأمم المتحدة، بحسب قناة الجزيرة، إن نحو 65% من القطاع بات تحت السيطرة الإسرائيلية، بعد أن كانت النسبة نحو 53% عند إعلان وقف إطلاق النار. ولم يجد مكتب الأمم المتحدة لحقوق الإنسان خطًا واحدًا يمكن تحديده، بل خطوطًا متحركة يجهلها الفلسطينيون، ووثّق مقتل 331 شخصًا قرب الخط حتى نهاية تموز 2026. أما العائلات النازحة التي نصبت خيامها قرب الكتل فاضطرت إلى الرحيل من جديد."
    scope: "national"
    place: gaza
    from: 2026-10-01
    to: 2026-11-01
    day: 11
    effects:
      - { target: land, delta: -0.1 }
      - { target: home, delta: -0.05 }
      - { target: safety, delta: -0.05 }
    options:
      - id: move_tent
        text: "Move the tent west"
        text_ar: "ننقل الخيمة غربًا"
        outcome: "The family takes down its tent for the seventh time and pitches it further from the yellow blocks."
        outcome_ar: "تفكك العائلة خيمتها للمرة السابعة وتنصبها أبعد عن الكتل الصفراء."
        effects:
          - { target: safety, delta: 0.03 }
          - { target: land, delta: -0.05 }
          - { target: home, delta: -0.03 }
