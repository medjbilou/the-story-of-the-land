  - id: gz_2024_12_kamal_adwan
    title: "Kamal Adwan Hospital and Dr Hussam Abu Safiya"
    title_ar: "مستشفى كمال عدوان والدكتور حسام أبو صفية"
    text: "On 27 December 2024, after weeks of bombardment around it, Israeli occupation forces stormed Kamal Adwan Hospital, the last major functioning health facility in northern Gaza. Its director, Dr Hussam Abu Safiya, quoted by Gaza's Ministry of Health, said the soldiers set fire to all its surgical departments; WHO said key departments were burnt and destroyed in the raid, and that the hospital was now empty after critical patients were forced to move to the Indonesian Hospital. Abu Safiya was detained with dozens of staff; the Israeli army claimed, without evidence, that the hospital was a Hamas stronghold, and said he was held for questioning."
    text_ar: "في 27 كانون الأول 2024، بعد أسابيع من القصف في محيطه، اقتحمت قوات الاحتلال مستشفى كمال عدوان، آخر منشأة صحية كبرى عاملة في شمال غزة. وقال مديره الدكتور حسام أبو صفية، بحسب وزارة الصحة في غزة، إن الجنود أضرموا النار في أقسام الجراحة كلها، فيما قالت منظمة الصحة العالمية إن أقسامًا رئيسية احترقت ودُمّرت خلال الاقتحام، وإن المستشفى بات خاليًا بعد نقل المرضى ذوي الحالات الحرجة قسرًا إلى المستشفى الإندونيسي. واعتُقل أبو صفية مع عشرات من العاملين، وزعم جيش الاحتلال، دون أن يقدّم دليلًا، أن المستشفى معقل لحماس، وقال إن مديره محتجز للتحقيق."
