  - id: gz_2024_06_nuseirat
    title: "Nuseirat: four captives and 274 dead"
    title_ar: "النصيرات: أربعة أسرى و274 شهيدًا"
    text: "On 8 June 2024, Israeli occupation forces, some of them disguised as Palestinians, raided Nuseirat refugee camp under heavy air strikes and freed four Israeli captives taken on 7 October. 274 Palestinians were killed that day and 698 wounded, according to Gaza's Ministry of Health; an Israeli police commander was also killed in the operation."
    text_ar: "في 8 حزيران 2024 اقتحمت قوات الاحتلال، وقد تنكّر بعض أفرادها في هيئة فلسطينيين، مخيمَ النصيرات للاجئين تحت غطاء غارات جوية كثيفة، وحرّرت أربعة أسرى إسرائيليين اقتيدوا في 7 تشرين الأول. واستُشهد في ذلك اليوم 274 فلسطينيًا وأصيب 698، بحسب وزارة الصحة في غزة، كما قُتل قائدٌ في الشرطة الإسرائيلية خلال العملية."
