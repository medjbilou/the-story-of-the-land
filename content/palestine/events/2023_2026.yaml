  - id: gz_2024_07_icj_opinion
    title: "The advisory opinion: the occupation is unlawful"
    title_ar: "الرأي الاستشاري: الاحتلال غير قانوني"
    text: "On 19 July 2024, at the request of the UN General Assembly, the ICJ gave an advisory opinion finding, by 11 votes to 4, that Israel's continued presence in the Occupied Palestinian Territory is unlawful and must end as rapidly as possible. It said Israel must immediately cease all new settlement activity, evacuate all settlers and make full reparation, and that its laws and measures breach Article 3 of the Convention on the Elimination of Racial Discrimination, which prohibits racial segregation and apartheid, without saying which of the two. All states were told not to recognise the unlawful situation or help maintain it."
    text_ar: "في 19 تموز 2024 أصدرت محكمة العدل الدولية، بطلبٍ من الجمعية العامة للأمم المتحدة، رأيًا استشاريًا خلصت فيه بأغلبية 11 صوتًا مقابل 4 إلى أن استمرار وجود إسرائيل في الأرض الفلسطينية المحتلة غير قانوني، وأن عليها إنهاءه بأسرع ما يمكن. وقالت إن على إسرائيل أن توقف فورًا كل نشاط استيطاني جديد، وأن تُجلي جميع المستوطنين، وأن تقدّم جبرًا كاملًا للضرر، وإن تشريعاتها وتدابيرها تخرق المادة الثالثة من الاتفاقية الدولية للقضاء على جميع أشكال التمييز العنصري، التي تحظر العزل العنصري والفصل العنصري (الأبارتهايد)، دون أن تحدّد أيهما. ودعت الدول كافة إلى عدم الاعتراف بهذا الوضع غير القانوني وعدم المساعدة على إدامته."
