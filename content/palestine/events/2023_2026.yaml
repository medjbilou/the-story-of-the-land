        text: "Enrol the children"
        text_ar: "نسجّل الأطفال في المدرسة"
        outcome: "The children set off in the morning with patched bags and come home with the names of new friends."
        outcome_ar: "يخرج الأطفال صباحًا بحقائب مرقّعة، ويعودون بأسماء أصدقاء جدد."
        effects:
