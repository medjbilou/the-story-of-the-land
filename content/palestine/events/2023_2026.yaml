  - id: gz_2026_10_wfp_cut
    title: "Food aid cut as winter approaches"
    title_ar: "تقليص المساعدات الغذائية مع اقتراب الشتاء"
    text: "On 19 October 2026 the World Food Programme said funding shortfalls had forced it to cut food assistance in Gaza by about a third: this month it supports 1.1 million people instead of 1.6 million, families receive one food parcel instead of two and a smaller bag of flour, and daily hot meals fall from 250,000 to 150,000. WFP said about 1.4 million people (67% of the population) still face crisis-level food insecurity or worse, around 200,000 of them in emergency conditions, as winter approaches."
    text_ar: "في 19 تشرين الأول 2026 أعلن برنامج الأغذية العالمي أن نقص التمويل اضطره إلى تقليص مساعداته الغذائية في غزة بنحو الثلث: فهو يدعم هذا الشهر 1.1 مليون شخص بدلًا من 1.6 مليون، وتتسلم الأسرة طردًا غذائيًا واحدًا بدلًا من اثنين مع كيس طحين أصغر، وتنخفض الوجبات الساخنة اليومية من 250 ألفًا إلى 150 ألفًا. وقال البرنامج إن نحو 1.4 مليون إنسان (67% من السكان) ما زالوا يعانون انعدام الأمن الغذائي بمستوى الأزمة أو أسوأ، منهم نحو 200 ألف في حالة طوارئ، مع اقتراب الشتاء."
    scope: "national"
    from: 2026-10-01
    to: 2026-11-01
    day: 19
    effects:
      - { target: livelihood, delta: -0.08 }
      - { target: family, delta: -0.03 }
    options:
      - id: share_parcel
        text: "Share the parcel with those who got nothing"
        text_ar: "نتقاسم الطرد مع من لم يصله شيء"
        outcome: "One parcel feeds two families, and there is less bread in both tents."
        outcome_ar: "يصير الطرد الواحد طعامًا لعائلتين، ويقلّ الخبز في الخيمتين معًا."
        effects:
          - { target: community, delta: 0.05 }
          - { target: livelihood, delta: -0.03 }
      - id: grow_vegetables
        text: "Grow vegetables by the tent"
        text_ar: "نزرع خضارًا قرب الخيمة"
        outcome: "The grandfather plants mulukhiyah seeds in old tins and waters them with the washing water."
        outcome_ar: "يزرع الجد بذور الملوخية في علب قديمة، ويسقيها من ماء الغسيل."
        effects:
          - { target: livelihood, delta: 0.03 }
          - { target: land, delta: 0.03 }
          - { target: sumud, delta: 0.03 }
    sources:
      - { url: "https://www.wfp.org/news/funding-cuts-force-wfp-drastically-reduce-lifesaving-assistance-gaza", checked: 2026-10-19 }
      - { url: "https://news.un.org/en/story/2026/10/1168622", checked: 2026-10-19 }
  - id: gz_2026_10_still_on_the_land
    title: "Still on the land"
    title_ar: "ما زالوا على الأرض"
    text: "By 19 October 2026 Gaza's Ministry of Health had recorded 74,480 Palestinians killed and 175,539 injured since October 2023. Separately, the ministry's list of the dead identified by name holds 72,835 people identified up to 7 May 2026: a different count, never added to the first or confused with it. In the West Bank, the UN human rights office counted 1,001 Palestinians killed between 7 October 2023 and 17 October 2025, one in five of them a child. The UN Commission of Inquiry, Amnesty International, B'Tselem and the International Association of Genocide Scholars have concluded that Israel has committed genocide in Gaza. No court has yet ruled on the merits: the ICJ has scheduled written pleadings in South Africa's case to run until May 2029. Here the chapter ends: with no verdict, and the people still on their land."
    text_ar: "حتى 19 تشرين الأول 2026 سجّلت وزارة الصحة في غزة استشهاد 74,480 فلسطينيًا وإصابة 175,539 منذ تشرين الأول 2023. وبمعزل عن ذلك، تضم قائمة الوزارة للشهداء المعروفين بالاسم 72,835 شخصًا جرى التعرف عليهم حتى 7 أيار 2026؛ وهو عدٌّ مختلف لا يُجمع إلى الأول ولا يُخلط به. وفي الضفة الغربية أحصى مكتب الأمم المتحدة لحقوق الإنسان مقتل 1,001 فلسطيني بين 7 تشرين الأول 2023 و17 تشرين الأول 2025، خُمسهم من الأطفال. وقد خلصت لجنة التحقيق الأممية ومنظمة العفو الدولية ومنظمة بتسيلم والرابطة الدولية لعلماء الإبادة الجماعية إلى أن إسرائيل ارتكبت إبادة جماعية في غزة. أما المحاكم فلم تفصل في موضوع الإبادة الجماعية بعد، إذ حددت محكمة العدل الدولية مواعيد المرافعات المكتوبة في دعوى جنوب أفريقيا حتى أيار 2029. وهنا ينتهي الفصل: بلا حكم نهائي، والناس ما زالوا على أرضهم."
    scope: "national"
    tags: [sensitive]
    from: 2026-10-01
    to: 2026-11-01
    day: 19
    effects:
      - { target: memory, delta: 0.05 }
      - { target: sumud, delta: 0.05 }
    options:
      - id: rebuild_room
        text: "Build one room from the rubble"
        text_ar: "نبني غرفة واحدة من الركام"
        outcome: "The father stacks the stones of the old house, and the family has a room with a cloth roof."
        outcome_ar: "يرصّ الأب حجارة البيت القديم بعضها فوق بعض، فتصير للعائلة غرفة بسقفٍ من القماش."
        effects:
          - { target: home, delta: 0.05 }
          - { target: land, delta: 0.03 }
          - { target: sumud, delta: 0.03 }
      - id: tell_story
        text: "Tell the story from the beginning"
        text_ar: "نحكي الحكاية من أولها"
        outcome: "The grandmother sits among her grandchildren and begins with the first house and the first land, and does not end the story."
        outcome_ar: "تجلس الجدة بين الأحفاد وتبدأ من البيت الأول والأرض الأولى، ولا تنهي الحكاية."
        effects:
          - { target: memory, delta: 0.08 }
          - { target: sumud, delta: 0.03 }
    sources:
      - { url: "https://data.techforpalestine.org/api/v3/summary.json", checked: 2026-10-19 }
      - { url: "https://thepresidency.gov.za/presidency-notes-icj-order-21-may-2026-matter-between-government-republic-south-africa-and-state", checked: 2026-10-19 }
      - { url: "https://www.un.org/unispal/document/ohchr-press-release-17oct25/", checked: 2026-10-19 }
      - { url: "https://www.pbs.org/newshour/amp/world/leading-genocide-scholars-organization-says-israel-is-committing-genocide-in-gaza", checked: 2026-10-19 }
      - { url: "https://www.amnesty.org/en/latest/news/2024/12/amnesty-international-concludes-israel-is-committing-genocide-against-palestinians-in-gaza/", checked: 2026-10-19 }
      - { url: "https://www.fidh.org/en/region/north-africa-middle-east/israel-palestine/b-tselem-and-physicians-for-human-rights-israel-israel-is-committing", checked: 2026-10-19 }
