  - id: gz_2023_10_attack
    title: "7 October 2023: after sixteen years of siege"
    title_ar: "السابع من تشرين الأول 2023: بعد ستة عشر عامًا من الحصار"
    text: "On 7 October 2023 fighters led by the Qassam Brigades, Hamas's armed wing, broke through the fence around Gaza and attacked the Israeli towns and army posts around the Strip. AFP's tally of Israeli social-security data counts 1,139 killed: 695 Israeli civilians, 36 of them children, 373 members of the security forces and 71 foreigners; 251 people were taken captive into Gaza. In June 2024 the UN Commission of Inquiry found that at least 14 Israeli civilians were likely killed by Israeli forces' own fire that day. Two days after the attack, Israeli defence minister Yoav Gallant announced a \"complete siege\" of Gaza: no electricity, no food, no water, no fuel. What followed was the destruction of Gaza by the Israeli occupation army, with US weapons and support: in the first year alone US military aid to Israel reached at least $17.9 billion, 2,000-pound bombs among it, according to Brown University's Costs of War project, and by 11 October 2025 the UN satellite centre UNOSAT found about 81% of all structures in the Strip damaged."
    text_ar: "في السابع من تشرين الأول 2023 اخترق مقاتلون تقودهم كتائب القسام، الجناح العسكري لحركة حماس، السياجَ المحيط بغزة، وهاجموا البلدات والمواقع العسكرية الإسرائيلية المحيطة بالقطاع. وتُحصي وكالة الصحافة الفرنسية، استنادًا إلى بيانات الضمان الاجتماعي الإسرائيلي، 1,139 قتيلًا: 695 مدنيًا إسرائيليًا بينهم 36 طفلًا، و373 من أفراد قوات الأمن، و71 أجنبيًا، فيما أُسر 251 شخصًا واقتيدوا إلى غزة. وفي حزيران 2024 خلصت لجنة التحقيق الدولية التابعة للأمم المتحدة إلى أن 14 مدنيًا إسرائيليًا على الأقل قُتلوا على الأرجح بنيران القوات الإسرائيلية نفسها في ذلك اليوم. وبعد يومين من الهجوم أعلن وزير جيش الاحتلال يوآف غالانت فرض حصار كامل على غزة: لا كهرباء ولا طعام ولا ماء ولا وقود. وما تلا ذلك كان تدميرَ غزة على يد جيش الاحتلال بسلاحٍ أمريكي ودعمٍ أمريكي: ففي العام الأول وحده بلغت المساعدات العسكرية الأمريكية لإسرائيل 17.9 مليار دولار على الأقل، منها قنابل زنة ألفَي رطل، بحسب مشروع «تكاليف الحرب» في جامعة براون، ووجد مركز الأمم المتحدة للأقمار الصناعية (يونوسات) في 11 تشرين الأول 2025 أن نحو 81% من مباني القطاع قد تضرّرت."
