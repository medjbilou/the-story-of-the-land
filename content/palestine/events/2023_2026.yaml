  - id: gz_2025_03_resumption
    title: "A total closure, then the war resumes"
    title_ar: "إغلاقٌ تام ثم استئناف الحرب"
    text: "On 2 March 2025, the day after the truce's first phase ended, the Israeli government halted the entry of all goods and supplies into Gaza, humanitarian aid included, to press Hamas to accept a new negotiating framework. On 18 March it broke the truce with a wave of strikes; Gaza's Ministry of Health counted at least 404 killed and 562 wounded that day. The total closure lasted nearly three months: the first trucks, just five, entered only on 19 May."
    text_ar: "في 2 آذار 2025، غداة انتهاء المرحلة الأولى من الهدنة، أوقفت حكومة الاحتلال دخول جميع البضائع والإمدادات إلى غزة، بما فيها المساعدات الإنسانية، للضغط على حماس كي تقبل إطار تفاوضٍ جديدًا. وفي 18 آذار نقضت الهدنة بموجة غارات واسعة، وأحصت وزارة الصحة في غزة في ذلك اليوم 404 شهداء على الأقل و562 جريحًا. ودام الإغلاق التام قرابة ثلاثة أشهر، ولم تدخل أولى الشاحنات، وهي خمس فقط، إلا في 19 أيار."
