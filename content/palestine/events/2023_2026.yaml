  - id: gz_2025_01_truce_return
    title: "The January truce and the return north"
    title_ar: "هدنة كانون الثاني والعودة إلى الشمال"
    text: "A ceasefire took effect on Sunday 19 January 2025; on its first day three Israeli captives were freed and, according to the UN, more than 630 aid trucks entered Gaza. From 27 January, when the Salah al-Din and al-Rashid roads opened, displaced people walked back north; UN humanitarians counted more than 462,000 crossings within days. Many found their homes gone and pitched tents on the ruins, and there were reports of people killed by unexploded ordnance on the way."
    text_ar: "دخل وقفٌ لإطلاق النار حيّز التنفيذ يوم الأحد 19 كانون الثاني 2025، فأُفرج في يومه الأول عن ثلاثة من الأسرى الإسرائيليين، ودخلت أكثر من 630 شاحنة مساعدات بحسب الأمم المتحدة. ومنذ 27 كانون الثاني، حين فُتح طريقا صلاح الدين والرشيد، عاد النازحون سيرًا إلى الشمال، وأحصت الأمم المتحدة أكثر من 462 ألف عملية عبور خلال أيام. ووجد كثيرون منهم بيوتهم وقد زالت، فنصبوا الخيام فوق أنقاضها، ووردت أنباء عن استشهاد بعضهم بذخائر غير منفجرة في الطريق."
    scope: "national"
