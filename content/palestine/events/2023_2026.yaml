  - id: gz_2025_09_coi
    title: "The UN Commission of Inquiry: genocide"
    title_ar: "لجنة التحقيق الأممية: إبادة جماعية"
    text: "On 16 September 2025, the UN Independent International Commission of Inquiry concluded that Israel has committed genocide in Gaza. It found four of the five acts defined in the 1948 Convention: killing, causing serious bodily or mental harm, deliberately inflicting conditions of life calculated to physically destroy Palestinians, and imposing measures intended to prevent births, and said genocidal intent was the only reasonable inference. It held the state responsible and found that President Isaac Herzog, Prime Minister Benjamin Netanyahu and former defence minister Yoav Gallant had incited genocide; Israel rejected the report as \"fake\". Two days later, on 18 September, the United States vetoed a Security Council demand for a ceasefire in Gaza for the sixth time, against the votes of the other 14 members."
    text_ar: "في 16 أيلول 2025 خلصت لجنة التحقيق الدولية المستقلة التابعة للأمم المتحدة إلى أن إسرائيل ارتكبت إبادة جماعية في غزة. ووجدت أربعة من الأفعال الخمسة المحددة في اتفاقية عام 1948: القتل، وإلحاق أذى جسدي أو نفسي جسيم، وفرض ظروف معيشية عمدًا يُقصد بها التدمير المادي للفلسطينيين، وفرض تدابير تستهدف منع الإنجاب، ورأت أن نية الإبادة هي الاستنتاج المعقول الوحيد. وحمّلت الدولة المسؤولية، وعدّت تصريحات الرئيس إسحاق هرتسوغ ورئيس الوزراء بنيامين نتنياهو ووزير الدفاع السابق يوآف غالانت تحريضًا على الإبادة، فيما رفضت إسرائيل التقرير ووصفته بأنه «زائف». وبعد يومين، في 18 أيلول، استخدمت الولايات المتحدة الفيتو للمرة السادسة ضد مطالبة مجلس الأمن بوقف إطلاق النار في غزة، رغم تأييد الأعضاء الأربعة عشر الآخرين."
