  - id: gz_2025_01_iron_wall
    title: "The camps emptied: \"Iron Wall\""
    title_ar: "تهجير المخيمات: «السور الحديدي»"
    text: "Two days after the Gaza ceasefire took effect, on 21 January 2025, the Israeli occupation army launched what Israel called \"Iron Wall\" on Jenin camp, then on the camps of Tulkarm and Nur Shams, with helicopter fire, air strikes and, for the first time since the early 2000s, tanks. By 10 February UNRWA estimated more than 40,000 refugees displaced, several thousand of them earlier, during a Palestinian Authority security operation around Jenin. OCHA called it the longest and largest displacement in the West Bank since 1967, and counted 74 Palestinians killed by Israeli forces in the Jenin, Tubas and Tulkarm governorates by 30 June. On 23 February the Israeli defence minister ordered the army to prepare for a \"long stay\" in the emptied camps over the coming year and said their people would not be allowed to return. In September 2026 the UN human rights office found that the three camps' entire populations had been forcibly displaced, that 33,362 people were still kept out in July by UNRWA's count, and that by October 2025 52% of the buildings in Jenin camp, 48% in Nur Shams and 36% in Tulkarm camp were damaged or destroyed; it said this raised serious concerns of the crime against humanity of forcible transfer, and of ethnic cleansing."
    text_ar: "بعد يومين من سريان وقف إطلاق النار في غزة، في 21 كانون الثاني 2025، شنّ جيش الاحتلال على مخيم جنين ما سمّته إسرائيل عملية «السور الحديدي»، ثم امتدت إلى مخيمَي طولكرم ونور شمس، بنيران المروحيات والغارات الجوية، وبالدبابات لأول مرة منذ مطلع الألفية. وبحلول 10 شباط قدّرت الأونروا عدد اللاجئين المهجّرين بأكثر من 40 ألفًا، بينهم بضعة آلاف كانوا قد نزحوا من قبلُ خلال عملية لأجهزة أمن السلطة الفلسطينية في جنين ومحيطها. ووصف مكتب أوتشا ما جرى بأنه أطول موجة تهجير في الضفة الغربية وأوسعها منذ عام 1967، وأحصى استشهاد 74 فلسطينيًا بنيران قوات الاحتلال في محافظات جنين وطوباس وطولكرم حتى 30 حزيران. وفي 23 شباط أمر وزير جيش الاحتلال قواته بالاستعداد للبقاء طويلًا، طوال العام التالي، في المخيمات التي أُفرغت، وقال إن أهلها لن يُسمح لهم بالعودة. وفي أيلول 2026 خلص مكتب الأمم المتحدة لحقوق الإنسان إلى أن سكان المخيمات الثلاثة هُجّروا قسرًا عن آخرهم، وأن 33,362 منهم ما زالوا ممنوعين من العودة في تموز بحسب الأونروا، وأن 52% من مباني مخيم جنين و48% من مباني نور شمس و36% من مباني مخيم طولكرم قد دُمّرت أو تضرّرت بحلول تشرين الأول 2025، ورأى أن ذلك يثير مخاوف جدية من النقل القسري، وهو جريمة ضد الإنسانية، ومن التطهير العرقي."
