  - id: gz_2025_03_paramedics
    title: "The fifteen rescuers of Rafah"
    title_ar: "مسعفو رفح الخمسة عشر"
    text: "On 23 March 2025, near Tal al-Sultan in Rafah, Israeli occupation forces opened fire on a clearly marked rescue convoy and killed 15 of its crew: eight Palestine Red Crescent paramedics, six Civil Defence members and one UNRWA staff member. The UN was granted access to the site only about five days later, and the bodies were recovered from a mass grave in the sand by 30 March. Video from paramedic Rifat Radwan's phone contradicted the Israeli army's first account, which later spoke of a \"professional error\"; a Forensic Architecture and Earshot study counted at least 910 shots, some fired from 1 to 4 metres."
    text_ar: "في 23 آذار 2025، قرب تل السلطان في رفح، أطلقت قوات الاحتلال النار على قافلة إنقاذ تحمل شاراتٍ واضحة، فاستُشهد 15 من أفراد طواقمها: ثمانية من الهلال الأحمر الفلسطيني، وستة من الدفاع المدني، وموظفًا في الأونروا. ولم يُسمح للأمم المتحدة بالوصول إلى المكان إلا بعد نحو خمسة أيام، واكتمل انتشال الجثامين من مقبرة جماعية في الرمال في 30 آذار. وناقض مقطعٌ صوّره المسعف رفعت رضوان بهاتفه الروايةَ الأولى لجيش الاحتلال، الذي عاد فتحدث عن «خطأ مهني»، فيما أحصت دراسةٌ لمجموعتَي «العمارة الجنائية» و«إيرشوت» 910 طلقات على الأقل، أُطلق بعضها من مسافة متر إلى أربعة أمتار."
