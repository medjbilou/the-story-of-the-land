  - id: gz_2024_04_wck
    title: "The World Central Kitchen convoy"
    title_ar: "قافلة المطبخ المركزي العالمي"
    text: "On 1 April 2024, Israeli strikes hit a World Central Kitchen convoy leaving its warehouse in Deir al-Balah, killing seven aid workers from Palestine, Australia, Poland and the United Kingdom and a US-Canadian dual citizen. WCK said the team had coordinated its movements with the Israeli army and travelled in cars bearing its logo, having just unloaded more than 100 tonnes of food that arrived by sea; it paused its operations. The Israeli military called it a \"tragic\" incident and promised a review."
    text_ar: "في 1 نيسان 2024 أصابت غاراتٌ إسرائيلية قافلةً لمنظمة «المطبخ المركزي العالمي» أثناء مغادرتها مستودعها في دير البلح، فقتلت سبعة من عمال الإغاثة، هم مواطنون من فلسطين وأستراليا وبولندا والمملكة المتحدة وحاملٌ للجنسيتين الأمريكية والكندية. وقالت المنظمة إن الفريق نسّق تحركاته مع جيش الاحتلال وكان يستقل سيارات تحمل شعارها، بعدما أفرغ أكثر من 100 طن من الغذاء وصلت بحرًا، ثم علّقت عملياتها. ووصف الجيش الصهيوني ما جرى بأنه «حادث مأساوي» ووعد بمراجعته."
