  - id: gz_2025_12_aid_bans
    title: "Aid groups banned, UNRWA restricted further"
    title_ar: "حظر منظمات الإغاثة وتشديد القيود على الأونروا"
    text: "On 29 December 2025 the Knesset adopted amendments to its law ending UNRWA's operations, and the UN Secretary-General said the law and its amendments must be immediately repealed. On the first day of 2026 an Israeli government ban on 37 international aid organisations came into effect, among them Doctors Without Borders (MSF) and the Norwegian Refugee Council, saying they had not met new rules requiring details on staff, funding and operations, and accusing some of links to Hamas and Palestinian Islamic Jihad without providing evidence. UN human rights chief Volker Türk called the ban the latest in a pattern of unlawful restrictions on humanitarian access."
    text_ar: "في 29 كانون الأول 2025 أقرّ الكنيست تعديلات على قانون وقف عمليات الأونروا، وقال الأمين العام للأمم المتحدة إن القانون وتعديلاته يجب إلغاؤها فورًا. وفي اليوم الأول من عام 2026 دخل حيّز التنفيذ حظرٌ فرضته حكومة الاحتلال على 37 منظمة إغاثة دولية، منها أطباء بلا حدود والمجلس النرويجي للاجئين، بحجة عدم التزامها بقواعد جديدة تفرض تقديم بيانات مفصلة عن موظفيها وتمويلها وعملياتها، واتهمت بعضها بصلات بحركتَي حماس والجهاد الإسلامي دون أن تقدّم دليلًا. ووصف المفوض السامي لحقوق الإنسان فولكر تورك الحظر بأنه أحدث حلقة في نمط من القيود غير القانونية على وصول المساعدات."
    scope: "national"
    from: 2025-12-01
