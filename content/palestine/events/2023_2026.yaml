  - id: gz_2023_10_ahli
    title: "The al-Ahli Arab (Baptist) Hospital explosion: contested accounts"
    title_ar: "انفجار المستشفى الأهلي العربي (المعمداني): روايات متنازع عليها"
    text: "On 17 October 2023, an explosion hit the grounds of al-Ahli Arab (Baptist) Hospital in Ghazza (Gaza City). Gaza's Ministry of Health reported 471 killed and 342 injured; Human Rights Watch said it could not corroborate that count and that it was significantly higher than other estimates. The ministry blamed Israel and the Israeli army claimed a misfired Islamic Jihad rocket was to blame; HRW's remote investigation found that the blast resulted from an apparent rocket-propelled munition, such as those commonly used by Palestinian armed groups, and said further investigation was needed to establish who launched it. The cause and the toll remain contested."
    text_ar: "في 17 تشرين الأول 2023 هزّ انفجارٌ ساحةَ المستشفى الأهلي العربي (المعمداني) في مدينة غزة. وأعلنت وزارة الصحة في غزة سقوط 471 قتيلًا و342 جريحًا، فيما قالت منظمة هيومن رايتس ووتش إنها لم تتمكن من التحقق من هذا العدد، وإنه أعلى بكثير من تقديرات أخرى. حمّلت الوزارةُ إسرائيلَ المسؤولية، وزعم جيش الاحتلال أن الانفجار نجم عن صاروخ لحركة الجهاد الإسلامي انحرف عن مساره؛ أما تحقيق المنظمة، الذي أُجري عن بُعد، فخلص إلى أن الانفجار نجم على ما يبدو عن ذخيرة صاروخية من النوع الشائع لدى الفصائل الفلسطينية، مع تأكيده الحاجة إلى مزيد من التحقيق لتحديد من أطلقها. ولا يزال سبب الانفجار وحصيلته موضع خلاف."
