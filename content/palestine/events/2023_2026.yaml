  - id: gz_2026_10_one_year
    title: "One year of \"ceasefire\""
    title_ar: "عامٌ على «وقف إطلاق النار»"
    text: "One year after the ceasefire announcement, the UN human rights office said on 12 October 2026 that it had verified 1,076 Palestinians killed between 10 October 2025 and the end of July 2026: 268 children, 126 women and 682 men. Gaza's Ministry of Health counts more, reporting 1,431 killed and 5,026 injured since the ceasefire by 2 October, according to OCHA. OHCHR said attacks that killed only children, or only women and children, raised concern that civilians were being targeted, which is a war crime."
    text_ar: "بعد عام على إعلان وقف إطلاق النار، قال مكتب الأمم المتحدة لحقوق الإنسان في 12 تشرين الأول 2026 إنه تحقق من مقتل 1,076 فلسطينيًا بين 10 تشرين الأول 2025 ونهاية تموز 2026: 268 طفلًا و126 امرأة و682 رجلًا. أما وزارة الصحة في غزة فتُحصي عددًا أكبر، إذ أبلغت عن 1,431 شهيدًا و5,026 جريحًا منذ وقف إطلاق النار حتى 2 تشرين الأول، بحسب مكتب تنسيق الشؤون الإنسانية. ورأى مكتب الأمم المتحدة لحقوق الإنسان أن هجماتٍ لم تقتل إلا أطفالًا، أو لم تقتل إلا نساءً وأطفالًا، تثير القلق من استهداف المدنيين، وهو جريمة حرب."
    scope: "national"
    tags: [sensitive]
    from: 2026-10-01
    to: 2026-11-01
    day: 12
    effects:
      - { target: safety, delta: -0.05 }
      - { target: family, delta: -0.03 }
    options:
      - id: continue
        text: "Continue"
        text_ar: "متابعة"
    sources:
