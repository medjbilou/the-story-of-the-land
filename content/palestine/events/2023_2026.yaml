        text_ar: "نكتب أسماء شهدائنا ونسلّمها"
        outcome: "The daughter writes down the names of the relatives who were killed, with their dates of birth, and hands in the list."
        outcome_ar: "تكتب الابنة أسماء الأقارب الذين استُشهدوا، مع تواريخ ميلادهم، وتسلّم القائمة."
