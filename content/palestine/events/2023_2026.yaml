  - id: gz_2025_10_exchange
    title: "Exchange day"
    title_ar: "يوم التبادل"
    text: "On 13 October 2025 the 20 Israeli captives still alive were released. Israel freed more than 1,900 Palestinians: about 250 serving life sentences and about 1,700 people seized from Gaza during the war and held without charge; more than 150 of them were sent into exile in Egypt. Hamas said it would hand over the bodies of four of the 28 deceased captives, leaving the return of the rest unresolved."
    text_ar: "في 13 تشرين الأول 2025 أُفرج عن الأسرى الإسرائيليين العشرين الذين بقوا على قيد الحياة. وأفرجت إسرائيل عن أكثر من 1,900 فلسطيني: نحو 250 من المحكومين بالمؤبد، ونحو 1,700 ممن اعتُقلوا من غزة خلال الحرب واحتُجزوا دون تهمة، وأُبعد أكثر من 150 منهم إلى مصر. وقالت حماس إنها ستسلّم جثامين أربعة من الأسرى الثمانية والعشرين المتوفَّين، فيما بقيت إعادة البقية معلّقة."
    scope: "national"
