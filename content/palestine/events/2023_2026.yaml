  - id: gz_2024_02_flour
    title: "The flour massacre"
    title_ar: "مجزرة الطحين"
    text: "Before dawn on 29 February 2024, crowds waiting for flour trucks at the Nabulsi roundabout on al-Rashid Street, south-west of Ghazza (Gaza City), came under Israeli fire: at least 112 Palestinians were killed and more than 750 wounded. The Israeli army first blamed a stampede as the trucks arrived, then claimed its troops opened fire when they felt threatened by the crowd; witnesses said the stampede followed the shooting, not the other way round, and described tanks running over bodies."
    text_ar: "قُبيل فجر 29 شباط 2024 تعرّضت حشودٌ تنتظر شاحنات الطحين عند دوّار النابلسي في شارع الرشيد، جنوب غربيّ مدينة غزة، لإطلاق نار إسرائيلي، فاستُشهد 112 فلسطينيًا على الأقل وأصيب أكثر من 750. زعم جيش الاحتلال أولًا أن الضحايا سقطوا في تدافعٍ عند وصول الشاحنات، ثم قال إن جنوده أطلقوا النار حين شعروا بأن الحشد يهددهم، فيما أكد شهود أن التدافع جاء بعد إطلاق النار لا قبله، ووصفوا دبابات تدهس الجثث."
    scope: "region:gaza"
    place: gaza
    tags: [sensitive]
    from: 2024-02-01
    to: 2024-03-01
    day: 29
