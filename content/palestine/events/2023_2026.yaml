  - id: gz_2024_04_daqqa
    title: "Walid Daqqa and the prisons"
    title_ar: "وليد دقة والسجون"
    text: "On 7 April 2024 Walid Daqqa, a writer from Baqa al-Gharbiyya, died of cancer in Israeli custody at 62, after 38 years in prison. Arrested in 1986, he had been sentenced for belonging to a PFLP cell accused of abducting and killing an Israeli soldier. He was diagnosed in 2015 and refused release on humanitarian grounds; Amnesty International said he died of \"systematic medical neglect, torture and other ill-treatment\". In prison he wrote a novel for young readers, \"The Secret of the Oil\", and in 2020 his daughter Milad was born from smuggled sperm. Two years later his body is still held. Since October 2023 the prisons have filled: about 9,200 Palestinians were held in January 2026. B'Tselem, which found that the prisons had become \"torture camps\", counted at least 84 dead in custody since October 2023, 50 from Gaza and 31 from the West Bank, 80 of their bodies still withheld; Physicians for Human Rights Israel counted at least 94 by November 2025."
    text_ar: "في 7 نيسان 2024 استُشهد الأسير الكاتب وليد دقة، ابن باقة الغربية، بالسرطان في سجون الاحتلال عن 62 عامًا، بعد 38 عامًا من الأسر. كان قد اعتُقل عام 1986، وحُكم عليه بتهمة الانتماء إلى خلية للجبهة الشعبية لتحرير فلسطين اتُّهمت بخطف جندي إسرائيلي وقتله. وشُخّص مرضه عام 2015، فرفضت سلطات الاحتلال الإفراج عنه لأسباب إنسانية، وقالت منظمة العفو الدولية إنه توفي جرّاء إهمال طبي ممنهج وتعذيب وغيره من ضروب سوء المعاملة. كتب في السجن رواية لليافعين هي «حكاية سرّ الزيت»، ووُلدت ابنته ميلاد عام 2020 من نطفة مهرّبة. وبعد عامين ما زال جثمانه محتجزًا. ومنذ تشرين الأول 2023 امتلأت السجون: نحو 9,200 أسير فلسطيني في كانون الثاني 2026. وأحصت منظمة بتسيلم، التي خلصت إلى أن السجون صارت معسكرات تعذيب، 84 أسيرًا على الأقل استُشهدوا في الاحتجاز منذ تشرين الأول 2023، منهم 50 من غزة و31 من الضفة الغربية، وما زال الاحتلال يحتجز جثامين 80 منهم، فيما أحصت منظمة أطباء لحقوق الإنسان في إسرائيل 94 على الأقل حتى تشرين الثاني 2025."
