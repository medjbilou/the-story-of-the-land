  - id: gz_2026_07_ncag
    title: "Hamas steps back from civil administration"
    title_ar: "حماس تتخلى عن الإدارة المدنية"
    text: "On 6 July 2026 Hamas announced the dissolution of the Government Emergency Committee that had run daily affairs in Gaza, and said it was ready to hand governmental responsibilities to the National Committee for the Administration of Gaza, a technocratic body led by Ali Shaath that had been based outside the Strip for months. Hamas thus stepped back from direct civilian rule without giving up its political or military role; the question of its disarmament remained unresolved."
    text_ar: "في 6 تموز 2026 أعلنت حماس حلّ لجنة الطوارئ الحكومية التي كانت تدير الشؤون اليومية في غزة، واستعدادها لتسليم المسؤوليات الحكومية إلى اللجنة الوطنية لإدارة غزة، وهي هيئة من التكنوقراط يرأسها علي شعث، ظلت مقيمة خارج القطاع شهورًا. وبذلك تراجعت الحركة عن الحكم المدني المباشر من دون أن تتخلى عن دورها السياسي والعسكري، فيما بقيت مسألة نزع سلاحها دون حل."
    scope: "national"
    from: 2026-07-01
    to: 2026-08-01
    day: 6
    effects:
