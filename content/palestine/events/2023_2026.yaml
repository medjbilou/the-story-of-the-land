  - id: gz_2024_11_icc
    title: "ICC arrest warrants"
    title_ar: "مذكرات توقيف من المحكمة الجنائية الدولية"
    text: "On 21 November 2024, Pre-Trial Chamber I of the International Criminal Court issued arrest warrants for Israeli Prime Minister Benjamin Netanyahu and former defence minister Yoav Gallant for the war crime of starvation as a method of warfare and the crimes against humanity of murder, persecution and other inhumane acts, from at least 8 October 2023 until at least 20 May 2024. It also issued a warrant for Qassam Brigades commander Mohammed Deif for crimes including murder, extermination, torture, hostage-taking, and rape and other sexual violence, although Israel said it had killed him. The United States then sanctioned the ICC prosecutor and, in June 2025, under an executive order of that February, four of the court's judges."
    text_ar: "في 21 تشرين الثاني 2024 أصدرت الدائرة التمهيدية الأولى في المحكمة الجنائية الدولية مذكرتَي توقيف بحق رئيس الوزراء الإسرائيلي بنيامين نتنياهو ووزير الدفاع السابق يوآف غالانت، بتهمة ارتكاب جريمة الحرب المتمثلة في استخدام التجويع أسلوبًا من أساليب الحرب، وجرائم ضد الإنسانية هي القتل والاضطهاد وأفعال لاإنسانية أخرى، في الفترة الممتدة من 8 تشرين الأول 2023 على الأقل حتى 20 أيار 2024 على الأقل. كما أصدرت مذكرة توقيف بحق قائد كتائب القسام محمد الضيف بتهمٍ منها القتل والإبادة والتعذيب وأخذ الرهائن والاغتصاب وغيره من أشكال العنف الجنسي، رغم إعلان إسرائيل أنها قتلته. ثم فرضت الولايات المتحدة عقوبات على المدعي العام للمحكمة، وفي حزيران 2025، بموجب أمر تنفيذي صدر في شباط من العام نفسه، على أربعة من قضاتها."
