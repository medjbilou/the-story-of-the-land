  - id: gz_2023_11_truce
    title: "The seven-day truce"
    title_ar: "هدنة الأيام السبعة"
    text: "A truce held from 24 November to 1 December 2023. On its first day 24 captives were freed from Gaza, 13 Israelis, 10 Thais and one Filipino, and Israel released 39 Palestinian women and children from its jails. According to Middle East Eye, 78 Israeli civilians were released under the deal during the truce, and 24 foreign nationals and three Israeli-Russians outside it. Then the truce expired and the Israeli bombardment resumed. On 8 December the United States vetoed a Security Council resolution demanding an immediate ceasefire; 13 members voted for it and Britain abstained."
    text_ar: "صمدت هدنةٌ من 24 تشرين الثاني إلى 1 كانون الأول 2023. في يومها الأول أُفرج عن 24 أسيرًا من غزة، هم 13 إسرائيليًا و10 تايلانديين وفلبيني واحد، وأفرجت سلطات الاحتلال عن 39 من النساء والأطفال الفلسطينيين المعتقلين في سجونها. وبحسب موقع «ميدل إيست آي» أُطلق خلال الهدنة سراحُ 78 مدنيًا إسرائيليًا ضمن الاتفاق، و24 أجنبيًا وثلاثة يحملون الجنسيتين الإسرائيلية والروسية خارجه. ثم انقضت الهدنة واستأنف جيش الاحتلال القصف. وفي 8 كانون الأول استخدمت الولايات المتحدة حق النقض (الفيتو) ضد مشروع قرار في مجلس الأمن يطالب بوقف فوري لإطلاق النار، أيّده 13 عضوًا وامتنعت بريطانيا عن التصويت."
    scope: "national"
