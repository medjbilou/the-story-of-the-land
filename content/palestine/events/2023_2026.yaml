  - id: gz_2025_08_e1
    title: "E1: cutting the West Bank in two"
    title_ar: "مشروع E1: شطر الضفة الغربية"
    text: "On 20 August 2025 the Israeli occupation authorities approved the planning of E1: some 3,400 settler homes on about 12 km² between al-Quds (Jerusalem) and the settlement of Ma'ale Adumim. Finance minister Bezalel Smotrich said the Palestinian state was being \"erased from the table, not with slogans but with actions\". The settlement corridor would cut the West Bank in two, and about 3,700 Palestinians, most of them Bedouin, live in its path in 18 communities at risk of demolition and forcible transfer, Khan al-Ahmar among them. In August 2026 the Zionist government opened tenders for 1,234 of the homes, and the UN human rights office called E1 a \"grave and unlawful step to consolidate annexation\". In July 2026 defence minister Israel Katz said the government had approved 104 new settlements since taking office."
    text_ar: "في 20 آب 2025 أقرّت سلطات الاحتلال تخطيط مشروع E1 الاستيطاني: نحو 3,400 وحدة استيطانية على قرابة 12 كيلومترًا مربعًا بين القدس ومستوطنة معاليه أدوميم. وقال وزير المالية بتسلئيل سموتريتش إن الدولة الفلسطينية تُمحى عن الطاولة، لا بالشعارات بل بالأفعال. ومن شأن هذا الممرّ الاستيطاني أن يشطر الضفة الغربية شطرين، ويعيش في طريقه نحو 3,700 فلسطيني، أغلبهم من البدو، في 18 تجمّعًا مهدَّدًا بالهدم والتهجير القسري، منها الخان الأحمر. وفي آب 2026 طرحت الحكومة الصهيونية عطاءات لبناء 1,234 وحدة منها، فوصف مكتب الأمم المتحدة لحقوق الإنسان المشروع بأنه خطوة خطيرة وغير قانونية لترسيخ الضمّ. وفي تموز 2026 قال وزير جيش الاحتلال يسرائيل كاتس إن حكومته أقرّت 104 مستوطنات جديدة منذ تولّيها الحكم."
