  - id: gz_2024_10_unrwa_laws
    title: "The Knesset's laws against UNRWA"
    title_ar: "قانونا الكنيست ضد الأونروا"
    text: "In October 2024 the Knesset passed two laws to end the operations of UNRWA, the UN agency for Palestine refugees, in territory Israel considers its own, and to bar Israeli authorities from any contact with the agency. The ban came into effect on 30 January 2025, when UNRWA was ordered to vacate and stop operating in its premises in occupied East al-Quds (East Jerusalem); the agency said its clinics in the West Bank remained open and its humanitarian operation in Gaza continued."
    text_ar: "في تشرين الأول 2024 أقرّ الكنيست قانونين يقضيان بإنهاء عمليات الأونروا، وكالة الأمم المتحدة لإغاثة وتشغيل لاجئي فلسطين، في الأراضي التي تعدّها إسرائيل تابعةً لها، ويحظران على السلطات الإسرائيلية أي اتصال بالوكالة. وبدأ سريان الحظر في 30 كانون الثاني 2025، حين أُمرت الوكالة بإخلاء مقارّها في القدس الشرقية المحتلة ووقف عملياتها فيها، فيما أكدت أن عياداتها في الضفة الغربية مفتوحة وأن عملها الإنساني في غزة مستمر."
    scope: "national"
