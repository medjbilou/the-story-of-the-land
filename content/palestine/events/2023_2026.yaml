  - id: gz_2024_11_school
    title: "A second school year without schools"
    title_ar: "عامٌ دراسي ثانٍ بلا مدارس"
    text: "The school year could not begin in September 2024. By UNICEF's count on 21 November, 658,000 children had already lost a whole school year, and 57,000 children due to start first grade joined them; 95% of Gaza's school buildings had been damaged or destroyed by Israeli bombardment. On 17 January 2024 the Israeli army had blown up Israa University, the last university still standing in Gaza; UN experts called the systematic destruction of education \"scholasticide\"."
    text_ar: "لم يبدأ العام الدراسي في أيلول 2024. وبحسب منظمة يونيسف في 21 تشرين الثاني، كان 658 ألف طفل قد حُرموا عامًا دراسيًا كاملًا، وانضم إليهم 57 ألف تلميذ كان يُفترض أن يبدؤوا الصف الأول، فيما ألحق القصف الإسرائيلي الضرر أو الدمار بـ95% من مباني المدارس في غزة. وكان الجيش الصهيوني قد نسف في 17 كانون الثاني 2024 جامعة الإسراء، آخر جامعة باقية في القطاع، ووصف خبراء الأمم المتحدة هذا التدمير المنهجي للتعليم بأنه «إبادة تعليمية»."
    scope: "national"
