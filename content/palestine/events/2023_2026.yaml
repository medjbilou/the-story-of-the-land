  - id: gz_2024_01_hamza
    title: "Hamza Dahdouh and Mustafa Thuraya"
    title_ar: "حمزة الدحدوح ومصطفى ثريا"
    text: "On 7 January 2024, an Israeli missile hit a car in southern Gaza, killing Al Jazeera journalist Hamza Dahdouh, Wael Dahdouh's eldest son, and freelance journalist Mustafa Thuraya. Al Jazeera said the car was hit near al-Mawasi, west of Khan Yunis, while they were interviewing displaced people; the Committee to Protect Journalists places it in al-Nasr (Moraj), northeast of Rafah, as they drove back from an assignment. At his son's grave, Wael Dahdouh vowed to keep showing the world what was happening in Gaza. By then the Palestinian Journalists Syndicate had recorded 102 journalists killed by Israeli forces since October 2023."
    text_ar: "في 7 كانون الثاني 2024 أصاب صاروخٌ إسرائيلي سيارةً في جنوب قطاع غزة، فاستُشهد حمزة الدحدوح، الصحفي في قناة الجزيرة والابن الأكبر لوائل الدحدوح، والصحفيُّ المستقل مصطفى ثريا. وقالت الجزيرة إن السيارة أُصيبت قرب المواصي غربيّ خان يونس بينما كانا يجريان مقابلات مع نازحين، فيما تقول لجنة حماية الصحفيين إنها أُصيبت في بلدة النصر (موراج) شمال شرقي رفح وهما عائدان من مهمة صحفية. وعند قبر ابنه تعهّد وائل الدحدوح بأن يواصل إطلاع العالم على ما يجري في غزة. وكانت نقابة الصحفيين الفلسطينيين قد وثّقت حتى ذلك اليوم استشهاد 102 صحفي بنيران قوات الاحتلال منذ تشرين الأول 2023."
