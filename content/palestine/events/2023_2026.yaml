  - id: gz_2024_01_icj
    title: "The ICJ orders provisional measures"
    title_ar: "محكمة العدل الدولية تأمر بتدابير مؤقتة"
    text: "On 26 January 2024, in the case South Africa brought under the Genocide Convention, the International Court of Justice treated Palestinians in Gaza as a group protected by the Convention and, as provisional measures, ordered Israel to take all measures within its power to prevent acts of genocide against them, to prevent and punish incitement to genocide and to allow urgently needed aid in; it did not order a ceasefire. This is not a ruling on whether genocide is being committed: the Court has not yet decided the merits, which may take years."
    text_ar: "في 26 كانون الثاني 2024، في الدعوى التي رفعتها جنوب أفريقيا بموجب اتفاقية منع جريمة الإبادة الجماعية، عدّت محكمة العدل الدولية الفلسطينيين في غزة جماعةً تحميها الاتفاقية، وأمرت إسرائيل، في إطار تدابير مؤقتة، باتخاذ كل ما في وسعها لمنع أفعال الإبادة الجماعية بحقهم، ومنعِ التحريض عليها والمعاقبةِ عليه، والسماحِ بدخول المساعدات الإنسانية العاجلة، لكنها لم تأمر بوقف إطلاق النار. وهذا ليس حكمًا في ما إذا كانت إبادة جماعية تُرتكب؛ فالمحكمة لم تفصل بعدُ في موضوع الدعوى، وقد يستغرق ذلك سنوات."
    scope: "national"
    from: 2024-01-01
