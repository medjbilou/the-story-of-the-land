  - id: gz_2025_10_ceasefire
    title: "The ceasefire and the road north"
    title_ar: "وقف إطلاق النار والطريق إلى الشمال"
    text: "The first phase of the ceasefire took effect at noon on 10 October 2025. It provided for an exchange of captives and prisoners, an Israeli withdrawal from parts of Gaza, about 600 aid trucks a day and free movement from south to north along the Salah al-Din and al-Rashid roads, and displaced families set out for Ghazza (Gaza City). Israeli forces remained deployed across about 53% of the Strip, behind what came to be called the \"yellow line\"."
    text_ar: "دخلت المرحلة الأولى من وقف إطلاق النار حيّز التنفيذ ظهر يوم 10 تشرين الأول 2025. ونصّ الاتفاق على تبادل الأسرى، وانسحاب إسرائيلي من أجزاء من غزة، ودخول نحو 600 شاحنة مساعدات يوميًا، وحرية العبور من الجنوب إلى الشمال عبر طريقَي صلاح الدين والرشيد، فانطلقت العائلات النازحة نحو مدينة غزة. وبقيت قوات الاحتلال منتشرة في نحو 53% من مساحة القطاع، خلف ما صار يُعرف بـ«الخط الأصفر»."
    scope: "national"
    from: 2025-10-01
    to: 2025-11-01
