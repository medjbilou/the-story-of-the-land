  - id: gz_2025_10_strikes
    title: "A ceasefire that does not stop the killing"
    title_ar: "هدنة لا توقف القتل"
    text: "The ceasefire did not stop the killing. Overnight from 28 to 29 October 2025, Israeli strikes killed at least 104 Palestinians, including 46 children, and wounded 253, according to Gaza's Ministry of Health. The Israeli army claimed it struck after one of its soldiers was killed in Rafah; Hamas denied any role in the attack on the soldier and said it remained committed to the truce. Israel then said it had reinstated the ceasefire."
    text_ar: "لم يوقف وقفُ إطلاق النار القتلَ. فبين ليلة 28 تشرين الأول 2025 وصباح اليوم التالي استُشهد 104 فلسطينيين على الأقل في الغارات الإسرائيلية، بينهم 46 طفلًا، وأُصيب 253، بحسب وزارة الصحة في غزة. وزعم جيش الاحتلال أنه شنّ الغارات بعد مقتل أحد جنوده في رفح، فيما نفت حماس أي صلة لها بالهجوم على الجندي وأكدت التزامها بالهدنة. ثم أعلنت إسرائيل أنها أعادت العمل بوقف إطلاق النار."
    scope: "national"
