  - id: gz_2025_10_flotilla
    title: "The Global Sumud Flotilla"
    title_ar: "أسطول الصمود العالمي"
    text: "In early October 2025 Israeli forces intercepted the Global Sumud Flotilla at sea: dozens of civilian boats that had sailed to break the blockade and bring aid to Gaza, carrying activists from many countries, among them the Swedish activist Greta Thunberg. More than 450 participants were detained. On 2 October Amnesty International said at least 39 vessels had been intercepted, called it \"a calculated act of intimidation\" and demanded the immediate and unconditional release of the crews."
    text_ar: "في مطلع تشرين الأول 2025 اعترضت قوات الاحتلال في البحر أسطول الصمود العالمي، وهو عشرات القوارب المدنية التي أبحرت لكسر الحصار وإيصال المساعدات إلى غزة، وعلى متنها ناشطون من بلدان كثيرة بينهم الناشطة السويدية غريتا تونبرغ. واحتُجز أكثر من 450 مشاركًا. وقالت منظمة العفو الدولية في 2 تشرين الأول إن 39 سفينة على الأقل اعتُرضت، ووصفت ذلك بأنه «عمل ترهيب محسوب»، وطالبت بالإفراج الفوري وغير المشروط عن طواقمها."
    scope: "national"
    from: 2025-10-01
    to: 2025-11-01
    day: 2
