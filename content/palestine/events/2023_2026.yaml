  - id: gz_2023_10_dahdouh
    title: "The family of Wael Dahdouh"
    title_ar: "عائلة وائل الدحدوح"
    text: "On 25 October 2023, an Israeli air strike on Nuseirat refugee camp in central Gaza killed Amna, the wife of Al Jazeera's Gaza bureau chief Wael Dahdouh, together with his son Mahmoud, his daughter Sham and his 45-day-old grandson Adam. Airwars has named at least 13 of his relatives among the dead and puts the civilian toll of the strike at 13 to 21."
    text_ar: "في 25 تشرين الأول 2023 أصابت غارةٌ جوية إسرائيلية مخيمَ النصيرات للاجئين وسط القطاع، فاستُشهدت آمنة، زوجة وائل الدحدوح مدير مكتب قناة الجزيرة في غزة، وابنه محمود وابنته شام وحفيده آدم ابن الخمسة والأربعين يومًا. ووثّقت منظمة «إيروورز» أسماء 13 شهيدًا على الأقل من أقاربه، وتقدّر عدد الضحايا المدنيين في الغارة بما بين 13 و21."
