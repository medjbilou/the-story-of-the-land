  - id: gz_2024_04_encampments
    title: "The student encampments"
    title_ar: "مخيمات الطلاب التضامنية"
    text: "In April 2024 students at Columbia University in New York set up a Gaza solidarity encampment on their campus. According to Al Jazeera, protest encampments spread to universities across the United States after police entered Columbia's campus, and within three weeks they had become a global student movement reaching Europe, Australia and Canada."
    text_ar: "في نيسان 2024 أقام طلاب جامعة كولومبيا في نيويورك مخيمًا تضامنيًا مع غزة داخل حرمهم الجامعي. وبحسب قناة الجزيرة، انتشرت مخيمات الاحتجاج في جامعات الولايات المتحدة بعد أن دخلت الشرطة حرم كولومبيا، وتحوّلت خلال ثلاثة أسابيع إلى حركة طلابية عالمية امتدت إلى أوروبا وأستراليا وكندا."
    scope: "national"
    from: 2024-04-01
    to: 2024-05-01
    effects:
