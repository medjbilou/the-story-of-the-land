  - id: gz_2024_04_nasser
    title: "The mass graves at Nasser Medical Complex"
    title_ar: "المقابر الجماعية في مجمع ناصر الطبي"
    text: "After Israeli forces withdrew on 7 April 2024 from Nasser Medical Complex in Khan Yunis, which they had stormed, mass graves were uncovered in its grounds; Gaza's civil defence said it recovered more than 300 bodies. By 23 April the UN human rights office reported 283 bodies recovered there, only 42 of them identified; according to reports it received, the dead included older people, women and wounded, and some were found with their hands tied and stripped of their clothes. High Commissioner Volker Türk called for independent investigations, recalling that the intentional killing of civilians, detainees and others hors de combat is a war crime. The Israeli army called the claim that it buried bodies \"baseless\" and said it had examined bodies buried by Palestinians while searching for captives."
    text_ar: "بعد انسحاب قوات الاحتلال في 7 نيسان 2024 من مجمع ناصر الطبي في خان يونس، الذي كانت قد اقتحمته، كُشف عن مقابر جماعية في ساحاته، وقال الدفاع المدني في غزة إنه انتشل منها أكثر من 300 جثة. وحتى 23 نيسان أفاد مكتب الأمم المتحدة لحقوق الإنسان بانتشال 283 جثة منها، لم يُتعرَّف إلا على 42 منها؛ وبحسب ما أُبلغ به المكتب، كان بين الضحايا مسنّون ونساء وجرحى، ووُجد بعضهم مكبّل اليدين ومجرّدًا من ملابسه. ودعا المفوض السامي فولكر تورك إلى تحقيقات مستقلة، مذكّرًا بأن القتل العمد للمدنيين والمحتجزين والعاجزين عن القتال جريمة حرب. ووصف جيش الاحتلال اتهامه بدفن جثث بأنه «لا أساس له»، وزعم أنه فحص جثثًا دفنها فلسطينيون بحثًا عن أسرى."
