        text_ar: "نسجّل الأطفال في خيمة تعليمية"
        outcome: "The little ones come back from the tent reciting times tables and squabbling over a single notebook."
        outcome_ar: "يعود الصغار من الخيمة يرددون جدول الضرب، ويتشاجرون على دفتر واحد."
