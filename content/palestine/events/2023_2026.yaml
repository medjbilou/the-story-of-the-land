        outcome: "The children stand in front of the tent and wave at the phone, sending their message to those who could not get through."
        outcome_ar: "يقف الأطفال أمام الخيمة ويلوّحون للهاتف، ويرسلون رسالتهم إلى من لم يصلوا."
