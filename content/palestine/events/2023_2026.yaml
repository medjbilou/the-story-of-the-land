  - id: gz_2024_05_tal_sultan
    title: "The displacement camp in Tal al-Sultan"
    title_ar: "مخيم النازحين في تل السلطان"
    text: "On 26 May 2024, two days after the International Court of Justice ordered Israel to immediately halt its military offensive in Rafah, an Israeli strike hit a camp for displaced people in the Tal al-Sultan neighbourhood of western Rafah. At least 45 people were killed, most of them women and children, and dozens were wounded. Explosive-weapons experts, among them a Human Rights Watch researcher, identified fragments at the scene as part of a US-made GBU-39 bomb. Israeli Prime Minister Benjamin Netanyahu called it a \"tragic mishap\" but said he did not intend to end the war before every goal was achieved."
    text_ar: "في 26 أيار 2024، بعد يومين من أمر محكمة العدل الدولية إسرائيلَ بالوقف الفوري لهجومها العسكري على رفح، أصابت غارةٌ إسرائيلية مخيمًا للنازحين في حي تل السلطان غربيّ رفح. استُشهد 45 شخصًا على الأقل، معظمهم من النساء والأطفال، وأصيب العشرات. وتعرّف خبراء في الأسلحة المتفجرة، بينهم باحث في منظمة هيومن رايتس ووتش، على بقايا في المكان قالوا إنها لقنبلة أمريكية الصنع من طراز GBU-39. ووصف رئيس الوزراء الإسرائيلي بنيامين نتنياهو ما جرى بأنه «حادث مأساوي»، لكنه قال إنه لا ينوي إنهاء الحرب قبل تحقيق كل أهدافها."
