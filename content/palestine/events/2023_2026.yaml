  - id: gz_2024_04_shifa
    title: "Al-Shifa after the second siege: \"an empty shell\""
    title_ar: "الشفاء بعد الحصار الثاني: «قوقعة فارغة»"
    text: "After the Israeli army besieged and stormed al-Shifa a second time, a WHO-led mission entered the hospital on 5 April 2024 and found Gaza's largest referral hospital \"an empty shell\": most of its buildings destroyed or burned in the Israeli assault, at least 115 beds burned in the former emergency department, and shallow graves dug outside. The acting director said at least 20 patients had reportedly died during the siege for lack of care. The UN human rights office later reported about 30 bodies buried in two graves in the courtyard, some with their hands tied."
    text_ar: "بعد أن حاصر جيش الاحتلال مجمّع الشفاء واقتحمه مرة ثانية، دخلت بعثةٌ تقودها منظمة الصحة العالمية إلى المستشفى في 5 نيسان 2024، فوجدت أكبر مستشفى إحالة في غزة «قوقعة فارغة»: دمّر الهجوم الإسرائيلي معظم مبانيه أو أحرقها، و115 سريرًا على الأقل احترقت في قسم الطوارئ السابق، وقبورٌ ضحلة حُفرت خارجه. وقال المدير بالوكالة إن 20 مريضًا على الأقل تُوفّوا، بحسب ما أُفيد، خلال الحصار لانعدام الرعاية. وأفاد مكتب الأمم المتحدة لحقوق الإنسان لاحقًا بدفن نحو 30 جثة في قبرين بساحة المستشفى، بعضها مكبّل اليدين."
