  - id: gz_2025_05_ghf
    title: "Killings at the food distribution sites"
    title_ar: "القتل عند نقاط توزيع الغذاء"
    text: "From late May 2025, the Gaza Humanitarian Foundation, backed by Israel and the United States, handed out limited food parcels at militarised distribution points; the UN said its model was neither impartial nor neutral. In June the US State Department approved $30 million for it. The UN human rights office recorded at least 1,373 Palestinians killed while seeking food between 27 May and the end of July: 859 near GHF sites and 514 along the routes of food convoys. It said most of the killings were committed by the Israeli military."
    text_ar: "منذ أواخر أيار 2025 تولّت «مؤسسة غزة الإنسانية»، المدعومة من إسرائيل والولايات المتحدة، توزيع طرود غذائية محدودة في نقاط توزيع عسكرية الطابع، وقالت الأمم المتحدة إن نموذجها لا يراعي مبدأي عدم التحيز والحياد. وفي حزيران أعلنت وزارة الخارجية الأمريكية تمويلها بثلاثين مليون دولار. ووثّق مكتب الأمم المتحدة لحقوق الإنسان استشهاد 1,373 فلسطينيًا على الأقل أثناء سعيهم إلى الحصول على الغذاء بين 27 أيار ونهاية تموز: 859 قرب مواقع المؤسسة و514 على طرق قوافل الغذاء، وقال إن جيش الاحتلال ارتكب معظم عمليات القتل."
