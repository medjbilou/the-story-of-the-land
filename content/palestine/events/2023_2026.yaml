  - id: gz_2026_04_flotilla
    title: "The second Sumud flotilla"
    title_ar: "أسطول الصمود الثاني"
    text: "A second Global Sumud Flotilla sailed from Barcelona on 12 April 2026. Late on 29 April Israel seized 22 of its 58 boats in international waters, hundreds of miles from Gaza. Organisers said 211 of about 400 activists were detained; Israel's foreign ministry put the figure at 175. Spain called the interception illegal and Türkiye called it \"an act of piracy\"."
    text_ar: "أبحر أسطول الصمود العالمي الثاني من برشلونة في 12 نيسان 2026. وفي ساعة متأخرة من ليل 29 نيسان استولت إسرائيل على 22 من قواربه الثمانية والخمسين في المياه الدولية، على بُعد مئات الأميال من غزة. وقال المنظمون إن 211 من نحو 400 ناشط احتُجزوا، فيما قدّرت وزارة الخارجية الإسرائيلية العدد بـ175. ووصفت إسبانيا الاعتراض بأنه غير قانوني، ووصفته تركيا بأنه «عمل من أعمال القرصنة»."
    scope: "national"
