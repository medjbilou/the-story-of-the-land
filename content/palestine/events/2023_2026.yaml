  - id: gz_2024_12_amnesty
    title: "Amnesty International: genocide"
    title_ar: "منظمة العفو الدولية: إبادة جماعية"
    text: "On 5 December 2024, Amnesty International published \"You Feel Like You Are Subhuman\", concluding that Israel is committing genocide against Palestinians in Gaza. Covering nine months from 7 October 2023, it documented three of the five acts in the Genocide Convention: killing, causing serious bodily or mental harm, and inflicting conditions of life calculated to bring about physical destruction. Amnesty also condemned the atrocities committed by Hamas and other armed groups on 7 October, including deliberate mass killings and hostage-taking, and said they can never justify Israel's genocide."
    text_ar: "في 5 كانون الأول 2024 نشرت منظمة العفو الدولية تقريرًا بعنوان «تشعر وكأنك دون البشر» خلصت فيه إلى أن إسرائيل ترتكب إبادة جماعية بحق الفلسطينيين في غزة. وتناول التقرير تسعة أشهر بدءًا من 7 تشرين الأول 2023، ووثّق ثلاثة من الأفعال الخمسة الواردة في اتفاقية الإبادة الجماعية: القتل، وإلحاق أذى جسدي أو نفسي جسيم، وفرض ظروف معيشية يُقصد بها التدمير المادي. كما أدانت المنظمة الفظائع التي ارتكبتها حماس وفصائل مسلحة أخرى في 7 تشرين الأول، ومنها القتل الجماعي المتعمد وأخذ الرهائن، مؤكدةً أنها لا يمكن أبدًا أن تبرّر الإبادة الجماعية التي ترتكبها إسرائيل."
