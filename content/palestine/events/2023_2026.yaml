    title: "The West Bank under fire"
    title_ar: "الضفة الغربية تحت النار"
    text: "The killing did not stop at Gaza. On 11 October 2023 settlers and Israeli soldiers stormed a house in Qusra, near Nablus, and four Palestinians were killed, a child, Hassan Odeh, among them; the next day, at their funeral, Ibrahim al-Wadi and his son Ahmed were shot dead, by settlers according to the Palestinian Ministry of Health, by settlers and soldiers according to Ibrahim's brother. On 22 October an Israeli air strike hit al-Ansar mosque in Jenin camp, killing two men by the Ministry's count; the army claimed fighters were using it as a command centre. By 14 December OCHA had counted 276 Palestinians killed in the West Bank since 7 October, 70 of them children, air and drone strikes on Jenin and Nur Shams camps, 343 settler attacks (35 a week, against 21 before), more than 3,000 Palestinians arrested and six men dead in Israeli custody under unclear circumstances."
    text_ar: "لم يتوقف القتل عند حدود غزة. ففي 11 تشرين الأول 2023 اقتحم مستوطنون وجنود من جيش الاحتلال بيتًا في قصرة قرب نابلس، فاستُشهد أربعة فلسطينيين بينهم الطفل حسن عودة، وفي اليوم التالي، خلال تشييعهم، استُشهد إبراهيم الوادي وابنه أحمد برصاص المستوطنين بحسب وزارة الصحة الفلسطينية، وبرصاص المستوطنين والجنود بحسب شقيق إبراهيم. وفي 22 تشرين الأول قصفت طائرات الاحتلال مسجد الأنصار في مخيم جنين، فاستُشهد رجلان بحسب الوزارة، وزعم الجيش أن مقاتلين كانوا يتّخذونه مركزَ قيادة. وحتى 14 كانون الأول أحصى مكتب أوتشا 276 شهيدًا فلسطينيًا في الضفة الغربية منذ 7 تشرين الأول، بينهم 70 طفلًا، وغاراتٍ جوية وأخرى بطائرات مسيّرة على مخيمَي جنين ونور شمس، و343 اعتداءً للمستوطنين (35 في الأسبوع، مقابل 21 قبل ذلك)، واعتقالَ أكثر من 3,000 فلسطيني، واستشهادَ ستة أسرى في سجون الاحتلال في ظروف غامضة."
