  - id: gz_2023_10_jabalia
    title: "The bombing of Jabalia camp"
    title_ar: "قصف مخيم جباليا"
    text: "On 31 October 2023, Israeli air strikes hit a residential block of Jabalia refugee camp. Airwars, in its assessment updated in October 2026, counts at least 149 civilians killed, 85 of them children, and assesses that 2,000-pound bombs were used, guided weapons of a family the United States supplies to Israel; Gaza's Government Media Office gave higher figures. The Israeli army claimed it was targeting Hamas commander Ibrahim Biari, and it struck the camp again the next day. The UN human rights office said the attacks could amount to war crimes, given the high civilian toll and the scale of destruction."
    text_ar: "في 31 تشرين الأول 2023 ضربت غاراتٌ جوية إسرائيلية حيًّا سكنيًا في مخيم جباليا للاجئين. وتوثّق منظمة «إيروورز»، في تقييمها المحدَّث في تشرين الأول 2026، استشهاد 149 مدنيًا على الأقل بينهم 85 طفلًا، وترجّح أن القنابل المستخدمة كانت زنة ألفَي رطل، من فئة الأسلحة الموجَّهة التي تزوّد بها الولاياتُ المتحدة إسرائيلَ، فيما أعلن المكتب الإعلامي الحكومي في غزة أرقامًا أعلى. وزعم جيش الاحتلال أنه استهدف القائد في حماس إبراهيم البياري، ثم عاد فقصف المخيم في اليوم التالي. ورأى مكتب الأمم المتحدة لحقوق الإنسان أن هذه الهجمات قد ترقى إلى جرائم حرب، بالنظر إلى ارتفاع عدد الضحايا المدنيين وحجم الدمار."
