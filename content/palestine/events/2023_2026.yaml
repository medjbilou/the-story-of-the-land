  - id: gz_2026_09_tent_schools
    title: "Back to school, in tents"
    title_ar: "العودة إلى المدرسة في الخيام"
    text: "On 19 September 2026 a new school year began in Gaza, much of it in tents. The Palestinian Ministry of Education and Higher Education said about 541,000 students returned to education; according to Al Jazeera, some 700,000 children had missed formal in-person schooling for almost three consecutive school years, and UNICEF estimated that nearly 98% of school buildings had been damaged by Israeli attacks since October 2023. At the Ahbab Shujayea school, more than 300 pupils study in worn-out tents with no desks or chairs."
    text_ar: "في 19 أيلول 2026 بدأ عام دراسي جديد في غزة، يجري جزء كبير منه في الخيام. وقالت وزارة التربية والتعليم العالي الفلسطينية إن نحو 541 ألف طالب عادوا إلى التعليم، وبحسب قناة الجزيرة فات نحو 700 ألف طفل التعليمُ الحضوري النظامي قرابة ثلاثة أعوام دراسية متتالية، فيما تقدّر يونيسف أن الهجمات الإسرائيلية ألحقت الضرر بنحو 98% من مباني المدارس منذ تشرين الأول 2023. وفي مدرسة «أحباب الشجاعية» يدرس أكثر من 300 تلميذ في خيام بالية، بلا مقاعد ولا كراسٍ."
    scope: "national"
    from: 2026-09-01
    to: 2026-10-01
    day: 19
