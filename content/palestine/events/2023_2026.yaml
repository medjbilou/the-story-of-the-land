  - id: gz_2025_11_toll_70000
    title: "The recorded toll passes 70,000"
    title_ar: "الحصيلة المسجلة تتجاوز 70 ألفًا"
    text: "On 29 November 2025, Gaza's Ministry of Health said the recorded death toll had passed 70,000, reaching 70,100. Of the 301 deaths added since 27 November, only two were people killed in new strikes; the other 299 had been identified from remains that lay buried for months under the rubble of bombed buildings."
    text_ar: "في 29 تشرين الثاني 2025 أعلنت وزارة الصحة في غزة أن عدد الشهداء المسجلين تجاوز 70 ألفًا، إذ بلغ 70,100. ومن بين 301 وفاة أُضيفت منذ 27 تشرين الثاني، استُشهد اثنان فقط في غارات جديدة؛ أما الباقون، وعددهم 299، فقد جرى التعرف على رفاتهم بعد أن ظلت مدفونة شهورًا تحت أنقاض المباني المقصوفة."
    scope: "national"
    tags: [sensitive]
