  - id: gz_2026_07_abu_safiya
    title: "The doctor who has not come home"
    title_ar: "الطبيب الذي لم يَعُد إلى بيته"
    text: "On 6 July 2026 Amnesty International warned that the life of Dr Hussam Abu Safiya, director of Kamal Adwan Hospital, was in grave danger. He has been held since 27 December 2024 without charge or trial under Israel's Unlawful Combatants Law, and on 16 June Israel's Supreme Court rejected his petition and upheld his detention until at least October 2026. After a visit on 2 July, his lawyer from Physicians for Human Rights–Israel described bruising and signs of torture on his head and body."
    text_ar: "في 6 تموز 2026 حذّرت منظمة العفو الدولية من أن حياة الدكتور حسام أبو صفية، مدير مستشفى كمال عدوان، في خطر داهم. فهو محتجز منذ 27 كانون الأول 2024 دون تهمة أو محاكمة بموجب قانون «المقاتلين غير الشرعيين» الإسرائيلي، وقد رفضت المحكمة العليا الإسرائيلية في 16 حزيران التماسه وأبقت احتجازه حتى تشرين الأول 2026 على الأقل. وبعد زيارةٍ في 2 تموز وصف محاميه من منظمة «أطباء لحقوق الإنسان – إسرائيل» كدماتٍ وآثارَ تعذيب على رأسه وجسده."
    scope: "national"
    place: beit_lahia
