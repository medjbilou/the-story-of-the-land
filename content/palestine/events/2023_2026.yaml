  - id: gz_2024_01_hind
    title: "Hind Rajab"
    title_ar: "هند رجب"
    text: "On 29 January 2024, Hind Rajab, a girl of five or six (sources differ on her age), was trapped in a car in Ghazza (Gaza City) among relatives killed by Israeli fire, including her 15-year-old cousin Layan, and kept calling the Palestine Red Crescent for help. Two paramedics, Yusuf Zeino and Ahmed al-Madhoun, were sent for her; then contact was lost. On 10 February Hind and the two paramedics were found dead. Forensic Architecture counted 335 bullets that hit the car and found that an Israeli tank was likely 13 to 23 metres away. The Israeli army at first denied its forces were in the area; on 19 August 2026 it said its findings indicated that its troops had fired at a vehicle, and announced a criminal investigation by its Military Police."
    text_ar: "في 29 كانون الثاني 2024 حوصرت الطفلة هند رجب، وهي في الخامسة أو السادسة من عمرها (تختلف المصادر في ذلك)، داخل سيارةٍ في مدينة غزة بين أقاربها الذين استُشهدوا بنيران الاحتلال، ومنهم قريبتها ليان ذات الخمسة عشر عامًا، وظلت تستنجد هاتفيًا بالهلال الأحمر الفلسطيني. أُرسل إليها المسعفان يوسف زينو وأحمد المدهون، ثم انقطع الاتصال. وفي 10 شباط عُثر على هند والمسعفَين شهداء. وأحصى تحقيق مجموعة «العمارة الجنائية» 335 رصاصة أصابت السيارة، ورجّح أن دبابة إسرائيلية كانت على بُعد 13 إلى 23 مترًا منها. وكان جيش الاحتلال قد نفى وجود قواته في المنطقة، ثم قال في 19 آب 2026 إن نتائج فحصه تشير إلى أن جنوده أطلقوا النار على مركبة، وأعلن فتح تحقيق جنائي في الحادثة تتولاه شرطته العسكرية."
    scope: "region:gaza"
    place: gaza
    tags: [sensitive]
