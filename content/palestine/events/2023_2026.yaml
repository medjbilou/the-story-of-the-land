  - id: gz_2024_03_icj_aid
    title: "A second ICJ order: aid without hindrance"
    title_ar: "أمرٌ ثانٍ من محكمة العدل الدولية: المساعدات دون عوائق"
    text: "On 28 March 2024, citing worsening conditions and the spread of famine, the ICJ issued new provisional measures requiring Israel to ensure, without delay and in full cooperation with the UN, the unhindered provision of humanitarian aid and basic services throughout Gaza. Like the January order, these are provisional measures, not a judgment on the merits."
    text_ar: "في 28 آذار 2024، وإذ أشارت إلى تفاقم الأوضاع وانتشار المجاعة، أصدرت محكمة العدل الدولية تدابير مؤقتة جديدة تُلزم إسرائيل بأن تضمن، دون إبطاء وبالتعاون الكامل مع الأمم المتحدة، وصولَ المساعدات الإنسانية والخدمات الأساسية دون عوائق إلى أنحاء غزة كافة. وهي، مثل أمر كانون الثاني، تدابير مؤقتة وليست حكمًا في موضوع الدعوى."
