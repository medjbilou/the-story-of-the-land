  - id: gz_2026_02_lancet
    title: "The Gaza Mortality Survey"
    title_ar: "مسح الوفيات في غزة"
    text: "In February 2026 the Gaza Mortality Survey, published in The Lancet Global Health and based on 2,000 households with 9,729 people, estimated about 75,200 violent deaths in Gaza between 7 October 2023 and 5 January 2025, about 35% more than the Ministry of Health's 49,090 for the same period. It also estimated 8,540 excess non-violent deaths from worsening living conditions and the collapse of the health sector, and found that 56.2% of violent deaths were women, children and older people."
    text_ar: "في شباط 2026 قدّر «مسح الوفيات في غزة»، المنشور في مجلة «ذا لانسيت غلوبال هيلث» والمستند إلى 2,000 أسرة تضم 9,729 فردًا، عدد الوفيات العنيفة في غزة بين 7 تشرين الأول 2023 و5 كانون الثاني 2025 بنحو 75,200، أي أعلى بنحو 35% من رقم وزارة الصحة للفترة نفسها (49,090). كما قدّر 8,540 وفاة زائدة غير عنيفة نتيجة تدهور ظروف المعيشة وانهيار القطاع الطبي، ووجد أن 56.2% من الوفيات العنيفة كانت من النساء والأطفال والمسنّين."
    scope: "national"
    tags: [sensitive]
    from: 2026-02-01
    to: 2026-03-01
