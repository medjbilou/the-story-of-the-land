events:
  - id: gz_2023_10_before_october
    title: "Before 7 October"
    title_ar: "قبل السابع من تشرين الأول"
    text: "Since June 2007, for sixteen years, Israel had kept the Gaza Strip, home to about 2.3 million people, under blockade, with the Egyptian authorities also restricting the Rafah crossing. In the West Bank, OCHA's figures show some 200 Palestinians killed in 2023 before the war began in October; by the end of August the year's toll had already passed that of all of 2022, itself the deadliest year for West Bank Palestinians since OCHA's records began in 2005. In Gaza, on 9 May 2023 the Israeli occupation army opened the offensive it called \"Shield and Arrow\" with air strikes on homes where three Islamic Jihad members were staying, killing them along with ten family members; by 14 May the UN had verified 33 Palestinians killed in Gaza in all, at least 12 of them civilians, six of those children. On 5 April, during Ramadan, Israeli police stormed al-Aqsa Mosque at dawn, fired stun grenades and tear gas at worshippers spending the night in prayer and arrested some 350 people by the police's count, at least 400 by Palestinian officials'. In the first days of October thousands of settlers toured its courtyards while the police kept young Palestinians out."
    text_ar: "كان الاحتلال الإسرائيلي يفرض منذ حزيران 2007، أي منذ ستة عشر عامًا، حصارًا على قطاع غزة الذي يعيش فيه نحو 2.3 مليون إنسان، فيما تقيّد السلطات المصرية العبور من معبر رفح. وفي الضفة الغربية تُظهر أرقام مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية (أوتشا) نحو 200 شهيد فلسطيني في عام 2023 قبل أن تبدأ الحرب في تشرين الأول، وكانت حصيلة ذلك العام قد تجاوزت مع نهاية آب حصيلةَ عام 2022 كلّه، وكان عام 2022 نفسه أشدَّ الأعوام دمويةً على فلسطينيي الضفة منذ بدأ المكتب تسجيل الضحايا عام 2005. وفي غزة افتتح جيش الاحتلال في 9 أيار 2023 عدوانًا سمّاه «الدرع والسهم» بغاراتٍ جوية على بيوتٍ كان يقيم فيها ثلاثة من أعضاء حركة الجهاد الإسلامي، فاستُشهدوا ومعهم عشرة من أفراد عائلاتهم. وحتى 14 أيار تحقّقت الأمم المتحدة من سقوط 33 قتيلًا فلسطينيًا في القطاع، بينهم 12 مدنيًا على الأقل، منهم ستة أطفال. وفي 5 نيسان، في شهر رمضان، اقتحمت الشرطة الإسرائيلية المسجد الأقصى فجرًا وأطلقت قنابل الصوت والغاز المسيل للدموع على المعتكفين، واعتقلت نحو 350 شخصًا بحسب الشرطة و400 على الأقل بحسب مسؤولين فلسطينيين. ومع مطلع تشرين الأول اقتحم آلاف المستوطنين باحاته، فيما منعت الشرطة الشبّان الفلسطينيين من دخوله."
