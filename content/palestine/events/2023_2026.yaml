  - id: gz_2025_08_anas
    title: "Anas al-Sharif and his colleagues"
    title_ar: "أنس الشريف وزملاؤه"
    text: "Late on 10 August 2025, an Israeli drone hit a journalists' tent outside the main gate of al-Shifa Hospital in Ghazza (Gaza City), killing Al Jazeera correspondent Anas al-Sharif and his colleagues Mohammed Qreiqeh, Ibrahim Zaher and Mohammed Noufal, the channel's whole staff team in the city, and two other journalists, one of them Moamen Aliwa. The Israeli military claimed al-Sharif headed a Hamas cell; the Committee to Protect Journalists said the images it cited were not credible and that Israel has a long pattern of unsubstantiated claims."
    text_ar: "في ساعة متأخرة من ليل 10 آب 2025 أصابت طائرةٌ مسيّرة إسرائيلية خيمةً للصحفيين أمام البوابة الرئيسية لمستشفى الشفاء في مدينة غزة، فاستُشهد مراسل الجزيرة أنس الشريف وزملاؤه محمد قريقع وإبراهيم ظاهر ومحمد نوفل، أي فريق القناة كله في المدينة، إضافةً إلى صحفيَّين آخرين أحدهما مؤمن عليوة. وزعم جيش الاحتلال أن الشريف كان يرأس خلية لحماس، فيما قالت لجنة حماية الصحفيين إن الصور التي استند إليها غير موثوقة، وإن لإسرائيل سجلًّا طويلًا من الادعاءات غير المثبتة."
