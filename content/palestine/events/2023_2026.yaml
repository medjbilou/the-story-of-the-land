  - id: gz_2025_07_umm_al_khair
    title: "Masafer Yatta: the herders and the settlers"
    title_ar: "مسافر يطا: الرعاة والمستوطنون"
    text: "On 28 July 2025, in Umm al-Khair in Masafer Yatta, south of al-Khalil (Hebron), the settler Yinon Levi shot dead Awdah Hathaleen, 31, an English teacher, father of three and an activist who had worked with the makers of the Oscar-winning film \"No Other Land\", as settlers with a bulldozer tore up the village's sewage pipe and ran over its olive trees. Levi was released to house arrest and the authorities kept Hathaleen's body; only a year later was Levi charged with reckless manslaughter, the first such indictment of an Israeli in more than seven years. That same month, on 4 July, all 50 families of Muarrajat East, a herding community in the Jordan Valley, fled settler attacks. Human Rights Watch counts 107 communities, about 5,900 Palestinians, fully or partly displaced by settler violence since January 2023, and in Masafer Yatta the Israeli authorities have demolished about 400 structures in fifteen years, nearly half of them since January 2025. In June 2026 Amnesty International found that Israel is pursuing the ethnic cleansing of Bedouin and herding communities in Area C."
    text_ar: "في 28 تموز 2025، في قرية أم الخير بمسافر يطا جنوبي الخليل، أطلق المستوطن ينون ليفي النار على عودة الهذالين فاستُشهد. كان عودة في الحادية والثلاثين، أبًا لثلاثة أطفال ومعلّمًا للغة الإنجليزية، وناشطًا عمل مع صانعي فيلم «لا أرض أخرى» الحائز جائزة الأوسكار، وكان المستوطنون يقتلعون بجرّافةٍ أنبوب الصرف في القرية ويدهسون أشجار الزيتون. أُفرج عن ليفي إلى الحبس المنزلي، واحتجزت سلطات الاحتلال جثمان الشهيد، ولم يُتّهم ليفي بالقتل المتهوّر إلا بعد عام، في أول لائحة اتهام من نوعها بحق إسرائيلي منذ أكثر من سبع سنوات. وفي الشهر نفسه، في 4 تموز، فرّت العائلات الخمسون جميعها من تجمّع المعرّجات الشرقية الرعوي في الأغوار هربًا من اعتداءات المستوطنين. وتُحصي هيومن رايتس ووتش 107 تجمّعات، فيها نحو 5,900 فلسطيني، هجّرها عنف المستوطنين كليًّا أو جزئيًّا منذ كانون الثاني 2023، وفي مسافر يطا هدمت سلطات الاحتلال نحو 400 مبنى في خمسة عشر عامًا، نصفها تقريبًا منذ كانون الثاني 2025. وفي حزيران 2026 خلصت منظمة العفو الدولية إلى أن إسرائيل تمارس التطهير العرقي بحق التجمّعات البدوية والرعوية في المنطقة (ج)."
