  - id: gz_2023_10_evacuation_north
    title: "The evacuation order: north of Wadi Gaza, move south"
    title_ar: "أمر الإخلاء: من شمال وادي غزة إلى الجنوب"
    text: "Shortly before midnight on 12 October 2023, the Israeli occupation army told UN staff that the entire population north of Wadi Gaza must move to the south of the Strip within 24 hours: about 1.1 million people, according to the UN Secretary-General's spokesman, roughly half of Gaza. The UN called the mass relocation \"impossible\" and urgently asked for the order to be rescinded. On 17 October the UN human rights office warned that the order, together with the complete siege, could amount to a forcible transfer of civilians in breach of international law, and that those who had moved south found little shelter, food or water."
    text_ar: "قُبيل منتصف ليل 12 تشرين الأول 2023 أبلغ جيش الاحتلال موظفي الأمم المتحدة بأن على جميع السكان شمال وادي غزة الانتقال إلى جنوب القطاع خلال 24 ساعة، وهم نحو 1.1 مليون إنسان بحسب المتحدث باسم الأمين العام، أي قرابة نصف سكان غزة. ووصفت الأمم المتحدة هذا الترحيل الجماعي بأنه «مستحيل»، وطالبت بإلغاء الأمر على وجه السرعة. وفي 17 تشرين الأول حذّر مكتب الأمم المتحدة لحقوق الإنسان من أن الأمر، مقرونًا بالحصار الشامل، قد يرقى إلى نقلٍ قسري للمدنيين يخالف القانون الدولي، وأن من نزحوا جنوبًا وجدوا القليل من المأوى والغذاء والماء."
    scope: "national"
    place: gaza
    from: 2023-10-01
    to: 2023-11-01
    day: 12
