  - id: gz_2023_11_shifa
    title: "The raid on al-Shifa hospital"
    title_ar: "اقتحام مجمع الشفاء الطبي"
    text: "On 15 November 2023, after a days-long Israeli siege, the occupation army stormed al-Shifa, Gaza's largest hospital, and searched its rooms and basement. Israel claimed Hamas ran a headquarters in tunnels beneath it, which Hamas and hospital staff denied. When a WHO-led team reached the hospital on 18 November, it called al-Shifa a \"death zone\" and reported a mass grave at the entrance, with nearly 300 patients, 25 health workers and 32 babies in extremely critical condition still inside."
    text_ar: "في 15 تشرين الثاني 2023، بعد حصارٍ دام أيامًا، اقتحمت قوات الاحتلال مجمّع الشفاء الطبي، أكبر مستشفيات غزة، وفتّشت غرفه وطوابقه السفلية. وزعمت إسرائيل أن حماس تدير مقرًّا في أنفاق تحته، وهو ما نفته الحركة والعاملون في المستشفى. وحين وصل فريقٌ تقوده منظمة الصحة العالمية إلى المستشفى في 18 تشرين الثاني وصفه بأنه «منطقة موت»، وأفاد بوجود مقبرة جماعية عند مدخله، وبأن نحو 300 مريض و25 عاملًا صحيًا و32 رضيعًا في حالة حرجة للغاية ما زالوا في داخله."
