  - id: gz_2024_05_rafah
    title: "The Rafah invasion and the closing of the crossing"
    title_ar: "اجتياح رفح وإغلاق المعبر"
    text: "On 6 May 2024 the Israeli occupation army ordered eastern Rafah to be evacuated, in a city where about 1.4 million people, most of them already displaced, were sheltering. On 7 May it seized the Palestinian side of the Rafah crossing with Egypt, and aid through it stopped. By 18 May UNRWA's Commissioner-General said nearly 800,000 people had been displaced from Rafah, that those who flee are exposed, without safe passage or protection, and that they had never found safety, not even in UNRWA shelters."
    text_ar: "في 6 أيار 2024 أمر جيش الاحتلال بإخلاء شرق رفح، في مدينةٍ كان يحتمي بها نحو 1.4 مليون إنسان، معظمهم نازحون أصلًا. وفي 7 أيار سيطر على الجانب الفلسطيني من معبر رفح مع مصر، فتوقف دخول المساعدات عبره. وبحلول 18 أيار قال المفوض العام للأونروا إن نحو 800 ألف شخص نزحوا من رفح، مضيفًا أن الفارّين يتنقلون مكشوفين بلا ممرات آمنة ولا حماية، وأنهم لم يجدوا الأمان قط، ولا حتى في ملاجئ الوكالة."
