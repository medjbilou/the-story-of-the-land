  - id: e1989_09_beit_sahour
    title: "Beit Sahour: no taxation without representation"
    title_ar: "بيت ساحور: لا ضرائب بلا تمثيل"
    text: "Answering the Unified Leadership's call, the people of Beit Sahour refused to pay taxes to the Israeli administration or to file tax returns, under the slogan \"no taxation without representation\". On 20 September 1989 the army put the town under siege and curfew, cut its phone lines, blocked food and tried to keep reporters out, and defence minister Rabin said, \"We are going to teach them a lesson.\" In house-to-house raids soldiers seized property worth more than 1.5 million dollars by Israeli figures, 40 merchants were arrested, and the consuls of seven European states were barred from entering. The siege was lifted on 31 October, and on 7 November the United States vetoed a Security Council draft demanding the return of the seized property."
    text_ar: "استجابةً لدعوة القيادة الموحّدة، امتنع أهل بيت ساحور عن دفع الضرائب للإدارة الإسرائيلية وعن تقديم الإقرارات الضريبية، تحت شعار «لا ضرائب بلا تمثيل». وفي 20 أيلول 1989 فرض جيش الاحتلال على البلدة حصارًا وحظر تجول، وقطع خطوط الهاتف ومنع دخول الطعام وحاول منع الصحفيين، وقال وزير الدفاع رابين: «سنلقّنهم درسًا». وصادر الجنود في مداهمات البيوت ممتلكات تزيد قيمتها على 1.5 مليون دولار بحسب الأرقام الإسرائيلية، واعتُقل 40 تاجرًا، ومُنع قناصل سبع دول أوروبية من دخول البلدة. ورُفع الحصار في 31 تشرين الأول، وفي 7 تشرين الثاني استخدمت الولايات المتحدة حق النقض ضد مشروع قرار في مجلس الأمن يطالب بإعادة الممتلكات المصادرة."
