  - id: e1997_01_hebron_protocol
    title: "Al-Khalil divided"
    title_ar: "الخليل مقسومة"
    text: "On 17 January 1997 Netanyahu and Arafat signed the protocol on redeployment in al-Khalil (Hebron), dividing the city in two: H1, about 80% of the city, policed by the Palestinian police, and H2, the Old City and the neighbourhoods around it, where Israel kept powers over internal security and public order and a few hundred settlers live under army protection, 550 to 600 in 2005 by Al Jazeera's estimate. A large Palestinian majority still lives in both."
    text_ar: "في 17 كانون الثاني 1997 وقّع نتنياهو وعرفات بروتوكول إعادة الانتشار في الخليل، فقُسّمت المدينة إلى منطقتين: H1 وتشكّل نحو 80% من المدينة وتتولاها الشرطة الفلسطينية، وH2 التي تضمّ البلدة القديمة والأحياء المحيطة بها، وتبقى فيها لإسرائيل صلاحيات الأمن الداخلي والنظام العام، ويعيش فيها بضع مئات من المستوطنين في حماية جيش الاحتلال، قدّرتهم الجزيرة بما بين 550 و600 عام 2005. وما زالت أغلبية فلسطينية كبيرة تعيش في المنطقتين كلتيهما."
