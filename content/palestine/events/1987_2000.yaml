  - id: e1991_10_madrid
    title: "The Madrid Conference"
    title_ar: "مؤتمر مدريد"
    text: "From 30 October to 1 November 1991 Spain hosted the Madrid peace conference, co-sponsored by the United States and the Soviet Union. Palestinians attended inside a joint Jordanian-Palestinian delegation whose Palestinian members were headed by Dr Haidar Abdel-Shafi, after Yitzhak Shamir's government threatened to stay away if the delegation included PLO representatives, anyone from outside the West Bank and Gaza, or anyone from East al-Quds (East Jerusalem)."
    text_ar: "من 30 تشرين الأول إلى 1 تشرين الثاني 1991 استضافت إسبانيا مؤتمر مدريد للسلام برعاية الولايات المتحدة والاتحاد السوفياتي. وحضر الفلسطينيون ضمن وفد أردني فلسطيني مشترك، ترأّس الدكتور حيدر عبد الشافي جانبَه الفلسطيني، بعد أن هدّدت حكومة إسحاق شامير بالمقاطعة إن ضمّ الوفد ممثلين عن منظمة التحرير أو أحدًا من خارج الضفة وغزة أو من القدس الشرقية."
    scope: "national"
