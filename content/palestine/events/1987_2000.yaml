  - id: e1988_08_committees_banned
    title: "The popular committees are outlawed"
    title_ar: "اللجان الشعبية خارج القانون"
    text: "The popular committees in neighbourhoods and villages ran social services, popular teaching and farming cooperatives, and acted as the uprising's local governments. In mid-August 1988 the occupation authorities banned them: membership, attending a meeting, holding committee papers, including the Unified Leadership's communiqués, or giving a committee money became offences carrying up to ten years in prison. Everyone who took part in the cooperatives and committees now ran a higher risk of arrest."
    text_ar: "كانت اللجان الشعبية في الأحياء والقرى تدير الخدمات الاجتماعية والتعليم الشعبي والتعاونيات الزراعية، وكانت بمثابة حكومات محلية للانتفاضة. وفي منتصف آب 1988 حظرتها سلطات الاحتلال، فصارت العضوية فيها، أو حضور اجتماعاتها، أو حيازة وثائقها ومنها بيانات القيادة الموحّدة، أو التبرّع لها، جرائم عقوبتها السجن حتى عشر سنوات. وارتفع بذلك خطر الاعتقال على كل من شارك في التعاونيات واللجان."
    scope: "national"
    from: 1988-08-01
    to: 1988-09-01
    effects:
