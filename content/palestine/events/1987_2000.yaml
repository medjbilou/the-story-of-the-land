  - id: e1988_07_jordan
    title: "Jordan cuts its ties"
    title_ar: "الأردن يفكّ الارتباط"
    text: "On 31 July 1988 King Hussein announced that Jordan was cutting \"all legal and administrative ties\" with the West Bank, except its guardianship of the Muslim and Christian holy places in al-Quds (Jerusalem), and recognised the PLO as \"the sole legitimate representative of the Palestinian people\". Days earlier he had ended a 1.3 billion dollar development programme for the West Bank and dissolved the lower house of parliament, half of whose members represented West Bank constituencies. The decision ended West Bank Palestinians' status as Jordanian citizens, leaving them without the diplomatic protection of any sovereign state."
    text_ar: "في 31 تموز 1988 أعلن الملك حسين فكّ «جميع الروابط القانونية والإدارية» بين الأردن والضفة الغربية، باستثناء رعاية المقدسات الإسلامية والمسيحية في القدس، واعترف بمنظمة التحرير بوصفها «الممثل الشرعي الوحيد للشعب الفلسطيني». وقبل ذلك بأيام أوقف برنامجًا تنمويًا للضفة قيمته 1.3 مليار دولار، وحلّ مجلس النواب الذي كان نصف أعضائه يمثّلون دوائر في الضفة. وأنهى القرار وضعَ فلسطينيي الضفة بوصفهم مواطنين أردنيين، فبقوا بلا حماية دبلوماسية من أي دولة ذات سيادة."
    scope: "national"
