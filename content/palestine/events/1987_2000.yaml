  - id: e1996_09_tunnel
    title: "The tunnel uprising"
    title_ar: "هبّة النفق"
    text: "Around midnight on 23 September 1996 workers guarded by Israeli police opened a new exit from the Western Wall (al-Buraq Wall) tunnel onto the Via Dolorosa in the Old City of al-Quds (Jerusalem), a step Rabin and Peres had refused to take, and Mayor Ehud Olmert opened it formally the next morning. In the protests that followed, Palestinian security forces fought the Israeli army for the first time; about 70 Palestinians and 17 Israeli soldiers were killed in all, by the usual count. On 26 September alone the Palestinian Centre for Human Rights counted 64 Palestinians and 15 soldiers killed, and said Israeli soldiers fired first everywhere and used Cobra helicopter gunships in Rafah and Khan Yunis. Prime Minister Benjamin Netanyahu said afterwards that he did not regret opening the tunnel."
    text_ar: "قرابة منتصف ليل 23 أيلول 1996 فتح عمّال، تحرسهم شرطة الاحتلال، مخرجًا جديدًا لنفق حائط البراق على طريق الآلام في البلدة القديمة بالقدس، وهي خطوة كان رابين وبيريز قد رفضاها، وافتتحه رئيس بلدية الاحتلال في القدس إيهود أولمرت رسميًا صباح اليوم التالي. وفي الاحتجاجات التي تلت ذلك اشتبكت قوات الأمن الفلسطينية مع جيش الاحتلال للمرة الأولى، واستُشهد نحو 70 فلسطينيًا وقُتل 17 جنديًا إسرائيليًا في المجموع بحسب الحصيلة الشائعة. وفي يوم 26 أيلول وحده أحصى المركز الفلسطيني لحقوق الإنسان استشهاد 64 فلسطينيًا ومقتل 15 جنديًا، وقال إن جنود الاحتلال بادروا بإطلاق النار في كل مكان، واستخدموا مروحيات «كوبرا» الحربية في رفح وخان يونس. وقال رئيس الوزراء بنيامين نتنياهو بعد ذلك إنه غير نادم على فتح النفق."
