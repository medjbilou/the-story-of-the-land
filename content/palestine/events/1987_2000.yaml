  - id: e1994_03_hebron_curfew
    title: "Al-Khalil under curfew"
    title_ar: "الخليل تحت الحظر"
    text: "After the massacre the Israeli army put the roughly 170,000 Palestinians of al-Khalil (Hebron) under a tight curfew for almost two months, while settlers walked the streets carrying their weapons. The army ordered 520 Palestinian shops shut overnight, and they were still shut twenty years later; it closed Shuhada Street to Palestinian vehicles, and from 2000 to Palestinians altogether. On the Shamgar Commission's ruling the Ibrahimi Mosque was divided, giving settlers more than 65% of its interior and leaving Muslims about 35%, according to Al Jazeera."
    text_ar: "بعد المجزرة فرض جيش الاحتلال على نحو 170,000 فلسطيني في الخليل حظر تجول محكمًا دام قرابة شهرين، فيما كان المستوطنون يتجوّلون في الشوارع حاملين أسلحتهم. وأمر الجيش بإغلاق 520 محلًّا فلسطينيًا بين ليلة وضحاها، وبقيت مغلقة بعد عشرين عامًا، وأغلق شارع الشهداء أمام سيارات الفلسطينيين، ثم أمامهم كليًا ابتداءً من عام 2000. وبقرار من لجنة شمغار قسّمت سلطات الاحتلال الحرم الإبراهيمي، فخصّصت للمستوطنين أكثر من 65% من مساحته الداخلية وأبقت للمسلمين نحو 35%، بحسب الجزيرة."
