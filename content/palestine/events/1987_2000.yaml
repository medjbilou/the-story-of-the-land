  - id: e1993_09_oslo
    title: "Oslo: the Declaration of Principles"
    title_ar: "أوسلو: إعلان المبادئ"
    text: "On 13 September 1993 Mahmoud Abbas for the PLO and Shimon Peres for Israel signed the Declaration of Principles, known as Oslo I, in Washington, before Yasser Arafat, Yitzhak Rabin and US President Bill Clinton. The PLO recognised the State of Israel's right to exist and renounced violence; Israel recognised the PLO as the representative of the Palestinian people. Al-Quds (Jerusalem), refugees, settlements, security and borders were left to permanent status talks, and the text set no explicit halt to settlement building, over which Dr Haidar Abdel-Shafi broke with the negotiators. From the signing to the end of 1993 occupation forces killed 30 more Palestinians, B'Tselem counts."
    text_ar: "في 13 أيلول 1993 وقّع محمود عباس عن منظمة التحرير وشمعون بيريز عن إسرائيل في واشنطن إعلان المبادئ المعروف باتفاق أوسلو الأول، بحضور ياسر عرفات وإسحاق رابين والرئيس الأمريكي بيل كلينتون. واعترفت المنظمة بحق دولة إسرائيل في الوجود ونبذت العنف، أما إسرائيل فاعترفت بالمنظمة ممثلًا للشعب الفلسطيني. وأُرجئت القدس واللاجئون والمستوطنات والأمن والحدود إلى مفاوضات الوضع النهائي، ولم يتضمّن النص وقفًا صريحًا للاستيطان، ولهذا انفصل الدكتور حيدر عبد الشافي عن الوفد المفاوض. ومن توقيع الاتفاق حتى نهاية 1993 قتلت قوات الاحتلال 30 فلسطينيًا آخرين، بحسب بتسيلم."
