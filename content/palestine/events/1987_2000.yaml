        outcome: "The father handed the committee notebook back to his neighbour, saying he had young children, and the neighbour nodded."
        outcome_ar: "أعاد الأب دفتر اللجنة إلى جاره، وقال إن عنده أولادًا صغارًا، فهزّ الجار رأسه."
