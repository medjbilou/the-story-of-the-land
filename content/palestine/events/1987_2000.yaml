  - id: e1988_06_new_visions
    title: "Art from the land's own materials"
    title_ar: "الفن بمواد الأرض"
    text: "During the First Intifada the painter Sliman Mansour, Vera Tamari and others founded the New Visions group, which made its work from mud, henna and other local materials as part of the boycott. Israeli military orders banned the Palestinian flag and even its colours in art, and the ban stayed in place until Oslo in 1993."
    text_ar: "خلال الانتفاضة الأولى شارك الفنان سليمان منصور مع فيرا تماري وآخرين في تأسيس جماعة «رؤى جديدة»، التي صنعت أعمالها من الطين والحنّاء ومواد محلية أخرى في إطار المقاطعة. وكانت الأوامر العسكرية الإسرائيلية تحظر العلم الفلسطيني، بل حتى ألوانه في الفن، وظلّ الحظر قائمًا حتى أوسلو عام 1993."
