events:
  - id: e1987_12_jabalia
    title: "The uprising begins in Jabalia"
    title_ar: "الانتفاضة تبدأ من مخيم جباليا"
    text: "By December 1987 the West Bank and Gaza had lived twenty years under Israeli military occupation: land expropriation, deportations, house demolitions, detention without trial. In November settlers had shot dead a 17-year-old schoolgirl, Intisar al-Attar, in her schoolyard in Deir al-Balah. On 8 December an Israeli truck hit a car carrying Palestinian workers at the Erez checkpoint, killing four, three of them from Jabalia camp; many Palestinians saw it as revenge for the stabbing of an Israeli in Gaza two days earlier, which Israel denied. On 9 December occupation soldiers fired on protesters in Jabalia, killing Hatem al-Sisi, seventeen by most accounts, and wounding sixteen, and the uprising spread across Gaza and into the West Bank."
    text_ar: "بحلول كانون الأول 1987 كانت الضفة الغربية وقطاع غزة قد أمضيا عشرين عامًا تحت الاحتلال العسكري الإسرائيلي: مصادرة للأراضي وإبعاد وهدم للبيوت واعتقال بلا محاكمة. وفي تشرين الثاني استُشهدت الطالبة انتصار العطار، 17 عامًا، برصاص مستوطنين في ساحة مدرستها في دير البلح. وفي 8 كانون الأول صدمت شاحنة إسرائيلية عند حاجز بيت حانون (إيرز) سيارةً تقلّ عمالًا فلسطينيين، فقتلت أربعة منهم، ثلاثة من مخيم جباليا، ورأى فيها كثير من الفلسطينيين انتقامًا لطعن رجل إسرائيلي في غزة قبل يومين، وهو ما نفته إسرائيل. وفي 9 كانون الأول أطلق جنود الاحتلال النار على المحتجّين في جباليا، فاستُشهد حاتم السيسي، وهو في السابعة عشرة بحسب أكثر الروايات، وأصيب ستة عشر آخرون، وامتدّت الانتفاضة إلى غزة كلها ثم إلى الضفة الغربية."
