  - id: e1988_10_eighteen_cows
    title: "The eighteen cows"
    title_ar: "البقرات الثماني عشرة"
    text: "During the uprising the people of Beit Sahour bought 18 cows from a sympathetic Jewish kibbutz and sent a university student abroad to consult on dairy farming, so that their town would have its own milk. The occupation army declared the cooperative a threat to national security and ordered it closed. The townspeople hid the cows, sometimes inside their homes, and handed out the milk in secret for four years, a story told in the 2014 documentary The Wanted 18."
    text_ar: "خلال الانتفاضة اشترى أهالي بيت ساحور 18 بقرة من كيبوتس يهودي متعاطف، وأرسلوا طالبًا جامعيًا إلى الخارج ليستشير خبراء في تربية الأبقار، ليكون لبلدتهم حليبها الخاص. وأعلن جيش الاحتلال التعاونية خطرًا على الأمن القومي وأمر بإغلاقها. فخبّأ الأهالي الأبقار، أحيانًا داخل البيوت، ووزّعوا حليبها سرًّا أربع سنوات، وروى الفيلم الوثائقي «المطلوبون الـ18» (2014) قصتها."
    scope: "region:beit_sahour"
