  - id: e1989_12_demolitions
    title: "The demolished houses"
    title_ar: "البيوت المهدومة"
    text: "Since the uprising began Israel has been demolishing or sealing the homes of Palestinian families as punishment for acts blamed on one of their members, by administrative order with no evidence put before a judge. B'Tselem counts 125 houses totally demolished this way in 1988 and 144 in 1989, and calls the practice collective punishment that strikes whole families; in the uprising's first ten years, it says, Israeli forces totally demolished at least 447 houses as punishment and sealed at least 294. Alongside this, between 1987 and 1997 the authorities would demolish more than 1,800 houses in the West Bank for being built without a permit, leaving more than 10,000 Palestinians homeless."
    text_ar: "منذ بداية الانتفاضة تهدم سلطات الاحتلال بيوت عائلات فلسطينية أو تغلقها عقابًا على أفعال نُسبت إلى أحد أفرادها، بأوامر إدارية لا تُعرض فيها أي أدلة على قاضٍ. وتُحصي منظمة بتسيلم 125 بيتًا هُدمت كليًا بهذه الطريقة عام 1988 و144 عام 1989، وتصف هذا الهدم بأنه عقاب جماعي يصيب عائلات بأكملها، وتقول إن القوات الإسرائيلية هدمت في السنوات العشر الأولى من الانتفاضة 447 بيتًا على الأقل هدمًا كليًا عقابًا، وأغلقت 294 بيتًا على الأقل. وإلى جانب ذلك ستهدم هذه السلطات في الضفة الغربية، بين 1987 و1997، أكثر من 1,800 بيت بحجة البناء دون ترخيص، فيبقى أكثر من 10,000 فلسطيني بلا مأوى."
