  - id: e1994_05_cairo
    title: "The Cairo Agreement: Gaza and Ariha first"
    title_ar: "اتفاق القاهرة: غزة وأريحا أولًا"
    text: "On 4 May 1994 Arafat and Rabin signed the Gaza–Jericho Agreement in Cairo, which created the Palestinian Authority, and Israel undertook to withdraw partly from the Ariha (Jericho) area and the Gaza Strip within three weeks. The occupation army stayed at the Rafah crossing and in the settlements inside the Strip, and the agreement's economic protocol, signed in Paris, in effect bound the Palestinian economy into Israel's. The same month, the night curfew imposed on Gaza since May 1988 came to an end."
    text_ar: "في 4 أيار 1994 وقّع عرفات ورابين في القاهرة اتفاق غزة–أريحا، الذي أنشأ السلطة الوطنية الفلسطينية، وتعهّدت إسرائيل بالانسحاب جزئيًا من منطقة أريحا ومن قطاع غزة خلال ثلاثة أسابيع. وبقي جيش الاحتلال عند معبر رفح وفي المستوطنات داخل القطاع، وأدمج البروتوكول الاقتصادي الملحق بالاتفاق، الموقَّع في باريس، الاقتصادَ الفلسطيني فعليًا في الاقتصاد الإسرائيلي. وفي الشهر نفسه انتهى حظر التجول الليلي المفروض على غزة منذ أيار 1988."
