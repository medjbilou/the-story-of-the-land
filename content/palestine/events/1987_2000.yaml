  - id: e1990_10_aqsa
    title: "Killings at al-Haram al-Sharif"
    title_ar: "الدم في الحرم القدسي"
    text: "On 8 October 1990, the day the Temple Mount Faithful announced they would lay a cornerstone for a \"Third Temple\", Israeli security forces killed 17 to 21 Palestinians at al-Haram al-Sharif and wounded more than 150, according to the UN Secretary-General's report, and more than 20 Israeli civilians and police were hurt. Israel says Palestinians planned the clash with stones brought in beforehand; Palestinians say they threw stones only after police opened fire with live ammunition and tear gas. In Resolution 672 the Security Council condemned the violence, especially that of the Israeli forces; Israel rejected the resolution and refused to receive the Secretary-General's mission."
    text_ar: "في 8 تشرين الأول 1990، يوم أعلنت جماعة «أمناء جبل الهيكل» أنها ستضع حجر الأساس لـ«هيكل ثالث»، قتلت قوات الأمن الإسرائيلية في الحرم القدسي الشريف ما بين 17 و21 فلسطينيًا وأصابت أكثر من 150، بحسب تقرير الأمين العام للأمم المتحدة، فيما أصيب أكثر من 20 مدنيًا وشرطيًا إسرائيليًا. وتقول إسرائيل إن الفلسطينيين دبّروا المواجهة بحجارة أدخلوها مسبقًا، ويقول الفلسطينيون إنهم لم يرشقوا الحجارة إلا بعد أن بدأت الشرطة إطلاق الذخيرة الحية والغاز المسيل للدموع. وأدان مجلس الأمن في القرار 672 أعمال العنف، ولا سيما ما ارتكبته القوات الإسرائيلية، فرفضت إسرائيل القرار ورفضت استقبال بعثة الأمين العام."
