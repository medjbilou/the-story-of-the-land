  - id: e1991_01_gulf_curfew
    title: "The Gulf War curfew"
    title_ar: "حظر التجول في حرب الخليج"
    text: "As the Gulf War began, on 16 January 1991 the occupation army put the Gaza Strip under a round-the-clock curfew, and the West Bank the next day, confining about 1.7 million Palestinians to their homes, according to Human Rights Watch. The curfew was lifted for short spells every few days to buy supplies, did not apply to settlers, and lasted in most areas until March. Workers could not reach their jobs in Israel and many lost them for good, and the schools were shut. Human Rights Watch said the curfew appeared to be collective punishment; the Israeli government said it was to prevent unrest and attacks."
    text_ar: "مع اندلاع حرب الخليج فرض جيش الاحتلال في 16 كانون الثاني 1991 حظر تجول على مدار الساعة على قطاع غزة، ثم على الضفة الغربية في اليوم التالي، فحُبس نحو 1.7 مليون فلسطيني في بيوتهم بحسب هيومن رايتس ووتش. وكان الحظر يُرفع لفترات قصيرة كل بضعة أيام لشراء الحاجات، ولم يكن يسري على المستوطنين، واستمر في معظم المناطق حتى آذار. ومُنع العمال من الوصول إلى أعمالهم داخل إسرائيل فخسر كثيرون منهم وظائفهم نهائيًا، وأُغلقت المدارس. وقالت هيومن رايتس ووتش إن الحظر بدا عقابًا جماعيًا، فيما زعمت حكومة الاحتلال أنه لمنع الاضطرابات والهجمات."
