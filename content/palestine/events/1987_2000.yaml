  - id: e1988_04_beita
    title: "Beita"
    title_ar: "بيتا"
    text: "On 6 April 1988 a group of teenage settlers from Elon Moreh, hiking with two armed guards, walked onto the land of Beita near Nablus, where one guard, Romam Aldubi, already banned by the army from Nablus, shot dead the farmer Mousa Saleh Bani Shamseh. In the village a crowd confronted the group and took the guards' guns, while other villagers tried to hide the Israeli youths, and the settler Tirza Porat, 15, was killed. Her death was first blamed on stone throwers, but the next day the army said she had been shot in the head by Aldubi's own rifle. Knowing this, the army still blew up 15 buildings in Beita, killed the teenager Issam Abdul Halim Mohammad Said, arrested all the adult men and deported six of them, while the charges against Aldubi were dropped."
    text_ar: "في 6 نيسان 1988 دخلت مجموعة من الفتية المستوطنين من «إيلون موريه»، في رحلة مشي يرافقها حارسان مسلحان، أراضي بلدة بيتا قرب نابلس، وهناك قتل أحد الحارسين، رومام ألدوبي، الممنوع أصلًا بأمر من الجيش من دخول نابلس، المزارعَ موسى صالح بني شمسة. وفي البلدة واجه الأهالي المجموعة وانتزعوا سلاح الحارسين، فيما حاول أهالٍ آخرون إخفاء الفتية الإسرائيليين، وقُتلت المستوطِنة تيرزا بورات، 15 عامًا. ونُسب موتها أولًا إلى راشقي الحجارة، ثم أعلن الجيش في اليوم التالي أنها أصيبت في رأسها برصاص بندقية ألدوبي نفسه. ومع علم جيش الاحتلال بذلك نسف 15 مبنى في بيتا، وقتل الفتى عصام عبد الحليم محمد سعيد، واعتقل جميع رجالها البالغين، وأبعد ستة منهم، فيما أُسقطت التهم عن ألدوبي."
