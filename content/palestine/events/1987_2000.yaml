  - id: e1988_03_home_economy
    title: "Victory gardens"
    title_ar: "حدائق النصر"
    text: "With the boycott of Israeli goods and of work in the settlements, families began growing vegetables at home and on rooftops, and women founded farming cooperatives known as \"victory gardens\". The Palestinian Agricultural Relief Committee handed out hundreds of thousands of seed packets by mid-1988, and a family with two goats, a few chickens and some rabbits could produce its own milk, eggs and meat. The occupation authorities moved against this home economy: they closed town markets, banned the movement of produce between Palestinian districts and bulldozed fields."
    text_ar: "مع مقاطعة البضائع الإسرائيلية والامتناع عن العمل في المستوطنات، أخذت العائلات تزرع الخضار في البيوت وعلى الأسطح، وأسّست النساء تعاونيات زراعية سُمّيت «حدائق النصر». ووزّعت لجنة الإغاثة الزراعية الفلسطينية مئات الآلاف من رزم البذور بحلول منتصف 1988، وصارت عائلة تملك عنزتين وبضع دجاجات وأرانب قادرة على إنتاج حليبها وبيضها ولحمها. وتحرّكت سلطات الاحتلال ضد هذا الاقتصاد المنزلي، فأغلقت أسواق البلدات، ومنعت نقل المحاصيل بين المناطق الفلسطينية، وجرّفت حقولًا."
