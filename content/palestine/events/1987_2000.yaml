  - id: e1988_01_leaflets
    title: "Communiqué No. 1"
    title_ar: "البيان رقم 1"
    text: "On 8 January 1988 the first communiqué of the Unified National Leadership of the Uprising appeared, an underground body that brought together Fatah, the Popular and Democratic Fronts and the Palestinian Communist Party, while Hamas and Islamic Jihad stayed outside it. The numbered communiqués were passed around in secret in towns, villages and camps, setting strike days and calling for a boycott of Israeli goods and a refusal to pay taxes to the Israeli administration. They were drafted in consultation with local popular committees, which ran social services and acted as local governments."
    text_ar: "في 8 كانون الثاني 1988 صدر البيان الأول للقيادة الوطنية الموحّدة للانتفاضة، وهي إطار سرّي جمع حركة فتح والجبهتين الشعبية والديمقراطية والحزب الشيوعي الفلسطيني، فيما بقيت حركتا حماس والجهاد الإسلامي خارجه. وصارت البيانات المرقّمة تُوزَّع سرًّا في المدن والقرى والمخيمات، فتحدّد أيام الإضراب وتدعو إلى مقاطعة البضائع الإسرائيلية والامتناع عن دفع الضرائب للإدارة الإسرائيلية. وكانت تُصاغ بالتشاور مع اللجان الشعبية المحلية التي أدارت الخدمات الاجتماعية وكانت بمثابة حكومات محلية."
    scope: "national"
