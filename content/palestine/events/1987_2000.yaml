  - id: e1993_04_closure
    title: "Closure and permits"
    title_ar: "الإغلاق والتصاريح"
    text: "Since 1991 Israel has kept the occupied territories under an open-ended closure, and every Palestinian who wants to enter Israel needs a special permit, whether a worker, a patient needing treatment or a traveller flying abroad. The number of work permits rises and falls with political considerations, and when a \"total closure\" is imposed after attacks or on Jewish holidays, every permit is cancelled. The closure cut the Gaza Strip off from the West Bank and kept people from both out of East al-Quds (East Jerusalem), the centre of their medical, economic, religious and educational life."
    text_ar: "منذ عام 1991 تفرض إسرائيل على الأراضي المحتلة إغلاقًا غير محدّد المدة، وصار على كل فلسطيني يريد دخول إسرائيل أن يحمل تصريحًا خاصًا، عاملًا كان أو مريضًا يحتاج إلى العلاج أو مسافرًا عبر المطار. ويرتفع عدد تصاريح العمل وينخفض بحسب الاعتبارات السياسية، وحين يُفرض «الإغلاق الشامل» بعد الهجمات وفي الأعياد اليهودية تُلغى التصاريح كلها. وفصل الإغلاق قطاع غزة عن الضفة الغربية، ومنع أهلهما من دخول القدس الشرقية، مركز حياتهم الطبية والاقتصادية والدينية والتعليمية."
    scope: "national"
