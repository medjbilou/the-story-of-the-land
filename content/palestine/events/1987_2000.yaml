  - id: e1992_12_marj_al_zuhur
    title: "The deportees of Marj al-Zuhur"
    title_ar: "المبعَدون إلى مرج الزهور"
    text: "On 17 December 1992 Israel deported 415 Palestinians from the West Bank and Gaza in one operation to South Lebanon, handcuffed and blindfolded; Lebanon refused them entry, and they spent the winter in a tent camp at Marj al-Zuhur. B'Tselem says the orders were signed at night, some after the deportation had begun, that no evidence was presented against any of the deportees, and that the deportation plainly breached international law. The next day the Security Council unanimously demanded their safe and immediate return in Resolution 799; this brought the number deported since the uprising began to 481."
    text_ar: "في 17 كانون الأول 1992 أبعدت سلطات الاحتلال 415 فلسطينيًا من الضفة الغربية وقطاع غزة دفعة واحدة إلى جنوب لبنان، مكبّلي الأيدي معصوبي الأعين، فمنعتهم السلطات اللبنانية من الدخول، فبقوا في مخيم من الخيام في مرج الزهور طوال الشتاء. وتقول منظمة بتسيلم إن أوامر الإبعاد وُقّعت ليلًا، بعضها بعد أن بدأ الإبعاد فعلًا، وإنه لم تُقدَّم أدلة ضد أي من المبعَدين، وإن الإبعاد يخالف القانون الدولي صراحةً. وفي اليوم التالي طالب مجلس الأمن بالإجماع في القرار 799 بعودتهم الفورية والآمنة، وبهذا الإبعاد بلغ عدد من أبعدتهم إسرائيل منذ بداية الانتفاضة 481 فلسطينيًا."
