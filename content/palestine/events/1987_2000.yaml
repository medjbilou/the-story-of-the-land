  - id: e1995_11_rabin
    title: "Rabin is assassinated"
    title_ar: "اغتيال رابين"
    text: "On the evening of 4 November 1995, at the end of a rally in support of the Oslo Accords in Kings of Israel Square in Tel Aviv, the far-right student Yigal Amir assassinated Israeli prime minister Yitzhak Rabin because he opposed the accords. His successor Shimon Peres called early elections for May 1996 and narrowly lost them to Benjamin Netanyahu."
    text_ar: "مساء 4 تشرين الثاني 1995، في ختام مهرجان مؤيد لاتفاقات أوسلو في ساحة ملوك إسرائيل بتل أبيب، اغتال الطالب اليميني المتطرف يغآل عمير رئيسَ الوزراء الإسرائيلي إسحاق رابين، رفضًا لتلك الاتفاقات. ودعا خلفه شمعون بيريز إلى انتخابات مبكرة في أيار 1996، فخسرها بفارق ضئيل أمام بنيامين نتنياهو."
