  - id: e2000_09_toll
    title: "Thirteen years' toll"
    title_ar: "حصيلة ثلاثة عشر عامًا"
    text: "B'Tselem, the Israeli human rights group, counts 1,376 Palestinians killed by Israeli security forces in the occupied territories between 9 December 1987 and 28 September 2000, 281 of them minors, and 115 killed by Israeli civilians, 23 of them minors. Over the same period it counts 94 Israeli civilians and 91 members of the Israeli security forces killed by Palestinians in the occupied territories, and 177 civilians and 59 security personnel killed inside Israel. Palestinians accused of collaborating with Israel were also killed by Palestinians: 830 to April 1996 by the Associated Press's count, and 1,068 to November 1997 by the Israeli army's claim, B'Tselem reports; it also counts 28 Palestinians killed by collaborators whom Israel had armed."
    text_ar: "تُحصي منظمة بتسيلم الإسرائيلية لحقوق الإنسان، بين 9 كانون الأول 1987 و28 أيلول 2000، 1,376 فلسطينيًا قتلتهم قوات الأمن الإسرائيلية في الأراضي المحتلة، بينهم 281 قاصرًا، و115 قتلهم مدنيون إسرائيليون، بينهم 23 قاصرًا. وتُحصي للفترة نفسها 94 مدنيًا إسرائيليًا و91 من أفراد قوات الأمن الإسرائيلية قتلهم فلسطينيون في الأراضي المحتلة، و177 مدنيًا و59 من أفراد الأمن قُتلوا داخل إسرائيل. وقتل فلسطينيون أيضًا فلسطينيين اتُّهموا بالتعاون مع إسرائيل: 830 حتى نيسان 1996 بحسب إحصاء وكالة أسوشيتد برس، و1,068 حتى تشرين الثاني 1997 بحسب ما يزعمه الجيش الإسرائيلي، كما تنقل بتسيلم، التي تُحصي كذلك 28 فلسطينيًا قتلهم متعاونون سلّحتهم إسرائيل."
