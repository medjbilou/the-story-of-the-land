  - id: e2000_01_settlements
    title: "Settlements in the Oslo years"
    title_ar: "الاستيطان في سنوات أوسلو"
    text: "When Oslo I was signed in 1993 there were 110,066 settlers in the West Bank and 6,234 in the Gaza Strip, according to the Israeli group Peace Now. At the end of 1999 the West Bank settler population, excluding East al-Quds (East Jerusalem), stood at 177,411 by the count of Israel's own Central Bureau of Statistics, although Oslo II bound both sides not to take any step that would change the status of the West Bank and Gaza before the permanent status talks were concluded. B'Tselem says that the authorities who demolish Palestinian homes for lacking a permit do not demolish houses in the settlements, and have retroactively approved thousands built there without permits."
    text_ar: "حين وُقّع اتفاق أوسلو الأول عام 1993 كان في الضفة الغربية 110,066 مستوطنًا وفي قطاع غزة 6,234، بحسب حركة «السلام الآن» الإسرائيلية. وفي نهاية 1999 بلغ عدد المستوطنين في الضفة، من دون القدس الشرقية، 177,411 بحسب دائرة الإحصاء المركزية الإسرائيلية نفسها، مع أن اتفاق أوسلو الثاني ألزم الطرفين بألّا يتخذ أيٌّ منهما خطوة تغيّر وضع الضفة الغربية وقطاع غزة قبل أن تنتهي مفاوضات الوضع النهائي. وتقول منظمة بتسيلم إن سلطات الاحتلال التي تهدم البيوت الفلسطينية بحجة البناء دون ترخيص لا تهدم بيوت المستوطنات، بل أقرّت بأثر رجعي آلاف البيوت التي بُنيت فيها دون ترخيص."
