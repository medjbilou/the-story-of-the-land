  - id: e1996_01_elections
    title: "The first Palestinian general election"
    title_ar: "أول انتخابات فلسطينية عامة"
    text: "On 20 January 1996 Palestinians in the West Bank and Gaza elected a president and an 88-member Legislative Council, with turnout of about 72% of registered voters. Yasser Arafat won 88.1% of the vote by the figures the Central Elections Commission announced, against 9.3% for his only rival, Samiha Khalil, and Fatah won 50 seats. Hamas boycotted the election, seeing participation as lending legitimacy to the Palestinian Authority."
    text_ar: "في 20 كانون الثاني 1996 انتخب الفلسطينيون في الضفة الغربية وقطاع غزة رئيسًا ومجلسًا تشريعيًا من 88 عضوًا، وبلغت نسبة المشاركة نحو 72% من الناخبين المسجّلين. وفاز ياسر عرفات بنسبة 88.1% من الأصوات بحسب الأرقام التي أعلنتها لجنة الانتخابات المركزية، مقابل 9.3% لمنافسته الوحيدة سميحة خليل، وفازت حركة فتح بخمسين مقعدًا. وقاطعت حركة حماس الانتخابات، لأنها رأت في المشاركة إضفاءً للشرعية على السلطة الفلسطينية."
