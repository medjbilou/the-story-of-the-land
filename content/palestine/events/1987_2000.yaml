  - id: e1994_04_afula
    title: "The Afula and Hadera bombings"
    title_ar: "تفجيرا العفولة والخضيرة"
    text: "On 6 April 1994 Raed Zakarneh, 19, from Qabatiya, detonated a car bomb he was driving beside a bus taking on passengers in Afula, killing himself and eight Israeli civilians and wounding 34, according to Human Rights Watch, which calls it the first Hamas suicide bombing against Israeli civilians. Hamas claimed the attack as revenge for the Ibrahimi Mosque massacre, and on 13 April carried out a second bombing, on a bus in Hadera."
    text_ar: "في 6 نيسان 1994 فجّر رائد زكارنة، 19 عامًا، من قباطية، سيارةً مفخخة كان يقودها بجانب حافلة كان ركابٌ يصعدون إليها في العفولة، فقُتل معه ثمانية مدنيين إسرائيليين وجُرح 34، بحسب هيومن رايتس ووتش التي تعدّه أول تفجير انتحاري تنفّذه حماس ضد مدنيين إسرائيليين. وتبنّت حركة حماس الهجوم، وقالت إنه انتقام لمجزرة الحرم الإبراهيمي، ثم نفّذت في 13 نيسان تفجيرًا ثانيًا في حافلة في الخضيرة."
