  - id: e2000_07_camp_david
    title: "Camp David"
    title_ar: "كامب ديفيد"
    text: "From 11 to 25 July 2000 US President Bill Clinton brought Israeli prime minister Ehud Barak and Palestinian Authority chairman Yasser Arafat together at Camp David, and the summit ended without agreement. Al-Quds (Jerusalem) and al-Haram al-Sharif were the main sticking point, along with refugees and the right of return, borders and settlements. Accounts of the Israeli offer differ: some describe a state on about 73% of the West Bank rising to about 92% over 10–25 years, while Palestinians put the maximum at about 86% and saw the offer as inconsistent with Resolution 242. Israeli and US officials blamed Arafat for the failure, while Robert Malley and others argued that all three sides' strategies contributed."
    text_ar: "من 11 إلى 25 تموز 2000 جمع الرئيس الأمريكي بيل كلينتون رئيس الوزراء الإسرائيلي إيهود باراك ورئيس السلطة الفلسطينية ياسر عرفات في كامب ديفيد، وانتهت القمة دون اتفاق. وكانت القدس والحرم القدسي الشريف عقدة الخلاف الكبرى، إلى جانب اللاجئين وحق العودة والحدود والمستوطنات. وتختلف الروايات في العرض الإسرائيلي: يتحدث بعضها عن دولة على نحو 73% من الضفة تتّسع إلى نحو 92% خلال 10–25 عامًا، ويقدّر الفلسطينيون الحد الأقصى بنحو 86%، ورأوا العرض مخالفًا للقرار 242. وحمّل مسؤولون إسرائيليون وأمريكيون عرفات مسؤولية الفشل، فيما رأى روبرت مالي وآخرون أن استراتيجيات الأطراف الثلاثة كلها أسهمت فيه."
