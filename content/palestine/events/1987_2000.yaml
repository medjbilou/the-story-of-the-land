  - id: e1988_02_force_beatings
    title: "\"Force, might and beatings\""
    title_ar: "«القوة والجبروت والضرب»"
    text: "On 22 December 1987, in Resolution 605, the Security Council strongly deplored the Israeli army's opening of fire, which had killed and wounded defenceless Palestinian civilians. On 19 January 1988 Israel's defence minister Yitzhak Rabin declared that \"the first priority is to use force, might, beatings\" to put down the uprising. By 22 February Israeli forces had killed at least 59 Palestinians and beaten thousands, leaving many with fractures, according to the Washington Post. In late February a CBS crew filmed four soldiers beating the cousins Wael and Osamah Joudeh of Iraq al-Tayeh village near Nablus, and Wael says they broke their bones with stones. Rabin denied ordering bones to be broken, but an Israeli officer tried for beatings said Rabin had told him to do it."
    text_ar: "في 22 كانون الأول 1987 استنكر مجلس الأمن بشدة، في القرار 605، إطلاقَ الجيش الإسرائيلي النار على المدنيين الفلسطينيين العزّل وقتلَهم وجرحَهم. وفي 19 كانون الثاني 1988 أعلن وزير الدفاع الإسرائيلي إسحاق رابين أن «الأولوية الأولى هي استخدام القوة والجبروت والضرب» لقمع الانتفاضة. وبحلول 22 شباط كانت قوات الاحتلال قد قتلت 59 فلسطينيًا على الأقل، وضربت الآلاف وتسبّبت لكثيرين منهم بكسور، بحسب صحيفة واشنطن بوست. وفي أواخر شباط صوّر طاقم لشبكة «سي بي إس» أربعة جنود يضربون ابنَي العم وائل وأسامة جودة من قرية عراق التايه قرب نابلس، ويقول وائل إنهم كسروا عظامهما بالحجارة. ونفى رابين أنه أمر بتكسير العظام، لكن ضابطًا إسرائيليًا حوكم بتهمة الضرب قال إن رابين أمره بذلك."
    scope: "national"
