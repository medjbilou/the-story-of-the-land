  - id: e1988_01_shops
    title: "The war of the shops"
    title_ar: "حرب الدكاكين"
    text: "Commercial strikes began here and there in the first days of the uprising, and on 1 January 1988 Nablus declared a two-week strike. In late January the Unified Leadership let shops open for three set hours a day during commercial strikes, though not during general strikes, and pharmacies were exempt. The occupation army set out to break the strikes: soldiers smashed shop locks to force owners to open, confiscated keys and shopkeepers' documents, and at times forced shops shut during the opening hours."
    text_ar: "بدأت الإضرابات التجارية متفرّقة منذ الأيام الأولى للانتفاضة، ثم أعلنت نابلس إضرابًا لمدة أسبوعين في الأول من كانون الثاني 1988. وفي أواخر كانون الثاني سمحت القيادة الموحّدة للمحالّ بأن تفتح أبوابها ثلاث ساعات محدّدة كل يوم في أيام الإضراب التجاري، دون أيام الإضراب العام، واستُثنيت الصيدليات. وسعى جيش الاحتلال إلى كسر الإضراب، فحطّم الجنود أقفال المحالّ لإجبار أصحابها على فتحها، وصادروا مفاتيحها ووثائق أصحابها، وأغلقوها بالقوة أحيانًا في ساعات الفتح."
    scope: "national"
    from: 1988-01-01
