  - id: e1997_04_abu_ghneim
    title: "Jabal Abu Ghneim"
    title_ar: "جبل أبو غنيم"
    text: "On 19 February 1997 the Netanyahu government approved the Har Homa settlement on Jabal Abu Ghneim, on 1,850 dunams Israel had expropriated in 1991; building began in March, and Israel's Supreme Court rejected the landowners' petitions. ARIJ says 354 dunams of Umm Tuba's land were taken in 1997 and hundreds of dunams of Beit Sahour's land from that year on, and B'Tselem says that since 1967 Israel has expropriated more than a third of East al-Quds (East Jerusalem) and built some 40,000 housing units on it for Jews and not one for Palestinians. In March the United States vetoed two Security Council drafts calling for a halt to construction, and in April the General Assembly demanded an immediate halt by 134 votes to 3."
    text_ar: "في 19 شباط 1997 وافقت حكومة نتنياهو على بناء مستوطنة «هار حوما» على جبل أبو غنيم، فوق 1,850 دونمًا صادرتها سلطات الاحتلال عام 1991، وبدأت أعمال البناء في آذار، ورفضت المحكمة العليا الإسرائيلية التماسات الملّاك. ويقول معهد الأبحاث التطبيقية – القدس (أريج) إن 354 دونمًا من أراضي أم طوبا صودرت عام 1997، ومئات الدونمات من أراضي بيت ساحور ابتداءً من ذلك العام، فيما تقول بتسيلم إن إسرائيل صادرت منذ 1967 أكثر من ثلث القدس الشرقية وبنت عليه نحو 40,000 وحدة سكنية لليهود ولم تبنِ وحدة واحدة للفلسطينيين. وفي آذار استخدمت الولايات المتحدة حق النقض مرتين ضد مشروعَي قرار في مجلس الأمن يدعوان إلى وقف البناء، وفي نيسان طالبت الجمعية العامة بوقفه فورًا بأغلبية 134 صوتًا مقابل 3."
