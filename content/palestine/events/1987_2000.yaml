  - id: e1988_05_gaza_curfew
    title: "Gaza's nights under curfew"
    title_ar: "ليل غزة تحت الحظر"
    text: "From May 1988 the occupation army imposed a permanent night curfew on the Gaza Strip, and it would stay in force for six years, until the Palestinian Authority arrived in May 1994. In the West Bank towns and villages were put under curfew again and again; some villages spent more than a third of 1988 and 1989 under curfew, and food ran short. The curfew did not apply to settlers, and some used it to damage Palestinian property, according to B'Tselem."
    text_ar: "منذ أيار 1988 فرض جيش الاحتلال على قطاع غزة حظر تجول ليليًا دائمًا، وسيبقى ساريًا ست سنوات حتى دخول السلطة الفلسطينية في أيار 1994. وفي الضفة الغربية فُرض حظر التجول مرارًا على المدن والقرى، وبقيت بعض القرى تحت الحظر أكثر من ثلث أيام عامي 1988 و1989، فشحّ فيها الطعام. ولم يكن الحظر يسري على المستوطنين، واستغلّه بعضهم للإضرار بممتلكات فلسطينية، بحسب منظمة بتسيلم."
    scope: "region:gaza"
    place: gaza
