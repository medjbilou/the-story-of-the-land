    title: "Arafat in Gaza"
    title_ar: "عرفات في غزة"
    text: "On 1 July 1994 Yasser Arafat made a symbolic return to Ghazza (Gaza City), his first visit in 25 years. On 5 July he became president of the Palestinian Authority when it was formally inaugurated."
