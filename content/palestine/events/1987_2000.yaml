  - id: e1994_02_ibrahimi
    title: "The Ibrahimi Mosque massacre"
    title_ar: "مجزرة الحرم الإبراهيمي"
    text: "At dawn on 25 February 1994, in Ramadan, Baruch Goldstein, a settler doctor from Kiryat Arba and a member of the far-right Kach movement, entered the Ibrahimi Mosque in al-Khalil (Hebron) in army uniform, carrying an army-issued rifle, and the guards let him pass. He fired on the worshippers at dawn prayer, killing 29, six of them children aged 14 or under, and wounding 100 to 125 until survivors overpowered and killed him. Soldiers then killed more Palestinians outside the mosque, at al-Ahli hospital and in the cemetery; locals put the day's dead at 50 to 70, Al Jazeera reported. Israel's Shamgar Commission said he acted alone; some survivors speak of a second gunman. Resolution 904 called for the disarming of settlers; Israel banned Kach but refused the PLO's demand to disarm all settlers."
    text_ar: "فجر 25 شباط 1994، في شهر رمضان، دخل باروخ غولدشتاين، وهو طبيب مستوطن من «كريات أربع» وعضو في حركة «كاخ» اليمينية المتطرفة، الحرمَ الإبراهيمي في الخليل ببزّته العسكرية حاملًا بندقية تسلّمها من الجيش، فتركه الحرّاس يمرّ. وأطلق النار على المصلّين في صلاة الفجر، فقتل 29 منهم، بينهم ستة أطفال في الرابعة عشرة أو دونها، وجرح ما بين 100 و125، حتى تغلّب عليه الناجون وقتلوه. ثم قتل جنود الاحتلال مزيدًا من الفلسطينيين خارج المسجد وعند المستشفى الأهلي وفي المقبرة، ويقدّر الأهالي شهداء ذلك اليوم بما بين 50 و70، بحسب الجزيرة. وخلصت لجنة شمغار الإسرائيلية إلى أنه تصرّف وحده، فيما يتحدث بعض الناجين عن مسلح ثانٍ. ودعا مجلس الأمن في القرار 904 إلى نزع سلاح المستوطنين، وحظرت إسرائيل حركة «كاخ»، لكنها رفضت مطلب منظمة التحرير بنزع سلاح المستوطنين جميعًا."
