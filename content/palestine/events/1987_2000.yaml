  - id: e1990_05_rishon
    title: "The Rishon LeZion massacre"
    title_ar: "مجزرة عيون قارة"
    text: "On the morning of 20 May 1990 Ami Popper, a discharged Israeli soldier in army trousers, carrying an army rifle stolen from his brother, a serving soldier, opened fire on Palestinian workers from the Gaza Strip waiting at a pick-up point in Rishon LeZion for rides to their jobs, killing seven of them and wounding 10–11. The dead were aged 22 to 36; five were from Khan Yunis and two from Rafah. Israeli forces putting down the protests that swept the occupied territories killed seven more Palestinians, among them a 14-year-old boy, and after a week of clashes the Palestinian toll stood at 19 dead and about 700 injured. In 1991 Popper was given seven life sentences, reduced in 1999 to 40 years."
    text_ar: "صباح 20 أيار 1990 أطلق عامي بوبر، وهو جندي إسرائيلي مسرَّح من الخدمة يرتدي بنطال الجيش ويحمل بندقية عسكرية سرقها من أخيه الجندي في الخدمة، النارَ على عمال فلسطينيين من قطاع غزة كانوا ينتظرون عند موقف في ريشون لتسيون (عيون قارة) من يقلّهم إلى أعمالهم، فقتل سبعة منهم وجرح 10–11. وكان الشهداء بين الثانية والعشرين والسادسة والثلاثين من العمر، خمسة منهم من خان يونس واثنان من رفح. وعمّت الاحتجاجات الأراضي المحتلة، فقتلت قوات الاحتلال وهي تقمعها سبعة فلسطينيين آخرين بينهم فتى في الرابعة عشرة، وبعد أسبوع من المواجهات بلغت حصيلة الشهداء الفلسطينيين 19 والجرحى نحو 700. وحُكم على بوبر عام 1991 بسبعة أحكام بالسجن المؤبد، ثم خُفّف الحكم عام 1999 إلى 40 عامًا."
