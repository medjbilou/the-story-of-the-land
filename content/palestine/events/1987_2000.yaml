  - id: e1988_04_abu_jihad
    title: "Abu Jihad is assassinated"
    title_ar: "اغتيال أبي جهاد"
    text: "Just after midnight on 16 April 1988 an Israeli commando force that had landed by sea stormed the home of Khalil al-Wazir, Abu Jihad, a founder of Fatah, in Tunis, and killed him along with his two bodyguards and the family's gardener. The naval commandos on the beach were led by Yoav Gallant, Israel's defence minister from 2022 to 2024, for whom the International Criminal Court issued an arrest warrant in November 2024 over alleged war crimes and crimes against humanity in Gaza. Accounts of what happened inside the house differ; one places his wife Intissar and son Nidal in the room. Israel did not acknowledge responsibility until November 2012, when its military censor cleared an Israeli newspaper to publish an account of the raid. In the protests that followed, occupation forces shot dead at least a dozen Palestinians, the worst toll of the uprising up to then."
    text_ar: "بُعيد منتصف ليل 16 نيسان 1988 اقتحمت قوة كوماندوز إسرائيلية نزلت من البحر بيتَ خليل الوزير «أبو جهاد»، أحد مؤسسي حركة فتح، في تونس، وقتلته مع حارسيه وبستاني البيت. وكان يقود الكوماندوز البحري على الشاطئ يوآف غالانت، الذي صار وزيرًا للدفاع في حكومة الاحتلال بين 2022 و2024، وأصدرت المحكمة الجنائية الدولية في تشرين الثاني 2024 مذكرة توقيف بحقه بتهم ارتكاب جرائم حرب وجرائم ضد الإنسانية في غزة. وتختلف الروايات في تفاصيل ما جرى داخل البيت، وتذكر إحداها أن زوجته انتصار وابنه نضال كانا في الغرفة. ولم تعترف إسرائيل بمسؤوليتها إلا في تشرين الثاني 2012، حين أجازت رقابتها العسكرية لصحيفة إسرائيلية نشر روايةٍ عن الاغتيال. وفي الاحتجاجات التي تلت ذلك قتلت قوات الاحتلال بالرصاص ما لا يقل عن اثني عشر فلسطينيًا، في أعنف أيام الانتفاضة حتى ذلك الحين."
