  - id: e1988_03_ketziot
    title: "Ansar 3"
    title_ar: "معتقل أنصار 3"
    text: "On 18 March 1988 the occupation army moved about 700 prisoners from Gaza's prisons to a new tent camp in the Negev desert, some 72 km south-west of Bir al-Sab' (Beersheba), which Palestinians called \"Ansar 3\". Hundreds held there were administrative detainees, jailed without charge or trial on six-month military orders renewable without limit; B'Tselem counts more than 18,000 such orders from the start of the uprising to November 1997. On 16 August 1988 two prisoners were shot dead during unrest involving some 1,000 prisoners, and the camp commander, who fired the shots that killed at least one of them, was cleared by an army inquiry. Human Rights Watch estimated that in 1990 the camp held about one in every 50 West Bank and Gaza men over sixteen, and Al Jazeera, citing B'Tselem, puts those arrested during the uprising at more than 175,000."
    text_ar: "في 18 آذار 1988 نقل جيش الاحتلال نحو 700 أسير من سجون غزة إلى معتقل خيام جديد في صحراء النقب، على بعد نحو 72 كيلومترًا جنوب غرب بئر السبع، سمّاه الفلسطينيون «أنصار 3». وكان مئات من المحتجزين فيه معتقلين إداريين، أي محتجزين بلا تهمة ولا محاكمة بأوامر عسكرية مدتها ستة أشهر قابلة للتجديد بلا حدّ، وتُحصي بتسيلم أكثر من 18,000 أمر اعتقال إداري منذ بداية الانتفاضة حتى تشرين الثاني 1997. وفي 16 آب 1988 استُشهد أسيران بالرصاص خلال احتجاج شارك فيه نحو 1,000 أسير، وكان قائد المعتقل قد أطلق الرصاص الذي قتل أحدهما على الأقل، فبرّأه تحقيق عسكري. وقدّرت هيومن رايتس ووتش أن المعتقل ضمّ عام 1990 نحو واحد من كل 50 رجلًا فوق السادسة عشرة في الضفة وغزة، فيما نقلت الجزيرة عن بتسيلم أن عدد من اعتُقلوا خلال الانتفاضة تجاوز 175,000."
