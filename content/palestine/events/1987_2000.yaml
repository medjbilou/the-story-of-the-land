        text_ar: "تبقى الأم في لجنة الحارة"
        outcome: "The committee met in a different kitchen each week, and the mother kept the minutes in her head rather than on paper."
        outcome_ar: "صارت اجتماعات اللجنة تُعقد في مطابخ مختلفة كل أسبوع، والأم تحفظ المحضر في رأسها لا على الورق."
