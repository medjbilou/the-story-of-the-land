  - id: e1988_11_declaration
    title: "The Declaration of Independence"
    title_ar: "إعلان الاستقلال"
    text: "On 15 November 1988, at the close of the 19th session of the Palestinian National Council in Algiers, Yasser Arafat read out the declaration of independence of the State of Palestine, written by the poet Mahmoud Darwish. The Council adopted it by 253 votes to 46, with 10 abstentions, and the declaration rests on UN General Assembly Resolution 181 of 1947. By mid-December about 75 states had recognised the new state, and the number would reach 93 by February 1989."
    text_ar: "في 15 تشرين الثاني 1988، في ختام الدورة التاسعة عشرة للمجلس الوطني الفلسطيني في الجزائر، تلا ياسر عرفات إعلان استقلال دولة فلسطين، الذي كتبه الشاعر محمود درويش. واعتمده المجلس بأغلبية 253 صوتًا مقابل 46 وامتناع 10 أعضاء عن التصويت، واستند الإعلان إلى قرار الجمعية العامة للأمم المتحدة رقم 181 لعام 1947. وبحلول منتصف كانون الأول اعترفت بالدولة نحو 75 دولة، وسيرتفع العدد إلى 93 بحلول شباط 1989."
    scope: "national"
    from: 1988-11-01
    to: 1988-12-01
    day: 15
    effects:
      - { target: solidarity, delta: 0.08 }
      - { target: memory, delta: 0.05 }
      - { target: sumud, delta: 0.05 }
      - { target: documents, delta: 0.02 }
    options:
      - id: listen_together
        text: "Gather round the radio to hear the declaration"
        text_ar: "نجتمع حول المذياع لنسمع الإعلان"
        outcome: "The grandfather turned the radio up as far as it would go, and wept when he heard Palestine read out as a state."
