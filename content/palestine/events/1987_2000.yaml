  - id: e1995_09_oslo2
    title: "Oslo II: Areas A, B and C"
    title_ar: "أوسلو الثاني: المناطق (أ) و(ب) و(ج)"
    text: "On 28 September 1995 Arafat and Rabin signed the Interim Agreement known as Oslo II in Washington, after the two sides first signed it in Taba on 24 September. It divided the West Bank into three areas. In the first phase Area A, run by the Palestinian Authority, covered about 3%, Area B, under shared control, about 23–25%, and Area C, under full Israeli control and holding all the settlements, about 72–74%; later redeployments brought the shares to about 18%, 22% and 60%. It provided for an elected Palestinian council and for permanent status talks to begin by 4 May 1996 at the latest."
    text_ar: "في 28 أيلول 1995 وقّع عرفات ورابين في واشنطن الاتفاق المرحلي المعروف باتفاق أوسلو الثاني، بعد أن وقّعه الطرفان أولًا في طابا في 24 أيلول. وقسّم الاتفاق الضفة الغربية إلى ثلاث مناطق: في المرحلة الأولى شملت المنطقة (أ)، التي تتولاها السلطة الفلسطينية، نحو 3%، والمنطقة (ب)، التي تتقاسم السلطة وإسرائيل السيطرة عليها، نحو 23–25%، والمنطقة (ج)، الخاضعة للسيطرة الإسرائيلية الكاملة والتي تضمّ المستوطنات كلها، نحو 72–74%، ثم صارت النسب بعد عمليات إعادة الانتشار اللاحقة نحو 18% و22% و60%. ونصّ على انتخاب مجلس فلسطيني، وعلى بدء مفاوضات الوضع النهائي في موعد أقصاه 4 أيار 1996."
