  - id: e1996_03_bombings_closure
    title: "The bus bombings and the closure"
    title_ar: "تفجيرات الحافلات والإغلاق"
    text: "On 5 January 1996 Israel's Shin Bet assassinated Yahya Ayyash, a leader of Hamas's armed wing, and Hamas then carried out a series of suicide bombings that it said avenged him. The bombing of the No. 18 bus in al-Quds (Jerusalem) on 25 February killed 17 civilians and 9 soldiers, a second on the same line on 3 March killed 16 civilians and 3 soldiers, and a third near Dizengoff Center in Tel Aviv on 4 March killed 13 people in a crowd that included many children in Purim costumes. B'Tselem says that after attacks the Israeli army imposes a total closure that cancels every permit, that in 1996 and 1997 it twice imposed an \"internal closure\" barring the people of every West Bank town and village from leaving it, and that in 1996 Israel went back to demolishing whole families' homes as punishment."
    text_ar: "في 5 كانون الثاني 1996 اغتال جهاز الشاباك الإسرائيلي يحيى عياش، أحد قادة الجناح العسكري لحركة حماس، ثم نفّذت الحركة سلسلة تفجيرات انتحارية قالت إنها ثأر له. وقتل تفجير الحافلة رقم 18 في القدس في 25 شباط 17 مدنيًا و9 جنود، وقتل تفجير ثانٍ على الخط نفسه في 3 آذار 16 مدنيًا و3 جنود، وقتل تفجير ثالث قرب مركز ديزنغوف في تل أبيب في 4 آذار 13 شخصًا وسط حشد ضمّ أطفالًا كثيرين بأزياء عيد المساخر. وتقول منظمة بتسيلم إن الجيش الإسرائيلي يفرض بعد الهجمات إغلاقًا شاملًا تُلغى فيه كل التصاريح، وإنه فرض عامي 1996 و1997 مرتين «إغلاقًا داخليًا» منع سكان كل بلدة وقرية في الضفة من مغادرتها، وإن إسرائيل عادت عام 1996 إلى هدم بيوت عائلات بأكملها عقابًا."
