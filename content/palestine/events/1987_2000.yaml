  - id: e1988_02_schools
    title: "Schools shut, lessons at home"
    title_ar: "المدارس مغلقة والدروس في البيوت"
    text: "On 10 January 1988 the Israeli military authorities closed Birzeit University, and it would not begin to reopen, faculty by faculty, until April 1992. In early February 1988 Israel ordered almost all Palestinian schools shut indefinitely; they stayed closed for about four months, and West Bank pupils lost 175 of 210 school days that year. Popular committees and neighbourhood women's committees organised secret classes in homes. The occupation authorities banned this popular teaching, and soldiers raided classes, detained teachers and students and confiscated books."
    text_ar: "في 10 كانون الثاني 1988 أغلقت سلطات الاحتلال العسكرية جامعة بيرزيت، ولن تبدأ إعادة فتحها، كليةً بعد كلية، إلا في نيسان 1992. وفي مطلع شباط 1988 أمرت إسرائيل بإغلاق جميع المدارس الفلسطينية تقريبًا إلى أجل غير مسمّى، فبقيت مغلقة نحو أربعة أشهر، وخسر تلاميذ الضفة 175 يومًا من أصل 210 أيام دراسية في ذلك العام. فنظّمت اللجان الشعبية ولجان النساء في الأحياء صفوفًا سرّية في البيوت. وحظر الاحتلال هذا التعليم الشعبي، فداهم الجنود الصفوف واعتقلوا معلمين وطلابًا وصادروا الكتب."
    scope: "national"
