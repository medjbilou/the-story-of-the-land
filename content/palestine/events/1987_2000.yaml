  - id: e1997_12_quiet_deportation
    title: "The \"quiet deportation\" from al-Quds"
    title_ar: "«الترحيل الصامت» من القدس"
    text: "For about two years Israel's Interior Ministry has been demanding that Palestinians in East al-Quds (East Jerusalem) produce many proofs that they live in the city and have lived there before, and revoking the residency of anyone who cannot, even of those who moved to a suburb only metres beyond the municipal border. By the ministry's own figures the residency of 4,480 Palestinians of al-Quds has been revoked, 1,295 of them in the past two years, and B'Tselem and HaMoked call the policy \"the quiet deportation\". Israeli citizens, by contrast, keep the right to come back to live in the city however long they have lived elsewhere."
    text_ar: "منذ نحو عامين تطالب وزارة الداخلية الإسرائيلية الفلسطينيين في القدس الشرقية بإثباتات كثيرة على أنهم يقيمون في المدينة وأقاموا فيها من قبل، وتسحب إقامة من يعجز عن تقديمها، حتى لو انتقل إلى ضاحية لا تبعد عن حدود البلدية سوى أمتار. وبحسب أرقام الوزارة نفسها سُحبت إقامة 4,480 فلسطينيًا مقدسيًا، منهم 1,295 في العامين الأخيرين، وتسمّي منظمتا بتسيلم وهموكيد هذه السياسة «الترحيل الصامت». أما المواطنون الإسرائيليون فيحتفظون بحقهم في العودة إلى العيش في المدينة مهما طالت إقامتهم خارجها."
