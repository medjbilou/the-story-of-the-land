  - id: e1956_10_kafr_qasim
    title: "The Kafr Qasim massacre"
    title_ar: "مجزرة كفر قاسم"
    text: "On 29 October 1956, on the eve of the tripartite attack on Egypt, Colonel Issachar Shadmi, the Zionist army brigade commander in charge of the area's Border Police, brought the nightly curfew on twelve Arab villages near the Jordanian border forward to 5 p.m. The mukhtar of Kafr Qasim was told at 4.30 p.m. and asked about some 400 villagers still in the fields who knew nothing of it. Border Police stopped those returning at the entrance to the village and shot them at close range, under orders that \"anyone leaving his home shall be shot; there shall be no arrests\": in about an hour they killed 49 villagers, among them children, women and an unborn child (some counts give 48: 19 men, 6 women and 23 children). All were citizens of Israel, and the military censor banned all reporting. In July 2022 the Military Court of Appeal unsealed hundreds of pages of the trial record, confirming a plan called \"Mole\" to terrorise the villagers and drive them out."
    text_ar: "في 29 تشرين الأول 1956، عشية العدوان الثلاثي على مصر، قدّم العقيد يسخار شدمي، قائد اللواء في جيش الاحتلال المسؤول عن حرس الحدود في المنطقة، موعد حظر التجوّل الليلي على اثنتي عشرة قرية عربية قريبة من الحدود الأردنية إلى الخامسة مساءً. وأُبلغ مختار كفر قاسم بذلك في الرابعة والنصف عصرًا، فسأل عن نحو 400 من أهل القرية ما زالوا في الحقول لا يعلمون به. وعند مدخل القرية أوقف جنود حرس الحدود الأهالي العائدين وأطلقوا عليهم النار من مسافة قريبة، وكانت الأوامر: «من يغادر بيته يُطلق عليه النار؛ لا اعتقالات»، فقتلوا في نحو ساعة 49 من أهل القرية، بينهم أطفال ونساء وجنين في بطن أمه (وتذكر بعض الإحصاءات 48: 19 رجلًا و6 نساء و23 طفلًا). وكانوا جميعًا مواطنين في إسرائيل، وفرضت الرقابة العسكرية حظرًا تامًّا على النشر. وفي تموز 2022 رفعت محكمة الاستئناف العسكرية طابع السرّية عن مئات الصفحات من محضر المحاكمة، فتأكّد وجود خطة اسمها «الخُلد» هدفها ترويع الأهالي وتهجيرهم."
