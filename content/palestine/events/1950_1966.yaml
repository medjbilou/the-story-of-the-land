  - id: e1956_09_upper_nazareth
    title: "\"Upper Nazareth\" on al-Nasira's land"
    title_ar: "«الناصرة العليا» فوق أرض الناصرة"
    text: "In 1954, 1,200 dunams, about half of them inside the municipal boundaries of al-Nasira (Nazareth), were allocated for a new Jewish town under a law allowing expropriation for \"public purposes\", and its first dwellings were completed in September 1956; in 1958 it took the name \"Nazareth Illit\" (Upper Nazareth). The army's planning director Yuval Ne'eman said it would safeguard \"the Jewish character of the Galilee\" and demonstrate state sovereignty to the Arab population, and the historian Geremy Forman wrote that it was meant to overpower al-Nasira numerically, economically and politically. The Institute for Palestine Studies' encyclopedia lists it among the projects of the \"Judaization of the Galilee\"."
    text_ar: "عام 1954 خُصّص 1200 دونم، نحو نصفها كان ضمن حدود بلدية الناصرة، لبناء بلدة يهودية جديدة بموجب قانون يجيز المصادرة «للأغراض العامة»، واكتملت أولى مساكنها في أيلول 1956، ثم سُمّيت عام 1958 «نتسيرت عيليت» (الناصرة العليا). وقال مسؤول التخطيط في الجيش يوفال نئمان إنها ستصون «الطابع اليهودي للجليل» وتُظهر سيادة الدولة للسكان العرب، وكتب المؤرخ جيريمي فورمان أنها أُريد بها التفوّق على الناصرة عددًا واقتصادًا وسياسة. وتعُدّها الموسوعة التفاعلية لمؤسسة الدراسات الفلسطينية من مشاريع «تهويد الجليل»."
