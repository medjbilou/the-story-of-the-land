  - id: e1955_09_fedayeen
    title: "The fedayeen of Gaza"
    title_ar: "الفدائيون في غزة"
    text: "After the February raid Egypt's leadership decided to back fida'i action from Gaza and formed Palestinian fedayeen units known as Battalion 141, led by Lieutenant Colonel Mustafa Hafez; they began operating in September 1955, the month of Egypt's Czech arms deal (27 September). Their raids inside Israel hit soldiers and civilians. The battalion's operations stopped after the Zionist intelligence services assassinated its commander in July 1956."
    text_ar: "بعد غارة شباط قرّرت القيادة المصرية دعم العمل الفدائي من غزة، فشكّلت وحدات فدائية فلسطينية عُرفت بالكتيبة 141 بقيادة المقدّم مصطفى حافظ، بدأت عملياتها في أيلول 1955، وهو الشهر الذي عقدت فيه مصر صفقة السلاح التشيكية (27 أيلول). وأصابت غاراتها داخل إسرائيل عسكريين ومدنيين. وتوقّفت عمليات الكتيبة بعد أن اغتالت مخابرات الاحتلال قائدها في تموز 1956."
