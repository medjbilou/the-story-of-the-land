  - id: e1950_07_law_of_return
    title: "A \"Law of Return\" for others"
    title_ar: "«قانون العودة» لغير أهل البلاد"
    text: "On 5 July 1950, the anniversary of the death of the Zionist leader Theodor Herzl, the Knesset unanimously passed the \"Law of Return\", which states that every Jew in the world has the right to come to the country as an immigrant. Adalah notes that no comparable law guarantees Palestinians a right to return or to citizenship, even those born in the country. The door opened for immigrants from around the world, while the Palestinian refugees who owned the houses and the land stayed behind the armistice lines."
    text_ar: "في 5 تموز 1950، ذكرى وفاة الزعيم الصهيوني تيودور هرتسل، أقرّ الكنيست بالإجماع «قانون العودة»، الذي ينصّ على أن لكل يهودي في العالم الحق في القدوم إلى البلاد مهاجرًا. وتلاحظ منظمة عدالة أنه لا يوجد قانون مماثل يضمن للفلسطينيين حقّ العودة أو الجنسية، حتى لمن وُلد منهم في البلاد. فانفتح الباب لمهاجرين من أنحاء العالم، وبقي اللاجئون الفلسطينيون، أصحاب البيوت والأرض، خلف خطوط الهدنة."
    scope: "national"
    from: 1950-07-01
    to: 1950-08-01
    day: 5
    effects:
      - { target: land, delta: -0.03 }
      - { target: solidarity, delta: -0.02 }
      - { target: sumud, delta: 0.03 }
    options:
      - id: hang_key
        text: "Hang up the key and keep saying the house's name"
        text_ar: "نعلّق المفتاح ونردّد اسم البيت"
        outcome: "The children came to know which door the key opened, though they had never seen it."
        outcome_ar: "صار الأطفال يعرفون أي باب يفتحه المفتاح، وإن لم يروه قطّ."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: sumud, delta: 0.03 }
      - id: petition
        text: "Write a petition demanding to go back home"
        text_ar: "نكتب عريضة نطالب فيها بالعودة إلى بيتنا"
        outcome: "The petition carried dozens of names and thumbprints, and no answer came."
        outcome_ar: "حملت العريضة عشرات الأسماء والبصمات، ولم يأتِ جواب."
        effects:
          - { target: solidarity, delta: 0.03 }
          - { target: documents, delta: 0.03 }
