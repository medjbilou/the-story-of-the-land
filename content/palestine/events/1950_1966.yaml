  - id: fate1950_depopulated
    title: "The second expulsion from {village_en}"
    title_ar: "الترحيل الثاني عن {village_ar}"
    text: "After the war some of the people of {village_en} stayed in their homes, living under military rule. In 1950, more than a year after the armistice agreements, the occupation army deported those who remained: it trucked some across the armistice lines and made others walk across them, to join their relatives in exile."
    text_ar: "بعد الحرب بقي بعض أهل {village_ar} في بيوتهم، وعاشوا تحت الحكم العسكري. وفي عام 1950، بعد أكثر من عام على اتفاقيات الهدنة، رحّل جيش الاحتلال من بقي منهم: نقل بعضهم بالشاحنات إلى ما وراء خطوط الهدنة، وأجبر آخرين على السير عبرها، ليلحقوا بأقاربهم في المنفى."
