  - id: e1963_06_men_in_the_sun
    title: "Men in the Sun"
    title_ar: "«رجال في الشمس»"
    text: "In 1963 Ghassan Kanafani, a refugee from 'Akka (Acre), published Men in the Sun, in which three Palestinian refugees hide in a lorry's water tank to cross into Kuwait in search of work and die inside it in silence. The novel is read as an allegory of refugee life after 1948, became one of the most admired and quoted works of modern Arabic fiction, and ends with the question: \"Why didn't you knock on the sides of the tank?\" It was filmed in 1972 as The Dupes."
    text_ar: "عام 1963 نشر غسان كنفاني، اللاجئ ابن عكا، روايته «رجال في الشمس» عن ثلاثة لاجئين فلسطينيين يختبئون في خزّان ماء شاحنة ليعبروا الحدود إلى الكويت بحثًا عن عمل، فيموتون في داخله صامتين. وتُقرأ الرواية رمزًا لحال اللاجئين بعد 1948، وصارت من أكثر الأعمال تقديرًا واقتباسًا في الأدب العربي الحديث، وتنتهي بالسؤال: «لماذا لم تدقّوا جدران الخزّان؟» وحُوّلت عام 1972 إلى فيلم «المخدوعون»."
    scope: "national"
    from: 1963-06-01
    to: 1963-07-01
    effects:
      - { target: memory, delta: 0.05 }
      - { target: sumud, delta: 0.03 }
    options:
      - id: read_aloud
        text: "Read the novel aloud in the evening"
        text_ar: "نقرأ الرواية بصوت عالٍ في السهرة"
        outcome: "At the last page no one spoke, then the grandfather said: we must knock."
        outcome_ar: "عند الصفحة الأخيرة لم يتكلّم أحد، ثم قال الجدّ: يجب أن ندقّ."
        effects:
