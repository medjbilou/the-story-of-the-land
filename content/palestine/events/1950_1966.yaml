  - id: e1956_04_gaza_shelling
    title: "Shells on central Ghazza, gunfire in Kfar Chabad"
    title_ar: "قذائف على وسط غزة ورصاص في كفار حباد"
    text: "On 5 April 1956 the occupation army shelled central Ghazza (Gaza City) with 120 mm mortars, killing 58 civilians: 33 men, 15 women and 10 children. On 11 April a fedayeen squad from Egypt entered the Israeli village of Kfar Chabad (Shafrir) and opened fire on boys in a synagogue study hall, killing a young instructor and between three and five boys, as accounts of the toll differ. In both cases the victims were civilians."
    text_ar: "في 5 نيسان 1956 قصف جيش الاحتلال وسط مدينة غزة بقذائف هاون من عيار 120 ملم، فقتل 58 مدنيًّا: 33 رجلًا و15 امرأة و10 أطفال. وفي 11 نيسان دخلت مجموعة فدائية من مصر قرية كفار حباد (شافير) في إسرائيل، وأطلقت النار على فتية كانوا في قاعة دراسة بكنيس، فقتلت مرشدًا شابًّا وما بين ثلاثة وخمسة فتيان، إذ تختلف الروايات في عددهم. وفي الحالتين كان الضحايا مدنيين."
