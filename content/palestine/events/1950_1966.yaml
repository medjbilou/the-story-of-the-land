        text_ar: "نساعد الجيران في رفع الأنقاض"
        outcome: "The sons lifted the stones one by one and set aside those that could be built with again."
        outcome_ar: "رفع الأبناء الحجارة حجرًا حجرًا، وفصلوا الصالح منها للبناء."
        effects:
          - { target: community, delta: 0.05 }
          - { target: solidarity, delta: 0.05 }
          - { target: livelihood, delta: -0.03 }
      - id: join_protest
        text: "Join the demonstration"
        text_ar: "نخرج في المظاهرة"
        outcome: "The son came back smelling of tear gas and said people wanted protection."
        outcome_ar: "عاد الابن ورائحة الغاز المسيل للدموع في ثيابه، وقال إن الناس يريدون من يحميهم."
        effects:
