        text_ar: "نسمع خبر البلاغ في المقهى"
        outcome: "The men whispered in the coffee house, and the grandfather smiled for the first time in a long while."
        outcome_ar: "تهامس الرجال في المقهى، وابتسم الجدّ لأول مرة منذ زمن."
