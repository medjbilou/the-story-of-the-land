  - id: e1956_11_khan_yunis
    title: "The Khan Yunis massacre"
    title_ar: "مجزرة خان يونس"
    text: "On 3 November 1956, during the occupation of the Strip, occupation soldiers went through Khan Yunis town and its camp looking for men with arms and, the refugees told UNRWA, killed many unarmed civilians. In his special report to the General Assembly of 15 December 1956, the UNRWA Director said he had received lists naming 275 people said to have been killed that day: 140 refugees and 135 local residents. The historian Benny Morris estimates about 200 killed in Khan Yunis and Rafah together, the Israeli authorities claimed the soldiers had met resistance, and an Israeli soldier who was there later wrote of \"a human slaughterhouse\"."
    text_ar: "في 3 تشرين الثاني 1956، خلال احتلال القطاع، اجتاح جنود الاحتلال بلدة خان يونس ومخيمها بحثًا عن رجال يحملون السلاح، وقتلوا كثيرًا من المدنيين العزّل بحسب ما رواه اللاجئون للأونروا. وذكر مدير الأونروا في تقريره الخاص إلى الجمعية العامة في 15 كانون الأول 1956 أنه تلقّى قوائم بأسماء 275 شخصًا قيل إنهم قُتلوا ذلك اليوم، منهم 140 لاجئًا و135 من سكان البلدة. ويقدّر المؤرخ بيني موريس قتلى خان يونس ورفح معًا بنحو 200، فيما زعمت السلطات الإسرائيلية أن الجنود واجهوا مقاومة، وكتب لاحقًا جندي إسرائيلي شهد الأحداث عن «مسلخ بشري»."
