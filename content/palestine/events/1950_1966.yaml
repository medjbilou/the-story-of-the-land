        text_ar: "نسافر إلى حيفا بلا تصريح لأول مرة"
        outcome: "The father sat on the bus a long time before he believed no one would ask for his paper."
        outcome_ar: "جلس الأب في الحافلة وقتًا طويلًا قبل أن يصدّق أن أحدًا لن يطلب ورقته."
