  - id: e1956_11_rafah
    title: "The Rafah massacre"
    title_ar: "مجزرة رفح"
    text: "On the morning of 12 November 1956 loudspeakers summoned Rafah's men aged about 15 to 60 to a school yard for screening; occupation soldiers hurried them with shots in the air and beatings, and made them keep their heads bowed to the ground while bullets passed above them. Lists received by the UNRWA Director named 111 dead: 103 refugees, 7 residents and one Egyptian, while a Palestinian account cited by the historian Jean-Pierre Filiu gives 197 killed and 23 missing. UNRWA warned the Israeli government that it could not go on working in the Strip unless such killings stopped; Ben-Gurion claimed in the Knesset that a \"riot\" had broken out under Egyptian incitement and that about 48 people died while it was put down."
    text_ar: "صباح 12 تشرين الثاني 1956 نادت مكبّرات الصوت رجال رفح ممن تتراوح أعمارهم بين 15 و60 عامًا تقريبًا إلى ساحة مدرسة للتفتيش، فاستعجلهم جنود الاحتلال بإطلاق النار في الهواء وبالضرب، وأجبروهم على إحناء رؤوسهم إلى الأرض والرصاص يمرّ فوقهم. وأحصت قوائم تلقّاها مدير الأونروا 111 قتيلًا: 103 لاجئين و7 من السكان ومصريًّا واحدًا، فيما تذكر رواية فلسطينية أوردها المؤرخ جان بيير فيليو 197 قتيلًا و23 مفقودًا. وحذّرت الأونروا الحكومة الإسرائيلية من أنها لن تستطيع مواصلة عملها في القطاع ما لم يتوقّف هذا القتل، أما بن غوريون فزعم أمام الكنيست أن «شغبًا» اندلع بتحريض مصري وأن نحو 48 شخصًا قُتلوا في قمعه."
