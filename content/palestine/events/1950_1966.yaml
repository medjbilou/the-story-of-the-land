  - id: e1964_09_karmiel
    title: "Karmiel and the \"Judaisation of the Galilee\""
    title_ar: "كرمئيل و«تهويد الجليل»"
    text: "In 1961 the Zionist government expropriated land owned by the people of Deir al-Asad, Bi'ina and Nahf, which some sources say had been declared \"closed areas\" in 1956, to build the town of Karmiel, founded in 1964 with the official aim of \"Judaising the Galilee\". The owners were offered \"equally good land\", but when the MPs Moshe Sneh and Yusef Khamis took their case to the Knesset it emerged that no such land existed. When local Arabs applied to live there, Housing Minister Yosef Almogi said in 1964 that Karmiel \"was not built to solve the problems for the people in the surrounding area\"."
    text_ar: "صادرت الحكومة الصهيونية عام 1961 أراضي يملكها أهل دير الأسد والبعنة ونحف، كانت بحسب بعض المصادر قد أُعلنت «مناطق مغلقة» عام 1956، لبناء مدينة كرمئيل التي أُقيمت عام 1964، وكان هدفها الرسمي «تهويد الجليل». وعُرضت على أصحاب الأرض «أرض بديلة مساوية في الجودة»، فلما حمل النائبان موشيه سنيه ويوسف خميس قضيتهم إلى الكنيست تبيّن أنه لا توجد أرض كهذه. وحين تقدّم عرب من المنطقة للسكن فيها، قال وزير الإسكان يوسف ألموغي عام 1964 إن كرمئيل «لم تُبنَ لحلّ مشكلات أهل المنطقة المحيطة»."
    scope: "region:deir_al_asad"
    place: deir_al_asad
    from: 1964-09-01
    to: 1964-10-01
    effects:
      - { target: land, delta: -0.1 }
      - { target: sumud, delta: 0.03 }
    options:
      - id: protest
        text: "Join the protest against the confiscation"
        text_ar: "نشارك في الاحتجاج على المصادرة"
        outcome: "The father marched with the people of the three villages, carrying a sign with the name of his land."
        outcome_ar: "سار الأب مع أهل القرى الثلاث، ورفع لافتة كُتب عليها اسم أرضه."
        effects:
          - { target: sumud, delta: 0.05 }
          - { target: solidarity, delta: 0.03 }
          - { target: safety, delta: -0.05 }
      - id: till_rest
        text: "Plough what land we still have"
        text_ar: "نحرث ما بقي لنا من أرض"
        outcome: "The sons ploughed the small field that was left while bulldozers worked on the facing hill."
        outcome_ar: "حرث الأبناء الحقل الصغير الباقي، والجرّافات تعمل على التلّ المقابل."
        effects:
          - { target: land, delta: 0.03 }
          - { target: livelihood, delta: 0.03 }
      - id: keep_maps
        text: "Keep maps of the confiscated land"
        text_ar: "نحتفظ بخرائط الأرض المصادرة"
        outcome: "The grandfather drew the boundaries in pencil and wrote across them: we did not sell."
        outcome_ar: "رسم الجدّ الحدود بقلم رصاص، وكتب عليها: لم نبِع."
        effects:
          - { target: documents, delta: 0.05 }
          - { target: memory, delta: 0.03 }
