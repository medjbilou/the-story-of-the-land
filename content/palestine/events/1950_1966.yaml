  - id: e1958_10_kafr_qasim_verdict
    title: "The Kafr Qasim verdict: a token fine for the commander"
    title_ar: "حكم كفر قاسم: غرامة رمزية للقائد"
    text: "On 16 October 1958 a military court convicted eight of the eleven accused in the Kafr Qasim massacre; Shmuel Malinki was sentenced to 17 years and Gabriel Dahan to 15, but the sentences were cut and all the convicted men were out of prison by 1959–1960. Colonel Issachar Shadmi, responsible for the curfew order, was convicted only of extending the curfew without authority and given a token fine. The high command was never tried. In November 1957 the government and the army had imposed a \"sulha\" (reconciliation ceremony) on the villagers, which the Arabic press called a fraud."
    text_ar: "في 16 تشرين الأول 1958 أدانت محكمة عسكرية ثمانية من أحد عشر متهمًا في مجزرة كفر قاسم، وحُكم على شموئيل ملينكي بالسجن 17 عامًا وعلى غبريئيل دهان 15 عامًا، لكن الأحكام خُفّفت وخرج جميع المدانين من السجن بحلول 1959–1960. أما العقيد يسخار شدمي، المسؤول عن أمر حظر التجوّل، فلم يُدَن إلا بتمديد الحظر دون صلاحية، وغُرّم غرامة رمزية. ولم تُحاكَم القيادة العليا. وكانت الحكومة والجيش قد فرضا على أهل القرية في تشرين الثاني 1957 «صُلحة» وصفتها الصحافة العربية بالخدعة."
    scope: "national"
    place: kafr_qasim
