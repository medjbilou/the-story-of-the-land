  - id: e1951_06_infiltrators
    title: "Shot on the way home"
    title_ar: "الرصاص على طريق العودة"
    text: "After the armistice thousands of refugees tried to cross the lines to return home, recover their belongings or harvest their fields and orchards, and the Zionist government branded them \"infiltrators\". The historian Benny Morris estimates that Israeli forces, mines and booby-traps killed between 2,700 and 5,000 of them in 1949–1956, most in 1949–1951, that \"the vast majority\" were unarmed, and that the overwhelming majority crossed for economic or social reasons. Yitzhak Pundak, a former Israeli brigade commander, testified that he was ordered \"to liquidate every infiltrator\" his forces met and to leave the bodies in the fields as a deterrent."
    text_ar: "بعد الهدنة حاول آلاف اللاجئين عبور خطوط الهدنة للعودة إلى بيوتهم، أو استعادة متاعهم، أو حصاد حقولهم وبساتينهم، فوصمتهم الحكومة الصهيونية بـ«المتسلّلين». ويقدّر المؤرخ بيني موريس أن قوات الاحتلال وألغامها وأفخاخها قتلت ما بين 2700 و5000 منهم بين 1949 و1956، أكثرهم في 1949–1951، وأن «الغالبية العظمى» منهم كانوا عزّلًا، وأن الأغلبية الساحقة عبرت لأسباب اقتصادية أو اجتماعية. وشهد يتسحاق بونداك، قائد لواء إسرائيلي سابق، بأنه أُمر «بتصفية كل متسلّل» تصادفه قواته، وبترك الجثث في الحقول للردع."
    scope: "national"
    tags: [sensitive]
    from: 1951-06-01
    to: 1951-07-01
    effects:
      - { target: safety, delta: -0.1 }
      - { target: family, delta: -0.03 }
      - { target: livelihood, delta: -0.03 }
    options:
      - id: cross_harvest
        text: "The father crosses at night to harvest his wheat"
        text_ar: "يعبر الأب ليلًا ليحصد قمحه"
        outcome: "He came back before dawn with half a sack of wheat, his clothes torn by the wire."
        outcome_ar: "عاد قبل الفجر بنصف كيس قمح، وثيابه ممزّقة من الأسلاك."
        effects:
          - { target: livelihood, delta: 0.05 }
          - { target: land, delta: 0.03 }
          - { target: safety, delta: -0.15 }
      - id: day_labour
        text: "Stay and do day labour where we are"
        text_ar: "نبقى ونعمل بالمياومة حيث نحن"
        outcome: "The father worked other men's fields and looked west whenever he rested."
        outcome_ar: "عمل الأب في حقول غيره، وكان ينظر غربًا كلما استراح."
        effects:
          - { target: livelihood, delta: 0.03 }
          - { target: safety, delta: 0.03 }
          - { target: sumud, delta: -0.03 }
      - id: watch_line
        text: "Look at our land from the armistice line"
        text_ar: "ننظر إلى أرضنا من خط الهدنة"
        outcome: "The land was so close that the children could see the big fig tree."
        outcome_ar: "كانت الأرض قريبة حتى إن الأطفال رأوا شجرة التين الكبيرة."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: sumud, delta: 0.03 }
