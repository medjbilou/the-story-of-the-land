  - id: e1950_05_unrwa_starts
    title: "UNRWA begins its work"
    title_ar: "الأونروا تبدأ عملها"
    text: "On 1 May 1950 UNRWA began serving Palestine refugees in Jordan, Lebanon, Syria, the West Bank and the Gaza Strip. The agency does not run the camps and has no police or administrative powers in them; it provides services in camps whose use is governed by an agreement with the host government. Its registered refugees numbered about 914,000 in 1950 and about 1.12 million in 1960."
    text_ar: "في 1 أيار 1950 بدأت الأونروا عملها في خدمة اللاجئين الفلسطينيين في الأردن ولبنان وسوريا والضفة الغربية وقطاع غزة. ولا تدير الوكالة المخيمات ولا تملك فيها سلطة شرطة أو إدارة، بل تقدّم الخدمات في مخيمات يحكم استخدامَها اتفاقٌ مع الحكومة المضيفة. وبلغ عدد اللاجئين المسجّلين لديها نحو 914 ألفًا عام 1950، ونحو 1.12 مليون عام 1960."
    scope: "national"
    from: 1950-05-01
    to: 1950-06-01
    day: 1
    effects:
