  - id: e1965_05_identity_card
    title: "\"Write down! I am an Arab\""
    title_ar: "«سجّل! أنا عربي»"
    text: "On 1 May 1965 Mahmoud Darwish recited his poem \"Identity Card\" to a crowd in a cinema in al-Nasira (Nazareth), and it spread quickly, with its refrain \"Write down! I am an Arab\". The poem had appeared in his second collection, Leaves of Olives, published in Hayfa (Haifa) in 1964. Darwish, born in al-Birwa in 1941, fled to Lebanon with his family when the Zionist army captured and razed his village; they came back a year later and settled in Deir al-Asad."
    text_ar: "في 1 أيار 1965 ألقى محمود درويش قصيدته «بطاقة هوية» أمام جمهور في دار سينما بالناصرة، فانتشرت بسرعة، ولازمتُها «سجّل! أنا عربي». وكانت القصيدة قد صدرت في ديوانه الثاني «أوراق الزيتون» (حيفا، 1964). ودرويش، المولود في البروة عام 1941، لجأ مع عائلته إلى لبنان حين احتلّ الجيش الصهيوني قريته ودمّرها، ثم عادوا بعد عام واستقرّوا في دير الأسد."
    scope: "national"
    from: 1965-05-01
    to: 1965-06-01
    day: 1
    effects:
      - { target: memory, delta: 0.05 }
      - { target: sumud, delta: 0.05 }
      - { target: community, delta: 0.03 }
    options:
      - id: learn_poem
        text: "The children learn the poem by heart"
        text_ar: "يحفظ الأطفال القصيدة"
        outcome: "The little ones chanted \"Write down!\" as they played in the alley."
        outcome_ar: "صار الصغار يردّدون «سجّل!» وهم يلعبون في الزقاق."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: family, delta: 0.03 }
      - id: copy_poem
        text: "Copy the poem by hand and pass it on"
        text_ar: "ننسخ القصيدة بخط اليد ونوزّعها"
        outcome: "The daughter copied the poem ten times, and one copy reached a distant village."
        outcome_ar: "نسخت البنت القصيدة عشر مرات، ووصلت إحدى النسخ إلى قرية بعيدة."
        effects:
          - { target: community, delta: 0.05 }
          - { target: sumud, delta: 0.03 }
          - { target: safety, delta: -0.03 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/Mahmoud_Darwish", checked: 2026-10-19 }
  - id: e1966_06_resistance_literature
    title: "\"The Literature of Resistance in Occupied Palestine\""
    title_ar: "«أدب المقاومة في فلسطين المحتلة»"
    text: "In 1966 Ghassan Kanafani published The Literature of Resistance in Occupied Palestine 1948–1966, becoming the first to apply the idea of \"resistance literature\" to Palestinian writing. His studies of this literature gathered work by poets and writers inside the country, among them Mahmoud Darwish, Samih al-Qasim and Hanna Abu Hanna."
    text_ar: "عام 1966 أصدر غسان كنفاني كتابه «أدب المقاومة في فلسطين المحتلة 1948–1966»، وكان أول من أطلق مفهوم «أدب المقاومة» على الكتابة الفلسطينية. وجمعت دراساته في هذا الأدب نصوصًا لشعراء وكتّاب من داخل البلاد، منهم محمود درويش وسميح القاسم وحنّا أبو حنّا."
    scope: "national"
    from: 1966-06-01
    to: 1966-07-01
    effects:
      - { target: memory, delta: 0.05 }
      - { target: solidarity, delta: 0.05 }
    options:
      - id: read_book
        text: "Read the book and discover the poets inside"
        text_ar: "نقرأ الكتاب ونتعرّف إلى شعراء الداخل"
        outcome: "The sons learned that there were people inside writing about them, as they wrote about inside."
        outcome_ar: "عرف الأبناء أن في الداخل من يكتب عنهم، كما يكتبون هم عن الداخل."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: sumud, delta: 0.03 }
      - id: pass_on
        text: "Lend the book to the neighbours"
        text_ar: "نعير الكتاب لجيراننا"
        outcome: "The book went round the houses in the alley and came back months later without its cover."
        outcome_ar: "دار الكتاب على بيوت الزقاق، وعاد بعد شهور بلا غلاف."
        effects:
          - { target: community, delta: 0.05 }
          - { target: solidarity, delta: 0.03 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/Ghassan_Kanafani", checked: 2026-10-19 }
      - { url: "https://www.versobooks.com/products/3514-palestinian-resistance-literature-under-occupation-1948-1968", checked: 2026-10-19 }
  - id: e1966_11_samu
    title: "The attack on as-Samu"
    title_ar: "الهجوم على السموع"
    text: "On 13 November 1966 the Zionist army sent some 3,000–4,000 troops with tanks and aircraft against as-Samu, south of al-Khalil (Hebron) and then under Jordanian rule. The government blamed Jordan for a mine, reportedly laid by Fatah fighters, that had killed three Israeli border policemen on 11–12 November, although Jordan had been working to curb Fatah raids since 1965 and the mine's supposed Jordanian origin was never independently investigated. The force demolished between 40 houses (the Israeli army's claim) and 125 (the UN's), with the village clinic and a school, killed 16 members of the Jordanian forces and wounded 54, and killed three civilians and wounded 96; one Israeli soldier was killed. The Security Council censured Israel in Resolution 228 on 25 November, and in the protests that swept the West Bank Jordanian police killed four Palestinians."
    text_ar: "في 13 تشرين الثاني 1966 دفع جيش الاحتلال بنحو 3000 إلى 4000 جندي، بالدبابات والطائرات، على قرية السموع جنوب الخليل، وكانت تحت الحكم الأردني. وحمّلت الحكومة الصهيونية الأردنَّ مسؤولية لغم قيل إن مقاتلين من فتح زرعوه فقتل ثلاثة من أفراد حرس الحدود الإسرائيلي في 11–12 تشرين الثاني، مع أن الأردن كان يعمل على كبح غارات فتح منذ 1965، ولم يُحقَّق تحقيقًا مستقلًّا قطّ في نسبة اللغم إلى الأردن. وهدمت القوة ما بين 40 بيتًا (بحسب ما زعمه جيش الاحتلال) و125 بيتًا (بحسب الأمم المتحدة)، ومعها عيادة القرية ومدرسة، وقتلت 16 من القوات الأردنية وجرحت 54، وقتلت ثلاثة مدنيين وجرحت 96، وقُتل من جنودها جندي واحد. ودان مجلس الأمن إسرائيل بالقرار 228 في 25 تشرين الثاني، واندلعت في الضفة الغربية مظاهرات قتلت فيها الشرطة الأردنية أربعة فلسطينيين."
    scope: "region:as_samu"
