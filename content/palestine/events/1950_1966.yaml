  - id: e1951_12_iqrit
    title: "Iqrit: a ruling to return, then demolition at Christmas"
    title_ar: "إقرث: حكم بالعودة ثم نسف في عيد الميلاد"
    text: "On 5 November 1948 the occupation army ordered the people of Iqrit in Upper Galilee (432 of its 491 residents were Greek Catholics) to leave, promising they could return in two weeks, and trucked most of them to al-Rama. On 31 July 1951 the courts recognised their right to their land and to return, but the army declared the village a closed military area and then, on Christmas Day, 25 December 1951, before a court hearing set for 6 February 1952, blew up its houses. Only the church still stands, and the villagers' descendants still bury their dead in its cemetery."
    text_ar: "في 5 تشرين الثاني 1948 أمر جيش الاحتلال أهل إقرث في الجليل الأعلى (وكان 432 من سكانها الـ491 من الروم الكاثوليك) بالخروج من قريتهم، ووعدهم بالعودة بعد أسبوعين، ونقل أغلبهم بالشاحنات إلى الرامة. وفي 31 تموز 1951 اعترفت المحاكم بحقّهم في أرضهم وفي العودة إليها، لكن الجيش أعلن القرية منطقة عسكرية مغلقة، ثم نسف بيوتها يوم عيد الميلاد، 25 كانون الأول 1951، قبل جلسة محكمة كانت مقرّرة في 6 شباط 1952. ولم يبقَ إلا الكنيسة قائمةً، وما زال أبناء القرية يدفنون موتاهم في مقبرتها."
    scope: "national"
    from: 1951-12-01
    to: 1952-01-01
    day: 25
