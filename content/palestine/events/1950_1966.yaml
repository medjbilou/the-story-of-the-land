      - { target: memory, delta: 0.05 }
      - { target: sumud, delta: 0.05 }
    options:
      - id: draw_village
        text: "Draw the village as it was before the bombing"
        text_ar: "نرسم القرية كما كانت قبل القصف"
        outcome: "The son drew the lanes and the houses and wrote beneath them: we were born here."
        outcome_ar: "رسم الابن الأزقّة والبيوت، وكتب تحت الرسم: هنا وُلدنا."
        effects:
          - { target: memory, delta: 0.1 }
      - id: yearly_return
        text: "Go back to the village ruins every year"
        text_ar: "نعود إلى أطلال القرية كل عام"
        outcome: "The family now had a fixed appointment with the stones, and never missed it."
        outcome_ar: "صار للعائلة موعد ثابت مع الحجارة، لا تُخلفه."
        effects:
          - { target: community, delta: 0.05 }
          - { target: sumud, delta: 0.05 }
          - { target: safety, delta: -0.03 }
    sources:
