events:
  - id: e1950_01_military_rule
    title: "Military rule and travel permits"
    title_ar: "الحكم العسكري وتصاريح التنقّل"
    text: "Since the occupation of al-Nasira (Nazareth) and its villages in July 1948, when Ben-Gurion's government appointed a military governor there, the Palestinians who stayed inside Israel had lived under military rule, which was extended to the Triangle villages in May 1949. It rested on the British Defence (Emergency) Regulations of 1945: articles 110, 111 and 124 restricted movement, and articles 109 and 125 declared closed zones that Arabs could not enter. A Palestinian now needed the military governor's permission to work, trade, study or seek medical care beyond the village boundary. The governors granted permits selectively, and the Zionist government used military rule to steer votes to Mapai and keep Arab labour cheap."
    text_ar: "منذ احتلال الناصرة وقراها في تموز 1948، حين عيّنت حكومة بن غوريون حاكمًا عسكريًّا عليها، عاش الفلسطينيون الذين بقوا داخل إسرائيل تحت حكم عسكري، امتدّ إلى قرى المثلث في أيار 1949. واستند هذا الحكم إلى أنظمة الطوارئ البريطانية لعام 1945: فالمواد 110 و111 و124 قيّدت التنقّل، والمادتان 109 و125 أعلنتا مناطق مغلقة يُمنع العرب من دخولها. وصار على الفلسطيني أن يحصل على إذن من الحاكم العسكري ليعمل أو يتاجر أو يتعلّم أو يتعالج خارج حدود قريته. وكان الحكّام يمنحونه انتقائيًّا، واستخدمت الحكومة الصهيونية هذا الحكم لتوجيه الأصوات إلى حزب مباي ولإبقاء اليد العاملة العربية رخيصة."
    scope: "national"
    from: 1950-01-01
    to: 1950-02-01
