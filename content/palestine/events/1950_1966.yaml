  - id: e1956_11_gaza_occupied
    title: "The tripartite attack and the occupation of Gaza"
    title_ar: "العدوان الثلاثي واحتلال غزة"
    text: "With the British, French and Israeli attack on Egypt, the Zionist army occupied the Gaza Strip in early November 1956 and set up a military government that cut telephone and postal links, closed the banks and banned some school textbooks. In Khan Yunis and Rafah its soldiers killed hundreds of refugees and residents during search operations. On 7 November the UN General Assembly called on Britain, France and Israel to withdraw their troops from Egypt immediately."
    text_ar: "مع العدوان البريطاني الفرنسي الإسرائيلي على مصر، احتلّ الجيش الصهيوني قطاع غزة في مطلع تشرين الثاني 1956، وأقام فيه حكمًا عسكريًّا قطع الهاتف والبريد وأغلق المصارف ومنع كتبًا مدرسية. وفي خان يونس ورفح قتل جنوده مئات من اللاجئين والسكان خلال عمليات التفتيش. وفي 7 تشرين الثاني دعت الجمعية العامة للأمم المتحدة بريطانيا وفرنسا وإسرائيل إلى سحب قواتها من مصر فورًا."
    scope: "national"
