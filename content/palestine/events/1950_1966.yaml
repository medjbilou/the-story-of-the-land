        text_ar: "نسجّل للحصول على بطاقة التموين"
        outcome: "Flour now came every month, and the village's name was written on an official card."
        outcome_ar: "صار الطحين يصل كل شهر، وصار اسم القرية مكتوبًا على بطاقة رسمية."
