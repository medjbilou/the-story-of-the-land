  - id: e1955_03_gaza_uprising
    title: "The March 1955 uprising in Gaza"
    title_ar: "هبّة آذار 1955 في غزة"
    text: "The day after the raid, 1 March 1955, demonstrations set out from the Palestine School in Ghazza (Gaza City) and spread from Beit Hanoun to Rafah against a plan agreed by Egypt and UNRWA in 1953 to resettle 12,000 refugee families in north-western Sinai. Egyptian police opened fire and killed Hosni Belal, a textile worker from al-Majdal who had become a refugee in the Strip, and a Supreme National Committee of communists, among them the poet Muin Bseiso, Muslim Brothers and independents demanded the plan's cancellation, training and arms for the camps' self-defence, and civil freedoms. First promises were followed by mass arrests on the night of 8–9 March, and some of those held stayed in prison until July 1957, but the uprising ended the resettlement plan."
    text_ar: "في اليوم التالي للغارة، 1 آذار 1955، خرجت مظاهرات من مدرسة فلسطين في غزة وامتدّت من بيت حانون إلى رفح، رفضًا لمشروع اتفقت عليه مصر والأونروا عام 1953 لتوطين 12 ألف عائلة لاجئة في شمال غرب سيناء. وأطلقت الشرطة المصرية النار فقتلت حسني بلال، عامل النسيج اللاجئ من المجدل، وطالبت لجنة وطنية عليا ضمّت شيوعيين، منهم الشاعر معين بسيسو، وأعضاء من الإخوان المسلمين ومستقلين، بإلغاء المشروع وتدريب أهل المخيمات وتسليحهم للدفاع عن أنفسهم وضمان الحريات. وأعقبت الوعودَ الأولى حملةُ اعتقالات ليلة 8–9 آذار، بقي بعض من اعتُقلوا فيها في السجن حتى تموز 1957، لكن الهبّة أسقطت مشروع التوطين."
