  - id: e1959_10_fatah
    title: "The birth of Fatah"
    title_ar: "ولادة «فتح»"
    text: "In autumn 1957 five or six Palestinians in Kuwait, among them Yasser Arafat and Khalil al-Wazir, founded the core of the Palestinian National Liberation Movement, Fatah; Salah Khalaf, Kamal Adwan, Muhammad Yusuf al-Najjar, Khalid al-Hasan and others soon joined them. The name Fatah first appeared in the first issue of the magazine Filastinuna – Nida' al-Hayat (Our Palestine – The Call of Life), published in Beirut in October 1959."
    text_ar: "في خريف 1957 أسّس خمسة أو ستة فلسطينيين في الكويت، منهم ياسر عرفات وخليل الوزير، النواة الأولى لحركة التحرير الوطني الفلسطيني «فتح»، ثم انضمّ إليهم صلاح خلف وكمال عدوان ومحمد يوسف النجار وخالد الحسن وآخرون. وظهر اسم «فتح» أول مرة في العدد الأول من مجلة «فلسطيننا – نداء الحياة» الصادر في بيروت في تشرين الأول 1959."
    scope: "national"
    from: 1959-10-01
    to: 1959-11-01
    effects:
