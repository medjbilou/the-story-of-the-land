  - id: e1952_04_citizenship_law
    title: "The Citizenship Law"
    title_ar: "قانون الجنسية"
    text: "In 1952 the Knesset passed the Citizenship Law, which makes every immigrant under the \"Law of Return\" a citizen automatically. Its Article 3 set conditions that deny citizenship or residency to Palestinians who lived in the country before 1948, and Adalah says they were designed to deprive refugees of their right of return. Even the family of the poet Mahmoud Darwish, who came back from Lebanon a year after the Nakba and settled in Deir al-Asad, was granted only residency."
    text_ar: "عام 1952 أقرّ الكنيست قانون الجنسية، الذي يجعل كل مهاجر بموجب «قانون العودة» مواطنًا تلقائيًّا. أما مادته الثالثة فوضعت شروطًا تحرم الفلسطينيين الذين عاشوا في البلاد قبل 1948 من الجنسية أو الإقامة، وتقول منظمة عدالة إنها صُمّمت لحرمان اللاجئين من حقّ العودة. حتى عائلة الشاعر محمود درويش، التي عادت من لبنان بعد عام من النكبة واستقرّت في دير الأسد، لم تُمنح إلا الإقامة."
    scope: "national"
    from: 1952-04-01
    to: 1952-05-01
    effects:
      - { target: documents, delta: -0.05 }
      - { target: family, delta: -0.03 }
    options:
      - id: register_names
        text: "Register every family member with the authorities"
        text_ar: "نسجّل أسماء كل أفراد العائلة في الدوائر"
        outcome: "The father queued for a whole day and came back with papers for every name but one."
        outcome_ar: "وقف الأب في الطابور يومًا كاملًا، وعاد بأوراق لكل اسم إلا اسمًا واحدًا."
        effects:
          - { target: documents, delta: 0.05 }
          - { target: safety, delta: 0.03 }
      - id: shelter_cousin
        text: "Shelter a cousin who came back without papers"
        text_ar: "نؤوي ابن عمّ عاد من الشتات بلا أوراق"
        outcome: "The cousin slept in the loft for months and went out only after dark."
        outcome_ar: "نام ابن العمّ في العلّية أشهرًا، ولم يكن يخرج إلا بعد العتمة."
        effects:
          - { target: family, delta: 0.05 }
          - { target: solidarity, delta: 0.03 }
          - { target: safety, delta: -0.08 }
