        text_ar: "نتابع قضية العودة في المحاكم"
        outcome: "The father now had a thick file, which he carried to every lawyer willing to listen."
        outcome_ar: "صار للأب ملفّ سميك، يحمله إلى كل محامٍ يقبل أن يسمعه."
        effects:
          - { target: documents, delta: 0.05 }
