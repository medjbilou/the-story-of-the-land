  - id: e1963_02_knesset_vote
    title: "Military rule survives by one vote"
    title_ar: "بقاء الحكم العسكري بفارق صوت"
    text: "In 1958 the Rosen Commission recommended ending military rule; the Zionist government refused and only moved some of its powers to the police. Opposition parties tried twice to abolish it in the Knesset, in 1962 and 1963, and the second attempt failed by a single vote, with two Arab MPs linked to the ruling Mapai party, Jabr Muadi and Thiab Ubaid, voting with the government. In late 1963 Prime Minister Levi Eshkol announced plans to end it."
    text_ar: "عام 1958 أوصت لجنة روزن بإنهاء الحكم العسكري، فرفضت الحكومة الصهيونية ذلك واكتفت بنقل بعض صلاحياته إلى الشرطة. وحاولت أحزاب المعارضة إلغاءه في الكنيست مرتين، عامَي 1962 و1963، ففشلت المحاولة الثانية بفارق صوت واحد، وصوّت مع الحكومة نائبان عربيان مرتبطان بحزب مباي الحاكم، هما جبر معدّي وذياب عبيد. وفي أواخر 1963 أعلن رئيس الوزراء ليفي إشكول نيّته إنهاءه."
    scope: "national"
    from: 1963-02-01
    to: 1963-03-01
