        text: "Father and son argue: who will take us home, the PLO or the fedayeen?"
        text_ar: "يتجادل الأب والابن: من يعيدنا، المنظمة أم الفدائيون؟"
        outcome: "The argument ran until dawn and ended with agreement that, whatever they disagreed on, the road home was one."
        outcome_ar: "طال الجدال حتى الفجر، وانتهى بأن الطريق إلى البيت واحد مهما اختلفوا."
