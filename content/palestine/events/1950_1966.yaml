  - id: e1957_03_gaza_withdrawal
    title: "The occupation leaves Gaza"
    title_ar: "انسحاب الاحتلال من غزة"
    text: "On 8 March 1957 the occupation army withdrew from the Gaza Strip after four months of occupation, under the threat of UN economic sanctions raised by US President Dwight Eisenhower. Its military government had required its approval for local leaders and broadcast Arabic propaganda through loudspeakers in coffee shops and in cinemas. The army wrote a report on the experience that was later used to prepare military government for the territories occupied in June 1967."
    text_ar: "في 8 آذار 1957 انسحب جيش الاحتلال من قطاع غزة بعد أربعة أشهر من الاحتلال، وقد هدّده الرئيس الأمريكي دوايت أيزنهاور بعقوبات اقتصادية أممية. وكان حكمه العسكري قد اشترط موافقته على تعيين القيادات المحلية، وبثّ دعايته بالعربية عبر مكبّرات الصوت في المقاهي وفي صالات السينما. وأعدّ الجيش تقريرًا عن تلك التجربة استُعمل لاحقًا في تحضير الحكم العسكري للأراضي التي احتُلّت في حزيران 1967."
    scope: "region:gaza"
    place: gaza
    from: 1957-03-01
    to: 1957-04-01
