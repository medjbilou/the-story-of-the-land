  - id: e1965_01_fatah_first_op
    title: "Al-Asifa: Fatah's first operation"
    title_ar: "«العاصفة»: أول عملية لفتح"
    text: "On 1 January 1965 al-Asifa (The Storm), Fatah's clandestine military wing, carried out its first operation inside Israel, targeting a water network at the Eilabun tunnel near the point where the Jordan River's water is diverted: an installation, not people. The group's members were arrested after the operation, and Ahmad Musa, whom the movement counts as its first martyr, was killed on the way back. The operation is counted as the start of Fatah's open military activity."
    text_ar: "في 1 كانون الثاني 1965 نفّذت «العاصفة»، الجناح العسكري السرّي لحركة فتح، أول عملياتها داخل إسرائيل، واستهدفت شبكة لنقل المياه عند نفق عيلبون، قرب النقطة التي تُحوَّل فيها مياه نهر الأردن، أي منشأة لا أشخاصًا. واعتُقل أفراد المجموعة بعد العملية، وقُتل في طريق العودة أحمد موسى، الذي تعُدّه الحركة أول شهدائها. وعُدّت هذه العملية بداية العمل العسكري العلني لفتح."
    scope: "national"
    tags: [sensitive]
    from: 1965-01-01
    to: 1965-02-01
    day: 1
