        text_ar: "يقرأ الابن المجلة سرًّا مع رفاقه"
        outcome: "The young men passed the only copy around until its edges tore."
        outcome_ar: "تناقل الشبّان النسخة الوحيدة حتى تمزّقت أطرافها."
