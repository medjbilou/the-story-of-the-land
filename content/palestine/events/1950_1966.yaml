  - id: e1966_12_military_rule_ends
    title: "The end of military rule"
    title_ar: "نهاية الحكم العسكري"
    text: "In December 1966, after eighteen years, military rule over Palestinians in Israel effectively ended when the police took over enforcing the emergency regulations under the Chief of Staff's supervision. Its repressive powers passed to the police and the intelligence services, and it was legally abolished only in late 1968. The land confiscated in those years, nearly a million dunams in the first decade alone, was not returned."
    text_ar: "في كانون الأول 1966، بعد ثمانية عشر عامًا، انتهى الحكم العسكري على الفلسطينيين في إسرائيل فعليًّا، حين تولّت الشرطة تطبيق أنظمة الطوارئ تحت إشراف رئيس الأركان. لكن صلاحياته القمعية انتقلت إلى الشرطة وأجهزة المخابرات، ولم يُلغَ قانونيًّا إلا في أواخر 1968. أما الأرض التي صودرت في تلك السنوات، ونحو مليون دونم منها أُخذ في العقد الأول وحده، فلم تُعَد إلى أصحابها."
    scope: "national"
    from: 1966-12-01
    to: 1967-01-01
    effects:
