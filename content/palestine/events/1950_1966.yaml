  - id: e1959_12_al_ard
    title: "The al-Ard movement"
    title_ar: "حركة «الأرض»"
    text: "In 1959 Sabri Jiryis, then a student, founded al-Ard (\"The Land\") among Palestinians in Israel with Mansour Kardosh, Saleh Baransi, Habib Qahwaji and Muhammad Miari; it called on Arabs inside to organise, and for the refugees' return and a Palestinian state beside the Jewish one on the basis of the partition plan. The Zionist government refused it a newspaper licence and blocked its registration, outlawed it in 1964 after it sent a 17-page memorandum to the UN Secretary-General, and the Central Elections Committee barred its list from the 1965 Knesset election, a ban the Supreme Court upheld. The government banished the founders to remote towns with no Arab population until the election was over."
    text_ar: "عام 1959 أسّس صبري جريس، وكان يومها طالبًا، مع منصور كردوش وصالح برانسي وحبيب قهوجي ومحمد ميعاري حركة «الأرض» بين الفلسطينيين في إسرائيل، فدعت إلى تنظيم العرب في الداخل، وإلى عودة اللاجئين وقيام دولة فلسطينية إلى جانب الدولة اليهودية على أساس قرار التقسيم. ورفضت الحكومة الصهيونية منحها ترخيص صحيفة ومنعت تسجيلها، ثم حظرتها عام 1964 بعد أن أرسلت الحركة مذكرة من 17 صفحة إلى الأمين العام للأمم المتحدة، ومنعت لجنة الانتخابات المركزية قائمتها من خوض انتخابات الكنيست عام 1965، وأيّدت المحكمة العليا المنع. وأبعدت الحكومة مؤسسيها إلى بلدات نائية لا عرب فيها حتى انتهاء الانتخابات."
    scope: "national"
    from: 1959-12-01
    to: 1960-01-01
