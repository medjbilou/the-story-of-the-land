  - id: e1950_04_west_bank_annex
    title: "Jordan annexes the West Bank"
    title_ar: "ضمّ الضفة الغربية إلى الأردن"
    text: "On 24 April 1950 Jordan formally annexed the West Bank, after the Ariha (Jericho) Conference of December 1948 at which Palestinian notables recognised King Abdullah I as ruler. A 1949 amendment to the nationality law had already made the West Bank's residents and refugees Jordanian citizens. Only Britain and Iraq formally recognised the annexation (Pakistan's recognition is disputed), and the Arab League treated Jordan as a temporary trustee pending a settlement."
    text_ar: "في 24 نيسان 1950 ضمّ الأردن الضفة الغربية رسميًّا، بعد مؤتمر أريحا في كانون الأول 1948 الذي بايع فيه وجهاء فلسطينيون الملك عبد الله الأول. وكان تعديل لقانون الجنسية عام 1949 قد منح سكان الضفة واللاجئين فيها الجنسية الأردنية. ولم يعترف بالضمّ رسميًّا سوى بريطانيا والعراق (واعتراف باكستان موضع خلاف)، وعدّت الجامعة العربية الأردن وصيًّا مؤقتًا على الأرض إلى حين التسوية."
    scope: "national"
    from: 1950-04-01
    to: 1950-05-01
    day: 24
    effects:
      - { target: documents, delta: 0.03 }
      - { target: solidarity, delta: -0.02 }
    options:
      - id: take_passport
        text: "Take the Jordanian passport"
        text_ar: "نأخذ الجواز الأردني"
        outcome: "The father now had a passport, and the refugee card stayed in the chest beside it."
        outcome_ar: "صار للأب جواز سفر، وبقيت بطاقة اللاجئ في الصندوق إلى جانبه."
        effects:
          - { target: documents, delta: 0.05 }
          - { target: livelihood, delta: 0.03 }
          - { target: sumud, delta: -0.02 }
      - id: village_first
        text: "Insist on being known by our village"
        text_ar: "نصرّ على أن نُعرَف باسم قريتنا"
        outcome: "Whenever the father was asked where he was from, he named his village before any country."
        outcome_ar: "كلما سُئل الأب عن بلده، ذكر اسم قريته قبل اسم أي دولة."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: sumud, delta: 0.03 }
