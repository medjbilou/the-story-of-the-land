      - { url: "https://hrw.org/news/2012/03/30/israels-palestinian-citizens-issue-unsettled", checked: 2026-10-19 }
  - id: e1953_10_qibya
    title: "The Qibya massacre"
    title_ar: "مجزرة قبية"
    text: "On the night of 14–15 October 1953 the Zionist army's Unit 101, commanded by Ariel Sharon, attacked Qibya in the West Bank, then under Jordanian rule; documents show that Sharon ordered \"maximal killing and damage to property\". His men blew up 45 houses, a school and a mosque and killed at least 69 Palestinians, two-thirds of them women and children. The government invoked a grenade that had killed an Israeli woman and her two children in Yehud two days earlier, although Jordan had condemned that killing and offered to help catch those responsible, and the armistice commission had condemned Israeli raids 44 times since November 1950. Prime Minister David Ben-Gurion falsely claimed that Israeli civilians had carried out the attack; the Security Council censured the raid in Resolution 101 on 24 November 1953."
    text_ar: "في ليلة 14–15 تشرين الأول 1953 هاجمت الوحدة 101 من جيش الاحتلال، بقيادة أريئيل شارون، قرية قبية في الضفة الغربية التي كانت آنذاك تحت الحكم الأردني، وتُظهر الوثائق أن شارون أمر بـ«أقصى قدر من القتل وتدمير الممتلكات». فنسف رجاله 45 بيتًا ومدرسة ومسجدًا، وقتلوا 69 فلسطينيًّا على الأقل، ثلثاهم من النساء والأطفال. واحتجّت الحكومة الصهيونية بقنبلة يدوية قتلت امرأة إسرائيلية وطفليها في بلدة يهود الإسرائيلية قبل يومين، مع أن الأردن دان تلك الجريمة وعرض التعاون للقبض على الفاعلين، وكانت لجنة الهدنة المشتركة قد دانت الغارات الإسرائيلية 44 مرة منذ تشرين الثاني 1950. وزعم رئيس الوزراء دافيد بن غوريون، خلافًا للحقيقة، أن مدنيين إسرائيليين نفّذوا الهجوم، ودان مجلس الأمن الغارة بأشدّ العبارات في القرار 101 في 24 تشرين الثاني 1953."
    scope: "region:qibya"
    place: qibya
    tags: [sensitive]
    from: 1953-10-01
    to: 1953-11-01
    day: 14
    effects:
      - { target: safety, delta: -0.15 }
      - { target: family, delta: -0.05 }
      - { target: memory, delta: 0.05 }
    options:
      - id: search_rubble
        text: "Help search under the rubble"
        text_ar: "نساعد في البحث تحت الأنقاض"
        outcome: "The father dug with his hands until morning and did not speak of what he found."
        outcome_ar: "حفر الأب بيديه حتى الصباح، ولم يتكلّم عمّا وجد."
        effects:
          - { target: community, delta: 0.05 }
          - { target: solidarity, delta: 0.05 }
          - { target: safety, delta: -0.03 }
      - id: night_watch
        text: "Keep watch at the edge of the village"
        text_ar: "نسهر على أطراف القرية"
        outcome: "The men took turns on watch, and the women brewed tea for them until dawn."
        outcome_ar: "تناوب الرجال على السهر، والنساء يُغلين الشاي لهم حتى الفجر."
        effects:
          - { target: safety, delta: 0.03 }
          - { target: community, delta: 0.03 }
          - { target: family, delta: -0.03 }
      - id: keep_names
        text: "Keep the names of the dead"
        text_ar: "نحفظ أسماء الشهداء"
        outcome: "The grandfather wrote down the names and folded the sheet into his Qur'an."
        outcome_ar: "كتب الجدّ الأسماء على ورقة، وطواها في مصحفه."
        effects:
          - { target: memory, delta: 0.1 }
          - { target: sumud, delta: 0.03 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/Qibya_massacre", checked: 2026-10-19 }
      - { url: "https://lrb.co.uk/the-paper/v16/n16/avi-shlaim/israel-s-dirty-war", checked: 2026-10-19 }
  - id: e1955_02_gaza_raid
    title: "The raid on Ghazza"
    title_ar: "الغارة على غزة"
    text: "On the evening of 28 February 1955, a week after David Ben-Gurion returned as defence minister, Zionist army paratroopers attacked an Egyptian army camp by the railway station in Ghazza (Gaza City) and ambushed the force sent to help it, killing 38 and wounding 33; seventeen soldiers died in their sleep. Until then Egypt had curbed private incursions from the Strip, while the occupation army had raided al-Bureij refugee camp in August 1953, killing fifty civilians. The pretext was the killing of an Israeli in Rehovot by Palestinian militants; the Security Council condemned the attack in Resolution 106 on 29 March 1955."
    text_ar: "مساء 28 شباط 1955، بعد أسبوع من عودة دافيد بن غوريون وزيرًا للدفاع، هاجم مظليّو جيش الاحتلال معسكرًا للجيش المصري قرب محطة سكة الحديد في مدينة غزة، ونصبوا كمينًا للقوة التي هبّت لنجدته، فقتلوا 38 وجرحوا 33، بينهم سبعة عشر جنديًّا قُتلوا وهم نيام. وكانت مصر حتى ذلك الحين تكبح محاولات العبور الفردية من القطاع، فيما كان جيش الاحتلال قد هاجم مخيم البريج للاجئين في آب 1953 فقتل خمسين مدنيًّا. وكانت الذريعة مقتل إسرائيلي في رحوفوت على يد مسلّحين فلسطينيين، ودان مجلس الأمن الهجوم بالقرار 106 في 29 آذار 1955."
