  - id: e1950_03_absentees_law
    title: "The Absentees' Property Law"
    title_ar: "قانون أملاك الغائبين"
    text: "On 14 March 1950 the Knesset passed the Absentees' Property Law. It defined as an \"absentee\" anyone who, after 29 November 1947, had been in an Arab country or in a part of Palestine outside Israel, or had left home for an area held by forces fighting Israel. Their property, from land and houses to bank accounts, along with Muslim waqf property, passed to the \"Custodian of Absentees' Property\". Even displaced people who never left the country became \"present absentees\" who could see their land but no longer owned it; Adalah calls the law the main instrument for taking the land of Palestinian refugees inside and outside."
    text_ar: "في 14 آذار 1950 أقرّ الكنيست قانون أملاك الغائبين، فعدّ «غائبًا» كلَّ من كان بعد 29 تشرين الثاني 1947 في بلد عربي أو في جزء من فلسطين خارج إسرائيل، أو ترك مكان سكنه إلى منطقة تسيطر عليها قوات تحارب إسرائيل. ونُقلت أملاك هؤلاء، من أرض وبيوت وحسابات مصرفية، ومعها أملاك وقف إسلامية، إلى «القيّم على أملاك الغائبين». وهكذا صار حتى المهجَّرون الذين بقوا داخل البلاد «حاضرين غائبين» يرون أرضهم ولا يملكونها، وتصف منظمة عدالة هذا القانون بأنه الأداة الرئيسية للاستيلاء على أراضي اللاجئين في الداخل والخارج."
    scope: "national"
    from: 1950-03-01
    to: 1950-04-01
    day: 14
