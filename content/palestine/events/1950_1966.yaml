      - { url: "https://en.wikipedia.org/wiki/Mahmoud_Darwish", checked: 2026-10-19 }
  - id: e1952_07_naqab_siyag
    title: "The Naqab: the tribes confined to the \"Siyag\""
    title_ar: "النقب: حصر العشائر في «السياج»"
    text: "On the eve of the Nakba about 92,000 people lived in the Naqab by Salman Abu Sitta's count, most of them Arab Bedouin; most were driven to Gaza and Jordan, and Adalah says only 12% remained, while the Adva Center counts between 11,000 and 18,000. The military government moved the remaining tribes to an area north-east of Bir al-Sab' (Beersheba) called the \"Siyag\", about 900 square kilometres or just 7% of the Bir al-Sab' district, with only a fifth of the cultivable land the tribes had farmed before 1948, and declared the land outside it a closed military zone to stop its owners from returning. The historian Benny Morris says the expulsions came in stages until 1952; Ilan Pappé says they went on until 1959."
    text_ar: "عشية النكبة كان في النقب نحو 92 ألف نسمة بحسب سلمان أبو ستة، أغلبهم من العرب البدو، فهُجّر معظمهم إلى غزة والأردن، ولم يبقَ منهم بحسب عدالة إلا 12%، فيما يقدّر مركز أدفا عدد الباقين بما بين 11 ألفًا و18 ألفًا. ونقل الحكم العسكري العشائر الباقية إلى منطقة شمال شرق بئر السبع سُمّيت «السياج»، مساحتها نحو 900 كيلومتر مربع، أي 7% فقط من قضاء بئر السبع، ولا تتجاوز أرضها الصالحة للزراعة خُمس ما كانت العشائر تزرعه قبل 1948، وأعلن الأرض خارجها منطقة عسكرية مغلقة لمنع أهلها من العودة إليها. ويذكر المؤرخ بيني موريس أن الطرد جرى على مراحل حتى عام 1952، ويرى إيلان بابيه أنه استمرّ حتى 1959."
    scope: "region:beersheba"
    place: beersheba
    from: 1952-07-01
    to: 1952-08-01
    effects:
      - { target: land, delta: -0.1 }
      - { target: home, delta: -0.05 }
      - { target: livelihood, delta: -0.05 }
    options:
      - id: graze_outside
        text: "Graze the flock secretly on our land outside the zone"
        text_ar: "نرعى الماشية خلسة في أرضنا خارج السياج"
        outcome: "The shepherd came back before sunset and said the land still knew his steps."
        outcome_ar: "عاد الراعي قبل الغروب، وقال إن الأرض ما زالت تعرف خطواته."
        effects:
          - { target: livelihood, delta: 0.05 }
          - { target: land, delta: 0.03 }
          - { target: safety, delta: -0.1 }
      - id: keep_boundaries
        text: "Keep the land papers and the names of its boundaries"
        text_ar: "نحفظ وثائق الأرض وأسماء حدودها"
        outcome: "The sons memorised the names of the wadis and wells that bounded the tribe's land."
        outcome_ar: "حفظ الأبناء أسماء الأودية والآبار التي تحدّ أرض العشيرة."
        effects:
          - { target: documents, delta: 0.05 }
          - { target: memory, delta: 0.05 }
    sources:
      - { url: "https://www.adalah.org/uploads/oldfiles/eng/publications/Nomads%20Against%20their%20Will%20English%20pdf%20final.pdf", checked: 2026-10-19 }
  - id: e1953_01_camps
    title: "The camps: from tents to concrete"
    title_ar: "المخيمات: من الخيام إلى البيوت الإسمنتية"
    text: "Alongside the camps of 1948, new camps were set up in the 1950s, among them Balata and Tulkarm in 1950 and Jenin in 1953. In 1953 about 301,000 of some 870,000 registered refugees, nearly 35%, lived in camps. Over time the camps turned from tent cities into rows of concrete blockhouses, and then into crowded neighbourhoods."
    text_ar: "إلى جانب مخيمات 1948 أُقيمت في الخمسينيات مخيمات جديدة، منها بلاطة وطولكرم عام 1950 وجنين عام 1953. وفي عام 1953 كان نحو 301 ألف من أصل نحو 870 ألف لاجئ مسجّل، أي قرابة 35%، يعيشون في المخيمات. ومع الزمن تحوّلت المخيمات من مدن خيام إلى صفوف من البيوت الإسمنتية، ثم إلى أحياء مكتظّة."
    scope: "national"
    from: 1953-01-01
    to: 1953-02-01
    effects:
      - { target: home, delta: 0.03 }
      - { target: community, delta: 0.05 }
      - { target: livelihood, delta: -0.03 }
    options:
      - id: build_room
        text: "Build a block room in place of the tent"
        text_ar: "نبني غرفة من الطوب مكان الخيمة"
        outcome: "The father laid the first block and said: this is a room to wait in, not a homeland."
        outcome_ar: "وضع الأب الحجر الأول وقال: هذه غرفة للانتظار، لا وطن."
        effects:
          - { target: home, delta: 0.05 }
          - { target: family, delta: 0.03 }
          - { target: livelihood, delta: -0.05 }
      - id: name_alley
        text: "Name our camp alley after our village"
        text_ar: "نسمّي زقاقنا في المخيم باسم قريتنا"
        outcome: "Neighbours from the same village came to live in the same alley, as they had back home."
        outcome_ar: "صار الجيران من القرية نفسها يسكنون الزقاق نفسه، كما كانوا هناك."
        effects:
          - { target: memory, delta: 0.05 }
          - { target: community, delta: 0.05 }
    sources:
      - { url: "https://en.wikipedia.org/wiki/Palestinian_refugee_camps", checked: 2026-10-19 }
  - id: e1953_03_land_acquisition
    title: "The Land Acquisition Law"
    title_ar: "قانون استملاك الأراضي"
    text: "In 1953 Israel passed the Land Acquisition (Validation of Acts and Compensation) Law, which with the Absentees' Property Law was one of the two main instruments for transferring Arab land to the state. According to Adalah, 1.2–1.3 million dunams were expropriated under it from 349 Arab towns and villages. Adalah says Arab ownership fell from 48% of the land in 1948 to about 3–3.5% today."
    text_ar: "عام 1953 أقرّت إسرائيل قانون استملاك الأراضي (تصديق إجراءات وتعويضات)، وهو مع قانون أملاك الغائبين إحدى الأداتين الرئيسيتين لنقل الأرض العربية إلى الدولة. وبحسب منظمة عدالة صودر بموجبه ما بين 1.2 و1.3 مليون دونم من 349 بلدة وقرية عربية. وتقول عدالة إن الملكية العربية تراجعت من 48% من الأرض عام 1948 إلى نحو 3–3.5% اليوم."
    scope: "national"
    from: 1953-03-01
    to: 1953-04-01
    effects:
      - { target: land, delta: -0.1 }
      - { target: livelihood, delta: -0.03 }
    options:
      - id: refuse_sign
        text: "Refuse to sign for compensation"
        text_ar: "نرفض التوقيع على قبول التعويض"
        outcome: "The grandfather refused to sign and said: land is not something you take a price for."
        outcome_ar: "رفض الجدّ أن يوقّع، وقال: الأرض لا يُقبض لها ثمن."
        effects:
          - { target: sumud, delta: 0.05 }
          - { target: land, delta: 0.03 }
          - { target: livelihood, delta: -0.05 }
      - id: take_money
        text: "Accept the compensation to feed the children"
        text_ar: "نقبل التعويض لنُطعم الأولاد"
        outcome: "The money came in a day and was gone in months, and the regret stayed."
        outcome_ar: "قُبض المبلغ في يوم، ونفد في شهور، وبقيت الحسرة."
        effects:
          - { target: livelihood, delta: 0.08 }
          - { target: land, delta: -0.05 }
          - { target: sumud, delta: -0.05 }
      - id: plant_now
        text: "Plant what land is left, at once"
        text_ar: "نزرع ما بقي من الأرض فورًا"
        outcome: "The family planted olives on every span it had left, down to the edge of the road."
        outcome_ar: "غرست العائلة الزيتون في كل شبر بقي لها، حتى حواشي الطريق."
        effects:
          - { target: land, delta: 0.05 }
          - { target: livelihood, delta: -0.03 }
    sources:
      - { url: "https://www.adalah.org/en/law/view/533", checked: 2026-10-19 }
  - id: e1953_09_kafr_birim
    title: "Kafr Bir'im: a village bombed so its people cannot return"
    title_ar: "كفر برعم: قصف قرية لمنع عودة أهلها"
    text: "On 13 November 1948 the occupation army ordered the people of Kafr Bir'im in Upper Galilee, mostly Maronites (about 1,050 people), to leave and told them it was temporary. In January 1952 the Supreme Court ruled that they could return once they had military permission; the army never gave it, and on 16 September 1953 the occupation's air force levelled the village and the state expropriated its land. Only the church and its bell tower remain, and settlements including Kibbutz Bar'am stand on its land."
    text_ar: "في 13 تشرين الثاني 1948 أمر جيش الاحتلال أهل كفر برعم في الجليل الأعلى، ومعظمهم من الموارنة (نحو 1050 نسمة)، بمغادرة قريتهم، وقال لهم إن الخروج مؤقت. وفي كانون الثاني 1952 قضت المحكمة العليا بأن لهم أن يعودوا متى حصلوا على إذن عسكري، لكن الجيش لم يمنحهم الإذن قطّ، وفي 16 أيلول 1953 دكّ طيران الاحتلال القرية وصادرت الدولة أرضها. ولم يبقَ منها إلا الكنيسة وبرج جرسها، وقامت على أرضها مستوطنات منها كيبوتس برعام."
    scope: "national"
    from: 1953-09-01
    to: 1953-10-01
    day: 16
    effects:
