  - id: e1950_08_majdal
    title: "Those who stayed in al-Majdal are deported"
    title_ar: "ترحيل من بقي في المجدل"
    text: "After the Zionist army occupied al-Majdal in November 1948, some 2,500–2,700 Palestinians remained, confined for about a year in a quarter fenced with barbed wire that was known as the \"ghetto\". Ben-Gurion and Moshe Dayan approved their deportation; the authorities mixed inducements with night raids that spread panic, and on 17 August 1950 they trucked the first group to the Gaza Strip. The state's own records list 2,333 people moved to Gaza, 60 to Jordan and 302 to other towns inside Israel; by October 1950 only twenty families remained, and the town's Hebrew name changed several times before it became \"Ashkelon\"."
    text_ar: "بعد أن احتلّ الجيش الصهيوني المجدل في تشرين الثاني 1948 بقي فيها نحو 2500–2700 فلسطيني، حُشروا قرابة عام في حيّ مسيّج بالأسلاك الشائكة عُرف باسم «الغيتو». ووافق بن غوريون وموشيه دايان على ترحيلهم، فجمعت السلطات بين الإغراءات والمداهمات الليلية التي أشاعت الذعر، وفي 17 آب 1950 رحّلت أول دفعة منهم بالشاحنات إلى قطاع غزة. وتسجّل وثائق الدولة نفسها نقل 2333 شخصًا إلى غزة و60 إلى الأردن و302 إلى بلدات أخرى داخل إسرائيل، وبحلول تشرين الأول 1950 لم يبقَ في البلدة سوى عشرين عائلة، وتبدّل اسمها العبري مرارًا حتى صار «أشكلون»."
    scope: "region:al_majdal"
    place: al_majdal
    from: 1950-08-01
    to: 1950-09-01
    day: 17
    effects:
