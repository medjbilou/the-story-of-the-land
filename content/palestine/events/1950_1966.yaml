  - id: e1964_05_plo
    title: "The founding of the PLO"
    title_ar: "تأسيس منظمة التحرير الفلسطينية"
    text: "From 28 May to 2 June 1964 the first Palestinian National Congress met in al-Quds (Jerusalem) with nearly 400 delegates; it proclaimed the Palestine Liberation Organization, approved a National Charter and a Basic Law, and elected Ahmad al-Shuqairi as its chairman. The first Arab summit in Cairo (January 1964) had entrusted Shuqairi with organising the Palestinian people, and the second summit in Alexandria (September 1964) recognised the PLO. Members of Fatah, the Ba'th Party and the Arab Nationalist Movement attended in a personal capacity."
    text_ar: "من 28 أيار إلى 2 حزيران 1964 انعقد في القدس المؤتمر الوطني الفلسطيني الأول بحضور نحو 400 مندوب، فأعلن قيام منظمة التحرير الفلسطينية وأقرّ ميثاقًا قوميًّا ونظامًا أساسيًّا، وانتُخب أحمد الشقيري رئيسًا لها. وجاء ذلك بعد أن كلّفت القمة العربية الأولى في القاهرة (كانون الثاني 1964) الشقيري بتنظيم الشعب الفلسطيني، ثم اعترفت القمة الثانية في الإسكندرية (أيلول 1964) بالمنظمة. وحضر أعضاء من فتح وحزب البعث وحركة القوميين العرب بصفتهم الشخصية."
    scope: "national"
    from: 1964-05-01
    to: 1964-06-01
    day: 28
    effects:
      - { target: solidarity, delta: 0.05 }
      - { target: sumud, delta: 0.05 }
      - { target: documents, delta: 0.02 }
    options:
      - id: listen_radio
        text: "Gather round the radio for Shuqairi's speech"
        text_ar: "نجتمع حول المذياع لسماع خطاب الشقيري"
        outcome: "This time the father turned the radio up and asked no one to be quiet."
        outcome_ar: "رفع الأب صوت المذياع هذه المرة، ولم يطلب من أحد أن يسكت."
        effects:
          - { target: community, delta: 0.03 }
          - { target: sumud, delta: 0.03 }
