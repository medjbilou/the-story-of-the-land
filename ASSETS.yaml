# Provenance of every image, video, font, audio, 3D-model and map-data file in this repository.
# scripts/oss/check_repo.py --only assets fails when such a file (by extension, or any file git treats as binary, or
# a file under content/map/ or StreamingAssets/map/) matches no rule, when a rule matches nothing (unless allow_empty),
# when a rule lacks glob/licence/source/status, or when a licence is not in scripts/oss/oss_policy.py ALLOWED_LICENCES.
# With --release (the release gate) it also fails on any row marked owner-verify or with licence unknown.
# Globs use fnmatch: '*' also matches '/'.
# ai_generated: true marks AI output (the future Steam/itch.io disclosure is generated from it).
rules:
  - glob: "unity/Assets/Art/Settlements/Prototype/Models/b*"
    licence: CC0-1.0
    ai_generated: true
    source: "Tripo Studio (tripo3d.ai), paid Max plan, made 10-13 October 2026 from concept images generated in the same studio, by Tal Heuberger (PR #507). Building modules decimated to 3,608-8,000 triangles in Blender 4.4; colour maps made at 1024 px and committed at 512 px (2x2 box average, JPEG quality 90, issue #659; owner ruling of 15 October 2026: plain git, only what ships, no masters). The masters and per-model records (prompts, task ids, credits) are kept outside the repository. The texture paths from the author's machine inside each FBX are blanked to same-length placeholders (owner ruling, 15 October 2026, PR #675)."
    status: verified
    artist: "Tal Heuberger"
    note: "The 23 single-building models of PR #507, brought over on their own in issue #659 (step 1). Tripo Terms of User Agreement (last updated 11 July 2025), s. 5.2.2: paid users have all rights in their Outputs, including to distribute and license them; s. 3.2 allows commercial and non-commercial use. CC0 / no rights claimed, as for the other AI-only assets (D1). Decided (owner, 2026-10-15, issue #659): 'they are ok to use'."
  # --- Our own captures and drawings: CC BY 4.0 ---
  - glob: "docs/images/hero-engine-*.jpg"
    licence: CC-BY-SA-4.0
    source: "In-engine render of the game's own map with no interface (a screenshot of the game, not an AI image; the AI-made parts it shows are Tal Heuberger's 3D models, Tripo Studio, their rows above): MapCapture.Promo (unity/Assets/Editor/MapCapture.cs) with -extraPose hero_c:34.76:32.06:36000:12 on the Mobile quality tier (the WebGL tier), 1920x1080, Unity 6000.3.25f1, main at 6c54c95, 2026-10-18; saved as JPEG (quality 84). Map derived from Copernicus DEM. The website's home page hero"
    status: verified
    note: "CC BY-SA 4.0 as for the Steam kit's renders (coordinator ruling, 2026-10-15): the render shows the CC BY-SA 4.0 bakes of D13."
  - glob: "docs/images/build-*.jpg"
    licence: CC-BY-SA-4.0
    source: "Screenshots of the game's own web build (unity/Builds/Web-disabled, built 2026-10-21) in Chromium at 1920x1080, saved as JPEG (quality 84) at 1600 px. The map is derived from Copernicus DEM; the People screen shows the AI portraits of unity/Assets/Resources/People (their row below)"
    status: verified
    note: "README screenshots (docs/images/captures.yaml). CC BY-SA 4.0 like the other in-engine captures."
  - glob: "docs/images/trailer.*"
    licence: CC-BY-SA-4.0
    source: "The trailer (1:20) and its poster, edited in HyperFrames on 2026-10-21 from: miniature-world shots generated with Google gemini-3-pro-image and animated with Veo 3.1 Lite; music generated with Google Lyria 3.5; screen recordings of the game's web build; fonts Amiri and EB Garamond (OFL, in the game). Quotes: Mahmoud Darwish, Ghassan Kanafani (Men in the Sun), Tawfiq Ziad, Refaat Alareer, each a single line"
    status: owner-verify
    ai_generated: true
    note: "The owner checks the quotes' translations before release. The AI shots and music are labelled in the video's last frame and in the README."
  - glob: "unity/Assets/WebGLTemplates/TheStoryOfTheLand/favicon.ico"
    licence: CC-BY-4.0
    source: "The app icon's full-bleed crop (docs/branding/app-icon-fullbleed.svg) at 16, 32 and 48 px: an olive tree against the sun over terraced hills, in the UI's navy and gold; drawn as SVG 2026-10-21"
    status: verified
    ai_generated: true
    note: "Hand-written SVG drawn by the AI coding assistant at the owner's request; no image model, no source image."
  - glob: "unity/Assets/Branding/AppIcon.png"
    licence: CC-BY-4.0
    source: "The player icon (macOS, Windows, Linux), 1024 px, rendered with rsvg-convert from docs/branding/app-icon.svg; drawn 2026-10-21"
    status: verified
    ai_generated: true
    note: "Hand-written SVG drawn by the AI coding assistant at the owner's request; no image model, no source image."
  - glob: "docs/branding/app-icon*.svg"
    licence: CC-BY-4.0
    source: "Source drawings of the app icon and favicon; the olive crown is generated by docs/branding/olive_crown.py; drawn 2026-10-21"
    status: verified
    ai_generated: true
    note: "Hand-written SVG drawn by the AI coding assistant at the owner's request; no image model, no source image."
  - glob: "unity/Assets/Resources/People/*.jpg"
    licence: CC0-1.0
    source: "The People screen's pictures, one per figure in content/palestine/figures.yaml: ink-and-wash portraits, and still lifes from the figure's story where no photograph of the person was found (Basil al-Araj, Bassem Abu Rahmah, Shehadeh Shehadeh); generated with Google gemini-3-pro-image on 2026-10-21, and on 2026-10-22 17 portraits redrawn from reference photos (tools/people_portraits/references.yaml) at the owner's request, 384 px"
    status: owner-verify
    ai_generated: true
    note: "AI images of real people: the owner checks each likeness before release. Same neutral style for every figure (no weapons, flags or honour symbols). Prompts: tools/people_portraits/ (spec.py, gen.py, gen_ref.py); the reference photos (some third-party news photos, used only as a likeness reference, not copied) are listed with their pages in references.yaml; outputs resized to 384 px JPG."
  - glob: "unity/Assets/UI/StartScreen/start-map.png"
    licence: CC-BY-SA-4.0
    source: "In-engine capture of the game's own map (1920x1080), rendered by The Story of the Land for the start-screen background; terrain and art credited in THIRD-PARTY-NOTICES.md, terrain derived from Copernicus DEM (NOTICE). Not an AI image"
    status: verified
    note: "CC BY-SA 4.0 like the build-*.jpg and hero-engine-*.jpg renders (coordinator ruling, 2026-10-15): the capture shows the CC BY-SA 4.0 map bakes of D13 (landuse.png, BiomeColours.bytes, RouteRibbons.bytes)."
  # --- Fonts ---
  - glob: "unity/Assets/UI/Fonts/EBGaramond-*.ttf"
    licence: OFL-1.1
    source: "https://github.com/octaviopardo/EBGaramond12 @ 106a4a6d377987459ae5e68673a4570f13b957fb (unity/Assets/UI/Fonts/SOURCE.txt)"
    status: verified
  - glob: "unity/Assets/UI/Fonts/NotoNaskhArabic/NotoNaskhArabic.ttf"
    licence: OFL-1.1
    source: "Noto Naskh Arabic (variable TTF), Copyright 2022 The Noto Project Authors, https://github.com/notofonts/arabic; vertical line metrics changed for the UI, glyphs unchanged (unity/Assets/UI/Fonts/NotoNaskhArabic/SOURCE.txt); licence text unity/Assets/UI/Fonts/NotoNaskhArabic/OFL.txt"
    status: verified
  - glob: "unity/Assets/UI/Fonts/Amiri/Amiri-*.ttf"
    licence: OFL-1.1
    source: "Amiri 1.003 (Regular and Bold), Copyright 2010-2022 The Amiri Project Authors, https://github.com/aliftype/amiri; the release zip and the files unmodified, sha256 in unity/Assets/UI/Fonts/Amiri/SOURCE.txt; licence text unity/Assets/UI/Fonts/Amiri/OFL.txt"
    status: verified
  # --- Map data ---
  - glob: "unity/Assets/StreamingAssets/map/heightmap.*"
    licence: Copernicus-DEM
    source: "Copernicus DEM GLO-30 via tools/dem_to_heightmap.py; attribution in NOTICE"
    status: verified
  - glob: "content/map/hexes.json"
    licence: CC-BY-SA-4.0
    source: "tools/hexgrid.py from the heightmap (Copernicus), CHELSA bio12 and IMS station normals; attributions in NOTICE; content/ is CC BY-SA 4.0"
    status: verified
  - glob: "content/map/precip_bio12.*"
    licence: CC0-1.0
    source: "CHELSA V2.1 bio12 1981-2010 via tools/precip_clip.py; citation in NOTICE"
    status: verified
  - glob: "content/map/precip_stations.json"
    licence: IMS-data.gov.il
    source: "Israel Meteorological Service, data.gov.il dataset 481, via tools/ims_normals.py; licence 'Other (Open)' with no licence URL"
    status: verified
    note: "Decision D6 (the M3 plan's deferred 'Legal review of map-data licences' row). Published 2026-10-10 before the check. Covered by D6 and D13. Owner, 17 Oct 2026 (#879, issuecomment-6233249635): 'Yes, flip all 3'."
  - glob: "content/map/subdistrict*"
    licence: CC-BY-SA-4.0
    source: "tools/borders_digitise.py from the Survey of Palestine map 'Administrative Divisions' (1:750,000, 1946, overprinted May 1947; two Commons scans, SHA-256 in the file) per the 1947 Schedule (Palestine Gazette No. 1552); coast from the Copernicus DEM (NOTICE); the hex layer by tools/borders_bake.py; content/ is CC BY-SA 4.0. subdistrict_hexes_1948.tsv is the YAML's baked runtime form (tools/regions_bake.py, issue #321), with the same rows and no new facts"
    status: verified
    note: "Decision D-B (owner-delegated, 2026-10-11): allowed; facts redrawn, no image copied. Government of Palestine works of 1945-47, public domain in Israel and the UK since 1997; the file holds facts (where legally defined lines run) redrawn by our own method, which a possible US copyright in the map's drawing does not reach (Feist). Hebrew and Arabic names from Wikipedia, noted per row."
  - glob: "content/map/armistice*"
    licence: CC-BY-SA-4.0
    source: "tools/armistice_digitise.py from the 1949 General Armistice Agreements (UNTS vol. 42) and their annexed maps: Syria, Annex I's MR points and the annexed 1:50,000 map (S/1353/Rev.1: the UN ODS colour scan and the UNISPAL 1-bit scan, SHA-256 in the tool); Lebanon, Art. V.1's international boundary as the Mandate frontier of content/map/subdistricts_1948.geojson; Egypt, Art. VI.1 and VIII.2 with the Survey of Palestine 1:100,000 sheet 9 'Gaza' (Commons, NLI copy) for the Wadi Hasi mouth, Deir Suneid and the highway; the 1950 modus vivendi line from S/1471's signed map (UNISPAL; sheet 2 from the UN Treaty Collection); Jordan from the low-resolution UNISPAL copy of the signed map 1 (source_quality low_res_scan), georeferenced on town coordinates from Wikidata (CC0) and Wikipedia; IBS 46 (1965) a named cross-check only; coast from the Copernicus DEM (NOTICE); the hex layer by tools/armistice_bake.py; content/ is CC BY-SA 4.0. armistice_hexes_1949.tsv is the YAML's baked runtime form (tools/regions_bake.py, issue #321), with the same rows and no new facts"
    status: verified
    note: "Decision D-A: UN documents with symbols are not copyrighted (ST/AI/189/Add.9/Rev.2 para. 2); the Gaza sheet, the Mandate frontier and Jordan map 1's 1:250,000 base fall under D-B (Government of Palestine); S/1471's base sheets are a Survey of Israel reprint of about 1949-50 (outside D-B; facts only taken). Only the lines' positions are taken, redrawn by our own method. Status draft until the owner's fact check and sensitivity review. Decision D-A decided (owner, 2026-10-14, docs/oss/DECISIONS.md): the rulings accepted as recorded; no archive request for a full-resolution Jordan scan now (it can be requested later)."
  - glob: "content/map/control*"
    licence: CC-BY-SA-4.0
    source: "tools/control_digitise.py from Israel State Archives map 6158/1 ('Palestine: the partition lines and the front lines', 1949, ISA-PMO-GovernmentSecretary-R0005czg; the NYU Faculty Digital Archive copy, hdl 2451/72921, SHA-256 in the tool; source_quality low_res_scan), georeferenced on its printed 10-km Palestine grid; its red (9 July 1948), blue (18 July 1948) and green (end of October 1948) front lines traced; the dates of the operations from Wikipedia; from each 1949 agreement's date the sides of content/map/armistice_lines_1949.geojson (D-A); the Mandate outline of content/map/subdistricts_1948.geojson (D-B); the hex layer by tools/control_bake.py; for 15 May - 10 June 1948 (#674, owner decision of 16 October 2026) the 9 July lines with the CIA's 'Military Situation - 18 May 1948' map (CIA-RDP78-01617A004700010003-6, the Wayback copy, SHA-256 in the tool; georeferenced on its graticule ticks) for the one dashed border traced (Safad-Hula) and the 1947 sub-districts (D-B) as cuts; content/ is CC BY-SA 4.0. control_hexes_1948_49.tsv is the YAML's baked runtime form (tools/regions_bake.py, issue #321), with the same rows and no new facts"
    status: verified
    note: "Decision D-C (owner, 2026-10-14): allowed. A 1949 Israeli state work, out of copyright in Israel (Copyright Act 2007 s. 42); a possible URAA US term in its drawing does not reach the facts taken (where a front line ran on a date: Feist); its base is a Survey of Palestine sheet (D-B). Only the lines' positions are taken, redrawn by our own method; no image is copied or committed. The CIA map (#674) is a US federal work, not protected by US copyright (17 USC 105); facts only, redrawn, no image committed. Status draft, owner-verify: the owner's fact check and sensitivity review before a shareable build."
  - glob: "content/map/occupation_1967.geojson"
    licence: CC-BY-SA-4.0
    source: "tools/occupation_digitise.py from open datasets on HDX (SHA-256 in the tool), checked 2026-10-22: OCHA oPt's 'West Bank Separation Barrier, January 2018' (CC BY 4.0, https://data.humdata.org/dataset/west-bank-barrier) and 'Gaza Strip Buffer Area' (October 2023, CC BY 4.0, https://data.humdata.org/dataset/gaza-strip-closed-and-access-restricted-areas); the Palestinian Ministry of Planning's West Bank village boundaries (CC BY 4.0, https://data.humdata.org/dataset/state-of-palestine-village-boundary-in-the-west-bank) and the Gaza Housing Council's municipal boundaries (CC BY 4.0, https://data.humdata.org/dataset/gaza-stripmunicipal-boundaries), as outlines; Peace Now's settlement built-up areas from 2011 aerial photos, published by OCHA (CC BY-IGO 3.0, https://data.humdata.org/dataset/state-of-palestine-settlements); founding years and the settlements emptied in 2005 from Wikidata (CC0). Simplified to within 5-15 m; content/ is CC BY-SA 4.0"
    status: verified
    note: "Each source's licence allows adapted redistribution with attribution (THIRD-PARTY-NOTICES.md, 'Required notices'). No Israeli government data. Status of the facts: draft, owner-verify (the file's storyoftheland.status)."
  - glob: "content/map/oslo_areas_1995.geojson"
    licence: unknown
    source: "tools/occupation_digitise.py from 'State of Palestine - Oslo Agreement in the West Bank' (Palestinian Authority, Ministry of Planning, via OCHA oPt; HDX dataset date 2004, https://data.humdata.org/dataset/state-of-palestine-other-0-0-0-0-0), Areas A (with H1) and B (with the nature reserve), simplified to within 10 m"
    status: owner-verify
    note: "HDX licence 'Other': the legacy HumanitarianResponse.info terms, whose page redirected to one without them on 2026-10-22, so the terms could not be read. The release gate fails until the owner confirms them, or deletes this file and reruns tools/occupation_bake.py (the map then draws no Oslo areas)."
  - glob: "content/map/occupation_layers.yaml"
    licence: CC-BY-SA-4.0
    source: "tools/occupation_bake.py from content/map/occupation_1967.geojson and content/map/oslo_areas_1995.geojson (their rows above): three lossless PNG textures (base64) and the settlement list, with each layer's first date and its source; no new facts"
    status: owner-verify
    note: "Its Oslo channels (tex1 b and a) come from oslo_areas_1995.geojson, whose licence awaits the owner; the rest is CC BY-SA 4.0 like content/."
  - glob: "content/map/gaza_damage_2023.yaml"
    licence: CC-BY-SA-4.0
    source: "tools/gaza_damage_bake.py from UNOSAT's 'Gaza Strip Comprehensive Damage Assessment - 11 October 2025' (CE20231007PSE; file geodatabase, SHA-256 in the tool; https://data.humdata.org/dataset/unosat-gaza-strip-comprehensive-damage-assessment-11-october-2025, licence CC BY-SA), checked 2026-10-22: its 198,308 structures counted once per cell of about 300 m at the first image showing each damaged and destroyed, plus a PNG texture made from those counts; no raw points"
    status: verified
    note: "HDX gives the licence as 'Creative Commons Attribution Share-Alike' without a version (its licence page describes 4.0); content/ is CC BY-SA 4.0. The file's totals equal UNOSAT's published ones (the bake fails otherwise)."
  - glob: "content/map/settlements_1948.yaml"
    licence: CC-BY-SA-4.0
    source: "Coordinates from the Wikipedia API (prop=coordinates) and tools/settlement_hexes.py; per-settlement URLs and check dates in settlements_1948.yaml"
    status: verified
  - glob: "content/map/settlement_hexes.yaml"
    licence: CC-BY-SA-4.0
    source: "Generated by tools/settlement_hexes.py from settlements_1948.yaml and hexes.json"
    status: verified
  - glob: "content/map/settlement_population_1945.yaml"
    licence: CC-BY-SA-4.0
    source: "Village Statistics, 1945 (Government of Palestine), figures read from https://en.wikipedia.org/wiki/Village_Statistics,_1945 on 2026-10-11; per-row sources in the file"
    status: verified
    note: "Presentation only (settlement kit footprints); the sim never reads it. To be checked against a scan of the 1945 publication. Owner, 17 Oct 2026 (#879, issuecomment-6233249635): 'Accept as draft for now'; ships labelled draft (the #570 rule, 'verify later'), with a scan check before 1.0."
  - glob: "content/map/localities_1948.*"
    licence: CC-BY-SA-4.0
    source: "1948 localities of 1,000+ people and Bedouin camp totals: populations and 1948 names from Village Statistics, 1945 (Government of Palestine) as transcribed on Wikipedia, revision 1359600351 (CC BY-SA 4.0, attribution in each row's sources); coordinates, today's names and Hebrew/Arabic labels from Wikidata (CC0); camp areas read at load from content/map/subdistrict_hexes_1948.yaml. Read 2026-10-11; per-row sources in the YAML. Five 1948 Hebrew names (Beisan, Kfar Ata, Pardes Hanna, Tarshiha, Majdal) from Hebrew Wikipedia (CC BY-SA 4.0), read 2026-10-14, cited in each row's name_he_sources (#558). localities_1948.tsv is its baked runtime form (tools/localities_bake.py), with the same rows and no new facts"
    status: verified
    note: "Presentation only (map kits and labels); the sim never reads it. Rows with match low or manual need the owner's check; VS figures not yet checked against a scan. Owner, 17 Oct 2026 (#879, issuecomment-6233249635): 'Accept as draft for now'; ships labelled draft (the #570 rule, 'verify later'), with a scan check before 1.0."
  - glob: "content/map/names_ar.yaml"
    licence: CC-BY-SA-4.0
    source: "The Story of the Land, 2026-10-19 (audits/map_names_ar.md in the project workspace): the Arabic name of every named place on the map, from the Arabic Wikipedia article on the place (read through its API; titles without their disambiguator) and the place's Wikidata item (CC0, read through wbgetentities), with hand overrides for a few 1948 names; harakat, tatweel and direction marks removed. Per-row URLs and check dates in name_ar_sources"
    status: verified
    note: "Map data under content/ (CC BY-SA 4.0, decision D1). Every name is agent-checked: an AI agent checked it against its sources and no person has read it yet; a native speaker reviews the names before release (CONTENT_POLICY section 2, rule 6). The file's own status is draft. tools/tests/test_names_ar.py keeps the inline name_ar of the map files equal to it."
  - glob: "content/map/route*_1948.yaml"
    licence: CC-BY-SA-4.0
    source: "Railways and main roads of May 1948 (issue #35): traced by tools/routes_1948.py on the Survey of Palestine 1:250,000 map of 1946 (public domain; scans and georeferencing by Palestine Open Maps, https://palopenmaps.org/en/maps?basemap=pal250k1946) between waypoints at Wikipedia API (CC BY-SA) and Wikidata (CC0) coordinates; per-route sources and check dates in routes_1948.yaml"
    status: verified
    note: "Public domain checked 2026-10-11: PD-UKGov (expired Crown copyright: 50 years from publication for published works, which HMSO treats as worldwide) and PD-scan, as Wikimedia Commons files the 1946 Survey of Palestine sheets (e.g. https://commons.wikimedia.org/wiki/File:Gaza_sh._04,_1946.jpg). Palestine Open Maps' About page calls its maps public domain under the UK Copyright, Designs and Patents Act and publishes no terms of its own for its tiles or georeferencing; the traced lines are our own derivative and copy none of its layers. No OpenStreetMap (ODbL) geometry is copied: OSM and OpenHistoricalMap lines are only measured against (tools/routes_accuracy.py, docs/routes.md)."
  - glob: "content/map/route_paths_1948.tsv"
    licence: CC-BY-SA-4.0
    source: "The baked runtime form of content/map/route_paths_1948.yaml (tools/route_paths_bake.py, issue #321): the same routes and points, with the YAML's check and the counts; no new facts. Sources as for the YAML above"
    status: verified
  - glob: "unity/Assets/Resources/Routes/RouteRibbons.bytes"
    licence: CC-BY-SA-4.0
    source: "The route ribbons' meshes (issue #321), baked by Editor RouteRibbonBake from content/map/route_paths_1948.yaml (the traced lines above) draped on the Copernicus DEM GLO-30-derived heightmap (unity/Assets/StreamingAssets/map/heightmap.*); no new facts; attribution in NOTICE"
    status: verified
    note: "Decision D13 decided (owner, 2026-10-14, docs/oss/DECISIONS.md): CC BY-SA 4.0, the most restrictive input (the map content in content/map/); the DEM, CHELSA and IMS findings accepted as recorded."
  - glob: "content/map/locations_1948.yaml"
    licence: CC-BY-SA-4.0
    source: "The map locations (#1008): coordinates from each place's Wikidata item (CC0, property P625), names, identities and Hebrew names from English and Hebrew Wikipedia (CC BY-SA 4.0), Jerusalem's 15 May 1948 control from the Knesset's 'Liberation of Jerusalem' page and en.wiki Operation Pitchfork, Sha'ar HaAliyah's opening from R. D. Seidelman's BGU thesis abstract (facts only, no text copied beyond short quotes in comments); hexes from tools/hexgrid.py; per-row sources and check dates in the file"
    status: verified
    note: "Every row is status draft until a person checks each fact (CONTENT_POLICY section 2, rule 6); the Hebrew names are agent-checked (#564). The East Jerusalem / Old City starting control is sensitive and waits for the owner's review."
  - glob: "content/map/overrides.yaml"
    licence: CC-BY-SA-4.0
    source: "The map editor's override file (#1009; owner rulings of 18 October 2026): this project's own authored edits (terrain, dated control, location hexes), applied after the generated map data. Ships empty; no facts and no third-party data"
    status: verified
  # --- Baked map textures (derived from the heightmap) ---
  - glob: "unity/Assets/Textures/Map/landuse.png"
    licence: CC-BY-SA-4.0
    source: "tools/land_bake.py (issue #33): the land-use colour and weight (procedural field parcels with farm tracks, garrigue, terraces and scrub) placed by: slope and water from the Copernicus DEM-derived heightmap (Copernicus-DEM); rainfall from CHELSA V2.1 bio12 (CC0-1.0) bias-corrected by the IMS station normals of content/map/precip_stations.json (data.gov.il dataset 481, IMS-data.gov.il, decision D6); content/map/hexes.json biomes (this project's own content, CC-BY-SA-4.0); and the town coordinates of content/map/settlements_1948.yaml (Wikipedia API, CC-BY-SA-4.0) for the citrus belt. Procedural, not AI-generated; attribution in NOTICE"
    status: verified
    note: "Decision D13 decided (owner, 2026-10-14, docs/oss/DECISIONS.md): CC BY-SA 4.0, the most restrictive input (the 1948 settlement coordinates from Wikipedia); the DEM, CHELSA and IMS findings accepted as recorded."
  - glob: "unity/Assets/Resources/Map/BiomeColours.bytes"
    licence: CC-BY-SA-4.0
    source: "The biome ground colours (issue #321, #529), baked by Editor BiomeColourBake from the biomes and centres of content/map/hexes.json, the heightmap's bounds (unity/Assets/StreamingAssets/map/heightmap.json) and this project's MapPalette.Ground colours. The biomes are derived by tools/hexgrid.py from the Copernicus DEM GLO-30-derived heightmap (Copernicus-DEM), CHELSA V2.1 bio12 rainfall (CC0-1.0) and the IMS station normals of content/map/precip_stations.json (data.gov.il dataset 481, decision D6); no new facts; attribution in NOTICE"
    status: verified
    note: "Decision D13 decided (owner, 2026-10-14, docs/oss/DECISIONS.md): CC BY-SA 4.0, the most restrictive input (the map content in content/map/); the DEM, CHELSA and IMS findings accepted as recorded."
  - glob: "unity/Assets/Resources/Map/MinimapRelief.png"
    licence: CC-BY-SA-4.0
    source: "The minimap's painted relief (HUD round 2, #398), made by tools/minimap_bake.py from files already in this repository: a hill shade of the Copernicus DEM GLO-30-derived heightmap (unity/Assets/StreamingAssets/map/heightmap.*, Copernicus-DEM), the biome colour bake (Resources/Map/BiomeColours.bytes), the land-use and coast textures (Textures/Map/landuse.png, coast.png) and the sub-district hexes of content/map/subdistrict_hexes_1948.yaml (this project's own content, CC-BY-SA-4.0) for the rim of Mandatory Palestine. Procedural, not AI-generated; no new facts; attribution in NOTICE"
    status: verified
    note: "Decision D13 (owner, 2026-10-14, docs/oss/DECISIONS.md): CC BY-SA 4.0, the most restrictive input; the owner's decision (2026-10-15), relayed by the coordinator, is that this bake of the same D13 inputs follows it and is verified."
