# The short guide to the family game (#1041), without balance values, so rule changes stay in the sim.
how_to_play.title: "How to play"
how_to_play.turn: "Each turn is one month in the life of a Palestinian family from the village you chose. A chapter runs from its first month to its last."
how_to_play.cards: "Cards tell what happened that month: across Palestine, near the village (within 25 km) and in the village itself. Choose what the family does; the card then tells what followed."
how_to_play.bar: "The top bar shows the family's ten resources, from Land to Solidarity, and the money in use. Point at one to read its value and how it changed."
how_to_play.end_turn: "End turn moves to the next month. It waits until you have chosen an answer on every card."
how_to_play.why: "Why? tells the last month again: each card, what the family chose and what changed. People lists the chapter's figures, and the map shows what happened to each village, from the date it happened."
how_to_play.narration: "A narrator opens each chapter. N turns the narration off and on again."
