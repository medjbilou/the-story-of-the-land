# UI strings (Arabic). GameRoot loads them in place of strings.en.yaml
# when Arabic is asked for. Code looks strings up by key (StoryOfTheLand.Game.UI.UiText); placeholders are string.Format
# arguments ({0}, {1}) formatted with the invariant culture, so they match strings.en.yaml token for token.
# Keep logical Arabic order, never reverse strings. Western digits, Levantine month names, as in the content files.
# The top bar's date arrives formatted by StoryOfTheLand.Sim.PlayerText.Date in the UI's language. The map's front-line date
# and the Why? dates are built by Control1948.DateText / LineDateText from the date.* strings below, so each language
# orders and names them (#687, #701). The family's resources (0..1) arrive on the 0-100 scale (PlayerText.Percent).
# Counted keys (UiText.Plural, the CLDR Arabic rule): key.one for 1, key.two for 2, key.few when n % 100 is 3-10,
# key.many for 11-99, key.other for 0 and 100-102. The .one and .two forms say the number in words, so they have no
# {0}. Each dual is in the case its line needs (the genitive after "بـ" or "من"). The base key is the fallback.
hud.turn: "الدور {0}"
hud.date: "{0}"
# A top-bar meter in words, kept as its tooltip for a later accessibility layer (HudModel.Spoken): {0} the caption, {1}
# the value, {2} the change without its sign. Points: a change of a 0-100 meter, shown as "+2%".
hud.say: "{0}: {1}"
hud.say_up: "{0}: {1}، بارتفاع {2} منذ الدور السابق"
hud.say_down: "{0}: {1}، بانخفاض {2} منذ الدور السابق"
hud.say_points: "{0:0} نقاط"
