# The short guide to the family game (#1041), without balance values, so rule changes stay in the sim.
how_to_play.title: "طريقة اللعب"
how_to_play.turn: "كلّ دورٍ شهرٌ من حياة عائلة فلسطينية من القرية التي اخترتها، ويمتدّ الفصل من شهره الأول إلى شهره الأخير."
how_to_play.cards: "تروي البطاقات ما جرى في ذلك الشهر: في فلسطين كلّها، وعلى مقربة من القرية (في حدود 25 كيلومترًا)، وفي القرية نفسها. اختر ما تفعله العائلة، ثم تروي البطاقة ما تلا ذلك."
how_to_play.bar: "يعرض الشريط العلوي موارد العائلة العشرة، من الأرض إلى التضامن، والعملةَ المتداولة. مرِّر المؤشر فوق أيٍّ منها لتقرأ قيمته ومقدار تغيّره."
how_to_play.end_turn: "ينقلك زرّ «إنهاء الدور» إلى الشهر التالي، ولا يعمل إلا بعد أن تختار جوابًا في كلّ بطاقة."
how_to_play.why: "يعيد زرّ «لماذا؟» رواية الشهر الماضي: كلّ بطاقة، وما اختارته العائلة، وما تغيّر. وتعرض شاشة «الشخصيات» سِيَر أبرز شخصيات الفصل، وتُظهر الخريطة مصير كلّ قرية ابتداءً من تاريخ وقوعه."
how_to_play.narration: "يفتتح الراوي كلّ فصل، ويوقف مفتاحُ N صوتَ الراوي أو يعيد تشغيله."
